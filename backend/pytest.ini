[pytest]
# ci.yml runs `pytest backend/tests` from the repo root -- this file makes
# that invocation (and a plain `cd backend && pytest`, for local dev) behave
# the same way. tests/conftest.py handles putting backend/ on sys.path so
# `import main` / `import models` / etc. resolve no matter which of those
# two working directories pytest was started from.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# OpenTelemetry's pinned 0.48b0 instrumentors still import the legacy
# pkg_resources compatibility API. This is a third-party deprecation warning,
# not application code; keep the CI output useful without changing runtime
# behavior or prematurely upgrading the tightly-pinned OTEL stack. Remove this
# filter when those instrumentors no longer import pkg_resources.
filterwarnings =
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
