# =============================================================================
# backend/ruff.toml
# -----------------------------------------------------------------------------
# Why this file exists: ci.yml runs `ruff check backend/` with no config at
# all, which means it inherited whatever rule set ruff's own "default" (no
# `select`/`ignore` given) happened to mean on whatever version `pip install
# ruff` (unpinned) resolved to that day. That was fine for a long time -- the
# unconfigured default used to be the narrow "Pyflakes (F) + a subset of
# pycodestyle (E)" set -- until ruff shipped a release that broadened its
# own default rule selection (adding categories like flake8-datetimez (DTZ),
# flake8-2020 (YTT), isort (I), and many more). Nothing in this repo's Python
# changed; ruff's definition of "default" did, and every `ci.yml` run after
# that point started failing with ~450+ new violations across files that
# were never written against those newer rules.
#
# Pinning the rule selection explicitly here (rather than leaving it
# implicit) makes CI's behavior a deliberate choice instead of a moving
# target tied to whatever ruff version happens to be latest on a given day.
# `ci.yml` also now pins the `ruff` version itself as a second, independent
# safeguard -- see that file's "Install dependencies" step -- so a bump to
# either one only ever happens on purpose, reviewed in a PR.
#
# This selects exactly the rule categories ruff used to enable by default
# (Pyflakes + a conservative pycodestyle subset), which is what this
# codebase was actually written and reviewed against:
#   E4 -- pycodestyle import-related errors (e.g. multiple imports per line)
#   E7 -- pycodestyle statement-related errors (e.g. bare `except:`)
#   E9 -- pycodestyle runtime errors (syntax errors, undefined names)
#   F  -- Pyflakes (unused imports/variables, undefined names, etc.)
#
# If you want to opt into more (DTZ for timezone-naive datetimes, UP for
# pyupgrade, B for bugbear, etc.), add them to `select` below deliberately,
# in a PR of their own -- each category will likely surface real findings
# across backend/ that need actual code changes, not just a config bump.
# =============================================================================

[lint]
select = ["E4", "E7", "E9", "F"]
