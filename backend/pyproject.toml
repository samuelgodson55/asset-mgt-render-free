# backend/pyproject.toml
# -----------------------------------------------------------------------------
# Ruff configuration for CI (.github/workflows/ci.yml's "lint" job).
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E712 ("avoid == True/False") is a real style rule for plain Python
# booleans, but this codebase's SQLAlchemy queries (e.g.
# `models.User.is_deleted == False`) NEED the `==`/`!=` operator overloads
# SQLAlchemy's Column type defines -- `is`/`is not`/truthiness checks
# don't build a SQL WHERE clause at all, they'd just compare the Column
# object's Python identity and silently break the query. Ignored
# project-wide rather than fixed inline, since the "fix" ruff suggests
# would be a genuine bug here, not a style improvement.
ignore = ["E712"]
