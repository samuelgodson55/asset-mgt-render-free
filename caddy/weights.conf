# caddy/weights.conf
# -----------------------------------------------------------------------------
# Imported into Caddyfile's `reverse_proxy frontend-blue:80 frontend-green:80`
# block. Order matters: the first weight below applies to frontend-blue, the
# second to frontend-green.
#
# FIXED ROLES: blue is always the incoming/candidate deploy, green is
# always the active/production slot once a rollout finishes -- see
# scripts/blue-green-deploy.sh's own top-of-file comment for the full
# mechanics (it deploys into blue, ramps traffic onto it, then promotes
# green onto the same image and flips back). Steady-state traffic is
# therefore always 100% green / 0% blue; blue only ever carries nonzero
# weight for the few minutes a rollout is actually in progress.
#
# THIS FILE IS LIVE STATE ON THE VM, not a static config value -- once
# deployed to /opt/snipeit/caddy/weights.conf, it's rewritten in place by
# scripts/blue-green-deploy.sh on every rollout (10/25/50/75/100% ramp
# steps onto blue, then straight back to 0/100 once green is promoted --
# see that script and Caddyfile's own comment) and reloaded into Caddy
# with `caddy reload` (graceful, zero dropped connections). The copy
# committed here is just the starting point for a brand-new VM (matches
# cloud-init's initial ACTIVE_SLOT=green / COMPOSE_PROFILES=green -- see
# infra-vm/cloud-init.yaml) and what `git diff` compares future states
# against; it is NOT re-synced over a VM's live weights.conf by
# deploy-azure-vm.yml (only Caddyfile/docker-compose.vm.yml/scripts/* are),
# so a VM mid-rollout is never yanked back to 0/100 by an unrelated sync.
#
# Safe to hand-edit for a manual/emergency traffic shift too -- just follow
# any edit with:
#   docker compose -f docker-compose.vm.yml exec caddy \
#     caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
# -----------------------------------------------------------------------------
lb_policy weighted_round_robin 0 100
