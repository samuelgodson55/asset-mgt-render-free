# ErrorBeacon Lite on Render Free
#
# This Blueprint creates only the ErrorBeacon Web Service.
# For a genuinely always-warm free deployment, use a dedicated Render
# workspace for ErrorBeacon and configure UptimeRobot Free to request
# /healthz every 5 minutes. Render Free spins down after 15 minutes without
# inbound traffic; UptimeRobot Free checks every 5 minutes.
#
# IMPORTANT: Render can still restart Free services at any time, so this is
# a practical free workaround, not an SLA. SQLite is ephemeral on Render Free.
services:
  - type: web
    name: errorbeacon-lite
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Without this, the container falls back to its code default
      # ('development'), so the /v1/test manual-alert endpoint (which
      # stamps its synthetic event with this service's own ENVIRONMENT
      # var) always reports "development" regardless of how this
      # standalone monitor is actually being used. Set to "production" on
      # Render if this deployment is monitoring a production system.
      - key: ENVIRONMENT
        value: production
      # Legacy single key: still read as a fallback by both ingest_auth and
      # admin_auth if the scoped keys below are left unset, for deployments
      # that haven't migrated yet. New setups should leave this blank and
      # use the two scoped keys instead so a compromised backend's ingest
      # key can't also resolve/silence incidents.
      - key: ERRORBEACON_API_KEY
        sync: false
      - key: ERRORBEACON_INGEST_API_KEY
        sync: false
      - key: ERRORBEACON_ADMIN_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_THREAD_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: MAX_ALERTS_PER_MINUTE
        value: "30"
      - key: DEDUP_SECONDS
        value: "60"
      - key: DATA_DIR
        value: "/data"
      - key: TELEGRAM_POLLING
        value: "true"
      - key: ALERT_QUEUE_SIZE
        value: "1000"
      - key: ALERT_WORKERS
        value: "3"
      - key: SPIKE_THRESHOLD
        value: "10"
      - key: SPIKE_WINDOW_SECONDS
        value: "300"
      - key: NOTIFICATIONS_ENABLED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
      - key: ERRORBEACON_EMAIL_FALLBACK_ENABLED
        value: "true"
      - key: ERRORBEACON_EMAIL_FALLBACK_AFTER_ATTEMPTS
        value: "3"
      - key: ERRORBEACON_EMAIL_FALLBACK_AFTER_SECONDS
        value: "300"
      - key: ERRORBEACON_RETENTION_DAYS
        value: "90"
      - key: ERRORBEACON_DB_WARN_MB
        value: "4096"
