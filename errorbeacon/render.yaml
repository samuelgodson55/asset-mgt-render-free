# ErrorBeacon Lite on Render Free
#
# This Blueprint creates only the ErrorBeacon Web Service.
# For a genuinely always-warm free deployment, use a dedicated Render
# workspace for ErrorBeacon and configure UptimeRobot Free to request
# /healthz every 5 minutes. Render Free spins down after 15 minutes without
# inbound traffic; UptimeRobot Free checks every 5 minutes.
#
# IMPORTANT: Render can still restart Free services at any time, so this is
# a practical free workaround, not an SLA. SQLite is ephemeral on Render Free.
services:
  - type: web
    name: errorbeacon-lite
    runtime: docker
    dockerfilePath: errorbeacon/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Without this, the container falls back to its code default
      # ('development'), so the /v1/test manual-alert endpoint (which
      # stamps its synthetic event with this service's own ENVIRONMENT
      # var) always reports "development" regardless of how this
      # standalone monitor is actually being used. Set to "production" on
      # Render if this deployment is monitoring a production system.
      - key: ENVIRONMENT
        value: production
      - key: ERRORBEACON_INGEST_API_KEY
        sync: false
      - key: ERRORBEACON_ENABLE_DOCS
        value: "false"
      - key: ERRORBEACON_MAX_REQUEST_BODY_BYTES
        value: "131072"
      - key: ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE
        value: "10"
      # ErrorBeacon is directly public on Render Free; never trust spoofable proxy headers.
      - key: ERRORBEACON_TRUST_PROXY_HEADERS
        value: "false"
      - key: ERRORBEACON_ADMIN_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_THREAD_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: MAX_ALERTS_PER_MINUTE
        value: "30"
      - key: DEDUP_SECONDS
        value: "60"
      - key: DATA_DIR
        value: "/data"
      - key: TELEGRAM_POLLING
        value: "true"
      - key: ALERT_QUEUE_SIZE
        value: "1000"
      - key: ALERT_WORKERS
        value: "3"
      - key: SPIKE_THRESHOLD
        value: "10"
      - key: SPIKE_WINDOW_SECONDS
        value: "300"
      - key: NOTIFICATIONS_ENABLED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ERRORBEACON_EMAIL_FALLBACK_ENABLED
        value: "true"
      # Admin recipients are intentionally separate from the application's
      # normal notification routing. Set this to the address(es) that should
      # receive ErrorBeacon fallback/test emails.
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
      - key: ERRORBEACON_EMAIL_FALLBACK_AFTER_ATTEMPTS
        value: "3"
      - key: ERRORBEACON_EMAIL_FALLBACK_AFTER_SECONDS
        value: "300"
      - key: ERRORBEACON_RETENTION_DAYS
        value: "90"
      - key: ERRORBEACON_DB_WARN_MB
        value: "4096"
      - key: ERRORBEACON_AUTO_STALE_DAYS
        value: "30"
      - key: ERRORBEACON_DIGEST_ENABLED
        value: "true"
      - key: ERRORBEACON_DIGEST_INTERVAL_HOURS
        value: "24"
      - key: ERRORBEACON_EMAIL_FALLBACK_RETRIES
        value: "3"
      - key: ERRORBEACON_STARTUP_SELF_TEST
        value: "false"
      # Reverse direction of the main app's ERRORBEACON_URL (see render.yaml's own
      # ERRORBEACON_URL comment). Powers the Telegram /apphealth command, which polls
      # backend's /healthz, /readyz and /health/dependencies. Unlike Compose/ACA,
      # ErrorBeacon on Render Free is a fully separate, standalone Web Service (see
      # this file's own header comment) with no shared network to the main app --
      # there is no in-network hostname to default to, so leaving this unset just
      # means /apphealth's checks fail fast with a connection error (bounded by
      # BACKEND_HEALTH_TIMEOUT_SECONDS below) rather than crashing. Set it to the
      # main app's public URL (e.g. its RENDER_EXTERNAL_URL) if you want /apphealth
      # to work here and are fine with the checks crossing the public internet.
      - key: BACKEND_URL
        sync: false
      - key: BACKEND_HEALTH_TIMEOUT_SECONDS
        value: "5"
