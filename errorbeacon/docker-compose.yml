services:
  errorbeacon:
    build:
      context: ..
      dockerfile: errorbeacon/Dockerfile
    container_name: errorbeacon
    restart: unless-stopped
    env_file: .env
    environment:
      ERRORBEACON_ENABLE_DOCS: ${ERRORBEACON_ENABLE_DOCS:-false}
      ERRORBEACON_MAX_REQUEST_BODY_BYTES: ${ERRORBEACON_MAX_REQUEST_BODY_BYTES:-131072}
      ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE: ${ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:8787:8000"
    volumes:
      - errorbeacon_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  errorbeacon_data:
