# docker-compose.yml
# -----------------------------------------------------------------------------
# Spins up the whole Snipe-IT Lite stack with one command:
#     docker compose up --build
#
# SECRETS (requirement #1): every value that used to be hardcoded here
# (POSTGRES_PASSWORD, JWT_SECRET_KEY, etc.) is read from a git-ignored
# ".env" file in this same folder via the ${VARIABLE_NAME} syntax. Docker
# Compose automatically loads ".env" with NO extra configuration needed --
# it just has to sit next to this file. See .env.example for the template
# and copy it to ".env" before running `docker compose up` for the first
# time:
#     cp .env.example .env
#
# Two services:
#   db   - PostgreSQL database that stores everything
#   app  - ONE FastAPI process (built from the root Dockerfile) that
#          serves BOTH the JSON API (under /api/*) AND the static
#          frontend (index.html/admin.html/js/*, etc.) -- see
#          backend/main.py's module docstring for why this used to be
#          three containers (backend + Celery worker + nginx) and now
#          isn't: that split doesn't fit Render's (or most platforms')
#          FREE tier, and this docker-compose.yml intentionally mirrors
#          the same simpler shape used in render.yaml so "works locally"
#          and "works on Render" mean the same thing.
#
# Once running, everything is served from ONE origin:
#   App + API:  http://localhost:8000
#   API docs:   http://localhost:8000/docs   (if ENABLE_API_DOCS=true)
# -----------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: snipeit_lite_db
    restart: unless-stopped
    environment:
      # ${VARIABLE_NAME} pulls its value from the ".env" file at compose-up
      # time. If ".env" is missing or a key isn't set, Compose falls back to
      # the value after the colon (kept here only as a last-resort default
      # so the project doesn't hard-crash with zero configuration).
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      POSTGRES_DB: ${POSTGRES_DB:-asset_db}
    volumes:
      # Named volume (requirement #7) so your data survives `docker compose
      # down` and container restarts -- only `docker compose down -v` wipes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Requirement #7: the app won't even try to start until this reports
      # healthy (see `app`'s `depends_on: condition: service_healthy`
      # below), which prevents the classic "app crash-loops because
      # Postgres wasn't ready yet" race condition.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-asset_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snipeit_lite_app
    restart: unless-stopped
    # Local-dev override: live-reload on file changes, unlike the
    # Dockerfile's own production CMD (see that file's comment). Mounts
    # backend/ and frontend/ as bind mounts below so edits on your host
    # show up immediately without rebuilding the image.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      # "development" or "production" -- gates the startup JWT-secret check
      # in backend/config.py (requirement #5). Defaults to "development" so
      # local `docker compose up` keeps working with the placeholder secret.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Must match the postgres credentials above -- built from the SAME
      # .env variables so they can never silently drift apart. The hostname
      # "db" works because Docker Compose puts every service on the same
      # network and lets them reach each other by service name.
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:supersecret@db:5432/asset_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file -- see .env.example}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
      # The frontend and API are served from this SAME container/origin
      # now (see backend/main.py), so this almost never matters for normal
      # browser use -- it only matters if you call this API directly from
      # a genuinely different origin. Empty by default; see config.py's
      # CORS_ORIGINS docstring.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Operations & Observability requirement #1: gate the startup
      # init_db()/seed_db() calls instead of always running them. Leave
      # both "true" for local docker-compose demo use; set both "false" in
      # a real production .env and run `alembic upgrade head` separately.
      AUTO_INIT_DB: ${AUTO_INIT_DB:-true}
      AUTO_SEED_DEMO_DATA: ${AUTO_SEED_DEMO_DATA:-true}
      # Operations & Observability requirement #2: structured logging.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Operations & Observability requirement #3: login rate limiting.
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      # SECURITY: exposes/hides /docs, /redoc, /openapi.json -- see
      # config.py's ENABLE_API_DOCS docstring. Defaults to "true" for local
      # dev convenience; set "false" in a real production .env.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      # Hardcoded Super Admin (root account) -- see .env.example and
      # backend/config.py's SUPER_ADMIN_* docstring. Defaults keep local
      # Docker Compose working out of the box; generate a real password
      # before deploying anywhere real.
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-change-this-super-admin-password}
      # Email notifications (extension requests + overdue-checkout digest)
      # -- see backend/config.py's NOTIFICATIONS_ENABLED docstring. Leave
      # disabled for local dev with no mail server; the app works fine
      # without it, it just logs what it would have sent instead. The
      # digest itself now runs from an in-process scheduler thread (see
      # backend/scheduler.py) rather than a separate Celery worker
      # container -- nothing extra to run locally for it to work.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_NOTIFICATION_INTERVAL_HOURS: ${OVERDUE_NOTIFICATION_INTERVAL_HOURS:-24}
      # Optional shared secret for triggering the overdue digest from an
      # external scheduler instead of/in addition to the in-process one --
      # see config.py's SYSTEM_TASK_TOKEN docstring and api/system.py.
      # Empty (disabled) by default.
      SYSTEM_TASK_TOKEN: ${SYSTEM_TASK_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
