# docker-compose.yml
# -----------------------------------------------------------------------------
# Spins up the whole Snipe-IT Lite stack with one command:
#     docker compose up --build
#
# SECRETS: every sensitive value (POSTGRES_PASSWORD, JWT_SECRET_KEY, etc.)
# is read from a git-ignored ".env" file in this same folder via the
# ${VARIABLE_NAME} syntax. Docker Compose loads ".env" automatically as long
# as it sits next to this file. Copy the template before first run:
#     cp .env.example .env
#
# Six services:
#   db       - PostgreSQL database that stores everything
#   redis    - Celery broker/result backend (async exports + email), the
#              cross-replica login rate limiter, and the scheduled-backup
#              leader lock -- see middleware/rate_limit.py and
#              services/backup_service.py's docstrings
#   backend  - FastAPI app (main.py) talking to the db (not published to the
#              host anymore -- see the "frontend" service below)
#   worker   - Celery worker (backend/Dockerfile, unmodified) consuming the
#              queue `backend` produces to: CSV/PDF export generation and
#              every outbound notification email
#   beat     - Celery Beat (same image as `worker`, different command) --
#              fires the scheduled overdue/due-soon digest jobs on a timer.
#              Split from `worker` so `worker` can be scaled to multiple
#              replicas without duplicating the scheduled jobs.
#   frontend - the frontend app PLUS an nginx reverse proxy in front of it,
#              built from frontend/Dockerfile. By default this is the React
#              "Ledger" SPA (frontend-app/, built to static assets by Vite);
#              set FRONTEND_BUILD_TARGET=frontend-legacy-only in .env to
#              ship the older vanilla-JS static site (index.html/admin.html/
#              js/*) instead -- see that service's own `target:` comment
#              below and frontend-app/README.md's "Detaching this app"
#              section. Whichever one is built, nginx serves it directly and
#              transparently forwards every /api/* request to the backend
#              container over Docker's internal network -- see
#              nginx/default.react.conf.template (React) /
#              nginx/default.conf.template (legacy) for the full
#              explanation. This is also the ONLY multi-tier-portable piece:
#              the exact same image runs on Render/cloud too, just with
#              different BACKEND_HOST/BACKEND_PORT env vars.
#
# Plus one OPT-IN seventh service, behind a Compose profile so it never
# starts unless you ask for it:
#   jaeger   - local distributed-tracing UI (Operations & Observability
#              requirement #4 -- see backend/telemetry.py's module
#              docstring). `docker compose up` alone never starts this;
#              run `docker compose --profile tracing up` instead, and set
#              OTEL_ENABLED=true in your .env (see .env.example) -- every
#              backend/worker/beat env block below already points
#              OTEL_EXPORTER_OTLP_ENDPOINT at it, zero extra config
#              needed. Browse traces at http://localhost:16686 once both
#              are on. See README.md's "Distributed Tracing" section for
#              a full walkthrough (what a trace looks like, what to click
#              on, how this differs from the plain container logs).
#
# Once running, everything is served from ONE origin:
#   App + API:        http://localhost:8080          (nginx)
#   API docs:          http://localhost:8080/docs     (proxied by nginx)
# -----------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: snipeit_lite_db
    restart: unless-stopped
    environment:
      # ${VARIABLE_NAME} pulls its value from the ".env" file at compose-up
      # time. If ".env" is missing or a key isn't set, Compose falls back to
      # the value after the colon (kept here only as a last-resort default
      # so the project doesn't hard-crash with zero configuration).
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      POSTGRES_DB: ${POSTGRES_DB:-asset_db}
    volumes:
      # Named volume (requirement #7) so your data survives `docker compose
      # down` and container restarts -- only `docker compose down -v` wipes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Requirement #7: the backend won't even try to start until this
      # reports healthy (see backend's `depends_on: condition:
      # service_healthy` below), which prevents the classic "backend
      # crash-loops because Postgres wasn't ready yet" race condition.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-asset_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # PgBouncer connection pooler -- always-on. The application automatically
  # routes through the local `pgbouncer:6432` service when
  # USE_PGBOUNCER=true; no DATABASE_URL edits are required.
  # ---------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-asset_db}
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 2
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # Lets backend/db_pool_metrics.py run SHOW POOLS/SHOW STATS against
      # PgBouncer's built-in `pgbouncer` admin virtual database, reusing
      # the SAME app DB user/password already above -- no separate
      # monitoring credential to provision or rotate. See that module's
      # docstring for what it does with the numbers.
      ADMIN_USERS: ${POSTGRES_USER:-admin}
      STATS_USERS: ${POSTGRES_USER:-admin}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # redis (Celery broker + result backend for async exports)
  # ---------------------------------------------------------------------
  # Two jobs: (1) the queue the `backend` container drops export jobs
  # into, and (2) where the `worker` container stashes a finished job's
  # file bytes until the frontend downloads them (see
  # backend/celery_app.py's module docstring for the full picture, and
  # config.py's EXPORT_RESULT_TTL_SECONDS for how long results live here
  # before expiring). Not published to the host -- like `db`, it's only
  # ever reached over Compose's internal network, by service name.
  redis:
    image: redis:7-alpine
    container_name: snipeit_lite_redis
    restart: unless-stopped
    volumes:
      # Named volume so queued-but-not-yet-processed jobs and any
      # not-yet-downloaded export results survive a `docker compose
      # restart`. Redis's default persistence (RDB snapshots) is enabled
      # out of the box in this image, which is all this workload needs --
      # a lost job here just means re-clicking "export", not lost data.
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # migrate (local development schema gate)
  # ---------------------------------------------------------------------
  # Local Docker deliberately uses Alembic as the source of truth. This
  # one-shot service runs before backend/worker/beat so a fresh local DB is
  # fully versioned instead of relying on create_all() and then needing
  # `alembic stamp head`. It is only a local Compose concern; ACA/VM use
  # their deployment migration gates.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: snipeit-lite-backend:local
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:supersecret@db:5432/asset_db}
      USE_PGBOUNCER: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file -- see .env.example}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTO_INIT_DB: "false"
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # `backend`, `worker`, and `beat` all build from the same Dockerfile
    # (`build: context: . / dockerfile: backend/Dockerfile`) but need the
    # SAME explicit `image:` tag -- without it, Compose tags each
    # service's build output separately, and
    # rebuilding just `backend` leaves `worker`/`beat` running a stale image.
    image: snipeit-lite-backend:local
    # NOTE: no `container_name` here (unlike the single-instance `db` and
    # `redis` services above) -- a fixed container name can only ever be
    # used by ONE running container at a time, which blocks `docker
    # compose up --scale backend=N` from starting a second replica at all.
    # See DEPLOYMENT.md's load balancing section for how/why to scale this
    # service; Compose auto-generates unique names per replica instead
    # (snipeit-lite-backend-1, -2, ...).
    restart: unless-stopped
    # Local-only direct backend port for diagnostics/chaos tests. Production
    # deployments do not use docker-compose.yml, and the public application
    # still goes through nginx on :8080. Keeping this port separate from the
    # frontend proxy makes readiness/incident tests unambiguous.
    ports:
      - "${BACKEND_DIRECT_PORT:-8001}:8000"
    volumes:
      # Local backup files (see backend/services/backup_service.py) --
      # named volume so they survive `docker compose restart`/`down`
      # (only `docker compose down -v` wipes it), same pattern as `db`'s
      # `pgdata` volume above. This is purely a local-dev convenience;
      # Render's Free plan has no equivalent persistent volume, which is
      # exactly why BACKUP_GDRIVE_ENABLED exists for production. When
      # scaled to multiple replicas, every replica mounts this SAME named
      # volume (Compose does this automatically), which is what lets any
      # replica see/download a backup created by any other -- and why
      # backup_service.py's index.json writes and the scheduled-backup
      # Redis lock both exist (see that file) to keep concurrent replicas
      # from corrupting each other's writes to it.
      - backup_data:/app/backups
      # Finished CSV/PDF exports (see backend/tasks/export_tasks.py) --
      # written by the `worker` container below, served back out by
      # whichever `backend` replica happens to receive the download
      # request, which only works because they share this SAME volume.
      - export_data:/app/export_results
    environment:
      # "development" or "production" -- gates the startup JWT-secret check
      # in backend/config.py (requirement #5). Defaults to "development" so
      # local `docker compose up` keeps working with the placeholder secret.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ERRORBEACON_ENABLE_DOCS: ${ERRORBEACON_ENABLE_DOCS:-false}
      ERRORBEACON_MAX_REQUEST_BODY_BYTES: ${ERRORBEACON_MAX_REQUEST_BODY_BYTES:-131072}
      ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE: ${ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE:-10}
      ERRORBEACON_TRUST_PROXY_HEADERS: ${ERRORBEACON_TRUST_PROXY_HEADERS:-false}
      # Local Compose schema is managed by the one-shot migrate service.
      AUTO_INIT_DB: "false"
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_INGEST_API_KEY: ${ERRORBEACON_INGEST_API_KEY:-}
      ERRORBEACON_ADMIN_API_KEY: ${ERRORBEACON_ADMIN_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      # How many uvicorn worker processes backend/start.sh launches when
      # ENVIRONMENT=production (ignored otherwise -- development/local
      # always run a single worker with --reload instead). Set this to
      # roughly the number of CPU cores available to the container; more
      # workers use more memory and take slightly longer to all finish
      # starting, so don't set it higher than you actually need.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Must match the postgres credentials above -- built from the SAME
      # .env variables so they can never silently drift apart. The hostname
      # "db" works because Docker Compose puts every service on the same
      # network and lets them reach each other by service name.
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:supersecret@db:5432/asset_db}
      USE_PGBOUNCER: ${USE_PGBOUNCER:-true}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      # Must match the `pgbouncer` service's own DEFAULT_POOL_SIZE/RESERVE_POOL_SIZE
      # above -- see backend/config.py's PGBOUNCER_DEFAULT_POOL_SIZE docstring for why
      # (adaptive pool sizing/DBConcurrencyMiddleware use these to avoid over-admitting
      # requests past what PgBouncer can actually service).
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-5}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-2}
      PGBOUNCER_SERVER_POOL_SIZE: ${PGBOUNCER_SERVER_POOL_SIZE:-7}
      PGBOUNCER_SAFETY_MARGIN_PERCENT: ${PGBOUNCER_SAFETY_MARGIN_PERCENT:-10}
      # Tells backend/database.py's adaptive connection-pool sizing
      # (_compute_pool_sizing()) exactly how many DB-connecting processes
      # can exist AT ONCE in this stack, instead of letting it derive a
      # (wrong, for this topology) guess from BACKEND_MAX_REPLICAS: this
      # deployment's replica-shaped derivation doesn't fit `worker`/`beat`
      # running as their own separate, always-on processes rather than
      # embedded. Default (unscaled) worst case: backend (1 -- ENVIRONMENT
      # defaults to development here, and start.sh only honors
      # UVICORN_WORKERS in production) + worker (--concurrency=2, i.e. 2
      # forked processes) + beat (1, no concurrency) = 4. If you
      # `docker compose up --scale backend=N`, bump this on all three of
      # backend/worker/beat (kept in sync by hand, same as
      # docker-compose.vm.yml) to reflect the extra replicas -- e.g.
      # N=3 unscaled-1 extra => 4 + (N-1).
      DB_EXPECTED_PROCESSES: "4"
      # One deployment-wide DB slot is reserved for background Celery/Beat work;
      # database.py subtracts it from the API pool budget and db_admission.py
      # enforces the same limit through Redis.
      DB_BACKGROUND_CONNECTION_RESERVE: ${DB_BACKGROUND_CONNECTION_RESERVE:-1}
      DB_BACKGROUND_CONCURRENCY_LIMIT: ${DB_BACKGROUND_CONCURRENCY_LIMIT:-1}
      # Broker + result backend for the async export job system (see
      # backend/celery_app.py) -- "redis" is the service name below,
      # resolved by Compose's internal DNS the same way "db" is for
      # Postgres.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Where finished CSV/PDF export files land on disk (see
      # backend/tasks/export_tasks.py) -- must match the `export_data`
      # volume's mount path above, and the SAME value the `worker` service
      # below is given, since one container writes here and the other
      # reads from it.
      EXPORT_RESULT_DIR: ${EXPORT_RESULT_DIR:-/app/export_results}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file -- see .env.example}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
      # Now mostly defense-in-depth: since the browser always calls the
      # SAME origin that served the page (nginx proxies /api/* under the
      # hood -- see nginx/default.conf.template), this almost never matters
      # for same-origin requests anymore. It still matters if you ever hit
      # this backend directly (bypassing nginx) or from a genuinely
      # different origin, so it stays here rather than being removed.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      # Brand name printed on the Quotation/Checkout Receipt PDF letterhead
      # (see backend/config.py's SITE_NAME docstring). Change this to
      # rebrand every future PDF export at once.
      SITE_NAME: ${SITE_NAME:-Snipe-IT Lite}
      # IANA timezone used to render CSV/PDF export timestamps and the
      # scheduled-backup filename (see backend/config.py's DISPLAY_TIMEZONE
      # docstring) + ISO 4217 currency code shown/exported everywhere a
      # price appears (see CURRENCY_CODE docstring). BUG FIX: both were
      # already real, wired-through settings on the VM path (infra-vm's
      # display_timezone/currency_code Terraform variables ->
      # cloud-init.yaml -> the VM's .env) and the ACA path (infra/
      # main.bicep's sharedEnv) the whole time, but neither compose file
      # ever actually read them here -- an operator setting either one
      # via terraform.tfvars/bicep params had it silently ignored, always
      # falling back to config.py's "Africa/Lagos"/"NGN" defaults. Caught
      # by scripts/check-bicep-compose-drift.py.
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Africa/Lagos}
      CURRENCY_CODE: ${CURRENCY_CODE:-NGN}
      # Operations & Observability requirement #2: structured logging.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # BUG FIX: this was present on `worker`/`beat` below and on every
      # service in docker-compose.vm.yml, but missing here -- backend fell
      # back to config.py's own LOG_LEVEL default (INFO, or WARNING under
      # ENVIRONMENT=production) instead of actually honoring a LOG_LEVEL set
      # in your .env, unlike every other service. Caught by
      # scripts/check-compose-drift.py.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Operations & Observability requirement #4: distributed tracing
      # (OpenTelemetry) -- see backend/telemetry.py's module docstring for
      # what this instruments and why. Off by default, matching every
      # other opt-in flag in this file; flip OTEL_ENABLED to "true" in
      # your .env and traces flow to the `jaeger` service below with NO
      # other change needed -- OTEL_EXPORTER_OTLP_ENDPOINT already points
      # at it. Remember `jaeger` itself only starts with `docker compose
      # --profile tracing up` (see this file's top comment) -- setting
      # OTEL_ENABLED=true without that profile just means spans are
      # created and immediately dropped (harmless, but pointless).
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      # Noisy (prints every span to stdout too) -- off by default even in
      # local dev; flip to "true" for a first no-Jaeger-needed smoke test
      # ("is instrumentation actually firing"), see telemetry.py.
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      # Alternative/additional export target -- see .env.azure.example and
      # README.md's "Distributed Tracing" section for how to get this
      # value from an Azure Application Insights resource. Empty here by
      # default since local docker-compose has no Azure resource to point
      # at; `jaeger` above is the local-dev equivalent.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      # Operations & Observability requirement #3: login rate limiting.
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Per-account brute-force lockout (see config.py and
      # services/auth_service.py's login()) -- a second, finer-grained
      # layer on top of the IP-based limiter above. Only read by `backend`
      # (login only happens there), so `worker` doesn't need these two.
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      # SECURITY: exposes/hides /docs, /redoc, /openapi.json -- see
      # config.py's ENABLE_API_DOCS docstring. Defaults to "true" for local
      # dev convenience; set "false" in a real production .env. Must be
      # kept in sync with the frontend service's own ENABLE_API_DOCS below
      # (same .env key drives both, so this happens automatically as long
      # as you don't override just one of the two services individually).
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      # Root Administrator identity (root account) -- see .env.example and
      # backend/config.py's SUPER_ADMIN_* docstring. These two are just the
      # fixed identity (not a secret); the password lives in the database
      # now, seeded by `alembic upgrade head` in production (see
      # backend/alembic/versions/0002_bootstrap_root_admin.py) -- that
      # migration reads ROOT_ADMIN_BOOTSTRAP_PASSWORD directly from the
      # environment, ONCE, the very first time it runs, so it's passed
      # through here too even though the running app never reads it itself.
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      ROOT_ADMIN_BOOTSTRAP_PASSWORD: ${ROOT_ADMIN_BOOTSTRAP_PASSWORD:-}
      # Email notifications (extension requests + overdue-checkout digest)
      # -- see backend/config.py's NOTIFICATIONS_ENABLED docstring. Notifications are enabled by default; configure SMTP/API provider
      # credentials for actual delivery.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      # "A reminder before something goes overdue" -- see
      # backend/config.py's DUE_SOON_REMINDER_DAYS docstring.
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
      # Database backups -- see backend/config.py's BACKUP_* docstring.
      ENABLE_AUTO_BACKUP: ${ENABLE_AUTO_BACKUP:-}
      BACKUP_HOURS_UTC: ${BACKUP_HOURS_UTC:-3}
      # Deprecated single-value override -- see config.py's docstring. Left
      # unset by default so BACKUP_HOURS_UTC above is what actually applies.
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_GDRIVE_ENABLED: ${BACKUP_GDRIVE_ENABLED:-false}
      # Mode 1 -- personal Google account (see backend/config.py's
      # BACKUP_GDRIVE_* docstring and backend/scripts/gdrive_oauth_setup.py).
      BACKUP_GDRIVE_OAUTH_CLIENT_ID: ${BACKUP_GDRIVE_OAUTH_CLIENT_ID:-}
      BACKUP_GDRIVE_OAUTH_CLIENT_SECRET: ${BACKUP_GDRIVE_OAUTH_CLIENT_SECRET:-}
      BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN: ${BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN:-}
      # Mode 2 -- Google Workspace service account + Shared Drive.
      BACKUP_GDRIVE_CREDENTIALS_JSON: ${BACKUP_GDRIVE_CREDENTIALS_JSON:-}
      BACKUP_GDRIVE_FOLDER_ID: ${BACKUP_GDRIVE_FOLDER_ID:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # ZERO-DOWNTIME: no explicit `healthcheck:` block needed here -- this
    # service's image (backend/Dockerfile) now bakes in its own
    # HEALTHCHECK instruction (GET /healthz -- see that Dockerfile's own
    # comment for the full reasoning), and Compose automatically uses an
    # image's built-in HEALTHCHECK for any service that doesn't override
    # it with one of its own. That's what makes `condition:
    # service_healthy` below (on the `frontend` service's `depends_on`)
    # meaningful: Compose won't consider this container healthy -- and
    # therefore won't start `frontend` -- until GET /healthz is actually
    # answering 200, not merely until the process has started.
    # No host `ports:` mapping -- see nginx reverse-proxy comment block
    # below for why. `backend` is still reachable from `frontend` over
    # Compose's internal network at "backend:8000", just not from the host.
    # To hit it directly for debugging (curl, Postman), temporarily add:
    #     ports:
    #       - "8000:8000"

  # ---------------------------------------------------------------------
  # worker (Celery consumer -- generates audit ledger CSV/PDF exports)
  # ---------------------------------------------------------------------
  # Same image/build context as `backend` (identical requirements.txt, so
  # it has reportlab/celery/redis/SQLAlchemy available and can import
  # services/audit_service.py directly) -- the only thing that differs is
  # the `command:` below, which runs a Celery worker process instead of
  # uvicorn. This is what actually executes `tasks.generate_audit_export`
  # jobs the `backend` container enqueues via POST /audit-logs/export
  # (backend/tasks/export_tasks.py) AND the scheduled
  # `tasks.send_overdue_notifications` digest (backend/tasks/
  # notification_tasks.py); see backend/celery_app.py for both.
  #
  # `-B` embeds Celery BEAT (the periodic-task scheduler) directly inside
  # this same worker process, rather than running it as its own container
  # -- see celery_app.py's `beat_schedule` comment for the full reasoning
  # and its "don't scale this to >1 replica without splitting Beat back
  # out" caveat.
  #
  # Talks to the SAME Postgres database as `backend` (it needs to query
  # the audit_logs table itself) and the SAME Redis instance (as the
  # queue it consumes from and where it stashes finished results) -- so it
  # gets an almost-identical environment block. Not published to the host
  # at all: nothing outside this Compose network ever talks to a worker
  # directly, only via the job queue.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Same explicit tag as `backend` above -- see that service's own
    # comment for the full "why": this is what actually prevents `worker`
    # from ever running a stale image relative to `backend` again.
    image: snipeit-lite-backend:local
    # No `container_name` here either (see `backend` service's comment
    # above) -- this is what lets you run
    # `docker compose up --scale worker=3` during peak load (see
    # DEPLOYMENT.md) to process more CSV/PDF export jobs in parallel.
    restart: unless-stopped
    # No `-B` flag -- Beat (the periodic-task scheduler) runs in its own
    # single-replica `beat` service below, not embedded here. That's what
    # lets `worker` scale to multiple replicas without firing duplicate
    # overdue/due-soon notification digests once per replica.
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      # Shares the SAME volume as the `backend` service's own mount of
      # this path -- `worker` is what actually writes finished export
      # files here (see backend/tasks/export_tasks.py), `backend` is what
      # reads them back out for download.
      - export_data:/app/export_results
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ERRORBEACON_ENABLE_DOCS: ${ERRORBEACON_ENABLE_DOCS:-false}
      ERRORBEACON_MAX_REQUEST_BODY_BYTES: ${ERRORBEACON_MAX_REQUEST_BODY_BYTES:-131072}
      ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE: ${ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE:-10}
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_INGEST_API_KEY: ${ERRORBEACON_INGEST_API_KEY:-}
      ERRORBEACON_ADMIN_API_KEY: ${ERRORBEACON_ADMIN_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:supersecret@db:5432/asset_db}
      USE_PGBOUNCER: ${USE_PGBOUNCER:-true}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      # Must match the `pgbouncer` service's own DEFAULT_POOL_SIZE/RESERVE_POOL_SIZE
      # above -- see backend/config.py's PGBOUNCER_DEFAULT_POOL_SIZE docstring for why
      # (adaptive pool sizing/DBConcurrencyMiddleware use these to avoid over-admitting
      # requests past what PgBouncer can actually service).
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-5}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-2}
      PGBOUNCER_SERVER_POOL_SIZE: ${PGBOUNCER_SERVER_POOL_SIZE:-7}
      PGBOUNCER_SAFETY_MARGIN_PERCENT: ${PGBOUNCER_SAFETY_MARGIN_PERCENT:-10}
      # See `backend`'s matching DB_EXPECTED_PROCESSES comment above for
      # the full "why 4" breakdown -- this worker's own --concurrency=2
      # (2 forked processes) is one of the three inputs.
      DB_EXPECTED_PROCESSES: "4"
      # One deployment-wide DB slot is reserved for background Celery/Beat work;
      # database.py subtracts it from the API pool budget and db_admission.py
      # enforces the same limit through Redis.
      DB_BACKGROUND_CONNECTION_RESERVE: ${DB_BACKGROUND_CONNECTION_RESERVE:-1}
      DB_BACKGROUND_CONCURRENCY_LIMIT: ${DB_BACKGROUND_CONCURRENCY_LIMIT:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Dedicated local worker/beat processes wait in-process for Redis instead of crash-looping.
      CELERY_BROKER_CONNECTION_MAX_RETRIES: ${CELERY_BROKER_CONNECTION_MAX_RETRIES:-none}
      EXPORT_RESULT_DIR: ${EXPORT_RESULT_DIR:-/app/export_results}
      # `worker` is what actually generates CSV/PDF exports
      # (backend/services/export_service.py), which reads both of these
      # directly -- DISPLAY_TIMEZONE at import time (module-level
      # `DISPLAY_TZ = ZoneInfo(settings.DISPLAY_TIMEZONE)`) and
      # CURRENCY_CODE per-export for currency formatting. See the
      # `backend` service's own DISPLAY_TIMEZONE/CURRENCY_CODE comment
      # above for the "why these exist at all" story.
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Africa/Lagos}
      CURRENCY_CODE: ${CURRENCY_CODE:-NGN}
      # The worker never issues/verifies JWTs itself (export jobs are
      # enqueued with an already-validated user's role/email baked in --
      # see api/audit.py), but Settings() still requires a JWT_SECRET_KEY
      # value to construct without error since it shares config.py with
      # the backend, so it needs the same one set here.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file -- see .env.example}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Operations & Observability requirement #4: distributed tracing --
      # see the `backend` service's own OTEL_* block above for the full
      # comment (identical here on purpose: a trace that starts in a
      # `backend` HTTP request and finishes as a task run HERE needs both
      # processes exporting to the SAME collector to show up as one
      # continuous trace). celery_app.py appends "-worker" to
      # OTEL_SERVICE_NAME automatically, so this container's spans are
      # still easy to tell apart from `backend`'s in the Jaeger/Azure UI
      # despite sharing the same env var value.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      # The worker never logs anyone in as the root admin -- that password
      # lives only in the database (see backend/security.py) -- so no
      # SUPER_ADMIN_* values need to be passed here.
      # `backend` owns DB migrations/seeding on its own startup hook, so
      # these stay disabled here regardless of `backend`'s .env values.
      AUTO_INIT_DB: "false"
      AUTO_SEED_DEMO_DATA: "false"
      # Same notification settings as `backend` above -- the overdue-digest
      # task (which runs HERE, in the worker/beat process, not in backend)
      # needs them too. Kept identical/copy-pasted rather than factored out
      # since docker-compose.yml has no "shared env block" feature without
      # YAML anchors, which this project avoids for beginner-readability.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
    depends_on:
      pgbouncer:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # This service shares `backend`'s image, which includes an inherited
    # HEALTHCHECK for `GET /healthz` over HTTP -- but this container runs
    # `celery worker`, not uvicorn, so nothing listens on port 8000.
    # Override with a real Celery liveness check: `celery inspect ping`
    # round-trips through the same broker this worker consumes from.
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --destination celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------
  # beat (Celery periodic-task scheduler -- fires the overdue/due-soon
  # notification digests on a schedule; see celery_app.py's beat_schedule)
  # ---------------------------------------------------------------------
  # Split out into its own service, deliberately with NO `deploy.replicas`
  # or `--scale` usage, EVER: Celery Beat firing more than once for the
  # same scheduled task, from more than one process, sends duplicate
  # notification emails. Keeping Beat as this one dedicated, never-scaled
  # service (instead of the old `-B` flag embedded in `worker`, which
  # WOULD duplicate if `worker` were scaled) is what makes `worker` itself
  # safe to scale to N replicas above.
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Same explicit tag as `backend`/`worker` above -- see `backend`'s own
    # comment for the full "why".
    image: snipeit-lite-backend:local
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ERRORBEACON_ENABLE_DOCS: ${ERRORBEACON_ENABLE_DOCS:-false}
      ERRORBEACON_MAX_REQUEST_BODY_BYTES: ${ERRORBEACON_MAX_REQUEST_BODY_BYTES:-131072}
      ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE: ${ERRORBEACON_ADMIN_AUTH_FAILURES_PER_MINUTE:-10}
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_INGEST_API_KEY: ${ERRORBEACON_INGEST_API_KEY:-}
      ERRORBEACON_ADMIN_API_KEY: ${ERRORBEACON_ADMIN_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:supersecret@db:5432/asset_db}
      USE_PGBOUNCER: ${USE_PGBOUNCER:-true}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      # Must match the `pgbouncer` service's own DEFAULT_POOL_SIZE/RESERVE_POOL_SIZE
      # above -- see backend/config.py's PGBOUNCER_DEFAULT_POOL_SIZE docstring for why
      # (adaptive pool sizing/DBConcurrencyMiddleware use these to avoid over-admitting
      # requests past what PgBouncer can actually service).
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-5}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-2}
      PGBOUNCER_SERVER_POOL_SIZE: ${PGBOUNCER_SERVER_POOL_SIZE:-7}
      PGBOUNCER_SAFETY_MARGIN_PERCENT: ${PGBOUNCER_SAFETY_MARGIN_PERCENT:-10}
      # See `backend`'s matching DB_EXPECTED_PROCESSES comment above for
      # the full "why 4" breakdown -- beat itself is only 1 of the 4 (no
      # concurrency), but still needs the SAME total so its own pool is
      # sized to fit alongside the other three.
      DB_EXPECTED_PROCESSES: "4"
      # One deployment-wide DB slot is reserved for background Celery/Beat work;
      # database.py subtracts it from the API pool budget and db_admission.py
      # enforces the same limit through Redis.
      DB_BACKGROUND_CONNECTION_RESERVE: ${DB_BACKGROUND_CONNECTION_RESERVE:-1}
      DB_BACKGROUND_CONCURRENCY_LIMIT: ${DB_BACKGROUND_CONCURRENCY_LIMIT:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Dedicated local worker/beat processes wait in-process for Redis instead of crash-looping.
      CELERY_BROKER_CONNECTION_MAX_RETRIES: ${CELERY_BROKER_CONNECTION_MAX_RETRIES:-none}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file -- see .env.example}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Operations & Observability requirement #4: distributed tracing --
      # see the `backend` service's own OTEL_* block for the full
      # comment. celery_app.py appends "-beat" to OTEL_SERVICE_NAME
      # automatically for this process specifically (via `beat_init`, not
      # `worker_process_init` -- see that file's own comment for why
      # Beat needs its own separate signal).
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      # Same reasoning as the `worker` service above: no startup validator
      # requires these anymore, since the root admin's password lives in
      # the database now, not in an environment variable.
      AUTO_INIT_DB: "false"
      AUTO_SEED_DEMO_DATA: "false"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
    depends_on:
      pgbouncer:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # This container inherits `backend`'s HTTP-based HEALTHCHECK, but
    # `celery beat` serves no HTTP endpoint and (unlike `worker`) has no
    # "inspect ping" equivalent -- Beat doesn't consume tasks, so it never
    # answers control commands. RedBeat's schedule lives in Redis, not a
    # local file, so there's nothing to check locally either. Disable the
    # inherited check rather than have Compose falsely report it unhealthy.
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------
  # jaeger (local distributed-tracing UI -- Operations & Observability
  # requirement #4; see backend/telemetry.py's module docstring)
  # ---------------------------------------------------------------------
  # OPT-IN: `profiles: [tracing]` means plain `docker compose up` never
  # starts this -- you have to explicitly ask for it:
  #     docker compose --profile tracing up
  # (add `-d` as usual to run it in the background). If you `docker
  # compose up` without `--profile tracing`, this container never even
  # starts, backend/worker/beat still try to export spans to
  # "jaeger:4318" and simply fail silently in the background (their
  # BatchSpanProcessor swallows the connection errors) -- this is the
  # single most common "why is Jaeger empty" cause, so always double
  # check you actually used the `--profile tracing` flag before anything
  # else. Every backend/worker/beat service's OTEL_EXPORTER_OTLP_ENDPOINT
  # above already points at "http://jaeger:4318" by default, so the only
  # other thing needed to see traces locally is OTEL_ENABLED=true in your
  # .env (see .env.example) -- no Jaeger-specific config on your end.
  #
  # Runs Jaeger v2 (a from-scratch rewrite on the OpenTelemetry Collector --
  # Jaeger v1 reached end-of-life 2025-12-31). Pinned to a specific version
  # (never "latest") so `docker compose pull` can't silently swap releases.
  # v2's all-in-one image has OTLP enabled on 4317 (gRPC) and 4318 (HTTP) by
  # default -- matches OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 above,
  # so backend/telemetry.py needs no Jaeger-specific config.
  #
  # One self-contained image bundling the collector, in-memory storage, and
  # query UI -- right for local dev where traces don't need to outlive
  # `docker compose down`. Not what infra/main.bicep uses in production --
  # see that file's `otelAzureMonitorEnabled` param for the Application
  # Insights path, which persists traces.
  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: snipeit_lite_jaeger
    profiles: ["tracing"]
    restart: unless-stopped
    # Jaeger v2 uses its built-in all-in-one configuration by default.
    # This small UI-only override adds clean, application-specific quick
    # searches without changing trace collection/storage behavior.
    command:
      - "--set=extensions.jaeger_query.ui.config_file=/etc/jaeger/ui-config.json"
    volumes:
      - ./jaeger/ui-config.json:/etc/jaeger/ui-config.json:ro
    ports:
      # Jaeger UI -- open http://localhost:16686 once both this and
      # `backend` (with OTEL_ENABLED=true) are running, and click any
      # request you just made through http://localhost:8080 to see its
      # full span waterfall (HTTP request -> SQL queries -> any Celery
      # task it enqueued).
      - "16686:16686"
      # OTLP/HTTP receiver -- what OTEL_EXPORTER_OTLP_ENDPOINT above
      # actually talks to. Published to the host too (not strictly
      # needed for backend/worker/beat, which reach it over the internal
      # "jaeger:4318" service name instead) purely so you can also point
      # a one-off local script/`curl` at "http://localhost:4318" while
      # debugging, without editing this file.
      - "4318:4318"
      # OTLP/gRPC receiver -- not used by this app (backend/telemetry.py
      # defaults OTEL_EXPORTER_OTLP_PROTOCOL to "http/protobuf", see that
      # setting's own comment for why), but published anyway since v2
      # enables it by default and it's occasionally handy for a one-off
      # gRPC-based debugging tool.
      - "4317:4317"

  # ---------------------------------------------------------------------
  # frontend / nginx reverse proxy (requirement: multi-tier deployment)
  # ---------------------------------------------------------------------
  # Built from frontend/Dockerfile: one self-contained image bundling the
  # static site AND an environment-templated nginx config (see
  # nginx/default.conf.template). Deployed unmodified to Render and your
  # cloud environment too -- only the environment variables below change.
  #
  # SECURITY: this is the only container with a host-published port. The
  # browser talks exclusively to nginx, which forwards /api/* to `backend`
  # over the private Compose network (see BACKEND_HOST/BACKEND_PORT below).
  # `backend` itself is not reachable from outside Docker.

  errorbeacon:
    build:
      context: .
      dockerfile: errorbeacon/Dockerfile
    image: errorbeacon-lite:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      ERRORBEACON_INGEST_API_KEY: ${ERRORBEACON_INGEST_API_KEY:-}
      ERRORBEACON_ADMIN_API_KEY: ${ERRORBEACON_ADMIN_API_KEY:-}
      ERRORBEACON_TRUST_PROXY_HEADERS: ${ERRORBEACON_TRUST_PROXY_HEADERS:-false}
      ERRORBEACON_EMAIL_FALLBACK_ENABLED: ${ERRORBEACON_EMAIL_FALLBACK_ENABLED:-true}
      ERRORBEACON_EMAIL_FALLBACK_AFTER_ATTEMPTS: ${ERRORBEACON_EMAIL_FALLBACK_AFTER_ATTEMPTS:-3}
      ERRORBEACON_EMAIL_FALLBACK_AFTER_SECONDS: ${ERRORBEACON_EMAIL_FALLBACK_AFTER_SECONDS:-300}
      ERRORBEACON_RETENTION_DAYS: ${ERRORBEACON_RETENTION_DAYS:-90}
      ERRORBEACON_DB_WARN_MB: ${ERRORBEACON_DB_WARN_MB:-4096}
      ERRORBEACON_AUTO_STALE_DAYS: ${ERRORBEACON_AUTO_STALE_DAYS:-30}
      ERRORBEACON_CLEAN_MAX_DEPTH: ${ERRORBEACON_CLEAN_MAX_DEPTH:-10}
      ERRORBEACON_CLEAN_MAX_ITEMS: ${ERRORBEACON_CLEAN_MAX_ITEMS:-100}
      ERRORBEACON_DIGEST_ENABLED: ${ERRORBEACON_DIGEST_ENABLED:-true}
      ERRORBEACON_DIGEST_INTERVAL_HOURS: ${ERRORBEACON_DIGEST_INTERVAL_HOURS:-24}
      ERRORBEACON_STARTUP_SELF_TEST: ${ERRORBEACON_STARTUP_SELF_TEST:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://errorbeacon.local}
      DEDUP_SECONDS: ${DEDUP_SECONDS:-60}
      SPIKE_THRESHOLD: ${SPIKE_THRESHOLD:-10}
      SPIKE_WINDOW_SECONDS: ${SPIKE_WINDOW_SECONDS:-300}
      ALERT_QUEUE_SIZE: ${ALERT_QUEUE_SIZE:-1000}
      ALERT_WORKERS: ${ALERT_WORKERS:-3}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-true}
      # Reverse direction of ERRORBEACON_URL above -- lets the Telegram /apphealth
      # command poll backend's /healthz, /readyz and /health/dependencies. `backend`
      # is reachable by service name on this same Compose network.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      BACKEND_HEALTH_TIMEOUT_SECONDS: ${BACKEND_HEALTH_TIMEOUT_SECONDS:-5}
    volumes:
      - errorbeacon_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # BUILD-TIME (not runtime) arg -- this is what actually changes what
      # ends up inside the image, since frontend/js gets transformed once,
      # during `docker compose build`, not on every container start. Reads
      # the SAME ENVIRONMENT value from .env as the backend/worker services
      # below, so there's still exactly one setting to change: local (raw
      # source), development (minified), or production (minified +
      # obfuscated) -- see frontend/Dockerfile's frontend-build stage and
      # build-frontend/build.js for what each mode does.
      #
      # IMPORTANT: unlike the `environment:` blocks below, editing .env
      # alone does NOT change a running container -- you must rebuild the
      # image for a new ENVIRONMENT value to take effect:
      #   docker compose build frontend && docker compose up -d frontend
      # or simply:
      #   docker compose up -d --build frontend
      # Watch the build output when you do -- build-frontend/build.js
      # prints a per-file size report (and total) for whichever mode just
      # ran, so you can see exactly what changed.
      args:
        BUILD_ENV: ${ENVIRONMENT:-development}
      # Which of frontend/Dockerfile's two mutually exclusive final stages
      # to build -- "frontend-legacy-only" (the legacy static site) or
      # "frontend-react-only" (the React "Ledger" SPA); both land at "/".
      # There is no combined default anymore (the old `frontend-final`
      # stage that shipped both side-by-side has been removed -- see
      # frontend/Dockerfile's own top-of-file comment), so this arg always
      # resolves to a real, explicit choice: FRONTEND_BUILD_TARGET in .env
      # controls it, defaulting to "frontend-react-only" (the React
      # "Ledger" SPA) if left unset -- this now matches the default used by
      # every other deploy path (ACA/VM CI both already default to "react"
      # when their own FRONTEND_BUILD_TARGET Actions variable is unset; see
      # .github/workflows/deploy-azure-aca.yml and deploy-azure-vm.yml), so
      # local Docker Compose and cloud deploys no longer disagree about
      # which frontend ships out of the box. Set
      # FRONTEND_BUILD_TARGET=frontend-legacy-only in .env to build the
      # legacy static site instead; see frontend/Dockerfile's own stage
      # comments and frontend-app/README.md's "Detaching this app" section.
      target: ${FRONTEND_BUILD_TARGET:-frontend-react-only}
    container_name: snipeit_lite_frontend
    restart: unless-stopped
    environment:
      # Which port nginx listens on INSIDE the container. Left at 80 here
      # since we're the ones choosing the host-side port via the `ports:`
      # mapping below; a platform like Render would instead inject its own
      # $PORT and this line wouldn't exist in that environment at all.
      PORT: ${FRONTEND_PORT:-80}
      # "backend" is this Compose file's service name above -- Docker's
      # embedded DNS resolves it automatically to that container's current
      # IP on every request (see default.conf.template's `resolver`
      # directive for why "every request" matters, not just "at startup").
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      RESOLVER_IP: ${RESOLVER_IP:-127.0.0.11}
      # SECURITY: must match the backend service's own ENABLE_API_DOCS
      # above -- see that line's comment and config.py's ENABLE_API_DOCS
      # docstring. Reading from the SAME .env key here means the two
      # services can't silently drift out of sync with each other.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
    ports:
      - "8080:80"
    # ZERO-DOWNTIME: `condition: service_healthy` (not the old bare
    # `- backend` shorthand, which only waits for the container to
    # START, not for it to actually be ANSWERING requests) -- now that
    # `backend` has a real HEALTHCHECK (see backend/Dockerfile), this
    # makes Compose hold `frontend` back until GET /healthz on that
    # container is genuinely returning 200. Without this, `docker
    # compose up`'s first few seconds could route real traffic through
    # nginx to a backend container that's still mid-import/mid-startup
    # (see main.py's on_startup()) and get a connection-refused/502
    # instead of a clean "not ready yet" -- nginx's own `resolver ...
    # valid=10s` + per-request re-resolution (see
    # nginx/default.conf.template) already handles the backend's IP
    # CHANGING later during a redeploy, but it can't paper over the
    # backend not being reachable AT ALL yet on first boot.
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  backup_data:
  export_data:
  errorbeacon_data:
