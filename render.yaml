# =============================================================================
# render.yaml
# -----------------------------------------------------------------------------
# Render "Blueprint" (Infrastructure as Code) for Snipe-IT Lite, reconfigured
# to run ENTIRELY on Render's FREE plan. See:
#   https://render.com/docs/blueprint-spec
#   https://render.com/docs/free
#
# WHY THIS LOOKS DIFFERENT FROM A "TYPICAL" MULTI-SERVICE DEPLOYMENT
# -----------------------------------------------------------------------------
# Render's Free plan only supports THREE service types: Web Services, Render
# Postgres, and Render Key Value (Redis) -- Private Services and Background
# Workers aren't available on Free at any plan, and a Free web service can
# send private-network traffic to datastores but can't receive it, so a
# private backend behind a public frontend (two web-shaped services talking
# to each other) isn't reachable either.
#
# THE FIX: one combined image (see Dockerfile.render + render-start.sh) that
# runs the FastAPI backend, the static frontend, AND (embedded, via
# RUN_EMBEDDED_WORKER) the Celery worker/beat process all in a SINGLE
# container -- so the whole app fits on the one service type Free instances
# actually support. That leaves exactly three resources below,
# ALL eligible for a Free instance type:
#   - snipeit-lite-db     (Postgres,   plan: free)
#   - snipeit-lite-redis  (Key Value,  plan: free)
#   - snipeit-lite-web    (Web Service, plan: free)
#
# FREE PLAN LIMITATIONS TO KNOW ABOUT (see README.md for the full writeup):
#   - The web service spins down after 15 minutes with no traffic, and takes
#     about a minute to spin back up on the next request -- expect a cold
#     start after any idle period.
#   - 750 free instance-hours per workspace per month, shared across every
#     free web service in the workspace. Running just this one service
#     around the clock stays comfortably under that; a second always-on
#     free web service in the same workspace could push you over it.
#   - Only ONE free Postgres and ONE free Key Value instance are allowed per
#     workspace -- if you already use either for another project in this
#     same workspace, you'll need to upgrade one of them to a paid plan.
#   - Free Postgres databases expire 30 days after creation (with a 14-day
#     grace period to upgrade before deletion) -- there's no way around
#     this on the Free plan; budget for upgrading DATABASE storage before
#     then if this deployment needs to outlive that window.
#   - Free Key Value (Redis) instances are IN-MEMORY ONLY -- every restart
#     (including every spin-down/spin-up cycle) wipes any queued-but-not-
#     yet-processed export job. That's an acceptable tradeoff for this
#     app's actual Redis usage (Celery broker/result backend for CSV/PDF
#     exports and the notification schedule) -- worst case, a queued
#     export job is lost and someone re-clicks "export".
#   - The embedded Celery worker/beat process (see render-start.sh) lives
#     and dies with the web service's own spin-down/redeploy cycle. Its
#     scheduled tasks (overdue/due-soon notification digests -- see
#     celery_app.py's beat_schedule) fire on a timer measured from
#     whenever the container last booted, NOT at a fixed clock time, so
#     they may run somewhat irregularly if the service spins down and
#     back up between scheduled runs. Fine for a personal/demo deployment;
#     upgrade off the Free plan (see below) for anything where reliably
#     timed notification emails actually matter.
#
# UPGRADING LATER: every setting below that's specific to the free-tier
# shape is confined to `plan: free` and the single combined `snipeit-lite-
# web` service. To split back out into separate backend/worker/frontend
# services on a paid plan (e.g. for horizontal scaling, which the embedded-
# worker approach explicitly does NOT support -- see render-start.sh's
# caveats), reintroduce `pserv`/`worker`-typed services pointed at
# backend/Dockerfile with SERVE_FRONTEND=false and RUN_EMBEDDED_WORKER=
# false, and change snipeit-lite-web back to a real nginx frontend. The
# application code itself (backend/main.py's SERVE_FRONTEND /
# RUN_EMBEDDED_WORKER flags) already supports both shapes.
# =============================================================================

databases:
  # Managed Postgres, Free instance type. Free Postgres databases: 1 GB
  # storage, expire 30 days after creation (14-day grace period to upgrade
  # before deletion), and only ONE is allowed per workspace -- see the
  # top-of-file comment.
  - name: snipeit-lite-db
    databaseName: asset_db
    user: snipeit
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------
  # Redis (Render Key Value), Free instance type -- Celery broker + result
  # backend for async audit-ledger exports AND the notification schedule
  # (see backend/celery_app.py). `ipAllowList: []` is REQUIRED for Key
  # Value instances (unlike Postgres/web services, it has no "allow all"
  # default) and means "no external access, private-network only" -- only
  # snipeit-lite-web (below) can reach it, which is all this app needs.
  # Free Key Value instances are in-memory only (see top-of-file comment)
  # and only ONE is allowed per workspace.
  # ---------------------------------------------------------------------
  - type: keyvalue
    name: snipeit-lite-redis
    plan: free
    ipAllowList: []
    region: oregon # Must match snipeit-lite-web's region -- see below.

  # ---------------------------------------------------------------------
  # The whole app: FastAPI backend + static frontend + (embedded) Celery
  # worker/beat, all in ONE container, built from Dockerfile.render. This
  # is the ONLY service in this Blueprint that can run on a Free instance
  # type as a public-facing service -- see the top-of-file comment for why
  # the original private-backend/private-worker/public-nginx split doesn't
  # fit the Free plan.
  # ---------------------------------------------------------------------
  - type: web
    name: snipeit-lite-web
    runtime: docker
    dockerfilePath: Dockerfile.render
    dockerContext: . # Repo root -- Dockerfile.render COPYs backend/, frontend/, and frontend-app/ from here.
    plan: free
    region: oregon # Must match snipeit-lite-redis's region -- private networking only works within a single Render region.
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snipeit-lite-db
          property: connectionString
      # Render Free does not provide a private service type for the PgBouncer
      # hop without changing the deployment tier. Keep this path direct rather
      # than silently pointing the app at a nonexistent localhost pooler.
      - key: USE_PGBOUNCER
        value: false
      # Broker + result backend for the embedded Celery worker/beat process
      # started by render-start.sh (see RUN_EMBEDDED_WORKER below) --
      # backend/celery_app.py.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: snipeit-lite-redis
          property: connectionString
      # Serve frontend/*.html/js/css directly from this same FastAPI
      # process (see backend/main.py's StaticFiles mount) instead of
      # relying on a separate nginx service -- see top-of-file comment.
      - key: SERVE_FRONTEND
        value: true
      # FRONTEND SELECTOR: React is the default Render frontend. Change ONLY
      # this environment variable to `legacy` if the classic frontend is ever
      # needed. Both builds are already in the image, so switching this value
      # does not require a new Docker build; Render redeploys the existing build.
      - key: FRONTEND_VARIANT
        value: react
      # Launch `celery -A celery_app worker -B` as a background process
      # inside THIS container (see render-start.sh) instead of a separate
      # Background Worker service, which isn't available on the Free plan
      # at all -- see top-of-file comment for the caveats (dies/restarts
      # with the web service, doesn't scale past one instance).
      - key: RUN_EMBEDDED_WORKER
        value: true
      # Long-lived application signing secret. Render must preserve the
      # Dashboard value across Blueprint syncs/redeploys; rotating this
      # would invalidate every existing JWT. Set it once in Render.
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: 12
      # Same-origin in normal use now that this one service serves BOTH
      # the frontend and the API (no separate frontend origin exists in
      # this deployment shape) -- this mostly matters as defense-in-depth
      # for anyone hitting the API directly from a different origin.
      # RENDER_EXTERNAL_URL is a Render-default env var this service gets
      # automatically, pointing at its own public onrender.com URL (or
      # custom domain, if configured).
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: snipeit-lite-web
          envVarKey: RENDER_EXTERNAL_URL
      # Deployment brand name -- on-screen navbar/login header + <title>
      # AND the Quotation/Checkout Receipt PDF letterhead
      # (see backend/config.py's SITE_NAME docstring).
      - key: SITE_NAME
        value: Snipe-IT Lite
      # Demo/staging-friendly defaults. Flip both to "false" for a real
      # production deployment with real data -- see README.md's "Database
      # Migrations" section for running `alembic upgrade head` as an
      # explicit deploy step instead.
      - key: AUTO_INIT_DB
        value: true
      - key: AUTO_SEED_DEMO_DATA
        value: true
      - key: LOG_LEVEL
        value: INFO
      # ErrorBeacon is deployed as a separate Render Web Service using
      # errorbeacon/render.yaml. These variables let the main application
      # send ingest events to that monitor without exposing its admin key.
      - key: ERRORBEACON_URL
        sync: false
      - key: ERRORBEACON_INGEST_API_KEY
        sync: false
      - key: ERRORBEACON_APP
        value: asset-inventory-quotes
      - key: LOG_FORMAT
        value: json
      - key: LOGIN_RATE_LIMIT_MAX
        value: 5
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      # Per-account brute-force lockout -- see config.py and
      # services/auth_service.py's login(). A second, finer-grained layer
      # on top of the IP-based limiter above.
      - key: ACCOUNT_LOCKOUT_MAX_ATTEMPTS
        value: 5
      - key: ACCOUNT_LOCKOUT_DURATION_MINUTES
        value: 15
      # SECURITY: this is a real cloud deployment reachable from the public
      # internet, so /docs, /redoc, and /openapi.json are disabled here --
      # see config.py's ENABLE_API_DOCS docstring for the full reasoning.
      # There's no separate nginx layer to double-gate this anymore (see
      # top-of-file comment) -- FastAPI's own docs_url/redoc_url/
      # openapi_url gating (backend/main.py) is now the only layer, and
      # it's sufficient on its own (it doesn't just hide the UI, it never
      # generates/registers these routes at all when disabled).
      - key: ENABLE_API_DOCS
        value: false
      # Root Administrator identity (root account) -- see
      # backend/security.py's module docstring and .env.example. Its
      # password is no longer an environment secret: this demo deployment
      # has AUTO_SEED_DEMO_DATA=true above, so backend/database.py's
      # seed_db() inserts it with the same well-known demo password as
      # every other seeded account (see that file's docstring for the
      # full credentials list) -- there's nothing to `generateValue` here
      # anymore. A real production deployment should flip
      # AUTO_SEED_DEMO_DATA to "false" and run `alembic upgrade head`
      # instead (see backend/alembic/versions/0002_bootstrap_root_admin.py),
      # which prints a randomly generated password to that job's logs
      # exactly once instead of using a fixed demo value.
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_NAME
        value: Super Admin
      # Email notifications (extension requests + overdue-checkout digest +
      # due-soon reminders) -- see backend/config.py's NOTIFICATIONS_ENABLED
      # docstring and .env.example. Disabled by default here too; flip
      # NOTIFICATIONS_ENABLED to "true" and fill in BREVO_API_KEY (or
      # switch EMAIL_PROVIDER to "resend" and fill in RESEND_API_KEY
      # instead) once you have one. Sent from the SAME process that runs
      # the embedded worker (see RUN_EMBEDDED_WORKER above) -- unlike the
      # old multi-service setup, there's no separate worker service to
      # duplicate these values into.
      #
      # EMAIL_PROVIDER defaults to "brevo" HERE, not "smtp" (config.py's
      # own default) -- see backend/services/notification_service.py's
      # top-of-file comment and config.py's EMAIL_PROVIDER comment for the
      # full story, but in short: Render's Free web service instance type
      # blocks ALL outbound traffic on SMTP ports 25/465/587 at the
      # network level (https://render.com/docs/free#free-web-services), so
      # plain SMTP cannot reach ANY provider from this service no matter
      # how SMTP_HOST/PORT below are configured. Brevo's free tier (300
      # emails/day, no credit card, no domain verification required to
      # start -- https://app.brevo.com/settings/keys/api) sends over port
      # 443 instead, which Free Render services CAN reach, so it's the
      # option that actually works while staying on Render's Free plan --
      # this Blueprint's entire premise (see this file's own top-of-file
      # comment). Brevo requires SMTP_FROM_EMAIL below to be a verified
      # sender in your Brevo account first (Brevo dashboard > Senders,
      # Domains & Dedicated IPs -- a one-click email confirmation, not
      # full DNS/domain verification) -- see config.py's BREVO_API_KEY
      # comment. The SMTP_* keys below are left in place, unused by
      # default, purely so switching EMAIL_PROVIDER back to "smtp" later
      # (e.g. after upgrading off the Free instance type) doesn't require
      # re-adding them from scratch.
      - key: NOTIFICATIONS_ENABLED
        value: true
      - key: EMAIL_PROVIDER
        value: brevo
      # Provider credentials are Dashboard-managed. `sync: false` means a
      # later Blueprint sync never replaces/clears a working key.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: SMTP_USE_SSL
        value: false
      # Sender/admin routing is operator configuration; preserve it too so
      # a Blueprint sync cannot silently clear notification destinations.
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
      - key: OVERDUE_DIGEST_HOURS_UTC
        value: 7
      - key: DUE_SOON_REMINDER_DAYS
        value: 1
      - key: DUE_SOON_DIGEST_HOURS_UTC
        value: 7
      - key: SEND_INDIVIDUAL_HOLDER_REMINDERS
        value: false
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale. Sent from the SAME
      # embedded-worker process as every other notification above.
      - key: EXTENSION_REQUEST_SLA_HOURS
        value: 24
      - key: QUOTATION_SLA_HOURS
        value: 24
      - key: APPROVAL_SLA_CHECK_INTERVAL_MINUTES
        value: 60
      - key: APPROVAL_SLA_ESCALATION_REPEAT_HOURS
        value: 24
      # Whether a Quotation's own recipient gets emailed on every change
      # (line items, notes, discount, assignment, approval, fulfillment)
      # on top of the in-app bell notification, which is always created
      # regardless -- see backend/config.py's own comment.
      - key: SEND_QUOTATION_RECIPIENT_EMAILS
        value: true
      # Database backups -- see backend/config.py's BACKUP_* docstring and
      # README.md's "Backups" section. Runs daily inside this same web
      # service process (a plain daemon thread, not Celery), so it works
      # on the Free plan with no Background Worker service needed.
      - key: ENABLE_AUTO_BACKUP
        value: true
      # Comma-separated hours (UTC, 0-23) -- e.g. "3" for once a day, or
      # "3,15,21" for three times a day. See config.py's BACKUP_HOURS_UTC
      # docstring.
      - key: BACKUP_HOURS_UTC
        value: 3
      - key: BACKUP_DIR
        value: /app/backups
      # This service's disk is wiped on every restart/redeploy on the Free
      # plan -- BACKUP_RETENTION_COUNT only limits the LOCAL copy count.
      # Enable BACKUP_GDRIVE_ENABLED (and fill in one of the two auth modes
      # below -- see backend/config.py's BACKUP_GDRIVE_* docstring) for
      # backups that actually survive a redeploy/spin-down.
      - key: BACKUP_RETENTION_COUNT
        value: 7
      - key: BACKUP_GDRIVE_ENABLED
        value: false
      # Mode 1 -- personal Google account (recommended unless you have a
      # Workspace Shared Drive). Run backend/scripts/gdrive_oauth_setup.py
      # locally first to get these three values.
      - key: BACKUP_GDRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: BACKUP_GDRIVE_OAUTH_CLIENT_SECRET
        sync: false
      - key: BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN
        sync: false
      # Mode 2 -- Google Workspace service account, only works if
      # BACKUP_GDRIVE_FOLDER_ID below is a Shared Drive folder.
      - key: BACKUP_GDRIVE_CREDENTIALS_JSON
        sync: false
      - key: BACKUP_GDRIVE_FOLDER_ID
        sync: false
