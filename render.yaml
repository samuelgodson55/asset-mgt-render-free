# =============================================================================
# render.yaml
# -----------------------------------------------------------------------------
# Render "Blueprint" (Infrastructure as Code) for Snipe-IT Lite, sized to fit
# entirely within Render's FREE plan -- zero required paid resources. See:
#   https://render.com/docs/blueprint-spec
#   https://render.com/docs/infrastructure-as-code
#   https://render.com/docs/free   (what IS and ISN'T free-tier-eligible)
#
# WHY THIS LOOKS SO MUCH SIMPLER THAN A "TYPICAL" MULTI-SERVICE BLUEPRINT
# -----------------------------------------------------------------------------
# This app used to deploy as FIVE resources: a Postgres database, a Redis
# instance, a private FastAPI backend, a private Celery worker, and a public
# nginx frontend. Render's free plan only covers Web Services, Postgres, and
# Key Value (Redis-compatible) instances -- private services and background
# workers always require a paid plan (see the docs link above). Free web
# services also can't receive PRIVATE network traffic from other services,
# so even a free nginx-in-front-of-a-free-backend split wouldn't work.
#
# The fix: ONE Postgres database (free) + ONE web service (free), where that
# single web service is the combined FastAPI app built from the root
# Dockerfile -- it serves the JSON API (/api/*) AND the static frontend
# together (see backend/main.py's module docstring). No Redis, no separate
# worker: the audit-export and overdue-notification jobs that used to run on
# a Celery worker now run as in-process background threads inside this same
# service instead (see backend/jobs.py and backend/scheduler.py).
#
# HOW TO USE
# -----------------------------------------------------------------------------
# 1. Push this file (at the repo root) to GitHub/GitLab/Bitbucket.
# 2. In the Render Dashboard: New -> Blueprint -> connect this repo.
# 3. Render reads this file, provisions both resources below, and wires
#    DATABASE_URL together automatically via `fromDatabase` -- no manual
#    "copy the connection string from the dashboard" step needed.
# 4. JWT_SECRET_KEY and SUPER_ADMIN_PASSWORD are both auto-generated by
#    Render (`generateValue: true`) -- you never need to invent or store
#    either one yourself. Find the generated SUPER_ADMIN_PASSWORD in the
#    Render dashboard's Environment tab if you need to log in as the
#    hardcoded Super Admin (see backend/config.py's SUPER_ADMIN_* docstring).
#
# KNOWN FREE-TIER TRADE-OFFS (read this)
# -----------------------------------------------------------------------------
#  - The web service SPINS DOWN after 15 minutes of no inbound HTTP traffic,
#    and takes ~30-60s to spin back up on the next request. Fine for a demo/
#    personal-use deployment; not what you want for a always-on production
#    tool -- upgrade this one service off the Free instance type if that
#    matters to you (everything else about this Blueprint stays the same).
#  - The free Postgres instance EXPIRES after 30 days and is NOT
#    automatically backed up/renewed -- Render will email you before it
#    expires. Upgrade it to a paid plan before that happens if you need this
#    data to persist long-term.
#  - The overdue-checkout email digest (backend/scheduler.py) only runs
#    while the service is awake -- see that file's docstring for two ways to
#    work around the spin-down above (an uptime pinger, or pointing an
#    external scheduler at POST /api/system/notifications/run).
# =============================================================================

databases:
  # Managed Postgres, Free plan. `property: connectionString` (referenced
  # below) gives the app a ready-to-use `postgresql://...` URL -- no manual
  # host/port/user/password assembly needed.
  - name: snipeit-lite-db
    databaseName: asset_db
    user: snipeit
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------
  # The ONE service: FastAPI (API) + static frontend, built from the root
  # Dockerfile, deployed as a Free web service.
  # ---------------------------------------------------------------------
  - type: web
    name: snipeit-lite
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon  # Pick whichever region is closest to your users.
    healthCheckPath: /healthz  # See backend/main.py's GET /healthz.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snipeit-lite-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true  # Render generates a long random secret for you.
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "12"
      # The frontend and API share this one service/origin now, so CORS is
      # effectively a non-issue -- see backend/config.py's CORS_ORIGINS
      # docstring. Leave empty unless you're calling this API cross-origin
      # from somewhere else entirely.
      - key: CORS_ORIGINS
        value: ""
      # SECURITY: disable interactive API docs on the public internet --
      # see backend/config.py's ENABLE_API_DOCS docstring. Flip to "true"
      # temporarily if you need to browse /docs on this deployment.
      - key: ENABLE_API_DOCS
        value: "false"
      # Operations & Observability: gate the startup init_db()/seed_db()
      # calls. AUTO_INIT_DB=true is fine for a first deploy (creates
      # tables via SQLAlchemy's create_all if they don't already exist);
      # AUTO_SEED_DEMO_DATA=true seeds a handful of demo accounts with
      # PUBLIC default passwords (see backend/database.py's seed_db())
      # ONLY if the database is currently empty -- flip this to "false"
      # once you've set up your own real accounts, since it re-runs on
      # every restart/redeploy otherwise (a no-op once the DB is populated,
      # but still worth turning off deliberately).
      - key: AUTO_INIT_DB
        value: "true"
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: ACCOUNT_LOCKOUT_MAX_ATTEMPTS
        value: "5"
      - key: ACCOUNT_LOCKOUT_DURATION_MINUTES
        value: "15"
      # Hardcoded Super Admin (root account) -- see backend/config.py's
      # SUPER_ADMIN_* docstring. SUPER_ADMIN_PASSWORD is auto-generated by
      # Render, same as JWT_SECRET_KEY above; find it in the dashboard's
      # Environment tab after your first deploy.
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_NAME
        value: Super Admin
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      # Email notifications: disabled by default (no SMTP provider
      # configured out of the box). Set NOTIFICATIONS_ENABLED to "true" and
      # fill in the SMTP_* values below (in the Render dashboard, not this
      # file, if they contain secrets) once you have a real mail provider --
      # see backend/services/notification_service.py's module docstring.
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        sync: false  # Never store a real secret in this file -- set it in the dashboard.
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_FROM_EMAIL
        value: ""
      - key: ADMIN_NOTIFICATION_EMAILS
        value: ""
      - key: OVERDUE_NOTIFICATION_INTERVAL_HOURS
        value: "24"
      # Optional shared secret for an external scheduler to trigger the
      # overdue digest directly (works around the free plan's spin-down --
      # see backend/scheduler.py's docstring). Leave unset/empty to rely
      # only on the in-process scheduler + Super Admin/Admin JWT auth.
      # Generate a real value and set it here (not in this file) if you
      # wire up an external scheduler -- see README.md's "Deploying on
      # Render's Free Plan" section.
      - key: SYSTEM_TASK_TOKEN
        sync: false
