# .github/workflows/sync-secrets-aca.yml
# -----------------------------------------------------------------------------
# ACA equivalent of sync-secrets-vm.yml: pushes CURRENT GitHub
# Environment secrets/variables onto the ALREADY-RUNNING `backend`
# Container App (config only -- no image/scale/SKU/domain changes), without
# going through infra-deploy.yml's full `az deployment group create`
# against main.bicep.
#
# WHY THIS EXISTS: infra-deploy.yml is the only other place these values
# reach ACA, and it's deliberately NOT meant to be your everyday "I changed
# a secret" tool -- its own top-of-file comment says as much ("infra
# changes ... are infrequent and reviewed, not something you want
# re-running on every secret change"). A full Bicep deploy also touches
# things a config-only change has no business touching: ingress traffic
# rules reset to `latestRevision: true` (bad if a blue-green rollout via
# aca-blue-green.sh is mid-flight -- see main.bicep's own ingress.traffic
# comment), and it's simply slower/riskier than it needs to be for
# "I rotated an API key." This workflow is the missing lightweight path --
# `az containerapp update`/`secret set` against the one app that actually
# reads any of this, callable any time, as many times as you want.
#
# SCOPE, DELIBERATELY NARROW: only `backend`'s NOTIFICATIONS_ENABLED/SMTP_*/
# EMAIL_PROVIDER/BREVO_API_KEY/RESEND_API_KEY/ADMIN_NOTIFICATION_EMAILS/
# digest-timing/BACKUP_GDRIVE_*/OTEL_*(minus Azure Monitor)/branding/
# security-tuning env vars -- see main.bicep's `sharedEnv`/`sharedSecrets`
# for the full source of truth this mirrors. Deliberately EXCLUDES:
#   - JWT_SECRET_KEY, DATABASE_URL, REDIS_URL, ROOT_ADMIN_BOOTSTRAP_PASSWORD
#     -- DATABASE_URL/REDIS_URL are derived from the Postgres/Redis
#     resources' OWN admin passwords (main.bicep's `databaseUrl`/`redisUrl`
#     vars, built from postgresServer's live FQDN); pushing a
#     POSTGRES_PASSWORD here without also rotating it AT the Postgres
#     Flexible Server resource would just break the DB connection.
#     JWT_SECRET_KEY rotation invalidates every live session -- too
#     consequential for a routine sync. All four stay infra-deploy.yml-only.
#   - dockerHub image/tag, custom domain/certificate, min replicas, Postgres
#     SKU/storage, otelAzureMonitorEnabled/alertEmailAddress -- every one of
#     these provisions or resizes an actual Azure resource (a new revision
#     with a different image, a cert binding, Application Insights itself,
#     ...), not a plain env var on an already-running container. Still
#     infra-deploy.yml territory.
# `frontend` gets exactly one var from this workflow -- ENABLE_API_DOCS --
# because main.bicep's own comment on it says it "must match backend's own
# value" (nginx/default.conf.template's /docs passthrough gating); every
# other frontend env var (BACKEND_HOST, BACKEND_PORT, PORT) is Bicep-
# computed infra plumbing, not user config, and frontend never reads
# SMTP/notification/backup settings at all (see main.bicep's frontendApp
# comment -- "never touches the database, Redis, JWTs, or SMTP").
# -----------------------------------------------------------------------------
name: Sync secrets to ACA (backend)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment''s backend Container App to update. "production", not "prod" -- matches infra-deploy.yml''s `target` input exactly (this is the ACA path; the VM path''s "vm-staging"/"prod" naming is a deliberately separate GitHub Environment namespace -- see deploy-azure-vm.yml''s `environment` input description).'
        required: true
        type: choice
        options: [staging, production]

permissions:
  id-token: write # required for OIDC federated login (azure/login) -- no client secret stored anywhere
  contents: read

concurrency:
  group: aca-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync secrets (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      RESOURCE_GROUP: ${{ inputs.target == 'production' && secrets.PROD_RESOURCE_GROUP || secrets.STAGING_RESOURCE_GROUP }}
      # ---- Every value this workflow is allowed to touch. Deliberately
      # kept in the SAME order, with the SAME names and the SAME
      # Secret-vs-Variable classification, as infra-deploy.yml's `Deploy
      # Bicep` step -- one source of truth, so a value you set once is
      # correct whether it reaches `backend` via a fresh Bicep deploy OR
      # via this workflow against an already-running one. See this file's
      # top comment for exactly what's excluded and why. ----
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'true' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS != 'false' }}
      SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL == 'true' }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_NOTIFICATION_EMAILS: ${{ secrets.ADMIN_NOTIFICATION_EMAILS }}
      OVERDUE_DIGEST_HOURS_UTC: ${{ vars.OVERDUE_DIGEST_HOURS_UTC || '8' }}
      DUE_SOON_REMINDER_DAYS: ${{ vars.DUE_SOON_REMINDER_DAYS || '2' }}
      DUE_SOON_DIGEST_HOURS_UTC: ${{ vars.DUE_SOON_DIGEST_HOURS_UTC || '8' }}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${{ vars.SEND_INDIVIDUAL_HOLDER_REMINDERS != 'false' }}
      EXTENSION_REQUEST_SLA_HOURS: ${{ vars.EXTENSION_REQUEST_SLA_HOURS || '24' }}
      QUOTATION_SLA_HOURS: ${{ vars.QUOTATION_SLA_HOURS || '24' }}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${{ vars.APPROVAL_SLA_CHECK_INTERVAL_MINUTES || '60' }}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${{ vars.APPROVAL_SLA_ESCALATION_REPEAT_HOURS || '24' }}
      SEND_QUOTATION_RECIPIENT_EMAILS: ${{ vars.SEND_QUOTATION_RECIPIENT_EMAILS != 'false' }}
      BACKUP_GDRIVE_ENABLED: ${{ vars.BACKUP_GDRIVE_ENABLED == 'true' }}
      BACKUP_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_ID }}
      BACKUP_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_SECRET }}
      BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN }}
      BACKUP_GDRIVE_FOLDER_ID: ${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}
      BACKUP_HOURS_UTC: ${{ vars.BACKUP_HOURS_UTC || '3' }}
      BACKUP_RETENTION_COUNT: ${{ vars.BACKUP_RETENTION_COUNT || '7' }}
      ENABLE_API_DOCS: ${{ vars.ENABLE_API_DOCS == 'true' }}
      SITE_NAME: ${{ vars.SITE_NAME || 'Snipe-IT Lite' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      LOGIN_RATE_LIMIT_MAX: ${{ vars.LOGIN_RATE_LIMIT_MAX || '5' }}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.LOGIN_RATE_LIMIT_WINDOW_SECONDS || '60' }}
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${{ vars.ACCOUNT_LOCKOUT_MAX_ATTEMPTS || '5' }}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${{ vars.ACCOUNT_LOCKOUT_DURATION_MINUTES || '15' }}
      SUPER_ADMIN_USERNAME: ${{ vars.SUPER_ADMIN_USERNAME || 'superadmin' }}
      SUPER_ADMIN_NAME: ${{ vars.SUPER_ADMIN_NAME || 'Super Admin' }}
      DISPLAY_TIMEZONE: ${{ vars.DISPLAY_TIMEZONE || 'Africa/Lagos' }}
      CURRENCY_CODE: ${{ vars.CURRENCY_CODE || 'NGN' }}
      CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER: ${{ vars.CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER == 'true' }}
      OTEL_ENABLED: ${{ vars.OTEL_ENABLED == 'true' }}
      OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME || 'snipeit-lite-backend' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_TRACES_SAMPLE_RATIO: ${{ vars.OTEL_TRACES_SAMPLE_RATIO || '1.0' }}
      ERRORBEACON_API_KEY: ${{ secrets.ERRORBEACON_API_KEY }}
      ERRORBEACON_INGEST_API_KEY: ${{ secrets.ERRORBEACON_INGEST_API_KEY || secrets.ERRORBEACON_API_KEY }}
      ERRORBEACON_ADMIN_API_KEY: ${{ secrets.ERRORBEACON_ADMIN_API_KEY || secrets.ERRORBEACON_API_KEY }}
      ERRORBEACON_TELEGRAM_BOT_TOKEN: ${{ secrets.ERRORBEACON_TELEGRAM_BOT_TOKEN }}
      ERRORBEACON_TELEGRAM_CHAT_ID: ${{ secrets.ERRORBEACON_TELEGRAM_CHAT_ID }}
      ERRORBEACON_TELEGRAM_THREAD_ID: ${{ vars.ERRORBEACON_TELEGRAM_THREAD_ID }}
      ERRORBEACON_GEMINI_API_KEY: ${{ secrets.ERRORBEACON_GEMINI_API_KEY }}
      ERRORBEACON_GEMINI_MODEL: ${{ vars.ERRORBEACON_GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      ERRORBEACON_GEMINI_FALLBACK_MODEL: ${{ vars.ERRORBEACON_GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
      ERRORBEACON_GROQ_API_KEY: ${{ secrets.ERRORBEACON_GROQ_API_KEY }}
      ERRORBEACON_GROQ_MODEL: ${{ vars.ERRORBEACON_GROQ_MODEL || 'llama-3.1-8b-instant' }}
      ERRORBEACON_OPENROUTER_API_KEY: ${{ secrets.ERRORBEACON_OPENROUTER_API_KEY }}
      ERRORBEACON_OPENROUTER_MODEL: ${{ vars.ERRORBEACON_OPENROUTER_MODEL || 'openrouter/free' }}
      # No separate ERRORBEACON_OPENROUTER_SITE_URL variable -- redundant
      # with CUSTOM_DOMAIN, which is already this environment's public
      # origin. Mirrors main.bicep's `publicOrigin` fallback (customDomain
      # if set, else the frontend's own *.azurecontainerapps.io FQDN) as
      # closely as a lightweight config-only sync can without an extra `az`
      # lookup -- falls back to the same 'https://errorbeacon.local'
      # placeholder main.bicep used to default to.
      ERRORBEACON_OPENROUTER_SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://errorbeacon.local' }}
      ERRORBEACON_APP: ${{ vars.ERRORBEACON_APP || 'asset-inventory-quotes' }}

    steps:
      - name: Azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify backend app exists in this environment
        run: |
          az containerapp show --name backend --resource-group "$RESOURCE_GROUP" --query name -o tsv >/dev/null 2>&1 || {
            echo "::error::No 'backend' Container App found in resource group '$RESOURCE_GROUP' -- run infra-deploy.yml (target: ${{ inputs.target }}) first to provision the environment before syncing config to it."
            exit 1
          }

      # Non-blocking -- see this file's top comment on why a full Bicep
      # deploy resets ingress.traffic to `latestRevision: true`. This
      # workflow only touches env vars, but the NEW revision it creates
      # still won't receive any traffic if a blue-green rollout has
      # currently pinned weight to specific named revisions -- worth
      # knowing about before you go looking for why the change "didn't
      # take effect."
      - name: Warn if a blue-green rollout looks mid-flight
        run: |
          TRAFFIC=$(az containerapp show --name backend --resource-group "$RESOURCE_GROUP" \
                      --query "properties.configuration.ingress.traffic" -o json)
          echo "Current backend traffic config: $TRAFFIC"
          SIMPLE=$(echo "$TRAFFIC" | jq -e 'length == 1 and .[0].latestRevision == true and .[0].weight == 100' >/dev/null 2>&1 && echo yes || echo no)
          if [ "$SIMPLE" = "no" ]; then
            echo "::warning::backend's traffic isn't the plain 'all traffic to latest revision' default -- a blue-green rollout (aca-blue-green.sh) may be mid-flight. This sync will still create a new revision with the updated config, but it may not receive any real traffic until that rollout finishes or is rolled back."
          fi

      - name: Update backend secrets
        # `az containerapp secret set` first, separately from the env-var
        # update below -- Container Apps secrets are app-level values that
        # env vars then reference via secretref:<name>, same two-layer
        # shape as main.bicep's sharedSecrets/sharedSecretEnvRefs. Empty
        # values fall back to the literal string "unset", matching
        # main.bicep's own `empty(x) ? 'unset' : x` guard for these exact
        # secrets -- Container Apps rejects a truly empty secret value
        # outright, and this keeps a not-yet-configured provider (e.g.
        # BREVO_API_KEY when EMAIL_PROVIDER=resend) from failing the whole
        # sync.
        run: |
          az containerapp secret set --name backend --resource-group "$RESOURCE_GROUP" \
            --secrets \
              smtp-password="${SMTP_PASSWORD:-unset}" \
              brevo-api-key="${BREVO_API_KEY:-unset}" \
              resend-api-key="${RESEND_API_KEY:-unset}" \
              gdrive-oauth-client-secret="${BACKUP_GDRIVE_OAUTH_CLIENT_SECRET:-unset}" \
              gdrive-oauth-refresh-token="${BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN:-unset}" \
              otel-exporter-otlp-headers="${OTEL_EXPORTER_OTLP_HEADERS:-unset}"

      - name: Sync isolated ErrorBeacon secrets/config
        run: |
          if az containerapp show --name errorbeacon --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp secret set --name errorbeacon --resource-group "$RESOURCE_GROUP" \
              --secrets \
                errorbeacon-api-key="${ERRORBEACON_API_KEY:-unset}" \
                errorbeacon-ingest-api-key="${ERRORBEACON_INGEST_API_KEY:-${ERRORBEACON_API_KEY:-unset}}" \
                errorbeacon-admin-api-key="${ERRORBEACON_ADMIN_API_KEY:-${ERRORBEACON_API_KEY:-unset}}" \
                smtp-password="${SMTP_PASSWORD:-unset}" \
                brevo-api-key="${BREVO_API_KEY:-unset}" \
                resend-api-key="${RESEND_API_KEY:-unset}" \
                telegram-bot-token="${ERRORBEACON_TELEGRAM_BOT_TOKEN:-unset}" \
                telegram-chat-id="${ERRORBEACON_TELEGRAM_CHAT_ID:-unset}" \
                gemini-api-key="${ERRORBEACON_GEMINI_API_KEY:-unset}" \
                groq-api-key="${ERRORBEACON_GROQ_API_KEY:-unset}" \
                openrouter-api-key="${ERRORBEACON_OPENROUTER_API_KEY:-unset}"
            az containerapp update --name errorbeacon --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                ERRORBEACON_API_KEY=secretref:errorbeacon-api-key \
                ERRORBEACON_INGEST_API_KEY=secretref:errorbeacon-ingest-api-key \
                ERRORBEACON_ADMIN_API_KEY=secretref:errorbeacon-admin-api-key \
                TELEGRAM_BOT_TOKEN=secretref:telegram-bot-token \
                TELEGRAM_CHAT_ID=secretref:telegram-chat-id \
                TELEGRAM_THREAD_ID="$ERRORBEACON_TELEGRAM_THREAD_ID" \
                GEMINI_API_KEY=secretref:gemini-api-key \
                GEMINI_MODEL="$ERRORBEACON_GEMINI_MODEL" \
                GEMINI_FALLBACK_MODEL="$ERRORBEACON_GEMINI_FALLBACK_MODEL" \
                GROQ_API_KEY=secretref:groq-api-key \
                GROQ_MODEL="$ERRORBEACON_GROQ_MODEL" \
                OPENROUTER_API_KEY=secretref:openrouter-api-key \
                OPENROUTER_MODEL="$ERRORBEACON_OPENROUTER_MODEL" \
                OPENROUTER_SITE_URL="$ERRORBEACON_OPENROUTER_SITE_URL" \
                NOTIFICATIONS_ENABLED="$NOTIFICATIONS_ENABLED" \
                SMTP_HOST="$SMTP_HOST" \
                SMTP_PORT="$SMTP_PORT" \
                SMTP_USERNAME="$SMTP_USERNAME" \
                SMTP_PASSWORD=secretref:smtp-password \
                SMTP_USE_TLS="$SMTP_USE_TLS" \
                SMTP_USE_SSL="$SMTP_USE_SSL" \
                SMTP_FROM_EMAIL="$SMTP_FROM_EMAIL" \
                EMAIL_PROVIDER="$EMAIL_PROVIDER" \
                BREVO_API_KEY=secretref:brevo-api-key \
                RESEND_API_KEY=secretref:resend-api-key \
                ADMIN_NOTIFICATION_EMAILS="$ADMIN_NOTIFICATION_EMAILS" \
                ERRORBEACON_EMAIL_FALLBACK_ENABLED=true \
                ERRORBEACON_EMAIL_FALLBACK_AFTER_ATTEMPTS=3 \
                ERRORBEACON_EMAIL_FALLBACK_AFTER_SECONDS=300 \
                ERRORBEACON_RETENTION_DAYS=90 \
                ERRORBEACON_DB_WARN_MB=4096 \
                DATA_DIR=/data \
                DEDUP_SECONDS=60 \
                SPIKE_THRESHOLD=10 \
                SPIKE_WINDOW_SECONDS=300
          else
            echo "ErrorBeacon app not found; run infra-deploy.yml first."
          fi

      - name: Update backend env vars (single revision for the whole batch)
        # One `containerapp update` call for everything -- plain values AND
        # secretref: pointers together -- so this produces exactly ONE new
        # revision, not one per key. Any var NOT listed here is left
        # completely untouched (this is additive/targeted, not a full
        # template replace) -- see this file's top comment for the full
        # list of what's deliberately excluded (JWT_SECRET_KEY,
        # DATABASE_URL, REDIS_URL, image/tag, custom domain, replicas,
        # Postgres SKU, ...).
        run: |
          az containerapp update --name backend --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              NOTIFICATIONS_ENABLED="$NOTIFICATIONS_ENABLED" \
              SMTP_HOST="$SMTP_HOST" \
              SMTP_PORT="$SMTP_PORT" \
              SMTP_USERNAME="$SMTP_USERNAME" \
              SMTP_PASSWORD=secretref:smtp-password \
              SMTP_USE_TLS="$SMTP_USE_TLS" \
              SMTP_USE_SSL="$SMTP_USE_SSL" \
              SMTP_FROM_EMAIL="$SMTP_FROM_EMAIL" \
              EMAIL_PROVIDER="$EMAIL_PROVIDER" \
              BREVO_API_KEY=secretref:brevo-api-key \
              RESEND_API_KEY=secretref:resend-api-key \
              ADMIN_NOTIFICATION_EMAILS="$ADMIN_NOTIFICATION_EMAILS" \
              OVERDUE_DIGEST_HOURS_UTC="$OVERDUE_DIGEST_HOURS_UTC" \
              DUE_SOON_REMINDER_DAYS="$DUE_SOON_REMINDER_DAYS" \
              DUE_SOON_DIGEST_HOURS_UTC="$DUE_SOON_DIGEST_HOURS_UTC" \
              SEND_INDIVIDUAL_HOLDER_REMINDERS="$SEND_INDIVIDUAL_HOLDER_REMINDERS" \
              EXTENSION_REQUEST_SLA_HOURS="$EXTENSION_REQUEST_SLA_HOURS" \
              QUOTATION_SLA_HOURS="$QUOTATION_SLA_HOURS" \
              APPROVAL_SLA_CHECK_INTERVAL_MINUTES="$APPROVAL_SLA_CHECK_INTERVAL_MINUTES" \
              APPROVAL_SLA_ESCALATION_REPEAT_HOURS="$APPROVAL_SLA_ESCALATION_REPEAT_HOURS" \
              SEND_QUOTATION_RECIPIENT_EMAILS="$SEND_QUOTATION_RECIPIENT_EMAILS" \
              BACKUP_GDRIVE_ENABLED="$BACKUP_GDRIVE_ENABLED" \
              BACKUP_GDRIVE_OAUTH_CLIENT_ID="$BACKUP_GDRIVE_OAUTH_CLIENT_ID" \
              BACKUP_GDRIVE_OAUTH_CLIENT_SECRET=secretref:gdrive-oauth-client-secret \
              BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN=secretref:gdrive-oauth-refresh-token \
              BACKUP_GDRIVE_FOLDER_ID="$BACKUP_GDRIVE_FOLDER_ID" \
              BACKUP_HOURS_UTC="$BACKUP_HOURS_UTC" \
              BACKUP_RETENTION_COUNT="$BACKUP_RETENTION_COUNT" \
              ENABLE_API_DOCS="$ENABLE_API_DOCS" \
              SITE_NAME="$SITE_NAME" \
              LOG_LEVEL="$LOG_LEVEL" \
              LOGIN_RATE_LIMIT_MAX="$LOGIN_RATE_LIMIT_MAX" \
              LOGIN_RATE_LIMIT_WINDOW_SECONDS="$LOGIN_RATE_LIMIT_WINDOW_SECONDS" \
              ACCOUNT_LOCKOUT_MAX_ATTEMPTS="$ACCOUNT_LOCKOUT_MAX_ATTEMPTS" \
              ACCOUNT_LOCKOUT_DURATION_MINUTES="$ACCOUNT_LOCKOUT_DURATION_MINUTES" \
              SUPER_ADMIN_USERNAME="$SUPER_ADMIN_USERNAME" \
              SUPER_ADMIN_NAME="$SUPER_ADMIN_NAME" \
              DISPLAY_TIMEZONE="$DISPLAY_TIMEZONE" \
              CURRENCY_CODE="$CURRENCY_CODE" \
              CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER="$CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER" \
              OTEL_ENABLED="$OTEL_ENABLED" \
              OTEL_SERVICE_NAME="$OTEL_SERVICE_NAME" \
              OTEL_EXPORTER_OTLP_ENDPOINT="$OTEL_EXPORTER_OTLP_ENDPOINT" \
              OTEL_EXPORTER_OTLP_HEADERS=secretref:otel-exporter-otlp-headers \
              OTEL_TRACES_SAMPLE_RATIO="$OTEL_TRACES_SAMPLE_RATIO" \
              ERRORBEACON_APP="$ERRORBEACON_APP"

      - name: Keep frontend's ENABLE_API_DOCS in lockstep with backend's
        # main.bicep's own comment on frontend's ENABLE_API_DOCS: "must
        # match backend's own value" (nginx/default.conf.template's /docs
        # passthrough gating). frontend has no secrets of its own to set
        # here -- see this file's top comment, it never reads SMTP/
        # notification/backup config at all.
        run: |
          az containerapp update --name frontend --resource-group "$RESOURCE_GROUP" \
            --set-env-vars ENABLE_API_DOCS="$ENABLE_API_DOCS"

      - name: Wait for the new backend revision to report healthy
        run: |
          for i in $(seq 1 30); do
            LATEST=$(az containerapp revision list --name backend --resource-group "$RESOURCE_GROUP" \
                       --query "sort_by([?properties.active], &properties.createdTime)[-1]" -o json)
            STATE=$(echo "$LATEST" | jq -r '.properties.healthState')
            NAME=$(echo "$LATEST" | jq -r '.name')
            echo "Revision $NAME: $STATE"
            if [ "$STATE" = "Healthy" ]; then
              exit 0
            fi
            if [ "$STATE" = "Unhealthy" ]; then
              echo "::error::Revision $NAME came up Unhealthy after the config sync -- check 'az containerapp logs show --name backend --resource-group $RESOURCE_GROUP' before trusting this config. The previous revision is still running and still holds traffic if it was ever set to latestRevision:true -- see aca-blue-green.sh's rollback subcommand if you need to move traffic explicitly."
              exit 1
            fi
            sleep 10
          done
          echo "::warning::Gave up waiting after 5 minutes -- revision $NAME was still '$STATE'. Check it manually; the sync itself succeeded (the update calls above didn't error), this is just health-check visibility."
