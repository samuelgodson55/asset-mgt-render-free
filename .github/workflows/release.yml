# .github/workflows/release.yml
# -----------------------------------------------------------------------------
# THE trigger for cutting a production-grade RELEASE ARTIFACT: `git tag
# v1.x.x && git push origin v1.x.x` (annotated or lightweight, either works
# -- `--sort=-creatordate` downstream in DEPLOYMENT_VM.md's rollback runbook
# relies on tag creation date, which both kinds have). Pushing a tag
# matching `v*.*.*` is the ONLY thing this file reacts to, and this file is
# the ONLY thing that tag triggers.
#
# IMPORTANT: pushing a version tag builds and publishes the official
# release images -- it does NOT deploy anything. Neither `deploy-azure-vm.yml`
# nor `deploy-azure-aca.yml` is called from here (neither has a `push`
# trigger, and neither is invoked via `uses:` below). Actually rolling a
# version out to production is a deliberate, separate, manual step: open
# "Deploy to VM" or "Deploy to ACA" in the Actions tab (`workflow_dispatch`),
# pick `prod`/`production`, choose which frontend to ship (`react` or
# `legacy`), and paste the version tag (e.g. `v1.4.2`) into that run's
# `image_tag` input -- it will pull the exact backend + frontend images
# this workflow already built and Trivy-scanned rather than rebuilding
# anything. Run either or both, whenever you choose to.
#
# What happens on `git push origin vX.Y.Z`:
#   1. `ci`          -- re-runs the same fast gate as every push (lint, tests,
#                       image build + Trivy scan, bicep validate). Reused via
#                       `uses: ./.github/workflows/ci.yml`, NOT copy-pasted.
#   2. `build-push`  -- builds backend + BOTH frontend flavors (react and
#                       legacy) and pushes each to Docker Hub, under three
#                       separate repo names, tagged with the VERSION itself
#                       (e.g. `:v1.4.2`), not just a commit SHA -- this is
#                       what makes a version tag a real, independently-
#                       pullable release artifact. Also tags `:latest` and
#                       `:<sha>` on the same images for convenience/
#                       traceability. Trivy scan is blocking on CRITICAL,
#                       same bar as the old production pipeline.
#   3. `changelog`   -- diffs this tag against the previous one
#                       (`git tag --sort=-creatordate`) and inserts a new
#                       "## [vX.Y.Z] - <date>" section into CHANGELOG.md,
#                       opens a pull request against `main` with that change
#                       (never pushes to `main` directly -- see that job's
#                       comments), and cuts a GitHub Release with the same
#                       notes.
#
# That's it -- this workflow's job is done once the images are published and
# the changelog PR/GitHub Release are cut. No deploy job runs from here, to
# either target, ever. Deploying (to the VM, to ACA, or both) always happens
# from that target's own workflow, on its own workflow_dispatch, at a time
# and to an environment you choose explicitly.
#
# `changelog` opens a PR rather than committing straight to `main` because
# this repo's `main` only ever changes via reviewed pull request (feature
# branch -> `develop` -> `main`) -- no branch, including this bot's, pushes
# to it directly. Merge that PR whenever convenient; it doesn't block
# anything else in this workflow.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build + tag + push backend + both frontend images
    needs: [ci]
    permissions:
      contents: read
    # Delegates to build-push-images.yml -- the single source of truth for
    # how every image actually gets built, shared with deploy-azure-vm.yml
    # and deploy-azure-aca.yml's fresh-build path, so "the shared image" is
    # genuinely the same artifact no matter which of those pipelines built
    # it. See that file's own top-of-file comment for the full "why".
    #
    # A GIT TAG PUSH BUILDS BOTH FRONTEND FLAVORS, ALWAYS -- unlike the
    # per-environment deploy workflows (which build exactly ONE frontend
    # flavor per run, chosen by that run's `frontend_type` input/Environment
    # variable), a version tag is meant to be a complete, immutable release
    # artifact set: `snipeit-lite-frontend-react:vX.Y.Z` AND
    # `snipeit-lite-frontend-legacy:vX.Y.Z` both get built, Trivy-scanned,
    # and pushed together, under their own separate Docker Hub repo names
    # (see frontend/Dockerfile's own top-of-file comment for why there are
    # two mutually exclusive frontend images at all -- the old combined
    # `frontend-final` target has been removed). Whichever flavor a given
    # environment actually deploys is decided later, at deploy time, by
    # that "Deploy to VM"/"Deploy to ACA" run's own frontend_type
    # input/Environment variable -- see those workflows' own comments.
    #
    # image_tags: three tags on the same build -- VERSION (the real release
    # artifact, e.g. v1.4.2 -- what a later "Deploy to VM"/"Deploy to ACA"
    # run hands to build-push-images.yml's own image_tags to pull), the
    # commit SHA (traceability back to exactly what was built), and
    # `latest` (convenience for anyone pulling without pinning a version).
    #
    # BUILD_ENV=production is what makes frontend/Dockerfile's BUILD_ENV
    # build-arg actually obfuscate (not just minify) the legacy-only
    # image's shipped JS -- see that Dockerfile's own comment (it has no
    # effect on the react-only image's Vite build, which is always a real
    # production build regardless -- see build-push-images.yml's own
    # build_env input comment). Previously this workflow's own build step
    # forgot to pass it at all (see git history / CHANGELOG); now it's set
    # once, here, and every caller of build-push-images.yml inherits the
    # same "don't forget this again" guarantee.
    uses: ./.github/workflows/build-push-images.yml
    with:
      build_matrix: |
        [
          {"service":"backend","dockerfile":"backend/Dockerfile","context":"backend","image_name":"snipeit-lite-backend"},
          {"service":"errorbeacon","dockerfile":"errorbeacon/Dockerfile","context":"errorbeacon","image_name":"errorbeacon-lite"},
          {"service":"frontend-react","dockerfile":"frontend/Dockerfile","context":".","target":"frontend-react-only","image_name":"snipeit-lite-frontend-react"},
          {"service":"frontend-legacy","dockerfile":"frontend/Dockerfile","context":".","target":"frontend-legacy-only","image_name":"snipeit-lite-frontend-legacy"}
        ]
      image_tags: ${{ github.ref_name }} ${{ github.sha }} latest
      version_label: ${{ github.ref_name }}
      build_env: production
      trivy_blocking: true
    secrets: inherit

  changelog:
    name: Update CHANGELOG.md (via PR) + cut GitHub Release
    needs: [build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the changelog branch (not `main` itself)
      pull-requests: write # to open the PR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # base the changelog branch on `main`, not the detached tag commit
          fetch-depth: 0 # need full tag history for `git tag --sort=-creatordate` and `git log <prev>..<current>`

      - name: Generate changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_name }}"

          # Same command the DEPLOYMENT.md rollback runbook uses, so "the
          # previous version" always means the same thing in both places.
          PREV_TAG="$(git tag --sort=-creatordate | grep -vFx "$CURRENT_TAG" | head -n 1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            echo "Diffing $RANGE against previous release $PREV_TAG"
          else
            RANGE="$CURRENT_TAG"
            echo "No previous tag found -- this is the first release; using full history up to $CURRENT_TAG"
          fi

          ENTRIES="$(git log $RANGE --no-merges --pretty=format:'- %s (%h)' -- . || true)"
          if [ -z "$ENTRIES" ]; then
            ENTRIES="- No user-facing changes recorded since ${PREV_TAG:-the beginning of history}."
          fi

          DATE="$(date -u +%Y-%m-%d)"
          {
            echo "section<<CHANGELOG_EOF"
            echo "## [${CURRENT_TAG}] - ${DATE}"
            echo "$ENTRIES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            echo "$ENTRIES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Insert section into CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v section="${{ steps.notes.outputs.section }}" '
            /<!-- release-notes-insertion-point -->/ { print; print ""; print section; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      # This repo's `main` only changes via reviewed PR (feature branch ->
      # `develop` -> `main`) -- nothing, including this bot, pushes to it
      # directly. So instead of committing straight to `main`, push a new
      # branch and open a PR against it; merge whenever convenient. This
      # does NOT block the `deploy` job below -- that runs off the
      # already-built, already-tagged images regardless of whether this PR
      # has been merged yet, since the changelog is documentation, not a
      # deploy input.
      - name: Open PR with the CHANGELOG.md update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: changelog/${{ github.ref_name }}
          delete-branch: true
          commit-message: "docs(changelog): ${{ github.ref_name }}"
          title: "docs(changelog): ${{ github.ref_name }}"
          body: |
            Automated changelog entry for `${{ github.ref_name }}`, opened by
            [`release.yml`](.github/workflows/release.yml). Safe to merge any
            time -- it doesn't gate the production deploy, which already ran
            (or is running) off this same tag.

            ${{ steps.notes.outputs.notes }}
          labels: changelog, automated

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.notes }}"

  # No `deploy`/`deploy-aca` job here on purpose. This workflow's job ends
  # at "images built, Trivy-scanned, and pushed to Docker Hub under this
  # version tag; changelog PR and GitHub Release cut." It never rolls
  # anything out to the VM or to Azure Container Apps. To deploy this
  # version to production (or to staging/vm-staging), run "Deploy to VM"
  # or "Deploy to ACA" from the Actions tab (workflow_dispatch), choose the
  # target environment, and paste this tag (e.g. "${{ github.ref_name }}")
  # into that run's `image_tag` input -- it pulls the exact image built
  # above rather than rebuilding.
