# .github/workflows/release.yml
# -----------------------------------------------------------------------------
# THE trigger for production releases: `git tag v1.x.x && git push origin
# v1.x.x` (annotated or lightweight, either works -- `--sort=-creatordate`
# downstream in DEPLOYMENT_VM.md's rollback runbook relies on tag creation
# date, which both kinds have). Pushing a tag matching `v*.*.*` is now the
# ONLY path to a production deploy, and this file is the ONLY thing that tag
# triggers -- neither `deploy-azure-vm.yml` nor `deploy-azure-aca.yml` has
# its own `push` trigger anymore; both are reusable workflows THIS one calls
# at the end (in parallel with each other), same as it always called
# `ci.yml`/`build-push-images.yml`. A version tag now deploys to BOTH
# targets every time -- there's no picking one deploy target over the other
# via a tag push; each target is still also fully usable on its own via its
# own `workflow_dispatch` entry point, independent of a tag push.
#
# What happens on `git push origin vX.Y.Z`:
#   1. `ci`          -- re-runs the same fast gate as every push (lint, tests,
#                       image build + Trivy scan, bicep validate). Reused via
#                       `uses: ./.github/workflows/ci.yml`, NOT copy-pasted.
#   2. `build-push`  -- builds BOTH images and pushes each to Docker Hub
#                       tagged with the VERSION itself (e.g. `:v1.4.2`), not
#                       just a commit SHA -- this is what makes a version tag
#                       a real, independently-pullable release artifact.
#                       Also tags `:latest` and `:<sha>` on the same images
#                       for convenience/traceability. Trivy scan is blocking
#                       on CRITICAL, same bar as the old production pipeline.
#   3. `changelog`   -- diffs this tag against the previous one
#                       (`git tag --sort=-creatordate`) and inserts a new
#                       "## [vX.Y.Z] - <date>" section into CHANGELOG.md,
#                       opens a pull request against `main` with that change
#                       (never pushes to `main` directly -- see that job's
#                       comments), and cuts a GitHub Release with the same
#                       notes.
#   4. `deploy`      -- calls deploy-azure-vm.yml (workflow_call entry point,
#                       always prod) with `image_tag: vX.Y.Z` to actually
#                       roll the already-built images out to the VM over
#                       SSH (migrate -> blue-green rollout -> smoke test ->
#                       auto-rollback).
#   5. `deploy-aca`  -- calls deploy-azure-aca.yml (workflow_call entry
#                       point, always production) with the same
#                       `image_tag: vX.Y.Z`, rolling the same already-built
#                       images out to Azure Container Apps (migrate ->
#                       blue-green canary ramp -> smoke test ->
#                       auto-rollback). Runs in parallel with `deploy`
#                       (both only depend on `build-push`) and with
#                       `changelog` -- a docs PR waiting on human review, or
#                       one deploy target taking longer than the other,
#                       shouldn't hold up shipping an already-built, already
#                       Trivy-scanned release to either target.
#
# `changelog` opens a PR rather than committing straight to `main` because
# this repo's `main` only ever changes via reviewed pull request (feature
# branch -> `develop` -> `main`) -- no branch, including this bot's, pushes
# to it directly. Merge that PR whenever convenient; it doesn't block
# anything else in this workflow.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build + tag + push both images
    needs: [ci]
    permissions:
      contents: read
    # Delegates to build-push-images.yml -- the single source of truth for
    # how the backend/frontend images actually get built, shared with
    # deploy-azure-vm.yml and deploy-azure-aca.yml's fresh-build path, so
    # "the shared image" is genuinely the same artifact no matter which of
    # those pipelines built it. See that file's own top-of-file comment for
    # the full "why".
    #
    # image_tags: three tags on the same build -- VERSION (the real release
    # artifact, e.g. v1.4.2 -- what the `deploy` job below hands to
    # deploy-azure-vm.yml to pull), the commit SHA (traceability back to
    # exactly what was built), and `latest` (convenience for anyone pulling
    # without pinning a version).
    #
    # BUILD_ENV=production is what makes frontend/Dockerfile's BUILD_ENV
    # build-arg actually obfuscate (not just minify) the shipped JS -- see
    # that Dockerfile's own comment. Previously this workflow's own build
    # step forgot to pass it at all (see git history / CHANGELOG); now it's
    # set once, here, and every caller of build-push-images.yml inherits the
    # same "don't forget this again" guarantee.
    uses: ./.github/workflows/build-push-images.yml
    with:
      backend_image_name: snipeit-lite-backend
      frontend_image_name: snipeit-lite-frontend
      image_tags: ${{ github.ref_name }} ${{ github.sha }} latest
      version_label: ${{ github.ref_name }}
      build_env: production
      trivy_blocking: true
    secrets: inherit

  changelog:
    name: Update CHANGELOG.md (via PR) + cut GitHub Release
    needs: [build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the changelog branch (not `main` itself)
      pull-requests: write # to open the PR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # base the changelog branch on `main`, not the detached tag commit
          fetch-depth: 0 # need full tag history for `git tag --sort=-creatordate` and `git log <prev>..<current>`

      - name: Generate changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_name }}"

          # Same command the DEPLOYMENT.md rollback runbook uses, so "the
          # previous version" always means the same thing in both places.
          PREV_TAG="$(git tag --sort=-creatordate | grep -vFx "$CURRENT_TAG" | head -n 1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            echo "Diffing $RANGE against previous release $PREV_TAG"
          else
            RANGE="$CURRENT_TAG"
            echo "No previous tag found -- this is the first release; using full history up to $CURRENT_TAG"
          fi

          ENTRIES="$(git log $RANGE --no-merges --pretty=format:'- %s (%h)' -- . || true)"
          if [ -z "$ENTRIES" ]; then
            ENTRIES="- No user-facing changes recorded since ${PREV_TAG:-the beginning of history}."
          fi

          DATE="$(date -u +%Y-%m-%d)"
          {
            echo "section<<CHANGELOG_EOF"
            echo "## [${CURRENT_TAG}] - ${DATE}"
            echo "$ENTRIES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            echo "$ENTRIES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Insert section into CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v section="${{ steps.notes.outputs.section }}" '
            /<!-- release-notes-insertion-point -->/ { print; print ""; print section; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      # This repo's `main` only changes via reviewed PR (feature branch ->
      # `develop` -> `main`) -- nothing, including this bot, pushes to it
      # directly. So instead of committing straight to `main`, push a new
      # branch and open a PR against it; merge whenever convenient. This
      # does NOT block the `deploy` job below -- that runs off the
      # already-built, already-tagged images regardless of whether this PR
      # has been merged yet, since the changelog is documentation, not a
      # deploy input.
      - name: Open PR with the CHANGELOG.md update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: changelog/${{ github.ref_name }}
          delete-branch: true
          commit-message: "docs(changelog): ${{ github.ref_name }}"
          title: "docs(changelog): ${{ github.ref_name }}"
          body: |
            Automated changelog entry for `${{ github.ref_name }}`, opened by
            [`release.yml`](.github/workflows/release.yml). Safe to merge any
            time -- it doesn't gate the production deploy, which already ran
            (or is running) off this same tag.

            ${{ steps.notes.outputs.notes }}
          labels: changelog, automated

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.notes }}"

  deploy:
    name: Deploy this version to the VM (Production)
    needs: [build-push] # not `changelog` -- a changelog PR awaiting review shouldn't hold up shipping an already-built, already-scanned release
    permissions:
      contents: read
      # No `id-token: write` here -- unlike the ACA path, deploy-azure-vm.yml
      # never calls `azure/login`; it authenticates to the VM over SSH,
      # proxied through Cloudflare Access via CF_ACCESS_CLIENT_ID/SECRET
      # (plain repository/environment secrets, not OIDC).
      #
      # `actions: read` is only actually USED by deploy-azure-vm.yml's
      # `verify-ci` job, which is gated with
      # `if: github.event_name == 'workflow_dispatch' && ...` and never
      # runs on this workflow_call (tag-release) path. GitHub still
      # statically validates a called reusable workflow's permission
      # requests against the UNION of every `permissions:` block declared
      # anywhere in it -- top-level AND every job's own, regardless of
      # whether that job's `if:` would actually let it run -- so without
      # this line here the whole call is rejected at trigger time with
      # "Error calling workflow ... requesting 'actions: read', but is
      # only allowed ...", even though nothing in this run's actual
      # execution path needs it.
      actions: read
    # deploy-azure-vm.yml's workflow_call entry point always targets
    # prod -- there's no `environment` input on this path (that choice
    # only exists on its workflow_dispatch entry point). See `deploy-aca`
    # below for the other deploy target this same tag triggers, in
    # parallel.
    uses: ./.github/workflows/deploy-azure-vm.yml
    with:
      image_tag: ${{ github.ref_name }}
    secrets: inherit

  deploy-aca:
    name: Deploy this version to Azure Container Apps (Production)
    needs: [build-push] # same reasoning as `deploy` above -- not `changelog`, and independent of the VM deploy so a slow/stuck VM rollout can't hold this one back either (both jobs only share `build-push`, so they run in parallel)
    permissions:
      contents: read
      id-token: write # OIDC federated Azure login -- deploy-azure-aca.yml calls `azure/login`, unlike the VM path (SSH + Cloudflare Access, plain secrets, no OIDC)
      # `actions: read` is only actually USED by deploy-azure-aca.yml's
      # `verify-ci` job, which is gated with
      # `if: github.event_name == 'workflow_dispatch' && ...` and never
      # runs on this workflow_call (tag-release) path -- same situation
      # as the `deploy` job's identical `actions: read` above. GitHub
      # still statically validates a called reusable workflow's
      # permission requests against the UNION of every `permissions:`
      # block declared anywhere in it (top-level AND every job's own,
      # regardless of whether that job's `if:` would let it run), so
      # without this line the whole call is rejected at trigger time
      # with "Error calling workflow ... requesting 'actions: read', but
      # is only allowed ...", even though nothing in this run's actual
      # execution path needs it.
      actions: read
    # deploy-azure-aca.yml's workflow_call entry point always targets
    # production -- there's no `environment` input on this path (that
    # choice only exists on its workflow_dispatch entry point), same
    # shape as deploy-azure-vm.yml's equivalent entry point above. A
    # version tag now deploys to BOTH targets: the VM (`deploy`, above)
    # and Azure Container Apps (this job) -- each is still also fully
    # usable on its own via its own workflow_dispatch run, independent of
    # a tag push.
    uses: ./.github/workflows/deploy-azure-aca.yml
    with:
      image_tag: ${{ github.ref_name }}
    secrets: inherit
