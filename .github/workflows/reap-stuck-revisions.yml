# .github/workflows/reap-stuck-revisions.yml
# -----------------------------------------------------------------------------
# MANUAL INCIDENT-RESPONSE TOOL ONLY -- there is intentionally NO cron/schedule
# trigger here. Normal cleanup is part of deploy-azure-aca.yml itself: each
# deployment reaps stale 0%-traffic revisions before it starts and runs a
# final cleanup after the rollout, so GitHub runners are used for cleanup only
# when a deployment actually happens.
#
# Keep this workflow_dispatch entry point as an emergency/manual escape hatch
# for a revision leak when you do NOT want to perform another deployment. It
# calls the same safety-hardened `aca-blue-green.sh reap` implementation used
# by the deployment workflow.
# -----------------------------------------------------------------------------
name: Manually reap orphaned ACA revisions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to inspect/clean. Choose the Azure Container Apps target you actually deployed.'
        required: true
        type: choice
        options: [staging, production]
        default: production
      grace_minutes:
        description: 'How old (minutes, by createdTime) an active/0%-traffic revision must be before it is treated as orphaned. Default 20.'
        required: false
        type: string
        default: '20'

concurrency:
  # Serialize manual cleanup with the matching deployment environment so a
  # human cannot accidentally reap a revision while its deployment is rolling.
  group: aca-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  reap:
    name: Reap ${{ inputs.environment }} revisions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RESOURCE_GROUP: ${{ inputs.environment == 'production' && secrets.PROD_RESOURCE_GROUP || secrets.STAGING_RESOURCE_GROUP }}
      GRACE_MINUTES: ${{ inputs.grace_minutes || '20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Container Apps exist
        run: |
          for APP in backend frontend; do
            if ! az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" --query name -o tsv >/dev/null 2>&1; then
              echo "::warning::Container App '$APP' does not exist in resource group '$RESOURCE_GROUP' -- nothing to reap for this app."
            fi
          done

      - name: Reap orphaned backend/frontend revisions
        run: |
          FAILED=0
          for APP in backend frontend; do
            if az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" --query name -o tsv >/dev/null 2>&1; then
              bash .github/scripts/aca-blue-green.sh reap "$APP" "$RESOURCE_GROUP" "$GRACE_MINUTES" || FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::At least one orphaned revision could not be deactivated automatically. See the log above for the affected app/revision."
            exit 1
          fi

      - name: Current revision status
        if: always()
        run: |
          for APP in backend frontend; do
            if az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" --query name -o tsv >/dev/null 2>&1; then
              bash .github/scripts/aca-blue-green.sh status "$APP" "$RESOURCE_GROUP"
            fi
          done
