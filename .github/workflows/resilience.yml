name: P1/P2 Resilience

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "Number of HTTP requests"
        required: true
        default: "500"
      concurrency:
        description: "Concurrent clients"
        required: true
        default: "25"
      max_p95_ms:
        description: "Maximum allowed p95 latency in milliseconds"
        required: true
        default: "1000"

concurrency:
  group: resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: Docker resilience + load gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # docker-compose.yml deliberately has NO fallback for JWT_SECRET_KEY
      # (`${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}`) -- that's
      # the one hard requirement. Everything else interpolated in
      # docker-compose.yml (POSTGRES_PASSWORD, DATABASE_URL, TELEGRAM_*, ...)
      # has a working `:-default` fine for a disposable CI run, EXCEPT
      # ERRORBEACON_INGEST_API_KEY/ERRORBEACON_ADMIN_API_KEY, which default
      # to an empty string on both the `backend` and `errorbeacon` sides.
      # That default is silent everywhere it matters for this workflow:
      # backend/integrations/fastapi_errorbeacon.py's report_client_event()
      # simply returns early when its KEY is empty (never even attempts to
      # send), and ErrorBeacon's own ingest_auth() would reject an empty-key
      # request with 503 "not configured" even if it tried -- so the
      # scripts/chaos-test.sh correlation check (frontend proxy -> backend
      # -> ErrorBeacon) has nothing to find no matter how long it polls.
      # Generating a shared throwaway key here, the same as JWT_SECRET_KEY,
      # closes that gap; ERRORBEACON_ADMIN_API_KEY isn't strictly exercised
      # by anything in this workflow today (chaos-test.sh reads ErrorBeacon's
      # SQLite file directly via `docker compose exec`, and /healthz is
      # unauthenticated), but setting it alongside the ingest key costs
      # nothing and avoids the same class of gap the moment this workflow
      # grows to touch an admin-authenticated route.
      #
      # This runner has no repo `.env` (it's gitignored, see .env.example's
      # own header) and no persistent VM to carry one across runs the way
      # deploy-azure-vm.yml's SSH+`.env` step does, so fresh throwaway
      # secrets are generated on every run instead -- nothing here needs to
      # be stable across runs, it just needs to exist (and, for
      # JWT_SECRET_KEY, be long enough that config.py's production-mode
      # length check would pass too -- it doesn't apply at
      # ENVIRONMENT=development, docker-compose.yml's default here, but
      # there's no reason to ship a value that would fail it).
      - name: Generate ephemeral .env for this run
        run: |
          {
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ERRORBEACON_INGEST_API_KEY=$(openssl rand -hex 32)"
            echo "ERRORBEACON_ADMIN_API_KEY=$(openssl rand -hex 32)"
          } >> .env

      - name: Build and start local stack
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 backend frontend
          exit 1

      - name: P2 health load test
        run: >-
          python scripts/load-test.py
          --url http://localhost:8080/healthz
          --requests ${{ inputs.requests }}
          --concurrency ${{ inputs.concurrency }}
          --max-error-rate 0
          --max-p95-ms ${{ inputs.max_p95_ms }}

      - name: P1 dependency chaos test
        # Invoked via `bash` after an explicit `chmod +x`, not run directly
        # -- same fix as ci.yml's nginx-config job applies to
        # nginx/test-config.sh: a script can lose its executable bit across
        # certain zip exports or a Windows checkout, which fails with
        # "Permission denied" / exit code 126 even though the script itself
        # is fine. See that job's own comment for the full story.
        run: |
          chmod +x ./scripts/chaos-test.sh
          bash ./scripts/chaos-test.sh

      - name: Collect service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 backend worker beat redis db errorbeacon frontend || true

      - name: Tear down
        if: always()
        run: docker compose down -v
