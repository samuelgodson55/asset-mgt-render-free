              dueSoonReminderDays=${{ vars.DUE_SOON_REMINDER_DAYS || 2 }} \
              dueSoonDigestHoursUtc="${{ vars.DUE_SOON_DIGEST_HOURS_UTC || '8' }}" \
              sendIndividualHolderReminders=${{ vars.SEND_INDIVIDUAL_HOLDER_REMINDERS != 'false' }} \
              extensionRequestSlaHours=${{ vars.EXTENSION_REQUEST_SLA_HOURS || 24 }} \
              quotationSlaHours=${{ vars.QUOTATION_SLA_HOURS || 24 }} \
              approvalSlaCheckIntervalMinutes=${{ vars.APPROVAL_SLA_CHECK_INTERVAL_MINUTES || 60 }} \
              approvalSlaEscalationRepeatHours=${{ vars.APPROVAL_SLA_ESCALATION_REPEAT_HOURS || 24 }} \
              sendQuotationRecipientEmails=${{ vars.SEND_QUOTATION_RECIPIENT_EMAILS != 'false' }} \
              usePgbouncer=${{ vars.USE_PGBOUNCER != 'false' }} \
              displayTimezone="${{ vars.DISPLAY_TIMEZONE || 'Africa/Lagos' }}" \
              currencyCode="${{ vars.CURRENCY_CODE || 'NGN' }}" \
              catalogShowStockToStaffCustomer=${{ vars.CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER == 'true' }} \
              backupHoursUtc="${{ vars.BACKUP_HOURS_UTC || '3' }}" \
              backupRetentionCount=${{ vars.BACKUP_RETENTION_COUNT || 7 }} \
              otelEnabled=${{ vars.OTEL_ENABLED == 'true' }} \
              otelServiceName="${{ vars.OTEL_SERVICE_NAME || 'snipeit-lite-backend' }}" \
              otelExporterOtlpEndpoint="${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
              otelExporterOtlpHeaders="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" \
              otelTracesSampleRatio="${{ vars.OTEL_TRACES_SAMPLE_RATIO || '1.0' }}" \
              otelAzureMonitorEnabled=${{ vars.OTEL_AZURE_MONITOR_ENABLED == 'true' }}

      - name: Verify Azure managed PgBouncer configuration
        if: ${{ github.event.inputs.action == 'apply' && vars.USE_PGBOUNCER != 'false' }}
        run: |
          set -euo pipefail
          SERVER=$(az postgres flexible-server list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)
          [ -n "$SERVER" ] || { echo "::error::No PostgreSQL Flexible Server found after infrastructure deployment."; exit 1; }
          for attempt in $(seq 1 12); do
            VALUE=$(az postgres flexible-server parameter show \
              --resource-group "$RESOURCE_GROUP" \
              --server-name "$SERVER" \
              --name pgbouncer.enabled \
              --query value -o tsv 2>/dev/null || true)
            if [ "$VALUE" = "on" ] || [ "$VALUE" = "true" ]; then
              echo "Azure managed PgBouncer is enabled on $SERVER."
              exit 0
            fi
            echo "PgBouncer is not yet observable as enabled (attempt $attempt/12); retrying..."
            sleep 10
          done
          echo "::error::Azure managed PgBouncer did not become enabled/observable on $SERVER. The deployment was not considered ready."
          exit 1

      # Bicep was given the exact pre-infra traffic topology, so there is no
      # post-deployment traffic flip. Verify the invariant instead.
      - name: Verify ACA traffic was preserved
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          set -euo pipefail
          for APP in backend frontend; do
            EXPECTED="$RUNNER_TEMP/aca-traffic/${APP}.json"
            ACTUAL="$RUNNER_TEMP/aca-traffic/${APP}-after.json"

            # First provisioning has no app to verify.
            if ! az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" \
                --query "name" -o tsv >/dev/null 2>&1; then
              continue
            fi

            az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.traffic" -o json > "$ACTUAL"

            EXPECTED_JSON=$(cat "$EXPECTED")
            ACTUAL_JSON=$(cat "$ACTUAL")

            if ! jq -n --argjson expected "$EXPECTED_JSON" --argjson actual "$ACTUAL_JSON" '
              def normalized:
                map({
                  revisionName: (.revisionName // null),
                  latestRevision: (.latestRevision // false),
                  weight: (.weight // 0)
                }) | sort_by((.revisionName // ""), (.latestRevision|tostring), .weight);
              ($expected | normalized) == ($actual | normalized)
            '; then
              echo "::error::$APP ingress traffic changed unexpectedly during infrastructure deployment."
              echo "Expected:"
              cat "$EXPECTED"
              echo "Actual:"
              cat "$ACTUAL"
              exit 1
            fi
            echo "$APP ingress traffic preserved."
          done

      # An infra refresh can create a revision because a value under
      # `properties.template` changed. It is not an application release and
      # has 0% traffic because Bicep preserved the pre-run routing. Deactivate
      # only revisions that did not exist before this run and carry no traffic.
      - name: Deactivate infra-only zero-traffic revisions
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          set -euo pipefail
          cleanup_new_zero_traffic() {
            local app="$1"
            local before="$RUNNER_TEMP/aca-traffic/${app}-active-before.txt"

            mapfile -t new_zero < <(
              az containerapp revision list --name "$app" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.active && properties.trafficWeight == \`0\`].name" -o tsv
            )

            for rev in "${new_zero[@]}"; do
              [ -z "$rev" ] && continue
              if grep -Fxq "$rev" "$before" 2>/dev/null; then
                continue
              fi

              echo "Deactivating infra-created zero-traffic revision $app/$rev"
              az containerapp revision deactivate \
                --name "$app" --resource-group "$RESOURCE_GROUP" --revision "$rev" || \
                echo "::warning::Could not deactivate infra-created revision $app/$rev; it remains at 0% traffic."
            done
          }

          cleanup_new_zero_traffic backend
          cleanup_new_zero_traffic frontend

      - name: Show Bicep stack state
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          az stack group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$STACK_NAME" \
            --query "{stack:name,resourceGroup:resourceGroup,managedResourceCount:length(resources),resources:resources}" \
            -o json

  destroy-infra:
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    env:
      ENV_NAME: ${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      RESOURCE_GROUP: rg-snipeit-lite-${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      STACK_NAME: snipeit-lite-${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify destroy confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.destroy_confirmation }}
        run: |
          set -euo pipefail
          expected="DESTROY-${{ github.event.inputs.target }}"
          if [ "$CONFIRMATION" != "$expected" ]; then
            echo "::error::Destroy is intentionally blocked. Enter '$expected' in destroy_confirmation."
            exit 1
          fi

      - name: Register deployment-stack provider
        run: |
          set -euo pipefail
          az provider register --namespace Microsoft.Resources --wait

      - name: Destroy preview and GitHub Summary
        id: destroy_preview
        run: |
          set -euo pipefail
          if ! az group show --name "$RESOURCE_GROUP" >/dev/null 2>&1; then
            {
              echo "## 🗑️ Bicep Destroy Plan — ${{ github.event.inputs.target }}"
              echo ''
              echo "Resource group **$RESOURCE_GROUP** does not exist."
              echo ''
              echo '**Resources scheduled for deletion:** 0'
              echo ''
              echo '> ✅ Nothing to destroy.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'nothing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! STACK_JSON=$(az stack group show --name "$STACK_NAME" --resource-group "$RESOURCE_GROUP" -o json 2>/dev/null); then
            {
              echo "## 🗑️ Bicep Destroy Plan — ${{ github.event.inputs.target }}"
              echo ''
              echo "Deployment stack **$STACK_NAME** does not exist."
              echo ''
              echo '**Resources scheduled for deletion:** 0'
              echo ''
              echo '> ✅ Nothing managed by this Bicep stack will be deleted.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'nothing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$STACK_JSON" > "$RUNNER_TEMP/stack.json"
          resource_count=$(jq '(.resources // []) | length' "$RUNNER_TEMP/stack.json")
          {
            echo "## ⚠️ Bicep Destroy Plan — ${{ github.event.inputs.target }}"
            echo ''
            echo "**Resource Group:** \`$RESOURCE_GROUP\`  "
            echo "**Deployment Stack:** \`$STACK_NAME\`  "
            echo ''
            echo '### Destruction Summary'
            echo ''
            echo '| Item | Value |'
            echo '|---|---:|'
            echo "| Managed resources scheduled for deletion | **$resource_count** |"
            echo '| Resource group | Retained |'
            echo ''
            echo '> ⚠️ **Destructive operation.** The stack is deleted with `action-on-unmanage=deleteResources`, so resources managed by this stack are deleted while the parent resource group is retained.'
            echo ''
            echo '### Resources'
            echo ''
            echo '| # | Resource ID |'
            echo '|---:|---|'
            jq -r '(.resources // []) | to_entries[] | "| \(.key + 1) | \(.value.id // .value.resourceId // .value) |"' "$RUNNER_TEMP/stack.json"
          } >> "$GITHUB_STEP_SUMMARY"

          echo '--- Managed resources scheduled for deletion ---'
          jq -r '(.resources // [])[] | .id // .resourceId // .' "$RUNNER_TEMP/stack.json"
          echo 'nothing=false' >> "$GITHUB_OUTPUT"

      - name: Destroy Bicep deployment stack
        if: ${{ steps.destroy_preview.outputs.nothing != 'true' }}
        run: |
          set -euo pipefail
          if ! az stack group show --name "$STACK_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Stack already absent; nothing to destroy."
            exit 0
          fi
          az stack group delete \
            --name "$STACK_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --action-on-unmanage deleteResources \
            --yes
          echo "All resources tracked by '$STACK_NAME' have been requested for deletion."
          echo "The resource group itself is intentionally retained."
