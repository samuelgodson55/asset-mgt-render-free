# .github/workflows/infra-deploy.yml
# -----------------------------------------------------------------------------
# Provisions/updates the Azure infrastructure in infra/main.bicep -- the
# cost-optimized shape: Container Apps Environment, Log Analytics, Storage
# (Azure Files for backup/export only), THREE Container Apps
# (frontend/backend/redis) + one `migrate` Container Apps Job, PLUS a
# standalone Azure Database for PostgreSQL Flexible Server (`postgresServer`
# -- a managed service, not a Container App; see infra/main.bicep's
# top-of-file comment for why Postgres specifically can't be a Container App
# on Azure Files). No ACR, no Key Vault, no managed identity, no Application
# Insights -- see infra/main.bicep's top-of-file comment.
#
# This is DELIBERATELY separate from deploy-azure-aca.yml /
# -staging.yml, which only ever push new `backend`/`frontend` images --
# infra changes (a new env var, a Postgres storage size bump, ...) are
# infrequent and reviewed, not something you want re-running on every
# `git push`.
#
# Run this:
#   - once, to create a brand-new environment (staging or prod)
#   - again, any time infra/main.bicep itself changes and you want that
#     change applied
#   - with action=destroy to safely remove ONLY resources tracked by the
#     Azure Deployment Stack for that environment
#
# Resource groups are derived from the environment name and created by this
# workflow. No RESOURCE_GROUP secret is required:
#   staging    -> rg-snipeit-lite-staging
#   production -> rg-snipeit-lite-prod
#
# The workflow also registers the providers used by infra/main.bicep. The
# Bicep stack is managed through Azure Deployment Stacks so destroy behaves
# like Terraform destroy: Azure deletes the resources tracked by the stack
# (`action-on-unmanage=deleteResources`) rather than blindly deleting the
# entire resource group. The parent resource group is intentionally retained.
#
# SAFE TO RE-RUN: it reads whatever image tags are CURRENTLY deployed on
# `backend`/`frontend` first and passes those back in as `initialImageTag`
# (both apps share one tag per deploy, so this reads either one), so
# re-applying infra changes never rolls a running environment back to a
# placeholder image.
# -----------------------------------------------------------------------------
name: Deploy ACA Infrastructure (Bicep)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to provision/update/destroy'
        required: true
        type: choice
        options: [staging, production]
      action:
        description: 'Bicep stack action'
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan
      destroy_confirmation:
        description: 'Required only for destroy: Type DESTROY <environment> exactly (for example: DESTROY production)'
        required: false
        type: string
        default: ''

permissions:
  id-token: write # required for OIDC federated login (azure/login) -- no client secret stored anywhere
  contents: read

jobs:
  deploy-infra:
    if: ${{ github.event.inputs.action != 'destroy' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    env:
      ENV_NAME: ${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      RESOURCE_GROUP: rg-snipeit-lite-${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      STACK_NAME: snipeit-lite-${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      # NOTE: deliberately checked as == 'staging' (not == 'production' && ''
      # || '-staging') -- GitHub Actions expressions use JS-style
      # truthy/falsy && / ||, and '' is falsy, so a `production && '' ||
      # '-staging'` ternary collapses to '-staging' on EVERY run regardless
      # of `target`, silently pinning production's Container Apps to the
      # staging Docker Hub repo (snipeit-lite-backend-staging /
      # snipeit-lite-frontend-staging) on every infra redeploy. Checking
      # for 'staging' instead keeps the only empty-string branch on the
      # `||` fallback, which is safe. See deploy-azure-aca.yml's
      # `resolve-target` job, which computes the equivalent `image_suffix`
      # with an explicit bash if/else for the same reason -- that workflow
      # was never affected by this bug, only this one.
      ENV_SUFFIX: ${{ github.event.inputs.target == 'staging' && '-staging' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Bicep resource providers
        run: |
          set -euo pipefail
          for provider in \
            Microsoft.App \
            Microsoft.DBforPostgreSQL \
            Microsoft.Insights \
            Microsoft.Network \
            Microsoft.OperationalInsights \
            Microsoft.Storage
          do
            echo "Registering $provider (already registered is a no-op)"
            az provider register --namespace "$provider" --wait
          done

      - name: Ensure resource group exists
        run: |
          set -euo pipefail
          az group show --name "$RESOURCE_GROUP" >/dev/null 2>&1 || \
            az group create --name "$RESOURCE_GROUP" \
              --location "${{ vars.AZURE_LOCATION || 'eastus2' }}"

      # main.bicep's alerting section (action group + 3 scheduled query
      # alert rules, see that file's "Alerting" comment) only deploys when
      # ALERT_EMAIL_ADDRESS is set -- both are Microsoft.Insights resource
      # types, and a subscription that has never used Azure Monitor
      # alerting before typically isn't registered for that namespace yet,
      # which fails the deployment with "MissingSubscriptionRegistration".
      # Registering an already-registered provider is a fast no-op, so this
      # runs unconditionally rather than trying to mirror bicep's
      # ALERT_EMAIL_ADDRESS-gated condition here in bash.
      #
      
      # INITIAL DEPLOYMENT vs INFRA REFRESH
      # ----------------------------------
      # First deployment: no Container Apps exist yet, so select the frontend
      # image flavor from this GitHub Environment's FRONTEND_BUILD_TARGET.
      # React is the safe/default initial target when the variable is unset.
      #
      # Refresh/update: never substitute "latest" and never rebuild the
      # frontend selection from the current variable. Read the exact image
      # references currently used by BOTH backend and frontend, verify both
      # manifests still exist on Docker Hub, and feed those exact repos/tags
      # back into Bicep. This preserves the running build even if
      # FRONTEND_BUILD_TARGET changed after the environment was created.
      - name: Resolve current ACA images (or initial defaults)
        id: current
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FRONTEND_BUILD_TARGET: ${{ vars.FRONTEND_BUILD_TARGET || 'react' }}
        run: |
          set -euo pipefail

          if [[ "$FRONTEND_BUILD_TARGET" != "react" && "$FRONTEND_BUILD_TARGET" != "legacy" ]]; then
            echo "::error::FRONTEND_BUILD_TARGET must be 'react' or 'legacy' when set; got '$FRONTEND_BUILD_TARGET'."
            exit 1
          fi

          BACKEND_IMAGE=""
          FRONTEND_IMAGE=""
          if az containerapp show --name backend --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1 && \
             az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            BACKEND_IMAGE=$(az containerapp show --name backend --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" -o tsv)
            FRONTEND_IMAGE=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" -o tsv)
          fi

          if [[ -n "$BACKEND_IMAGE" && -n "$FRONTEND_IMAGE" ]]; then
            echo "Existing ACA images found; preserving the exact build images for this infra refresh."
            BACKEND_REPO="${BACKEND_IMAGE%:*}"
            BACKEND_TAG="${BACKEND_IMAGE##*:}"
            FRONTEND_REPO="${FRONTEND_IMAGE%:*}"
            FRONTEND_TAG="${FRONTEND_IMAGE##*:}"
            SOURCE="existing"
          else
            echo "No complete existing ACA image pair found; treating this as the initial deployment."
            BACKEND_REPO="${DOCKERHUB_USERNAME}/snipeit-lite-backend${ENV_SUFFIX}"
            FRONTEND_REPO="${DOCKERHUB_USERNAME}/snipeit-lite-frontend-${FRONTEND_BUILD_TARGET}${ENV_SUFFIX}"
            BACKEND_TAG="latest"
            FRONTEND_TAG="latest"
            SOURCE="initial"
          fi

          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null
          fi

          for pair in \
            "backend|$BACKEND_REPO|$BACKEND_TAG" \
            "frontend|$FRONTEND_REPO|$FRONTEND_TAG"; do
            IFS='|' read -r NAME REPO TAG <<< "$pair"
            if ! docker manifest inspect "${REPO}:${TAG}" >/dev/null 2>&1; then
              echo "::error::Docker Hub image ${REPO}:${TAG} is not available. Refusing to refresh ACA with a dangling image reference."
              exit 1
            fi
            echo "$NAME image verified: ${REPO}:${TAG}"
          done

          echo "backend_repo=$BACKEND_REPO" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=$FRONTEND_REPO" >> "$GITHUB_OUTPUT"
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      # COST LEVER: staging has no real users waiting on it, so `backend`
      # AND `frontend` both scale to zero when idle (min replicas 0 -- pure
      # cold-start-on-first-request tradeoff, ~$0 idle compute). Production
      # now keeps BOTH `backend` AND `frontend` warm (min 1) -- zero cold
      # starts anywhere in the production request path, at the cost of two
      # always-on replicas instead of one. (Previously only `backend` was
      # floored at 1; `frontend` stayed at 0 even in production, so the
      # first visitor after any idle period still ate a cold start on the
      # static/proxy tier -- short, but not zero.) `redis` always runs at
      # exactly 1 replica regardless, in every environment -- see
      # infra/main.bicep, it's stateful and can't scale to zero.
      # `postgresServer` (Flexible Server) isn't a Container App at all and
      # has no replica concept -- it's always on, billed by the hour
      # regardless of traffic, same in every environment. The `migrate`
      # Container Apps Job is deliberately NOT part of this -- jobs have no
      # "warm" concept; every execution is a fresh cold start by design,
      # and that's fine since it only runs once per deploy, not per user
      # request.
      - name: Resolve replica floors for this environment
        id: replicas
        run: |
          if [ "$ENV_NAME" = "prod" ]; then
            echo "backend_min=1" >> "$GITHUB_OUTPUT"
            echo "frontend_min=1" >> "$GITHUB_OUTPUT"
          else
            echo "backend_min=0" >> "$GITHUB_OUTPUT"
            echo "frontend_min=0" >> "$GITHUB_OUTPUT"
          fi

      # ALERT_EMAIL_ADDRESS is optional -- leave the GitHub secret unset and
      # this resolves to an empty string, which keeps main.bicep's alerting
      # section (action group + 3 scheduled query alerts) undeployed
      # entirely, same as before this parameter existed. Set it once you
      # want backend error-rate/`/readyz`/backup alerts paging someone --
      # see SRE_STRATEGY.md section 2.
      # postgresSkuName/postgresStorageGb are read from repo-level GitHub
      # Variables (Settings -> Secrets and variables -> Actions -> Variables
      # tab, NOT Secrets -- these aren't sensitive) so you can size the
      # Flexible Server per-environment without editing this workflow.
      # Unset variables fall back to bicep's own defaults (Standard_B1ms /
      # 32 GiB) via the `|| default` bash pattern below -- this step is safe
      # to run even if you never set either variable.
      # SMTP (email notifications) and Google Drive (backup upload) now
      # follow the SAME Secrets-vs-Variables split, and the SAME names,
      # that sync-secrets-vm.yml/infra-deploy-vm.yml already use on the VM
      # path and that backend/config.py's BACKUP_GDRIVE_*/
      # NOTIFICATIONS_ENABLED env vars use (see .env.example):
      #   - SMTP_HOST / SMTP_USERNAME / SMTP_PASSWORD / SMTP_FROM_EMAIL /
      #     ADMIN_NOTIFICATION_EMAILS and the three BACKUP_GDRIVE_OAUTH_*
      #     values stay real GitHub Secrets (unchanged).
      #   - The on/off switches -- NOTIFICATIONS_ENABLED and
      #     BACKUP_GDRIVE_ENABLED -- are config, not credentials, so they're
      #     GitHub Variables, same as ENABLE_API_DOCS/SITE_NAME/etc. below.
      #     BACKUP_GDRIVE_FOLDER_ID (a Drive folder ID, not a credential)
      #     stays a Secret only because sync-secrets-vm.yml already treats
      #     it as one -- kept that way here too so the same name means the
      #     same classification on both deploy paths.
      #   This used to put NOTIFICATIONS_ENABLED AND the whole GDRIVE_*
      #   group in Secrets under different names entirely (GDRIVE_BACKUP_ENABLED,
      #   GDRIVE_OAUTH_CLIENT_ID, GDRIVE_FOLDER_ID, ...) than both the VM
      #   path and the app's own .env.example -- renamed/reclassified here
      #   so one name means one thing everywhere in this repo.
      # Every value below still resolves to an empty string / 'false' if
      # you never set it, keeping main.bicep's defaults (notifications off,
      # gdrive off) exactly as before these lines existed. Set them once
      # you're ready:
      #   - SMTP_HOST / SMTP_USERNAME / SMTP_PASSWORD / SMTP_FROM_EMAIL
      #     (Secrets), then NOTIFICATIONS_ENABLED=true (Variable).
      #     ADMIN_NOTIFICATION_EMAILS is optional on top (comma-separated,
      #     Secret).
      #   - BACKUP_GDRIVE_OAUTH_CLIENT_ID / BACKUP_GDRIVE_OAUTH_CLIENT_SECRET /
      #     BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN (Secrets, from backend/scripts/
      #     gdrive_oauth_setup.py -- run that ONCE on your own machine, not
      #     in CI) and BACKUP_GDRIVE_FOLDER_ID (Secret), then
      #     BACKUP_GDRIVE_ENABLED=true (Variable).
      # `vars.X == 'true'` / `secrets.X == 'true'` (not a plain boolean)
      # because GitHub Actions Variables and Secrets are always strings --
      # the standard pattern for turning an unset/empty value into bicep's
      # `false` default without needing a separate entry just for that.
      # ENABLE_API_DOCS / SITE_NAME / rate-limit / lockout / super-admin
      # identity / SMTP port+transport / notification intervals / display
      # timezone / currency / catalog visibility / backup schedule are all
      # non-sensitive config -- no passwords or tokens among them -- so they
      # follow the SAME pattern as postgresSkuName/postgresStorageGb above:
      # repo-level GitHub VARIABLES (Settings -> Secrets and variables ->
      # Actions -> Variables tab), not Secrets, with a `|| default` fallback
      # to main.bicep's own default so this step is safe to run even if you
      # never set any of them. Set only the ones you want to change from
      # their .env.example default; everything else keeps working exactly
      # as before these lines existed.
      #
      # OTEL_ENABLED / OTEL_AZURE_MONITOR_ENABLED / OTEL_SERVICE_NAME /
      # OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_TRACES_SAMPLE_RATIO follow that
      # same repo-Variables pattern -- distributed tracing (see
      # backend/telemetry.py's module docstring) stays off by default,
      # matching every other opt-in flag deployed by this workflow.
      # OTEL_EXPORTER_OTLP_HEADERS is the one exception, read from Secrets
      # instead (it commonly carries an API key -- see
      # infra/main.bicep's `otelExporterOtlpHeaders` param). See
      # README.md's "Distributed Tracing" section for what to actually set
      # here to turn this on end-to-end.
      # BUG FIX (the "Deploy Bicep" / "CertificateId property is missing for
      # customDomain" failure): main.bicep's `frontend` ingress used to bind
      # `customDomain` with `bindingType: 'SniEnabled'` and NO
      # `certificateId` at all -- Azure only tolerated that the very first
      # time (before any certificate existed for the domain); once a
      # managed certificate is provisioned for it (e.g. via the Portal's
      # "Add custom domain" wizard, or `az containerapp env certificate
      # create` / `hostname bind`, done once out-of-band -- main.bicep
      # still doesn't provision the certificate itself, see
      # `customDomainCertificateId`'s own param comment for why), EVERY
      # subsequent `az deployment group create` re-tried the same
      # certificate-less binding and Azure rejected it outright. This step
      # looks up whatever managed certificate (if any) already covers
      # `CUSTOM_DOMAIN` in this environment and feeds its resource ID into
      # `customDomainCertificateId` below, so the binding Bicep submits
      # always matches what Azure actually has on record -- idempotent,
      # every run, no more manually re-discovering the certificate ID by
      # hand each time infra needs to be redeployed.
      #
      # First deploy ever (no `Microsoft.App/managedEnvironments` in this
      # resource group yet) or `CUSTOM_DOMAIN` unset: both `az` calls below
      # fail/return nothing, `id` stays empty, and main.bicep's own
      # `empty(customDomainCertificateId)` fallback keeps `frontend` on its
      # default *.azurecontainerapps.io FQDN -- exactly like before this
      # step existed.
      - name: Resolve existing managed certificate for the custom domain (if any)
        id: cert
        run: |
          CERT_ID=""
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            ENV_APP_NAME=$(az containerapp env list --resource-group "$RESOURCE_GROUP" \
                             --query "[0].name" -o tsv 2>/dev/null) || true
            if [ -n "$ENV_APP_NAME" ]; then
              CERT_ID=$(az containerapp env certificate list \
                          --name "$ENV_APP_NAME" --resource-group "$RESOURCE_GROUP" \
                          --query "[?properties.subjectName=='${{ vars.CUSTOM_DOMAIN }}'] | [0].id" \
                          -o tsv 2>/dev/null) || true
            fi
          fi
          echo "id=${CERT_ID:-}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ] && [ -z "$CERT_ID" ]; then
            echo "::notice::No existing managed certificate found for '${{ vars.CUSTOM_DOMAIN }}' yet -- frontend will deploy on its default *.azurecontainerapps.io FQDN this run. Provision the certificate for this domain (Portal 'Add custom domain' wizard, or 'az containerapp env certificate create' / 'hostname bind'), then re-run this workflow to bind it going forward."
          fi

      # BLUE-GREEN SAFETY: this workflow is infrastructure/configuration
      # management, not an application release. Container Apps in Multiple
      # revision mode use ingress traffic as application-scope state. A full
      # Bicep PUT currently contains the baseline `latestRevision: true`
      # traffic rule, which can overwrite the explicit revision pin created
      # by aca-blue-green.sh. Snapshot the live routing BEFORE Bicep and
      # restore it immediately AFTER. This means an infra refresh cannot
      # silently move production traffic to an infra-created revision or
      # leave the next blue-green deploy with the wrong "active" revision.
      - name: Snapshot current ACA traffic before infra deployment
        if: ${{ github.event.inputs.action == 'apply' }}
        id: traffic_before
        run: |
          mkdir -p "$RUNNER_TEMP/aca-traffic"
          for APP in backend frontend; do
            az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.traffic" -o json \
              > "$RUNNER_TEMP/aca-traffic/${APP}.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/aca-traffic/${APP}.json"

            LIVE_REV=$(az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.traffic[?revisionName && weight > \`0\`].revisionName | [0]" \
              -o tsv 2>/dev/null || true)

            if [ -z "$LIVE_REV" ]; then
              LIVE_REV=$(az containerapp revision list --name "$APP" --resource-group "$RESOURCE_GROUP" \
                --query "sort_by([?properties.active], &properties.createdTime)[-1].name" \
                -o tsv 2>/dev/null || true)
            fi

            az containerapp revision list --name "$APP" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active].name" -o tsv 2>/dev/null \
              > "$RUNNER_TEMP/aca-traffic/${APP}-active-before.txt" || true

            echo "${APP}_live_revision=${LIVE_REV}" >> "$GITHUB_OUTPUT"
            echo "${APP}: preserving live revision '${LIVE_REV:-<none>}'"
            cat "$RUNNER_TEMP/aca-traffic/${APP}.json"
          done

      - name: Bicep What-If plan and GitHub Summary
        if: ${{ github.event.inputs.action == 'plan' }}
        run: |
          set -euo pipefail
          WHAT_IF="$RUNNER_TEMP/bicep-what-if.json"

          echo "Running Azure Resource Manager What-If..."
          if ! az deployment group what-if \
            --name "$STACK_NAME-plan" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --mode Incremental \
            --result-format ResourceIdOnly \
            --no-pretty-print \
            --output json \
            --parameters \
              environmentName="$ENV_NAME" \
              dockerHubBackendImage="${{ steps.current.outputs.backend_repo }}" \
              dockerHubFrontendImage="${{ steps.current.outputs.frontend_repo }}" \
              initialImageTag="latest" \
              initialBackendImageTag="${{ steps.current.outputs.backend_tag }}" \
              initialFrontendImageTag="${{ steps.current.outputs.frontend_tag }}" \
              dockerHubUsername="${{ secrets.DOCKERHUB_USERNAME }}" \
              dockerHubToken="${{ secrets.DOCKERHUB_TOKEN }}" \
              backendMinReplicas=${{ steps.replicas.outputs.backend_min }} \
              frontendMinReplicas=${{ steps.replicas.outputs.frontend_min }} \
              postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
              postgresSkuName="${{ vars.POSTGRES_SKU_NAME || 'Standard_B1ms' }}" \
              postgresStorageGb=${{ vars.POSTGRES_STORAGE_GB || 32 }} \
              redisPassword="${{ secrets.REDIS_PASSWORD }}" \
              jwtSecretKey="${{ secrets.JWT_SECRET_KEY }}" \
              rootAdminBootstrapPassword="${{ secrets.ROOT_ADMIN_BOOTSTRAP_PASSWORD }}" \
              customDomain="${{ vars.CUSTOM_DOMAIN }}" \
              customDomainCertificateId="${{ steps.cert.outputs.id }}" \
              alertEmailAddress="${{ secrets.ALERT_EMAIL_ADDRESS }}" \
              notificationsEnabled=${{ vars.NOTIFICATIONS_ENABLED == 'true' }} \
              smtpHost="${{ secrets.SMTP_HOST }}" \
              smtpUsername="${{ secrets.SMTP_USERNAME }}" \
              smtpPassword="${{ secrets.SMTP_PASSWORD }}" \
              smtpFromEmail="${{ secrets.SMTP_FROM_EMAIL }}" \
              emailProvider="${{ vars.EMAIL_PROVIDER || 'smtp' }}" \
              brevoApiKey="${{ secrets.BREVO_API_KEY }}" \
              resendApiKey="${{ secrets.RESEND_API_KEY }}" \
              adminNotificationEmails="${{ secrets.ADMIN_NOTIFICATION_EMAILS }}" \
              gdriveBackupEnabled=${{ vars.BACKUP_GDRIVE_ENABLED == 'true' }} \
              gdriveOauthClientId="${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_ID }}" \
              gdriveOauthClientSecret="${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_SECRET }}" \
              gdriveOauthRefreshToken="${{ secrets.BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN }}" \
              gdriveFolderId="${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}" \
              enableApiDocs=${{ vars.ENABLE_API_DOCS == 'true' }} \
              siteName="${{ vars.SITE_NAME || 'Snipe-IT Lite' }}" \
              logLevel="${{ vars.LOG_LEVEL || 'INFO' }}" \
              loginRateLimitMax=${{ vars.LOGIN_RATE_LIMIT_MAX || 5 }} \
              loginRateLimitWindowSeconds=${{ vars.LOGIN_RATE_LIMIT_WINDOW_SECONDS || 60 }} \
              accountLockoutMaxAttempts=${{ vars.ACCOUNT_LOCKOUT_MAX_ATTEMPTS || 5 }} \
              accountLockoutDurationMinutes=${{ vars.ACCOUNT_LOCKOUT_DURATION_MINUTES || 15 }} \
              superAdminUsername="${{ vars.SUPER_ADMIN_USERNAME || 'superadmin' }}" \
              superAdminName="${{ vars.SUPER_ADMIN_NAME || 'Super Admin' }}" \
              smtpPort=${{ vars.SMTP_PORT || 587 }} \
              smtpUseTls=${{ vars.SMTP_USE_TLS != 'false' }} \
              smtpUseSsl=${{ vars.SMTP_USE_SSL == 'true' }} \
              overdueDigestHoursUtc="${{ vars.OVERDUE_DIGEST_HOURS_UTC || '8' }}" \
              dueSoonReminderDays=${{ vars.DUE_SOON_REMINDER_DAYS || 2 }} \
              dueSoonDigestHoursUtc="${{ vars.DUE_SOON_DIGEST_HOURS_UTC || '8' }}" \
              sendIndividualHolderReminders=${{ vars.SEND_INDIVIDUAL_HOLDER_REMINDERS != 'false' }} \
              extensionRequestSlaHours=${{ vars.EXTENSION_REQUEST_SLA_HOURS || 24 }} \
              quotationSlaHours=${{ vars.QUOTATION_SLA_HOURS || 24 }} \
              approvalSlaCheckIntervalMinutes=${{ vars.APPROVAL_SLA_CHECK_INTERVAL_MINUTES || 60 }} \
              approvalSlaEscalationRepeatHours=${{ vars.APPROVAL_SLA_ESCALATION_REPEAT_HOURS || 24 }} \
              sendQuotationRecipientEmails=${{ vars.SEND_QUOTATION_RECIPIENT_EMAILS != 'false' }} \
              displayTimezone="${{ vars.DISPLAY_TIMEZONE || 'Africa/Lagos' }}" \
              currencyCode="${{ vars.CURRENCY_CODE || 'NGN' }}" \
              catalogShowStockToStaffCustomer=${{ vars.CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER == 'true' }} \
              backupHoursUtc="${{ vars.BACKUP_HOURS_UTC || '3' }}" \
              backupRetentionCount=${{ vars.BACKUP_RETENTION_COUNT || 7 }} \
              otelEnabled=${{ vars.OTEL_ENABLED == 'true' }} \
              otelServiceName="${{ vars.OTEL_SERVICE_NAME || 'snipeit-lite-backend' }}" \
              otelExporterOtlpEndpoint="${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
              otelExporterOtlpHeaders="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" \
              otelTracesSampleRatio="${{ vars.OTEL_TRACES_SAMPLE_RATIO || '1.0' }}" \
              otelAzureMonitorEnabled=${{ vars.OTEL_AZURE_MONITOR_ENABLED == 'true' }} \
            > "$WHAT_IF"; then
            {
              echo '## ❌ Bicep Plan Failed'
              echo ''
              echo "What-If could not be evaluated for **$ENV_NAME**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          create=$(jq '[.changes[]? | select(.changeType == "Create")] | length' "$WHAT_IF")
          modify=$(jq '[.changes[]? | select(.changeType == "Modify")] | length' "$WHAT_IF")
          delete=$(jq '[.changes[]? | select(.changeType == "Delete")] | length' "$WHAT_IF")
          deploy=$(jq '[.changes[]? | select(.changeType == "Deploy")] | length' "$WHAT_IF")
          nochange=$(jq '[.changes[]? | select(.changeType == "NoChange")] | length' "$WHAT_IF")
          unsupported=$(jq '[.changes[]? | select(.changeType == "Unsupported")] | length' "$WHAT_IF")
          total=$((create + modify + delete + deploy + nochange + unsupported))

          {
            echo "## Bicep Plan — ${{ github.event.inputs.target }}"
            echo ''
            echo "**Resource Group:** \`$RESOURCE_GROUP\`  "
            echo "**Deployment Stack:** \`$STACK_NAME\`  "
            echo ''
            echo '### Change Summary'
            echo ''
            echo '| Change | Count |'
            echo '|---|---:|'
            echo "| Create | $create |"
            echo "| Modify | $modify |"
            echo "| Delete | $delete |"
            echo "| Deploy | $deploy |"
            echo "| No change | $nochange |"
            echo "| Unsupported | $unsupported |"
            echo "| **Total** | **$total** |"
            echo ''
            if [ "$delete" -gt 0 ]; then
              echo '> ⚠️ **Destructive changes detected.** This plan does not apply them.'
              echo ''
            elif [ "$unsupported" -gt 0 ]; then
              echo '> ⚠️ **Unsupported changes detected.** Review the full What-If output before applying.'
              echo ''
            else
              echo '> ✅ **No destructive changes detected.** This plan did not modify Azure.'
              echo ''
            fi
            echo '### Resources'
            echo ''
            echo '| Change | Resource |'
            echo '|---|---|'
            jq -r '.changes[]? | "| \(.changeType) | \(.resourceId) |"' "$WHAT_IF"
            echo ''
            echo '> Full Azure What-If JSON is available in the workflow logs/artifacts for detailed inspection.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '--- Azure What-If (Resource IDs) ---'
          jq -r '.changes[]? | "\(.changeType): \(.resourceId)"' "$WHAT_IF"

      - name: Bicep What-If before apply and GitHub Summary
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          set -euo pipefail
          WHAT_IF="$RUNNER_TEMP/bicep-what-if-apply.json"

          if ! az deployment group what-if \
            --name "$STACK_NAME-preapply" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --mode Incremental \
            --result-format ResourceIdOnly \
            --no-pretty-print \
            --output json \
            --parameters \
              environmentName="$ENV_NAME" \
              dockerHubBackendImage="${{ steps.current.outputs.backend_repo }}" \
              dockerHubFrontendImage="${{ steps.current.outputs.frontend_repo }}" \
              initialImageTag="latest" \
              initialBackendImageTag="${{ steps.current.outputs.backend_tag }}" \
              initialFrontendImageTag="${{ steps.current.outputs.frontend_tag }}" \
              dockerHubUsername="${{ secrets.DOCKERHUB_USERNAME }}" \
              dockerHubToken="${{ secrets.DOCKERHUB_TOKEN }}" \
              backendMinReplicas=${{ steps.replicas.outputs.backend_min }} \
              frontendMinReplicas=${{ steps.replicas.outputs.frontend_min }} \
              postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
              postgresSkuName="${{ vars.POSTGRES_SKU_NAME || 'Standard_B1ms' }}" \
              postgresStorageGb=${{ vars.POSTGRES_STORAGE_GB || 32 }} \
              redisPassword="${{ secrets.REDIS_PASSWORD }}" \
              jwtSecretKey="${{ secrets.JWT_SECRET_KEY }}" \
              rootAdminBootstrapPassword="${{ secrets.ROOT_ADMIN_BOOTSTRAP_PASSWORD }}" \
              customDomain="${{ vars.CUSTOM_DOMAIN }}" \
              customDomainCertificateId="${{ steps.cert.outputs.id }}" \
              alertEmailAddress="${{ secrets.ALERT_EMAIL_ADDRESS }}" \
              notificationsEnabled=${{ vars.NOTIFICATIONS_ENABLED == 'true' }} \
              smtpHost="${{ secrets.SMTP_HOST }}" \
              smtpUsername="${{ secrets.SMTP_USERNAME }}" \
              smtpPassword="${{ secrets.SMTP_PASSWORD }}" \
              smtpFromEmail="${{ secrets.SMTP_FROM_EMAIL }}" \
              emailProvider="${{ vars.EMAIL_PROVIDER || 'smtp' }}" \
              brevoApiKey="${{ secrets.BREVO_API_KEY }}" \
              resendApiKey="${{ secrets.RESEND_API_KEY }}" \
              adminNotificationEmails="${{ secrets.ADMIN_NOTIFICATION_EMAILS }}" \
              gdriveBackupEnabled=${{ vars.BACKUP_GDRIVE_ENABLED == 'true' }} \
              gdriveOauthClientId="${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_ID }}" \
              gdriveOauthClientSecret="${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_SECRET }}" \
              gdriveOauthRefreshToken="${{ secrets.BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN }}" \
              gdriveFolderId="${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}" \
              enableApiDocs=${{ vars.ENABLE_API_DOCS == 'true' }} \
              siteName="${{ vars.SITE_NAME || 'Snipe-IT Lite' }}" \
              logLevel="${{ vars.LOG_LEVEL || 'INFO' }}" \
              loginRateLimitMax=${{ vars.LOGIN_RATE_LIMIT_MAX || 5 }} \
              loginRateLimitWindowSeconds=${{ vars.LOGIN_RATE_LIMIT_WINDOW_SECONDS || 60 }} \
              accountLockoutMaxAttempts=${{ vars.ACCOUNT_LOCKOUT_MAX_ATTEMPTS || 5 }} \
              accountLockoutDurationMinutes=${{ vars.ACCOUNT_LOCKOUT_DURATION_MINUTES || 15 }} \
              superAdminUsername="${{ vars.SUPER_ADMIN_USERNAME || 'superadmin' }}" \
              superAdminName="${{ vars.SUPER_ADMIN_NAME || 'Super Admin' }}" \
              smtpPort=${{ vars.SMTP_PORT || 587 }} \
              smtpUseTls=${{ vars.SMTP_USE_TLS != 'false' }} \
              smtpUseSsl=${{ vars.SMTP_USE_SSL == 'true' }} \
              overdueDigestHoursUtc="${{ vars.OVERDUE_DIGEST_HOURS_UTC || '8' }}" \
              dueSoonReminderDays=${{ vars.DUE_SOON_REMINDER_DAYS || 2 }} \
              dueSoonDigestHoursUtc="${{ vars.DUE_SOON_DIGEST_HOURS_UTC || '8' }}" \
              sendIndividualHolderReminders=${{ vars.SEND_INDIVIDUAL_HOLDER_REMINDERS != 'false' }} \
              extensionRequestSlaHours=${{ vars.EXTENSION_REQUEST_SLA_HOURS || 24 }} \
              quotationSlaHours=${{ vars.QUOTATION_SLA_HOURS || 24 }} \
              approvalSlaCheckIntervalMinutes=${{ vars.APPROVAL_SLA_CHECK_INTERVAL_MINUTES || 60 }} \
              approvalSlaEscalationRepeatHours=${{ vars.APPROVAL_SLA_ESCALATION_REPEAT_HOURS || 24 }} \
              sendQuotationRecipientEmails=${{ vars.SEND_QUOTATION_RECIPIENT_EMAILS != 'false' }} \
              displayTimezone="${{ vars.DISPLAY_TIMEZONE || 'Africa/Lagos' }}" \
              currencyCode="${{ vars.CURRENCY_CODE || 'NGN' }}" \
              catalogShowStockToStaffCustomer=${{ vars.CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER == 'true' }} \
              backupHoursUtc="${{ vars.BACKUP_HOURS_UTC || '3' }}" \
              backupRetentionCount=${{ vars.BACKUP_RETENTION_COUNT || 7 }} \
              otelEnabled=${{ vars.OTEL_ENABLED == 'true' }} \
              otelServiceName="${{ vars.OTEL_SERVICE_NAME || 'snipeit-lite-backend' }}" \
              otelExporterOtlpEndpoint="${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
              otelExporterOtlpHeaders="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" \
              otelTracesSampleRatio="${{ vars.OTEL_TRACES_SAMPLE_RATIO || '1.0' }}" \
              otelAzureMonitorEnabled=${{ vars.OTEL_AZURE_MONITOR_ENABLED == 'true' }} \
            > "$WHAT_IF"; then
            { echo '## ❌ Bicep Pre-Apply What-If Failed'; echo ''; echo 'Deployment was **not** attempted.'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          create=$(jq '[.changes[]? | select(.changeType == "Create")] | length' "$WHAT_IF")
          modify=$(jq '[.changes[]? | select(.changeType == "Modify")] | length' "$WHAT_IF")
          delete=$(jq '[.changes[]? | select(.changeType == "Delete")] | length' "$WHAT_IF")
          deploy=$(jq '[.changes[]? | select(.changeType == "Deploy")] | length' "$WHAT_IF")
          nochange=$(jq '[.changes[]? | select(.changeType == "NoChange")] | length' "$WHAT_IF")
          unsupported=$(jq '[.changes[]? | select(.changeType == "Unsupported")] | length' "$WHAT_IF")
          total=$((create + modify + delete + deploy + nochange + unsupported))
          {
            echo "## Bicep Pre-Apply Plan — ${{ github.event.inputs.target }}"
            echo ''
            echo "**Resource Group:** \`$RESOURCE_GROUP\`  "
            echo "**Deployment Stack:** \`$STACK_NAME\`  "
            echo ''
            echo '| Change | Count |'
            echo '|---|---:|'
            echo "| Create | $create |"
            echo "| Modify | $modify |"
            echo "| Delete | $delete |"
            echo "| Deploy | $deploy |"
            echo "| No change | $nochange |"
            echo "| Unsupported | $unsupported |"
            echo "| **Total** | **$total** |"
            echo ''
            if [ "$delete" -gt 0 ]; then echo '> ⚠️ **Destructive changes detected.** Apply will proceed because this workflow was explicitly selected as `apply`.'; else echo '> ✅ **No destructive changes detected.**'; fi
            echo ''
            echo '### Resources'
            echo ''
            echo '| Change | Resource |'
            echo '|---|---|'
            jq -r '.changes[]? | "| \(.changeType) | \(.resourceId) |"' "$WHAT_IF"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Bicep deployment stack
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          az stack group create \
            --name "$STACK_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --action-on-unmanage deleteResources \
            --deny-settings-mode none \
            --yes \
            --parameters \
              environmentName="$ENV_NAME" \
              dockerHubBackendImage="${{ steps.current.outputs.backend_repo }}" \
              dockerHubFrontendImage="${{ steps.current.outputs.frontend_repo }}" \
              initialImageTag="latest" \
              initialBackendImageTag="${{ steps.current.outputs.backend_tag }}" \
              initialFrontendImageTag="${{ steps.current.outputs.frontend_tag }}" \
              dockerHubUsername="${{ secrets.DOCKERHUB_USERNAME }}" \
              dockerHubToken="${{ secrets.DOCKERHUB_TOKEN }}" \
              backendMinReplicas=${{ steps.replicas.outputs.backend_min }} \
              frontendMinReplicas=${{ steps.replicas.outputs.frontend_min }} \
              postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
              postgresSkuName="${{ vars.POSTGRES_SKU_NAME || 'Standard_B1ms' }}" \
              postgresStorageGb=${{ vars.POSTGRES_STORAGE_GB || 32 }} \
              redisPassword="${{ secrets.REDIS_PASSWORD }}" \
              jwtSecretKey="${{ secrets.JWT_SECRET_KEY }}" \
              rootAdminBootstrapPassword="${{ secrets.ROOT_ADMIN_BOOTSTRAP_PASSWORD }}" \
              customDomain="${{ vars.CUSTOM_DOMAIN }}" \
              customDomainCertificateId="${{ steps.cert.outputs.id }}" \
              alertEmailAddress="${{ secrets.ALERT_EMAIL_ADDRESS }}" \
              notificationsEnabled=${{ vars.NOTIFICATIONS_ENABLED == 'true' }} \
              smtpHost="${{ secrets.SMTP_HOST }}" \
              smtpUsername="${{ secrets.SMTP_USERNAME }}" \
              smtpPassword="${{ secrets.SMTP_PASSWORD }}" \
              smtpFromEmail="${{ secrets.SMTP_FROM_EMAIL }}" \
              emailProvider="${{ vars.EMAIL_PROVIDER || 'smtp' }}" \
              brevoApiKey="${{ secrets.BREVO_API_KEY }}" \
              resendApiKey="${{ secrets.RESEND_API_KEY }}" \
              adminNotificationEmails="${{ secrets.ADMIN_NOTIFICATION_EMAILS }}" \
              gdriveBackupEnabled=${{ vars.BACKUP_GDRIVE_ENABLED == 'true' }} \
              gdriveOauthClientId="${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_ID }}" \
              gdriveOauthClientSecret="${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_SECRET }}" \
              gdriveOauthRefreshToken="${{ secrets.BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN }}" \
              gdriveFolderId="${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}" \
              enableApiDocs=${{ vars.ENABLE_API_DOCS == 'true' }} \
              siteName="${{ vars.SITE_NAME || 'Snipe-IT Lite' }}" \
              logLevel="${{ vars.LOG_LEVEL || 'INFO' }}" \
              loginRateLimitMax=${{ vars.LOGIN_RATE_LIMIT_MAX || 5 }} \
              loginRateLimitWindowSeconds=${{ vars.LOGIN_RATE_LIMIT_WINDOW_SECONDS || 60 }} \
              accountLockoutMaxAttempts=${{ vars.ACCOUNT_LOCKOUT_MAX_ATTEMPTS || 5 }} \
              accountLockoutDurationMinutes=${{ vars.ACCOUNT_LOCKOUT_DURATION_MINUTES || 15 }} \
              superAdminUsername="${{ vars.SUPER_ADMIN_USERNAME || 'superadmin' }}" \
              superAdminName="${{ vars.SUPER_ADMIN_NAME || 'Super Admin' }}" \
              smtpPort=${{ vars.SMTP_PORT || 587 }} \
              smtpUseTls=${{ vars.SMTP_USE_TLS != 'false' }} \
              smtpUseSsl=${{ vars.SMTP_USE_SSL == 'true' }} \
              overdueDigestHoursUtc="${{ vars.OVERDUE_DIGEST_HOURS_UTC || '8' }}" \
              dueSoonReminderDays=${{ vars.DUE_SOON_REMINDER_DAYS || 2 }} \
              dueSoonDigestHoursUtc="${{ vars.DUE_SOON_DIGEST_HOURS_UTC || '8' }}" \
              sendIndividualHolderReminders=${{ vars.SEND_INDIVIDUAL_HOLDER_REMINDERS != 'false' }} \
              extensionRequestSlaHours=${{ vars.EXTENSION_REQUEST_SLA_HOURS || 24 }} \
              quotationSlaHours=${{ vars.QUOTATION_SLA_HOURS || 24 }} \
              approvalSlaCheckIntervalMinutes=${{ vars.APPROVAL_SLA_CHECK_INTERVAL_MINUTES || 60 }} \
              approvalSlaEscalationRepeatHours=${{ vars.APPROVAL_SLA_ESCALATION_REPEAT_HOURS || 24 }} \
              sendQuotationRecipientEmails=${{ vars.SEND_QUOTATION_RECIPIENT_EMAILS != 'false' }} \
              displayTimezone="${{ vars.DISPLAY_TIMEZONE || 'Africa/Lagos' }}" \
              currencyCode="${{ vars.CURRENCY_CODE || 'NGN' }}" \
              catalogShowStockToStaffCustomer=${{ vars.CATALOG_SHOW_STOCK_TO_STAFF_CUSTOMER == 'true' }} \
              backupHoursUtc="${{ vars.BACKUP_HOURS_UTC || '3' }}" \
              backupRetentionCount=${{ vars.BACKUP_RETENTION_COUNT || 7 }} \
              otelEnabled=${{ vars.OTEL_ENABLED == 'true' }} \
              otelServiceName="${{ vars.OTEL_SERVICE_NAME || 'snipeit-lite-backend' }}" \
              otelExporterOtlpEndpoint="${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
              otelExporterOtlpHeaders="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" \
              otelTracesSampleRatio="${{ vars.OTEL_TRACES_SAMPLE_RATIO || '1.0' }}" \
              otelAzureMonitorEnabled=${{ vars.OTEL_AZURE_MONITOR_ENABLED == 'true' }}

      # Restore the exact pre-infra traffic target. If the snapshot used
      # explicit revision weights (the normal blue-green production state),
      # restore those weights. If it used latestRevision=true (first-ever
      # deployment / legacy state), restore the exact revision that was live
      # before Bicep rather than blindly keeping whatever Bicep made newest.
      # This is intentionally done AFTER Bicep has completed and before this
      # workflow exits, so the subsequent Deploy to ACA starts from the same
      # known-good traffic topology it had before the infra refresh.
      - name: Restore ACA traffic after infra deployment
        if: always()
        run: |
          restore_traffic() {
            local app="$1" snapshot="$RUNNER_TEMP/aca-traffic/${1}.json" fallback_rev="$2"
            [ -f "$snapshot" ] || { echo "::warning::No traffic snapshot for $app; leaving Azure's current routing unchanged."; return 0; }

            mapfile -t weights < <(jq -r '.[] | select(.revisionName != null and (.weight // 0) > 0) | "\(.revisionName)=\(.weight)"' "$snapshot")
            if [ "${#weights[@]}" -gt 0 ]; then
              echo "Restoring explicit traffic for $app: ${weights[*]}"
              local args=()
              for weight in "${weights[@]}"; do
                args+=(--revision-weight "$weight")
              done
              az containerapp ingress traffic set --name "$app" --resource-group "$RESOURCE_GROUP" "${args[@]}"
              return $?
            fi

            if [ -n "$fallback_rev" ]; then
              echo "Restoring $app to its pre-infra live revision: $fallback_rev (100%)"
              az containerapp ingress traffic set --name "$app" --resource-group "$RESOURCE_GROUP" \
                --revision-weight "${fallback_rev}=100"
              return $?
            fi

            echo "$app had no established traffic target before infra deployment (first provisioning); leaving the baseline routing in place."
          }

          restore_traffic backend "${{ steps.traffic_before.outputs.backend_live_revision }}"
          restore_traffic frontend "${{ steps.traffic_before.outputs.frontend_live_revision }}"

      # Bicep can legitimately create a revision when a value under
      # `properties.template` changes. That revision is NOT the application
      # release; Deploy to ACA owns application revisions. Once the original
      # traffic target is restored, any NEW infra-only revision with 0% traffic
      # is safe to deactivate. This prevents an infra refresh immediately
      # followed by an ACA deploy from leaving a third active slot around,
      # while still allowing the next ACA deployment to inherit the latest
      # template/secrets state. Never touch a revision that existed before
      # this infra run, and never touch anything carrying traffic.
      - name: Deactivate infra-only zero-traffic revisions
        if: ${{ success() }}
        run: |
          cleanup_new_zero_traffic() {
            local app="$1"
            local before="$RUNNER_TEMP/aca-traffic/${app}-active-before.txt"
            [ -f "$before" ] || return 0

            mapfile -t new_zero < <(az containerapp revision list --name "$app" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active && properties.trafficWeight == \`0\`].name" -o tsv)

            for rev in "${new_zero[@]}"; do
              [ -z "$rev" ] && continue
              if grep -Fxq "$rev" "$before"; then
                continue
              fi
              echo "Deactivating infra-created zero-traffic revision $app/$rev"
              az containerapp revision deactivate --name "$app" --resource-group "$RESOURCE_GROUP" --revision "$rev" || \
                echo "::warning::Could not deactivate infra-created revision $app/$rev; it remains at 0% traffic."
            done
          }

          cleanup_new_zero_traffic backend
          cleanup_new_zero_traffic frontend

      - name: Show Bicep stack state
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          az stack group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$STACK_NAME" \
            --query "{stack:name,resourceGroup:resourceGroup,managedResourceCount:length(resources),resources:resources}" \
            -o json

  destroy-infra:
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    env:
      ENV_NAME: ${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      RESOURCE_GROUP: rg-snipeit-lite-${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
      STACK_NAME: snipeit-lite-${{ github.event.inputs.target == 'production' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify destroy confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.destroy_confirmation }}
        run: |
          set -euo pipefail
          expected="DESTROY-${{ github.event.inputs.target }}"
          if [ "$CONFIRMATION" != "$expected" ]; then
            echo "::error::Destroy is intentionally blocked. Enter '$expected' in destroy_confirmation."
            exit 1
          fi

      - name: Register deployment-stack provider
        run: |
          set -euo pipefail
          az provider register --namespace Microsoft.Resources --wait

      - name: Destroy preview and GitHub Summary
        id: destroy_preview
        run: |
          set -euo pipefail
          if ! az group show --name "$RESOURCE_GROUP" >/dev/null 2>&1; then
            {
              echo "## 🗑️ Bicep Destroy Plan — ${{ github.event.inputs.target }}"
              echo ''
              echo "Resource group **$RESOURCE_GROUP** does not exist."
              echo ''
              echo '**Resources scheduled for deletion:** 0'
              echo ''
              echo '> ✅ Nothing to destroy.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'nothing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! STACK_JSON=$(az stack group show --name "$STACK_NAME" --resource-group "$RESOURCE_GROUP" -o json 2>/dev/null); then
            {
              echo "## 🗑️ Bicep Destroy Plan — ${{ github.event.inputs.target }}"
              echo ''
              echo "Deployment stack **$STACK_NAME** does not exist."
              echo ''
              echo '**Resources scheduled for deletion:** 0'
              echo ''
              echo '> ✅ Nothing managed by this Bicep stack will be deleted.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'nothing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$STACK_JSON" > "$RUNNER_TEMP/stack.json"
          resource_count=$(jq '(.resources // []) | length' "$RUNNER_TEMP/stack.json")
          {
            echo "## ⚠️ Bicep Destroy Plan — ${{ github.event.inputs.target }}"
            echo ''
            echo "**Resource Group:** \`$RESOURCE_GROUP\`  "
            echo "**Deployment Stack:** \`$STACK_NAME\`  "
            echo ''
            echo '### Destruction Summary'
            echo ''
            echo '| Item | Value |'
            echo '|---|---:|'
            echo "| Managed resources scheduled for deletion | **$resource_count** |"
            echo '| Resource group | Retained |'
            echo ''
            echo '> ⚠️ **Destructive operation.** The stack is deleted with `action-on-unmanage=deleteResources`, so resources managed by this stack are deleted while the parent resource group is retained.'
            echo ''
            echo '### Resources'
            echo ''
            echo '| # | Resource ID |'
            echo '|---:|---|'
            jq -r '(.resources // []) | to_entries[] | "| \(.key + 1) | \(.value.id // .value.resourceId // .value) |"' "$RUNNER_TEMP/stack.json"
          } >> "$GITHUB_STEP_SUMMARY"

          echo '--- Managed resources scheduled for deletion ---'
          jq -r '(.resources // [])[] | .id // .resourceId // .' "$RUNNER_TEMP/stack.json"
          echo 'nothing=false' >> "$GITHUB_OUTPUT"

      - name: Destroy Bicep deployment stack
        if: ${{ steps.destroy_preview.outputs.nothing != 'true' }}
        run: |
          set -euo pipefail
          if ! az stack group show --name "$STACK_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Stack already absent; nothing to destroy."
            exit 0
          fi
          az stack group delete \
            --name "$STACK_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --action-on-unmanage deleteResources \
            --yes
          echo "All resources tracked by '$STACK_NAME' have been requested for deletion."
          echo "The resource group itself is intentionally retained."
