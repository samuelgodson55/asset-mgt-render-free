# .github/workflows/ci.yml
# -----------------------------------------------------------------------------
# Runs on every push and PR, to every branch -- the fast, no-deploy gate that
# has to pass before anything is even eligible for the Azure deploy workflows
# (deploy-azure-staging.yml on `develop`, deploy-azure-production.yml on
# `main`). Nothing here talks to Azure or requires any Azure secrets.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, test, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio httpx pip-audit

      - name: Ruff lint
        run: ruff check backend/

      # backend/tests/ now has real coverage (auth, asset pools, checkouts,
      # extension requests, notification-recipient audience, and role
      # permission gates -- see backend/tests/conftest.py's module
      # docstring for how it spins up an isolated throwaway SQLite database
      # per test). No longer `|| true`: a real test failure now fails CI.
      - name: Pytest
        run: pytest backend/tests -v

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit -r backend/requirements.txt --desc || true

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan-images:
    name: Build images + Trivy scan
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t snipeit-backend:ci ./backend

      - name: Build frontend image (staging profile -- bundled+minified, not obfuscated)
        run: |
          docker build -f nginx/Dockerfile --build-arg BUILD_ENV=development \
            -t snipeit-frontend:ci .

      - name: Trivy scan -- backend
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: snipeit-backend:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # report, don't hard-fail CI on findings -- tighten to '1' once the backlog is triaged
          format: 'table'

      - name: Trivy scan -- frontend
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: snipeit-frontend:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

  bicep-lint:
    name: Validate infra/main.bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: az bicep build (syntax + type check)
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
