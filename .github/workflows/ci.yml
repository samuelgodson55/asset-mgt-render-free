# .github/workflows/ci.yml
# -----------------------------------------------------------------------------
# Continuous Integration for Snipe-IT Lite. Runs on every push and every pull
# request against `main`. Four jobs:
#
#   lint      - ruff, fast, catches obvious mistakes before anything else runs
#   test      - spins up a real (throwaway) Postgres service container, runs
#               `alembic upgrade head` against it, then runs the pytest smoke
#               suite in backend/tests/ with the full app wired up against
#               that real database
#   docker    - builds the single production image from the root Dockerfile
#               (the same one Render builds from render.yaml), to catch a
#               broken Dockerfile/COPY path/missing dependency before a real
#               deploy ever attempts it
#   validate-deploy-configs - sanity-checks that render.yaml and
#               docker-compose.yml are both well-formed YAML and that
#               `docker compose config` can fully resolve docker-compose.yml
#
# None of this deploys anything -- Render's own GitHub integration (or a
# separate deploy workflow, if you set one up) handles deploys. This
# workflow's only job is to catch problems BEFORE they reach that step.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# If you push twice in quick succession, cancel the older, now-outdated run
# instead of letting both finish -- saves CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run ruff
        working-directory: backend
        # --exit-zero on the first pass would defeat the point of CI; this
        # genuinely fails the job on lint errors. Adjust backend/pyproject.toml
        # (or add one) if you want to tune ruff's rule set over time.
        run: ruff check .

  test:
    name: Backend smoke tests (pytest + real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snipeit_ci
          POSTGRES_PASSWORD: snipeit_ci_password
          POSTGRES_DB: snipeit_ci
        ports:
          - 5432:5432
        # Wait for Postgres to actually be ready before any step below tries
        # to connect -- same idea as docker-compose.yml's `healthcheck` +
        # `depends_on: condition: service_healthy`.
        options: >-
          --health-cmd "pg_isready -U snipeit_ci -d snipeit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mirrors .env.example / render.yaml's env var names -- same
      # backend/config.py Pydantic Settings reads either way.
      ENVIRONMENT: development
      DATABASE_URL: postgresql://snipeit_ci:snipeit_ci_password@localhost:5432/snipeit_ci
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-real
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_HOURS: "12"
      CORS_ORIGINS: ""
      ENABLE_API_DOCS: "true"
      AUTO_INIT_DB: "false" # alembic (below) owns schema creation in CI, not create_all()
      AUTO_SEED_DEMO_DATA: "true"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LOGIN_RATE_LIMIT_MAX: "5"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "15"
      SUPER_ADMIN_USERNAME: superadmin
      SUPER_ADMIN_NAME: Super Admin
      SUPER_ADMIN_PASSWORD: ci-only-password-not-used-anywhere-real
      NOTIFICATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run database migrations (alembic upgrade head)
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  docker:
    name: Docker build (production image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image from root Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          # Cache layers between CI runs via GitHub Actions' cache backend --
          # keeps repeat builds fast without needing a registry to push to.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: snipeit-lite:ci

  validate-deploy-configs:
    name: Validate render.yaml / docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install --no-cache-dir yamllint

      - name: Lint render.yaml
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" render.yaml

      - name: Lint docker-compose.yml
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" docker-compose.yml

      - name: Validate docker-compose.yml fully resolves
        # A placeholder .env is enough for `docker compose config` to
        # resolve every ${VARIABLE} reference -- this step isn't trying to
        # start the stack, just confirming the YAML + variable substitution
        # is internally consistent (e.g. no typo'd ${VARIABLE_NAME}).
        run: |
          cp .env.example .env
          docker compose config --quiet
