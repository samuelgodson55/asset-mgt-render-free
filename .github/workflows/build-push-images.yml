# .github/workflows/build-push-images.yml
# -----------------------------------------------------------------------------
# Reusable `workflow_call` workflow: the ONE place that knows how to build,
# tag, push, and Trivy-scan any of this repo's images -- backend, or either
# frontend flavor (frontend-react-only / frontend-legacy-only). Every
# pipeline that ships a real, deployable image -- release.yml (git-tag
# production releases, which now builds backend + BOTH frontend flavors,
# each under its own Docker Hub repo name), deploy-azure-vm.yml ("Deploy to
# VM": VM path, both vm-staging and prod, ONE frontend flavor per run,
# chosen by that run's `frontend_type` input/Environment variable), and
# deploy-azure-aca.yml ("Deploy to ACA": Container Apps path, same
# one-flavor-per-run shape) -- calls THIS workflow instead of running its
# own copy-pasted `docker build` matrix.
#
# WHY THIS EXISTS: before this file, the exact same "docker build -f
# <dockerfile> --build-arg BUILD_ENV=... -t <name>:<tag> ..." logic was
# copy-pasted across four separate workflow files. That's precisely how the
# BUILD_ENV bug happened (see release.yml's BUILD_ENV comment): a fix
# landed in one copy and not the others, so "the same" backend/frontend
# image silently differed depending on which pipeline happened to build it.
# Consolidating the build step here is what makes each shipped image a true
# invariant instead of a convention multiple files have to independently
# remember to honor.
#
# MATRIX-BY-INPUT, NOT A FIXED backend+frontend PAIR: this used to hardcode
# a two-entry matrix (exactly one backend image, exactly one frontend
# image). Now that there are TWO independent, mutually exclusive frontend
# flavors (see frontend/Dockerfile's own top-of-file comment for why the
# old single combined `frontend-final` target was removed) and different
# callers need different COMBINATIONS of images built in one call --
# release.yml wants backend + frontend-react + frontend-legacy all at once;
# the two deploy-azure-*.yml workflows want backend + exactly ONE frontend
# flavor, decided per-run -- the matrix itself is now caller-supplied as a
# JSON array (`build_matrix` below), one object per image to build. Each
# caller assembles exactly the set of images IT needs; this workflow no
# longer has any built-in opinion about which images go together.
#
# Every image gets OCI labels (version/revision/created/source) applied the
# same way regardless of which images a given call builds, for the same
# "don't let the copies drift" reason.
# -----------------------------------------------------------------------------
name: Build + push images (reusable)

on:
  workflow_call:
    inputs:
      build_matrix:
        description: >-
          JSON array of image definitions to build in this call. Each entry:
          {"service": "<label for logs/job names>",
           "dockerfile": "<path>", "context": "<build context>",
           "image_name": "<Docker Hub repo name WITHOUT the username>",
           "target": "<optional --target; omit/empty for images with no
             build stages, e.g. backend>"}.
          The full ref is built inside this workflow as
          "<DOCKERHUB_USERNAME secret>/<image_name>", since a workflow_call
          caller's `with:` block cannot itself reference the secrets
          context. Example (release.yml's shape -- backend once, both
          frontend flavors):
            [{"service":"backend","dockerfile":"backend/Dockerfile","context":"backend","image_name":"snipeit-lite-backend"},
             {"service":"frontend-react","dockerfile":"frontend/Dockerfile","context":".","target":"frontend-react-only","image_name":"snipeit-lite-frontend-react"},
             {"service":"frontend-legacy","dockerfile":"frontend/Dockerfile","context":".","target":"frontend-legacy-only","image_name":"snipeit-lite-frontend-legacy"}]
        required: true
        type: string
      image_tags:
        description: 'Space-separated list of tags to build once and push under -- e.g. "v1.4.2 abc1234 latest". Applied to EVERY image in build_matrix. The FIRST tag in the list is what gets Trivy-scanned (all tags point at the exact same image, so scanning one scans all of them).'
        required: true
        type: string
      build_env:
        description: 'frontend/Dockerfile''s BUILD_ENV build-arg: "production" (minified + obfuscated) or "development" (minified only) -- see that Dockerfile''s own comment. Only meaningful for the frontend-legacy-only target (frontend-react-only''s Vite build always does a real production build regardless of this value -- see frontend/Dockerfile''s frontend-app-build stage comment); passed to every matrix entry regardless, since an unconsumed --build-arg on an entry whose Dockerfile has no matching ARG (backend, frontend-react-only) is a harmless no-op.'
        required: true
        type: string
      version_label:
        description: 'Value for the org.opencontainers.image.version label -- typically the human-facing release/version string (falls back to the first image_tags entry if left blank).'
        required: false
        type: string
        default: ''
      trivy_blocking:
        description: 'If true, a CRITICAL finding (ignoring CVEs with no fix yet) fails this workflow. If false, CRITICAL findings are still scanned and printed, just non-blocking -- matches staging''s "report, don''t block" posture.'
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-push:
    name: Build + push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # fail-fast defaults to true, which would let one image's failure
      # cancel every other one mid-build/push even though each entry in
      # build_matrix is an entirely independent artifact -- one failing
      # tells you nothing about the others. See release.yml's own matching
      # comment (this is where that reasoning now lives).
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image name + primary tag
        id: img
        run: |
          echo "name=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"
          PRIMARY_TAG=$(echo "${{ inputs.image_tags }}" | awk '{print $1}')
          echo "primary_tag=$PRIMARY_TAG" >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.service }} image
        run: |
          set -euo pipefail
          TARGET_ARGS=()
          # matrix.target is only set for entries that name a real --target
          # (e.g. frontend-react-only/frontend-legacy-only) -- an entry
          # with no `target` key in build_matrix (e.g. backend, whose
          # Dockerfile has no stages at all) leaves this unset, and no
          # --target flag is passed at all in that case.
          if [ -n "${{ matrix.target || '' }}" ]; then
            TARGET_ARGS+=(--target "${{ matrix.target }}")
          fi

          TAG_ARGS=()
          for TAG in ${{ inputs.image_tags }}; do
            TAG_ARGS+=(-t "${{ steps.img.outputs.name }}:$TAG")
          done

          docker build -f ${{ matrix.dockerfile }} \
                       --build-arg "BUILD_ENV=${{ inputs.build_env }}" \
                       "${TARGET_ARGS[@]}" \
                       --label org.opencontainers.image.version="${{ inputs.version_label != '' && inputs.version_label || steps.img.outputs.primary_tag }}" \
                       --label org.opencontainers.image.revision="${{ github.sha }}" \
                       --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                       --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
                       "${TAG_ARGS[@]}" \
                       ${{ matrix.context }}

          for TAG in ${{ inputs.image_tags }}; do
            docker push "${{ steps.img.outputs.name }}:$TAG"
          done

      - name: Trivy scan (CRITICAL, ignoring CVEs with no fix yet)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ steps.img.outputs.primary_tag }}
          severity: 'CRITICAL'
          exit-code: ${{ inputs.trivy_blocking && '1' || '0' }}
          ignore-unfixed: true
          format: 'table'

      - name: Trivy scan (HIGH, report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ steps.img.outputs.primary_tag }}
          severity: 'HIGH'
          exit-code: '0'
          format: 'table'
