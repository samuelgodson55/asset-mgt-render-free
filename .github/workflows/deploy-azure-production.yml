# .github/workflows/deploy-azure-production.yml
# -----------------------------------------------------------------------------
# THE production rollout pipeline -- migrate, then roll out both already-built
# images, then smoke test, with automatic rollback on failure.
#
# TRIGGER CHANGE: this workflow is NO LONGER triggered by `push: branches:
# [main]`. Production releases are now cut by pushing a `git tag v1.x.x`
# (see release.yml), which builds + Trivy-scans + pushes both images tagged
# with that VERSION (not just a commit SHA), updates CHANGELOG.md, cuts a
# GitHub Release, and only then calls this workflow (`uses:
# ./.github/workflows/deploy-azure-production.yml`) to actually deploy the
# already-pushed `image_tag` to Azure. That's why this file only declares
# `workflow_call` / `workflow_dispatch` triggers below -- it doesn't build or
# push anything itself anymore, it just migrates + deploys whatever version
# tag it's told to (see DEPLOYMENT.md's "Rollback" section for how
# `workflow_dispatch` + an older `image_tag` doubles as the recommended
# rollback path, reusing this same migrate -> deploy -> smoke-test ->
# auto-rollback machinery instead of raw `az containerapp update` commands).
#
# COST-OPTIMIZED SHAPE: `frontend`, `backend`, `redis` (Container Apps) +
# Azure Database for PostgreSQL Flexible Server (`postgresServer`, a managed
# service, NOT a Container App) -- see infra/main.bicep's top-of-file
# comment. TWO custom images: `backend` (backend/Dockerfile) and `frontend`
# (frontend/Dockerfile, unmodified from local Docker Compose). `redis` runs
# the official Redis image pulled straight from Docker Hub and is never
# rebuilt here; Postgres has no image to rebuild at all -- it's a PaaS
# resource, patched by Azure itself.
#
# Stages (given an `image_tag` that release.yml has already built & pushed):
#   1. Run `alembic upgrade head` as a Container Apps Job, using the NEW
#      backend image -- BEFORE either new image rolls out, against the OLD
#      still-live `backend`/`frontend`
#   2. Roll BOTH new images out (Container Apps' Single revision mode does
#      the health-probed rolling replacement automatically for each --
#      see infra/main.bicep's `probes` blocks)
#   3. Smoke test against the live `frontend` FQDN (which also proves
#      `backend` is reachable through it -- see the /api/auth/me check)
#   4. Roll back automatically if the smoke test fails
#
# `redis` and `postgresServer` are NOT touched by this pipeline -- `redis`
# runs a fixed official image and only changes when infra/main.bicep itself
# changes (see infra-deploy.yml); `postgresServer` is a managed service with
# no image or Container App revision to roll at all.
# -----------------------------------------------------------------------------
name: Deploy to Azure (Production)

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy, e.g. v1.4.2 (must already exist on Docker Hub -- see release.yml)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy, e.g. v1.4.2 (must already exist on Docker Hub) -- use this for a manual redeploy or a rollback to an older version; see DEPLOYMENT.md "Rollback"'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy mid-flight -- let it finish or fail cleanly

permissions:
  id-token: write # OIDC federated Azure login -- no client secret stored in GitHub
  contents: read

env:
  RESOURCE_GROUP: ${{ secrets.PROD_RESOURCE_GROUP }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-frontend

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    # AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are configured
    # as per-environment secrets (see DEPLOYMENT.md step 5's table --
    # deliberately per-environment since staging and production use
    # separate Azure AD App Registrations/federated credentials). GitHub
    # only injects an Environment's secrets into a job that declares
    # `environment:` -- without this, those three `secrets.AZURE_*`
    # references silently resolve to empty strings, and azure/login@v2
    # fails at runtime with "Not all values are present. Ensure
    # 'client-id' and 'tenant-id' are supplied" even though the secrets
    # exist and are correctly named. See deploy-azure-staging.yml's
    # matching jobs for the same fix.
    environment: production
    steps:
      - name: Validate image_tag looks like a version tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::warning::image_tag '$IMAGE_TAG' doesn't look like a v*.*.* version tag -- continuing anyway (useful for hotfix/manual tags), but double check this is intentional."
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the migrate job at the new backend image
        run: |
          az containerapp job update \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Run alembic upgrade head (against the OLD, still-live `backend`)
        run: |
          az containerapp job start --name migrate --resource-group "$RESOURCE_GROUP" --output json > job-run.json
          EXECUTION_NAME=$(jq -r '.name' job-run.json)
          echo "Started migration execution: $EXECUTION_NAME"

      # infra/main.bicep's `migrateJob` is configured with `replicaTimeout:
      # 600` (10 minutes) -- Azure itself won't kill a healthy execution
      # before that. This loop used to give up after 5 minutes (30 x 10s),
      # which is SHORTER than the job's own timeout: a migration that's
      # still legitimately "Running" past the 5-minute mark (e.g. the
      # 0010_partition_audit_logs.py backfill on a larger table, or a slow
      # cold pull of the backend image) got reported as "timed out" by this
      # workflow even though Azure would have let it keep going. Polling
      # window is now 45 x 15s = 675s, a bit past the job's 600s
      # replicaTimeout so Azure's own timeout is always what actually fires
      # first, plus headroom for the job to be scheduled/start pulling its
      # image before its first status even shows up here.
      - name: Wait for migration to complete
        run: |
          for i in $(seq 1 45); do
            STATUS=$(az containerapp job execution list \
              --name migrate --resource-group "$RESOURCE_GROUP" \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ]; then echo "::error::Migration failed"; exit 1; fi
            sleep 15
          done
          echo "::error::Migration did not reach Succeeded/Failed within 675s (job's own replicaTimeout is 600s, so this means Azure itself hasn't resolved it yet -- check the job's execution logs, it may still be genuinely stuck)"
          exit 1

      # Runs on both a genuine "Failed" status above and the 675s
      # poll-timeout fallback, so you get the actual `alembic upgrade
      # head` output (which line failed, or where it's hanging) right in
      # the workflow log instead of having to go find it in the Azure
      # Portal / `az containerapp job logs show` by hand after the fact.
      - name: Dump migration job logs (on failure)
        if: failure()
        run: |
          EXECUTION_NAME=$(az containerapp job execution list \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" -o tsv)
          echo "::group::migrate job execution: $EXECUTION_NAME"
          az containerapp job execution show \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --job-execution-name "$EXECUTION_NAME" -o json || true
          echo "::endgroup::"
          echo "::group::migrate container logs"
          az containerapp job logs show \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --container migrate --tail 200 || \
            echo "Could not fetch logs via 'az containerapp job logs show' -- check Log Analytics (workspace: \${namePrefix}-logs) or the Azure Portal's 'migrate' Container Apps Job > Execution history directly."
          echo "::endgroup::"

  deploy:
    name: Roll out new revisions
    needs: [migrate]
    runs-on: ubuntu-latest
    # See the `migrate` job's comment above -- same per-environment
    # AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID secrets, same
    # requirement to declare `environment:` to actually receive them.
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot currently-live images (for rollback)
        id: previous
        run: |
          PREV_BACKEND=$(az containerapp show --name backend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.template.containers[0].image" -o tsv)
          PREV_FRONTEND=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.template.containers[0].image" -o tsv)
          echo "backend_image=$PREV_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$PREV_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Currently-live before this deploy: backend=$PREV_BACKEND frontend=$PREV_FRONTEND"

      # Container Apps' Single revision mode replaces replicas gradually and
      # only routes traffic to new replicas once their readiness probe
      # passes (see infra/main.bicep's `probes` blocks) -- this IS the
      # rolling update for each app; no extra orchestration needed. `redis`
      # and `postgresServer` are never touched by this step. `backend` is
      # updated first so `frontend`'s proxy target is already correct by
      # the time `frontend` itself rolls out.
      - name: Update backend
        run: |
          az containerapp update --name backend --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            READY=$(az containerapp revision list --name backend --resource-group "$RESOURCE_GROUP" \
                      --query "[?properties.active].properties.healthState | [0]" -o tsv)
            echo "backend health state: $READY"
            [ "$READY" = "Healthy" ] && break
            sleep 10
          done

      - name: Update frontend
        run: |
          az containerapp update --name frontend --resource-group "$RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Wait for frontend readiness
        run: |
          for i in $(seq 1 30); do
            READY=$(az containerapp revision list --name frontend --resource-group "$RESOURCE_GROUP" \
                      --query "[?properties.active].properties.healthState | [0]" -o tsv)
            echo "frontend health state: $READY"
            [ "$READY" = "Healthy" ] && exit 0
            sleep 10
          done
          echo "::error::frontend did not become healthy in time"
          exit 1

      - name: Smoke test (through `frontend`'s public origin, proving the whole chain works)
        id: smoke
        run: |
          FQDN=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Testing https://$FQDN"
          curl -f -o /dev/null -w "%{http_code}" "https://$FQDN/" | grep -q 200 || exit 1
          # Hits backend THROUGH frontend's reverse proxy -- proves nginx's
          # /api/ location block is actually reaching `backend` internally,
          # not just that frontend serves static files.
          curl -f "https://$FQDN/api/auth/me" -o /dev/null -w "%{http_code}" | grep -qE "200|401" || exit 1

      - name: Roll back on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Smoke test failed -- rolling back both apps to what was live before this run ($IMAGE_TAG)"
          az containerapp update --name backend --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.backend_image }}"
          az containerapp update --name frontend --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.frontend_image }}"
          exit 1

      - name: Record deployed version
        if: success()
        run: |
          echo "Deployed $IMAGE_TAG to $RESOURCE_GROUP (backend + frontend)."
          echo "### Deployed to production :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Previously live:** \`${{ steps.previous.outputs.backend_image }}\` / \`${{ steps.previous.outputs.frontend_image }}\`" >> "$GITHUB_STEP_SUMMARY"
