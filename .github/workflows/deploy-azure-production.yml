# .github/workflows/deploy-azure-production.yml
# -----------------------------------------------------------------------------
# THE "push to main -> it's live" pipeline. Triggered on every push/merge to
# `main` -- no manual steps once this is set up, matching docker-compose.yml's
# original DEPLOYMENT.md promotion pipeline, just re-targeted at Azure
# Container Apps instead of SSH + `docker compose up -d`.
#
# Stages (mirrors DEPLOYMENT.md's "The pipeline, branch by branch" section):
#   1. Build backend + frontend images (frontend built bundled+minified+
#      OBFUSCATED -- BUILD_ENV=production, see nginx/Dockerfile's build-arg)
#   2. Push both to Azure Container Registry, tagged with the commit SHA
#   3. Trivy scan both images (blocking on CRITICAL findings in prod, unlike CI's report-only scan)
#   4. Run `alembic upgrade head` as a Container Apps Job -- BEFORE the new
#      image rolls out, against the OLD containers, exactly like
#      docker-compose.yml's original "migrate before you swap" rule
#   5. Roll the new image out to backend, worker, beat, frontend
#      (Container Apps' Single revision mode does this as a health-probed
#      rolling replacement automatically -- see infra/main.bicep's `probes`)
#   6. Smoke test against the live frontend FQDN
#   7. Roll back automatically if the smoke test fails
# -----------------------------------------------------------------------------
name: Deploy to Azure (Production)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy mid-flight -- let it finish or fail cleanly

permissions:
  id-token: write # OIDC federated Azure login -- no client secret stored in GitHub
  contents: read

env:
  RESOURCE_GROUP: ${{ secrets.PROD_RESOURCE_GROUP }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push-scan:
    name: Build, push, scan images
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      acr-login-server: ${{ steps.acr.outputs.login_server }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        id: acr
        run: |
          SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          echo "login_server=$SERVER" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name "$(echo ${{ steps.acr.outputs.login_server }} | cut -d. -f1)"

      - name: Build + push backend image
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/snipeit-backend:$IMAGE_TAG \
                       -t ${{ steps.acr.outputs.login_server }}/snipeit-backend:latest \
                       ./backend
          docker push ${{ steps.acr.outputs.login_server }}/snipeit-backend:$IMAGE_TAG
          docker push ${{ steps.acr.outputs.login_server }}/snipeit-backend:latest

      - name: Build + push frontend image (bundled + minified + OBFUSCATED)
        run: |
          docker build -f nginx/Dockerfile --build-arg BUILD_ENV=production \
                       -t ${{ steps.acr.outputs.login_server }}/snipeit-frontend:$IMAGE_TAG \
                       -t ${{ steps.acr.outputs.login_server }}/snipeit-frontend:latest .
          docker push ${{ steps.acr.outputs.login_server }}/snipeit-frontend:$IMAGE_TAG
          docker push ${{ steps.acr.outputs.login_server }}/snipeit-frontend:latest

      - name: Trivy scan -- backend (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.acr.outputs.login_server }}/snipeit-backend:${{ env.IMAGE_TAG }}
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Trivy scan -- frontend (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.acr.outputs.login_server }}/snipeit-frontend:${{ env.IMAGE_TAG }}
          severity: 'CRITICAL'
          exit-code: '1'

  migrate:
    name: Run database migrations
    needs: [build-push-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the migrate job at the new image
        run: |
          az containerapp job update \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build-push-scan.outputs.acr-login-server }}/snipeit-backend:$IMAGE_TAG"

      - name: Run alembic upgrade head (against the OLD, still-live containers)
        run: |
          az containerapp job start --name migrate --resource-group "$RESOURCE_GROUP" --output json > job-run.json
          EXECUTION_NAME=$(jq -r '.name' job-run.json)
          echo "Started migration execution: $EXECUTION_NAME"

      - name: Wait for migration to complete
        run: |
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution list \
              --name migrate --resource-group "$RESOURCE_GROUP" \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ]; then echo "::error::Migration failed"; exit 1; fi
            sleep 10
          done
          echo "::error::Migration timed out after 5 minutes"
          exit 1

  deploy:
    name: Roll out new revision
    needs: [build-push-scan, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot currently-live image (for rollback)
        id: previous
        run: |
          PREV=$(az containerapp show --name backend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.template.containers[0].image" -o tsv)
          echo "backend_image=$PREV" >> "$GITHUB_OUTPUT"

      # Container Apps' Single revision mode replaces replicas gradually and
      # only routes traffic to new replicas once their readiness probe
      # (see infra/main.bicep's `probes` block, GET /healthz) passes -- this
      # IS the rolling update; no extra orchestration needed here.
      - name: Update backend
        run: |
          az containerapp update --name backend --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build-push-scan.outputs.acr-login-server }}/snipeit-backend:$IMAGE_TAG"

      - name: Update worker
        run: |
          az containerapp update --name worker --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build-push-scan.outputs.acr-login-server }}/snipeit-backend:$IMAGE_TAG"

      - name: Update beat
        run: |
          az containerapp update --name beat --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build-push-scan.outputs.acr-login-server }}/snipeit-backend:$IMAGE_TAG"

      - name: Update frontend
        run: |
          az containerapp update --name frontend --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build-push-scan.outputs.acr-login-server }}/snipeit-frontend:$IMAGE_TAG"

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            READY=$(az containerapp revision list --name backend --resource-group "$RESOURCE_GROUP" \
                      --query "[?properties.active].properties.healthState | [0]" -o tsv)
            echo "Backend health state: $READY"
            [ "$READY" = "Healthy" ] && exit 0
            sleep 10
          done
          echo "::error::backend did not become healthy in time"
          exit 1

      - name: Smoke test
        id: smoke
        run: |
          FQDN=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Testing https://$FQDN"
          curl -f "https://$FQDN/healthz" || exit 1
          curl -f -o /dev/null -w "%{http_code}" "https://$FQDN/" | grep -q 200 || exit 1

      - name: Roll back backend on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Smoke test failed -- rolling back to ${{ steps.previous.outputs.backend_image }}"
          az containerapp update --name backend --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.backend_image }}"
          az containerapp update --name worker --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.backend_image }}"
          az containerapp update --name beat --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.backend_image }}"
          exit 1
