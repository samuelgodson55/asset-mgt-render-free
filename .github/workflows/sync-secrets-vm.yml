# .github/workflows/sync-secrets-vm.yml
# -----------------------------------------------------------------------------
# Pushes CURRENT GitHub Environment secrets/variables onto an ALREADY
# RUNNING VM's /opt/snipeit/.env, then restarts only the containers whose
# effective config actually changed. Exists specifically because
# infra-vm/cloud-init.yaml's write_files only ever runs on a VM's FIRST
# boot (see infra-vm/main.tf's `lifecycle.ignore_changes = [custom_data]`)
# -- re-running infra-deploy-vm.yml's `apply` after changing a secret
# updates Terraform's OWN record of it, but never reaches an already-
# provisioned VM on its own. This workflow is that missing "reach the
# running VM" step, callable any time, as many times as you want --
# GitHub has no "a secret changed" trigger to hook into automatically, so
# "continuous" here means "re-run this whenever you've changed a secret",
# not a background poller.
#
# Deliberately reads from the SAME secret/variable names
# infra-deploy-vm.yml already uses (see that workflow's `env:` block) --
# one source of truth, so a value you set once is correct whether it
# reaches the app via a fresh VM's cloud-init OR via this workflow against
# an existing one.
#
# DOMAIN, IMAGE_TAG, and CLOUDFLARE_TUNNEL_TOKEN are deliberately EXCLUDED
# from what this workflow writes -- DOMAIN is set once by Terraform/cloud-init
# from custom_domain and never changes on its own; IMAGE_TAG is owned by
# deploy-azure-vm.yml; CLOUDFLARE_TUNNEL_TOKEN is tied to the specific
# Cloudflare Tunnel Terraform created for THIS VM, and rotating it is a
# `terraform taint`+`apply` operation, not something this workflow should
# ever silently overwrite. All three are read back from the EXISTING .env
# and re-inserted untouched, so running this workflow can never
# accidentally roll back a deploy, break Caddy's TLS domain, or sever the
# Tunnel.
#
# Reaches the VM the same way deploy-azure-vm.yml does: installs
# `cloudflared` locally and SSHes to VM_HOST (the VM's ssh.<domain> Tunnel
# hostname) through a ProxyCommand authenticated as a Cloudflare Access
# service token (CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET secrets) --
# not its public IP; there is nothing listening on port 22 at the public
# IP by default. See DEPLOYMENT_VM.md's "Set up Cloudflare Tunnel" section.
# -----------------------------------------------------------------------------
name: Sync secrets to Azure VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment''s VM to update. "vm-staging", not "staging" -- see deploy-azure-vm.yml''s identical `environment` input description for why this is deliberately not the Container Apps path''s "staging" GitHub Environment.'
        required: true
        type: choice
        options: [vm-staging, prod]
        default: prod
      restart_services:
        description: 'Which containers to recreate after writing the new .env. "auto" only touches services whose config actually changed (recommended); "all" force-recreates everything (brief full downtime); "none" just writes .env without restarting anything (apply manually later).'
        required: true
        type: choice
        options: [auto, all, none]
        default: auto

concurrency:
  group: sync-secrets-vm-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync secrets (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
      # ---- Every secret/variable that lands in /opt/snipeit/.env, EXCEPT
      # DOMAIN, IMAGE_TAG, and CLOUDFLARE_TUNNEL_TOKEN (see this file's top
      # comment and the "Read back" step below for why) -- kept in the
      # exact same order as infra-vm/cloud-init.yaml's write_files entry
      # for .env, so a diff between the two is easy to eyeball whenever
      # either one changes. ----
      DOCKERHUB_BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend${{ inputs.environment == 'vm-staging' && '-staging' || '' }}
      DOCKERHUB_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-frontend${{ inputs.environment == 'vm-staging' && '-staging' || '' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'admin' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'asset_db' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      ERRORBEACON_API_KEY: ${{ secrets.ERRORBEACON_API_KEY }}
      ERRORBEACON_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/errorbeacon-lite
      ERRORBEACON_IMAGE_TAG: ${{ vars.ERRORBEACON_IMAGE_TAG || 'latest' }}
      ERRORBEACON_TELEGRAM_BOT_TOKEN: ${{ secrets.ERRORBEACON_TELEGRAM_BOT_TOKEN }}
      ERRORBEACON_TELEGRAM_CHAT_ID: ${{ secrets.ERRORBEACON_TELEGRAM_CHAT_ID }}
      ERRORBEACON_TELEGRAM_THREAD_ID: ${{ vars.ERRORBEACON_TELEGRAM_THREAD_ID }}
      ERRORBEACON_GEMINI_API_KEY: ${{ secrets.ERRORBEACON_GEMINI_API_KEY }}
      ERRORBEACON_GEMINI_MODEL: ${{ vars.ERRORBEACON_GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      ERRORBEACON_GEMINI_FALLBACK_MODEL: ${{ vars.ERRORBEACON_GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
      ERRORBEACON_GROQ_API_KEY: ${{ secrets.ERRORBEACON_GROQ_API_KEY }}
      ERRORBEACON_GROQ_MODEL: ${{ vars.ERRORBEACON_GROQ_MODEL || 'llama-3.1-8b-instant' }}
      ERRORBEACON_OPENROUTER_API_KEY: ${{ secrets.ERRORBEACON_OPENROUTER_API_KEY }}
      ERRORBEACON_OPENROUTER_MODEL: ${{ vars.ERRORBEACON_OPENROUTER_MODEL || 'openrouter/free' }}
      # No separate ERRORBEACON_OPENROUTER_SITE_URL variable -- redundant
      # with CUSTOM_DOMAIN. Unlike the ACA path there's no need to even
      # reference CUSTOM_DOMAIN here directly: DOMAIN (read back from the
      # VM's existing .env in the "Read back" step below) already IS the
      # deployed custom_domain Terraform/cloud-init wrote on first boot --
      # see the "Render new .env" step's OPENROUTER_SITE_URL=https://$DOMAIN
      # line, same pattern as its neighboring CORS_ORIGINS=https://$DOMAIN.
      ERRORBEACON_APP: ${{ vars.ERRORBEACON_APP || 'asset-inventory-quotes' }}
      JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM || 'HS256' }}
      JWT_EXPIRY_HOURS: ${{ vars.JWT_EXPIRY_HOURS || '12' }}
      SITE_NAME: ${{ vars.SITE_NAME || 'Snipe-IT Lite' }}
      ENABLE_API_DOCS: ${{ vars.ENABLE_API_DOCS || 'false' }}
      ROOT_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ROOT_ADMIN_BOOTSTRAP_PASSWORD }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      ADMIN_NOTIFICATION_EMAILS: ${{ secrets.ADMIN_NOTIFICATION_EMAILS }}
      DISPLAY_TIMEZONE: ${{ vars.DISPLAY_TIMEZONE || 'Africa/Lagos' }}
      CURRENCY_CODE: ${{ vars.CURRENCY_CODE || 'NGN' }}
      ENABLE_AUTO_BACKUP: ${{ vars.ENABLE_AUTO_BACKUP || 'true' }}
      BACKUP_GDRIVE_ENABLED: ${{ vars.BACKUP_GDRIVE_ENABLED || 'false' }}
      BACKUP_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_ID }}
      BACKUP_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_SECRET }}
      BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN }}
      BACKUP_GDRIVE_FOLDER_ID: ${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}
      # ---- Distributed tracing (OpenTelemetry) -- see infra-vm/variables.tf's
      # otel_* variables and docker-compose.vm.yml's `jaeger` service for
      # the full comment. Off by default. ----
      OTEL_ENABLED: ${{ vars.OTEL_ENABLED || 'false' }}
      OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME || 'snipeit-lite-backend' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT || 'http://jaeger:4318' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_TRACES_SAMPLE_RATIO: ${{ vars.OTEL_TRACES_SAMPLE_RATIO || '1.0' }}
      OTEL_CONSOLE_EXPORTER: ${{ vars.OTEL_CONSOLE_EXPORTER || 'false' }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      # ---- Per-service memory ceilings -- see docker-compose.vm.yml's
      # top comment. Override any of these as Environment Variables if
      # this environment needs different sizing than the shared default. ----
      DB_MEM_LIMIT: ${{ vars.DB_MEM_LIMIT || '768m' }}
      DB_MEM_RESERVATION: ${{ vars.DB_MEM_RESERVATION || '256m' }}
      REDIS_MEM_LIMIT: ${{ vars.REDIS_MEM_LIMIT || '256m' }}
      REDIS_MEM_RESERVATION: ${{ vars.REDIS_MEM_RESERVATION || '128m' }}
      BACKEND_MEM_LIMIT: ${{ vars.BACKEND_MEM_LIMIT || '768m' }}
      BACKEND_MEM_RESERVATION: ${{ vars.BACKEND_MEM_RESERVATION || '256m' }}
      WORKER_MEM_LIMIT: ${{ vars.WORKER_MEM_LIMIT || '640m' }}
      WORKER_MEM_RESERVATION: ${{ vars.WORKER_MEM_RESERVATION || '256m' }}
      BEAT_MEM_LIMIT: ${{ vars.BEAT_MEM_LIMIT || '128m' }}
      BEAT_MEM_RESERVATION: ${{ vars.BEAT_MEM_RESERVATION || '64m' }}
      FRONTEND_MEM_LIMIT: ${{ vars.FRONTEND_MEM_LIMIT || '128m' }}
      FRONTEND_MEM_RESERVATION: ${{ vars.FRONTEND_MEM_RESERVATION || '64m' }}
      CADDY_MEM_LIMIT: ${{ vars.CADDY_MEM_LIMIT || '160m' }}
      CADDY_MEM_RESERVATION: ${{ vars.CADDY_MEM_RESERVATION || '64m' }}
      # CORS_ORIGINS depends on DOMAIN, which this workflow reads back
      # from the VM rather than owning itself (see top comment) -- built
      # on the VM side in the "Render + write new .env" step below,
      # once the real DOMAIN value is known.

    steps:
      - name: Validate required secrets are present
        run: |
          missing=()
          [ -z "$VM_HOST" ] && missing+=("VM_HOST")
          [ -z "$VM_SSH_USER" ] && missing+=("VM_SSH_USER")
          [ -z "$POSTGRES_PASSWORD" ] && missing+=("POSTGRES_PASSWORD")
          [ -z "$JWT_SECRET_KEY" ] && missing+=("JWT_SECRET_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s) for the '${{ inputs.environment }}' Environment: ${missing[*]}"
            exit 1
          fi

      - name: Install cloudflared
        # See deploy-azure-vm.yml's identical step for the full rationale --
        # PINNED to 2026.5.1, not `releases/latest`, to avoid the 2026.6.0
        # service-token regression (cloudflare/cloudflared#1673) that makes
        # `access ssh` fail non-interactively with what ssh/scp report as
        # "remote error: tls: handshake failure".
        env:
          CLOUDFLARED_VERSION: '2026.5.1'
        run: |
          curl -fsSL --output /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Set up SSH (proxied through Cloudflare Access)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<SSHCONFIG
          Host $VM_HOST
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Read back DOMAIN + IMAGE_TAG + CLOUDFLARE_TUNNEL_TOKEN from the VM's existing .env
        id: existing
        run: |
          EXISTING=$(ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" "cat /opt/snipeit/.env")
          DOMAIN=$(echo "$EXISTING" | grep '^DOMAIN=' | head -1 | cut -d= -f2-)
          IMAGE_TAG=$(echo "$EXISTING" | grep '^IMAGE_TAG=' | head -1 | cut -d= -f2-)
          CLOUDFLARE_TUNNEL_TOKEN=$(echo "$EXISTING" | grep '^CLOUDFLARE_TUNNEL_TOKEN=' | head -1 | cut -d= -f2-)
          if [ -z "$DOMAIN" ]; then
            echo "::error::Could not read an existing DOMAIN= from /opt/snipeit/.env on $VM_HOST -- is this VM actually provisioned? Run infra-deploy-vm.yml first."
            exit 1
          fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "cloudflare_tunnel_token=$CLOUDFLARE_TUNNEL_TOKEN" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG:-latest}" >> "$GITHUB_OUTPUT"
          echo "Preserving existing DOMAIN=$DOMAIN and IMAGE_TAG=${IMAGE_TAG:-latest} untouched."

      - name: Render new .env
        env:
          DOMAIN: ${{ steps.existing.outputs.domain }}
          IMAGE_TAG: ${{ steps.existing.outputs.image_tag }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ steps.existing.outputs.cloudflare_tunnel_token }}
        run: |
          cat > new.env <<ENVEOF
          # Rewritten by sync-secrets-vm.yml on $(date -u +%Y-%m-%dT%H:%M:%SZ) for environment "${{ inputs.environment }}".
          # DOMAIN, IMAGE_TAG, and CLOUDFLARE_TUNNEL_TOKEN are preserved
          # from the VM's own prior .env -- this workflow never sets any
          # of the three (see this file's top comment).
          DOMAIN=$DOMAIN
          CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
          IMAGE_TAG=$IMAGE_TAG
          DOCKERHUB_BACKEND_IMAGE=$DOCKERHUB_BACKEND_IMAGE
          DOCKERHUB_FRONTEND_IMAGE=$DOCKERHUB_FRONTEND_IMAGE

          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB

          JWT_SECRET_KEY=$JWT_SECRET_KEY
          ERRORBEACON_API_KEY=$ERRORBEACON_API_KEY
          ERRORBEACON_IMAGE=$ERRORBEACON_IMAGE
          ERRORBEACON_IMAGE_TAG=$ERRORBEACON_IMAGE_TAG
          TELEGRAM_BOT_TOKEN=$ERRORBEACON_TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$ERRORBEACON_TELEGRAM_CHAT_ID
          TELEGRAM_THREAD_ID=$ERRORBEACON_TELEGRAM_THREAD_ID
          GEMINI_API_KEY=$ERRORBEACON_GEMINI_API_KEY
          GEMINI_MODEL=$ERRORBEACON_GEMINI_MODEL
          GEMINI_FALLBACK_MODEL=$ERRORBEACON_GEMINI_FALLBACK_MODEL
          GROQ_API_KEY=$ERRORBEACON_GROQ_API_KEY
          GROQ_MODEL=$ERRORBEACON_GROQ_MODEL
          OPENROUTER_API_KEY=$ERRORBEACON_OPENROUTER_API_KEY
          OPENROUTER_MODEL=$ERRORBEACON_OPENROUTER_MODEL
          OPENROUTER_SITE_URL=https://$DOMAIN
          JWT_ALGORITHM=$JWT_ALGORITHM
          JWT_EXPIRY_HOURS=$JWT_EXPIRY_HOURS

          CORS_ORIGINS=https://$DOMAIN
          SITE_NAME=$SITE_NAME
          ENABLE_API_DOCS=$ENABLE_API_DOCS
          ERRORBEACON_APP=$ERRORBEACON_APP

          SUPER_ADMIN_USERNAME=superadmin
          SUPER_ADMIN_NAME=Super Admin
          ROOT_ADMIN_BOOTSTRAP_PASSWORD=$ROOT_ADMIN_BOOTSTRAP_PASSWORD

          NOTIFICATIONS_ENABLED=$NOTIFICATIONS_ENABLED
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USERNAME=$SMTP_USERNAME
          SMTP_PASSWORD=$SMTP_PASSWORD
          SMTP_USE_TLS=true
          SMTP_USE_SSL=false
          SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL
          ADMIN_NOTIFICATION_EMAILS=$ADMIN_NOTIFICATION_EMAILS

          DISPLAY_TIMEZONE=$DISPLAY_TIMEZONE
          CURRENCY_CODE=$CURRENCY_CODE

          ENABLE_AUTO_BACKUP=$ENABLE_AUTO_BACKUP
          BACKUP_GDRIVE_ENABLED=$BACKUP_GDRIVE_ENABLED
          BACKUP_GDRIVE_OAUTH_CLIENT_ID=$BACKUP_GDRIVE_OAUTH_CLIENT_ID
          BACKUP_GDRIVE_OAUTH_CLIENT_SECRET=$BACKUP_GDRIVE_OAUTH_CLIENT_SECRET
          BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN=$BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN
          BACKUP_GDRIVE_FOLDER_ID=$BACKUP_GDRIVE_FOLDER_ID

          OTEL_ENABLED=$OTEL_ENABLED
          OTEL_SERVICE_NAME=$OTEL_SERVICE_NAME
          OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT
          OTEL_EXPORTER_OTLP_HEADERS=$OTEL_EXPORTER_OTLP_HEADERS
          OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
          OTEL_TRACES_SAMPLE_RATIO=$OTEL_TRACES_SAMPLE_RATIO
          OTEL_CONSOLE_EXPORTER=$OTEL_CONSOLE_EXPORTER
          APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING

          DB_MEM_LIMIT=$DB_MEM_LIMIT
          DB_MEM_RESERVATION=$DB_MEM_RESERVATION
          REDIS_MEM_LIMIT=$REDIS_MEM_LIMIT
          REDIS_MEM_RESERVATION=$REDIS_MEM_RESERVATION
          BACKEND_MEM_LIMIT=$BACKEND_MEM_LIMIT
          BACKEND_MEM_RESERVATION=$BACKEND_MEM_RESERVATION
          WORKER_MEM_LIMIT=$WORKER_MEM_LIMIT
          WORKER_MEM_RESERVATION=$WORKER_MEM_RESERVATION
          BEAT_MEM_LIMIT=$BEAT_MEM_LIMIT
          BEAT_MEM_RESERVATION=$BEAT_MEM_RESERVATION
          FRONTEND_MEM_LIMIT=$FRONTEND_MEM_LIMIT
          FRONTEND_MEM_RESERVATION=$FRONTEND_MEM_RESERVATION
          CADDY_MEM_LIMIT=$CADDY_MEM_LIMIT
          CADDY_MEM_RESERVATION=$CADDY_MEM_RESERVATION
          ENVEOF
          echo "Rendered new.env ($(wc -l < new.env) lines)."

      - name: Diff against what's currently on the VM (informational)
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" "cat /opt/snipeit/.env" > current.env
          echo "::group::Keys that will change (values redacted)"
          diff <(cut -d= -f1 current.env | sort) <(cut -d= -f1 new.env | grep -v '^#' | grep -v '^$' | sort) || true
          diff \
            <(grep -v '^#' current.env | grep -v '^$' | sed 's/=.*/=<redacted>/' | sort) \
            <(grep -v '^#' new.env | grep -v '^$' | sed 's/=.*/=<redacted>/' | sort) \
            | grep '^[<>]' || echo "No key names differ -- only values changed (or nothing changed)."
          echo "::endgroup::"

      - name: Upload new.env to the VM
        run: |
          scp -i ~/.ssh/deploy_key new.env "$VM_SSH_USER@$VM_HOST:/opt/snipeit/.env.new"
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/snipeit
            cp .env ".env.bak.$(date +%Y%m%d-%H%M%S)"
            # Keep only the 5 most recent backups so these don't accumulate
            # forever on the data disk.
            ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm --
            mv .env.new .env
            chmod 600 .env
          EOF

      - name: Restart affected containers
        if: inputs.restart_services != 'none'
        run: |
          if [ "${{ inputs.restart_services }}" = "all" ]; then
            ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
              "cd /opt/snipeit && docker compose -f docker-compose.vm.yml up -d --force-recreate"
          else
            # "auto": plain `up -d` only recreates a container whose
            # resolved config (env, image, mem_limit, ...) actually
            # changed vs. what's currently running -- an unrelated key
            # changing (e.g. SMTP_HOST) never bounces db/frontend, only
            # whichever service(s) actually read that key.
            ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
              "cd /opt/snipeit && docker compose -f docker-compose.vm.yml up -d"
          fi

      - name: Smoke test
        if: inputs.restart_services != 'none'
        run: |
          DOMAIN="${{ steps.existing.outputs.domain }}"
          curl -f -s -S --connect-timeout 15 --max-time 60 \
               --retry 5 --retry-delay 5 --retry-connrefused --retry-max-time 300 \
               "https://$DOMAIN/api/auth/me" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               | grep -qE "200|401" || {
                 echo "::error::App did not come back healthy after the secrets sync -- check container status/logs on the VM. A backup of the previous .env was left at /opt/snipeit/.env.bak.* if you need to roll back."
                 exit 1
               }

      - name: Clean up local secret material
        if: always()
        run: rm -f new.env current.env ~/.ssh/deploy_key
