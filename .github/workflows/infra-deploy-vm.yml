# .github/workflows/infra-deploy-vm.yml
# -----------------------------------------------------------------------------
# Provisions/updates/destroys the Azure VM infra stack in infra-vm/ via
# Terraform. Deliberately NOT triggered by a plain `git push` (unlike
# ci.yml) -- infra changes here are rarer, higher-blast-radius, and each
# apply's plan output should be read before it runs, so this is
# workflow_dispatch-only, mirroring infra-deploy.yml's own pattern for the
# Container Apps/Bicep path.
#
# Every variable infra-vm/variables.tf declares is supplied here as a
# TF_VAR_<name> environment variable sourced from a GitHub Environment's
# encrypted secrets -- Terraform automatically maps TF_VAR_foo to a
# variable named "foo", so no generated .tfvars file (and no risk of one
# accidentally being committed) is needed at all.
# -----------------------------------------------------------------------------
name: Deploy VM Infrastructure (Terraform)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment. "vm-staging", not "staging" -- kept deliberately distinct from the Container Apps path''s "staging" GitHub Environment so the two paths never share AZURE_CLIENT_ID or other environment-scoped secrets.'
        required: true
        type: choice
        options: [vm-staging, prod]
      action:
        description: 'Terraform action to run. "import" reconciles a resource that already exists in Azure but is missing from state.'
        required: true
        type: choice
        options: [plan, apply, destroy, import]
        default: plan
      replace_target:
        description: 'Optional: force-replace ONE resource instead of a normal plan/apply -- e.g. azurerm_linux_virtual_machine.this to rebuild just the VM (data disk, NIC, public IP, and all Cloudflare resources are untouched). Leave blank for a normal run.'
        required: false
        type: string
        default: ''
      import_resources:
        description: 'Only used when action=import. One "terraform_address=azure_resource_id" pair per line, e.g.: azurerm_network_security_group.this=/subscriptions/xxx/resourceGroups/rg-snipeit-lite-prod-vm/providers/Microsoft.Network/networkSecurityGroups/nsg-snipeit-lite-prod (copy the address + ID straight out of the "Error: A resource with the ID ... already exists" message -- the address is the `resource "..." "..."` line right below "with", the ID is the quoted string in the Error line itself).'
        required: false
        type: string
        default: ''
      confirm_destroy:
        description: 'Required only for action=destroy. Type DESTROY <environment> exactly (for example: DESTROY prod). The state backend is retained; only resources tracked by this Terraform state are destroyed.'
        required: false
        type: string
        default: ''

concurrency:
  # Only one Terraform run per environment at a time -- two concurrent
  # applies against the same state corrupt each other's plan.
  group: infra-vm-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: infra-vm

jobs:
  terraform:
    name: terraform ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Per-environment secrets ("vm-staging" vs "prod" use separate Azure AD
    # App Registrations/federated credentials and separate app secrets,
    # never shared -- and "vm-staging" is a distinct GitHub Environment
    # from the Container Apps path's own "staging", precisely so the two
    # paths never fight over the same secret values; see this workflow's
    # `environment` input description above) -- see
    # deploy-azure-aca.yml's `migrate`/`deploy` jobs for why declaring
    # `environment:` here is what actually makes GitHub inject that
    # Environment's secrets into this job at all.
    environment: ${{ inputs.environment }}
    env:
      # ---- Terraform provider + backend auth, via GitHub Actions OIDC
      # federation directly -- no `az login` CLI session, no client
      # secret ever touches disk. Both infra-vm/versions.tf's azurerm
      # `provider` block and its `backend "azurerm"` block pick these
      # ARM_* variables up automatically once `id-token: write` (above)
      # lets the job request an OIDC token from GitHub.
      #
      # This replaces a previous az-CLI-session approach (`azure/login`
      # + `use_cli = true`), which worked fine for the provider but broke
      # `terraform init` on the backend with "Authenticating using the
      # Azure CLI is only supported as a User (not a Service Principal)"
      # -- the backend's CLI-based auth explicitly rejects a service-
      # principal CLI session, which is exactly what a federated
      # `az login` produces. OIDC auth sidesteps that restriction
      # entirely rather than working around it, and covers both the
      # provider and the backend with one auth path.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

      # ---- Every infra-vm/variables.tf input, minus the ones with a
      # sensible default left alone (location, vm_size, disk sizes, etc --
      # override any of those too by adding more TF_VAR_* lines here if a
      # given environment needs to differ) ----
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # infra-vm/variables.tf's environment_name only accepts "prod" or
      # "staging" (it feeds Azure resource names, e.g.
      # rg-snipeit-lite-staging-vm -- see that variable's own validation
      # block) -- NOT "vm-staging", which is a GitHub-Environment-secrets
      # concept only. This maps the GitHub Environment name back down to
      # the Terraform-internal one.
      TF_VAR_environment_name: ${{ inputs.environment == 'prod' && 'prod' || 'staging' }}
      # Optional overrides for infra-vm/variables.tf's own defaults --
      # left unset, Terraform just uses those defaults (Standard_B2s /
      # eastus). Set these repo/environment Variables if you hit
      # `SkuNotAvailable`/`SkuNotAvailableForLocation` -- Azure capacity
      # for a given VM size in a given region shifts over time and isn't
      # something Terraform can retry around; picking a different size
      # (e.g. Standard_B2ms -- see DEPLOYMENT_VM.md's Cost section) or a
      # nearby region is the actual fix.
      TF_VAR_vm_size: ${{ vars.VM_SIZE || 'Standard_B2s' }}
      # AZURE_LOCATION -- named to match infra-deploy.yml's (Container Apps
      # path) Variable of the same name/purpose, rather than the previous
      # bare "LOCATION" here, so one Variable name means "which Azure
      # region" on both deploy paths instead of two different names for the
      # same thing.
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      TF_VAR_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      # OPTIONAL break-glass only -- leave this secret unset entirely for
      # the normal case (no inbound port 22 on the NSG at all, reached
      # instead via the Cloudflare Tunnel below). Only set
      # SSH_ALLOWED_SOURCE_IPS if you specifically want a temporary
      # direct-SSH fallback -- see infra-vm/variables.tf's
      # ssh_allowed_source_ips comment.
      TF_VAR_ssh_allowed_source_ips: ${{ secrets.SSH_ALLOWED_SOURCE_IPS || '[]' }} # JSON list, e.g. ["203.0.113.4/32"] -- break-glass only, see variables.tf
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }} # repo/environment Variable, not a secret -- e.g. "example.com"
      TF_VAR_ssh_access_allowed_emails: ${{ secrets.SSH_ACCESS_ALLOWED_EMAILS }} # JSON list, e.g. ["you@example.com"]
      TF_VAR_cloudflare_origin_cert: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
      TF_VAR_cloudflare_origin_cert_key: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_KEY }}
      TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN }} # repo/environment Variable, not a secret -- REQUIRED now, must be a hostname in the cloudflare_zone_id zone above
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
      TF_VAR_root_admin_bootstrap_password: ${{ secrets.ROOT_ADMIN_BOOTSTRAP_PASSWORD }}
      # /_deploy/ dashboard Basic Auth -- see infra-vm/variables.tf's
      # deploy_status_user/deploy_status_password_hash comments. Leave
      # DEPLOY_STATUS_PASSWORD_HASH unset and main.tf substitutes a real,
      # never-recorded random hash so the route fails closed on first
      # boot instead of open. Generate a real one with:
      #   docker run --rm caddy:2-alpine caddy hash-password
      TF_VAR_deploy_status_user: ${{ vars.DEPLOY_STATUS_USER || 'admin' }}
      TF_VAR_deploy_status_password_hash: ${{ secrets.DEPLOY_STATUS_PASSWORD_HASH }}
      TF_VAR_notifications_enabled: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
      TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      TF_VAR_smtp_from_email: ${{ secrets.SMTP_FROM_EMAIL }}
      TF_VAR_email_provider: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
      TF_VAR_brevo_api_key: ${{ secrets.BREVO_API_KEY }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_admin_notification_emails: ${{ secrets.ADMIN_NOTIFICATION_EMAILS }}
      TF_VAR_overdue_digest_hours_utc: ${{ vars.OVERDUE_DIGEST_HOURS_UTC || '8' }}
      TF_VAR_due_soon_digest_hours_utc: ${{ vars.DUE_SOON_DIGEST_HOURS_UTC || '8' }}
      TF_VAR_enable_auto_backup: ${{ vars.ENABLE_AUTO_BACKUP || 'true' }}
      # Azure VM/disk backup is controlled per GitHub Environment. Keep the
      # default enabled so existing environments retain current behavior when
      # the Variable has not been created yet.
      TF_VAR_enable_data_disk_snapshots: ${{ vars.ENABLE_DATA_DISK_SNAPSHOTS || 'true' }}
      TF_VAR_snapshot_retention_days: ${{ vars.SNAPSHOT_RETENTION_DAYS || '7' }}
      TF_VAR_backup_gdrive_enabled: ${{ vars.BACKUP_GDRIVE_ENABLED || 'false' }}
      TF_VAR_backup_gdrive_oauth_client_id: ${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_ID }}
      TF_VAR_backup_gdrive_oauth_client_secret: ${{ secrets.BACKUP_GDRIVE_OAUTH_CLIENT_SECRET }}
      TF_VAR_backup_gdrive_oauth_refresh_token: ${{ secrets.BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN }}
      # Mode 2 -- Google Workspace service account + Shared Drive. BUG FIX:
      # this was missing here even though Mode 1 (the four vars above) was
      # already wired end-to-end -- see infra-vm/variables.tf's matching
      # variable and docker-compose.vm.yml's matching env var comment.
      TF_VAR_backup_gdrive_credentials_json: ${{ secrets.BACKUP_GDRIVE_CREDENTIALS_JSON }}
      TF_VAR_backup_gdrive_folder_id: ${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}
      TF_VAR_otel_enabled: ${{ vars.OTEL_ENABLED || 'false' }}
      TF_VAR_otel_service_name: ${{ vars.OTEL_SERVICE_NAME }}
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      TF_VAR_otel_traces_sample_ratio: ${{ vars.OTEL_TRACES_SAMPLE_RATIO }}
      TF_VAR_otel_console_exporter: ${{ vars.OTEL_CONSOLE_EXPORTER || 'false' }}
      TF_VAR_applicationinsights_connection_string: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      TF_VAR_dockerhub_backend_image: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend${{ inputs.environment == 'vm-staging' && '-staging' || '' }}
      TF_VAR_dockerhub_frontend_image: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-frontend-${{ vars.FRONTEND_BUILD_TARGET || 'react' }}${{ inputs.environment == 'vm-staging' && '-staging' || '' }}
      # Same source as deploy-azure-vm.yml's resolve-target job reads to
      # actually pick frontend/Dockerfile's --target when THAT Docker Hub
      # image above gets built -- reading the identical Environment
      # variable here means this only ever documents (infra-vm/
      # variables.tf's frontend_build_target -- see its own description)
      # what deploy-azure-vm.yml is already doing, and the two can't drift
      # out of sync with each other by definition. Initial deployments
      # default to React when FRONTEND_BUILD_TARGET is unset; set the
      # variable explicitly to "legacy" for a legacy-only environment.
      TF_VAR_frontend_build_target: ${{ vars.FRONTEND_BUILD_TARGET || 'react' }}
      TF_VAR_initial_image_tag: latest
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Terraform remote state is bootstrapped automatically by the
      # first workflow step. Nothing needs to be created in the Portal and
      # no TF_STATE_* GitHub Variables are required. The state backend lives
      # in its own resource group, outside the VM stack, so destroy can never
      # delete the state it needs in order to destroy the VM resources.

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure resource providers
        working-directory: .
        run: |
          set -euo pipefail
          az account set --subscription "${ARM_SUBSCRIPTION_ID}"
          for provider in             Microsoft.Resources             Microsoft.Compute             Microsoft.Network             Microsoft.Storage             Microsoft.RecoveryServices
          do
            echo "Registering/checking ${provider}..."
            az provider register --namespace "${provider}" --wait >/dev/null
          done

      - name: Bootstrap Terraform state backend
        working-directory: .
        run: |
          set -euo pipefail
          state_env_file="$(mktemp)"
          trap 'rm -f "$state_env_file"' EXIT

          # The bootstrap script writes human-readable diagnostics to stderr and
          # only TF_STATE_* assignments to stdout. Capture stdout first so a
          # status message can never corrupt GitHub's $GITHUB_ENV file.
          ./scripts/bootstrap-terraform-state.sh > "$state_env_file"
          cat "$state_env_file" >&2
          grep -E '^TF_STATE_(RESOURCE_GROUP|STORAGE_ACCOUNT|CONTAINER)=' "$state_env_file" >> "$GITHUB_ENV"


      - name: terraform init
        # Bootstrap above discovers/reuses the existing state RG, storage
        # account, and vm-state container when present, and creates only what
        # is missing. The environment key remains stable, so an existing
        # prod.tfstate/vm-staging.tfstate is opened in place rather than
        # recreated.
        run: |
          for attempt in 1 2 3 4 5; do
            if terraform init -input=false \
              -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
              -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
              -backend-config="container_name=${TF_STATE_CONTAINER}" \
              -backend-config="key=${{ inputs.environment }}.tfstate"; then
              exit 0
            fi
            echo "Terraform backend init attempt $attempt/5 failed; waiting for Azure RBAC propagation..."
            sleep 15
          done
          exit 1

      - name: Detect whether this environment already has a VM
        id: vm_state
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          if terraform state list | grep -qx 'azurerm_linux_virtual_machine.this'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing VM found in Terraform state; preserving its exact application images."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing VM in Terraform state; using initial image defaults."
          fi

      - name: Install cloudflared for existing-VM image discovery
        if: steps.vm_state.outputs.exists == 'true'
        env:
          CLOUDFLARED_VERSION: '2026.5.1'
        run: |
          curl -fsSL --output /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Validate existing-VM SSH secrets
        if: steps.vm_state.outputs.exists == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          MISSING=()
          [ -z "$VM_HOST" ] && MISSING+=("VM_HOST")
          [ -z "$VM_SSH_USER" ] && MISSING+=("VM_SSH_USER")
          [ -z "$VM_SSH_PRIVATE_KEY" ] && MISSING+=("VM_SSH_PRIVATE_KEY")
          [ -z "$CF_ACCESS_CLIENT_ID" ] && MISSING+=("CF_ACCESS_CLIENT_ID")
          [ -z "$CF_ACCESS_CLIENT_SECRET" ] && MISSING+=("CF_ACCESS_CLIENT_SECRET")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Existing VM image preservation requires these secrets in GitHub Environment '${{ inputs.environment }}': ${MISSING[*]}"
            exit 1
          fi

      - name: Set up SSH for existing-VM image discovery
        if: steps.vm_state.outputs.exists == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<SSHCONFIG
          Host $VM_HOST
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Resolve current VM images (or initial defaults)
        id: current_images
        if: inputs.action == 'plan' || inputs.action == 'apply'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENV_SUFFIX: ${{ inputs.environment == 'vm-staging' && '-staging' || '' }}
          FRONTEND_BUILD_TARGET: ${{ vars.FRONTEND_BUILD_TARGET || 'react' }}
        run: |
          set -euo pipefail
          if [[ "$FRONTEND_BUILD_TARGET" != "react" && "$FRONTEND_BUILD_TARGET" != "legacy" ]]; then
            echo "::error::FRONTEND_BUILD_TARGET must be 'react' or 'legacy' when set; got '$FRONTEND_BUILD_TARGET'."
            exit 1
          fi

          if [[ "${{ steps.vm_state.outputs.exists }}" == "true" ]]; then
            CURRENT=$(ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
              "awk -F= '/^(DOCKERHUB_BACKEND_IMAGE|DOCKERHUB_FRONTEND_IMAGE|IMAGE_TAG)=/{print}' /opt/snipeit/.env")
            BACKEND_REPO=$(printf '%s\n' "$CURRENT" | sed -n 's/^DOCKERHUB_BACKEND_IMAGE=//p')
            FRONTEND_REPO=$(printf '%s\n' "$CURRENT" | sed -n 's/^DOCKERHUB_FRONTEND_IMAGE=//p')
            IMAGE_TAG=$(printf '%s\n' "$CURRENT" | sed -n 's/^IMAGE_TAG=//p')
            if [[ -z "$BACKEND_REPO" || -z "$FRONTEND_REPO" || -z "$IMAGE_TAG" ]]; then
              echo "::error::Existing VM does not expose a complete application image configuration in /opt/snipeit/.env."
              exit 1
            fi
            SOURCE="existing"
          else
            BACKEND_REPO="${DOCKERHUB_USERNAME}/snipeit-lite-backend${ENV_SUFFIX}"
            FRONTEND_REPO="${DOCKERHUB_USERNAME}/snipeit-lite-frontend-${FRONTEND_BUILD_TARGET}${ENV_SUFFIX}"
            IMAGE_TAG="latest"
            SOURCE="initial"
          fi

          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null
          fi

          for image in "${BACKEND_REPO}:${IMAGE_TAG}" "${FRONTEND_REPO}:${IMAGE_TAG}"; do
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::error::Docker Hub image $image does not exist. Refusing to apply infrastructure with a dangling application image."
              exit 1
            fi
            echo "Verified application image: $image"
          done

          if [[ "$FRONTEND_REPO" == *"-react" || "$FRONTEND_REPO" == *"-react-staging" ]]; then
            RESOLVED_FRONTEND_TARGET="react"
          elif [[ "$FRONTEND_REPO" == *"-legacy" || "$FRONTEND_REPO" == *"-legacy-staging" ]]; then
            RESOLVED_FRONTEND_TARGET="legacy"
          else
            echo "::error::Existing VM frontend image '$FRONTEND_REPO' does not identify a supported frontend flavor (-react or -legacy)."
            exit 1
          fi

          echo "backend_repo=$BACKEND_REPO" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=$FRONTEND_REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

          {
            echo "TF_VAR_dockerhub_backend_image=$BACKEND_REPO"
            echo "TF_VAR_dockerhub_frontend_image=$FRONTEND_REPO"
            echo "TF_VAR_frontend_build_target=$RESOLVED_FRONTEND_TARGET"
            echo "TF_VAR_initial_image_tag=$IMAGE_TAG"
          } >> "$GITHUB_ENV"

      - name: terraform fmt -check
        # Formatting is enforced so the workflow never reports a hidden
        # Terraform formatting error as a successful deployment.
        run: terraform fmt -check -recursive

      - name: Verify Cloudflare credentials and configured IDs
        # Terraform refreshes Cloudflare Access resources during plan. A token can
        # be valid/active while CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_ZONE_ID points
        # at the wrong account/zone. This preflight checks the actual zone -> account
        # relationship before Terraform runs, so a swapped/stale GitHub Environment
        # value is reported directly instead of surfacing later as provider error 1010.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          TF_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_CF_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p infra-vm/terraform-debug-artifact
          PREFLIGHT_LOG="infra-vm/terraform-debug-artifact/cloudflare-preflight.log"
          exec > >(tee "$PREFLIGHT_LOG") 2>&1

          echo "Cloudflare credential/configuration preflight"
          echo "Environment: ${{ inputs.environment }}"
          echo

          if [[ -z "${CF_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty in the '${{ inputs.environment }}' GitHub Environment."
            exit 1
          fi
          if [[ -z "${CF_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty in the '${{ inputs.environment }}' GitHub Environment."
            exit 1
          fi
          if [[ -z "${CF_ZONE_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ZONE_ID is empty in the '${{ inputs.environment }}' GitHub Environment."
            exit 1
          fi

          token_fingerprint="$(printf '%s' "$CF_API_TOKEN" | sha256sum | cut -c1-16)"
          echo "Configured Cloudflare account ID: ${CF_ACCOUNT_ID}"
          echo "Configured Cloudflare zone ID:     ${CF_ZONE_ID}"
          echo "Configured Cloudflare zone name:   ${CF_ZONE_NAME:-<empty>}"
          echo "Token fingerprint (SHA-256/16):    ${token_fingerprint}"
          echo

          # The account/zone IDs are not secrets, so show them explicitly. This
          # makes a wrong GitHub Environment value immediately visible without
          # ever printing the API token itself.
          check_cloudflare() {
            local label="$1"
            local url="$2"
            local response_file http_code success errors
            response_file="$(mktemp)"
            http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$url")"
            success="$(jq -r '.success // false' "$response_file")"
            errors="$(jq -c '.errors // []' "$response_file")"
            echo "${label}: HTTP ${http_code}, success=${success}"
            if [[ "$errors" != "[]" ]]; then
              echo "${label} errors: ${errors}"
            fi
            printf '%s' "$response_file"
          }

          echo "1. Verify API token"
          verify_file="$(mktemp)"
          verify_http="$(curl -sS -o "$verify_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          verify_success="$(jq -r '.success // false' "$verify_file")"
          verify_status="$(jq -r '.result.status // "unknown"' "$verify_file")"
          verify_id="$(jq -r '.result.id // "unknown"' "$verify_file")"
          echo "Token verification: HTTP ${verify_http}, success=${verify_success}, status=${verify_status}"
          echo "Token ID: ${verify_id}"
          if [[ ! "$verify_http" =~ ^2[0-9][0-9]$ || "$verify_success" != "true" ]]; then
            echo "::error::Cloudflare API token verification failed. Replace the token in the '${{ inputs.environment }}' GitHub Environment."
            exit 1
          fi
          rm -f "$verify_file"

          echo
          echo "2. Resolve configured zone -> owning Cloudflare account"
          zone_file="$(mktemp)"
          zone_http="$(curl -sS -o "$zone_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}")"
          zone_success="$(jq -r '.success // false' "$zone_file")"
          zone_actual_id="$(jq -r '.result.id // "unknown"' "$zone_file")"
          zone_actual_name="$(jq -r '.result.name // "unknown"' "$zone_file")"
          zone_owner_id="$(jq -r '.result.account.id // "unknown"' "$zone_file")"
          zone_owner_name="$(jq -r '.result.account.name // "unknown"' "$zone_file")"
          zone_errors="$(jq -c '.errors // []' "$zone_file")"
          echo "Zone lookup: HTTP ${zone_http}, success=${zone_success}"
          echo "Zone returned: ${zone_actual_name} (${zone_actual_id})"
          echo "Zone owner account: ${zone_owner_name} (${zone_owner_id})"
          if [[ "$zone_errors" != "[]" ]]; then
            echo "Zone lookup errors: ${zone_errors}"
          fi

          if [[ ! "$zone_http" =~ ^2[0-9][0-9]$ || "$zone_success" != "true" ]]; then
            echo "::error::CLOUDFLARE_ZONE_ID='${CF_ZONE_ID}' could not be read with the configured token. Check the '${{ inputs.environment }}' Environment's CLOUDFLARE_ZONE_ID and token Zone -> DNS/Zone permissions."
            exit 1
          fi

          if [[ "$zone_actual_id" != "$CF_ZONE_ID" ]]; then
            echo "::error::Cloudflare returned a different zone ID than configured."
            exit 1
          fi

          if [[ "$zone_owner_id" != "$CF_ACCOUNT_ID" ]]; then
            echo "::error::WRONG CLOUDFLARE_ACCOUNT_ID: configured='${CF_ACCOUNT_ID}', but zone '${zone_actual_name}' belongs to account='${zone_owner_id}' (${zone_owner_name})."
            echo "::error::Update the '${{ inputs.environment }}' GitHub Environment secret CLOUDFLARE_ACCOUNT_ID to '${zone_owner_id}'."
            echo "::error::Do not change Terraform state or recreate Cloudflare Access policies."
            exit 1
          fi

          if [[ -n "${CF_ZONE_NAME:-}" && "$zone_actual_name" != "$CF_ZONE_NAME" ]]; then
            echo "::error::WRONG CLOUDFLARE_ZONE_NAME: configured='${CF_ZONE_NAME}', but CLOUDFLARE_ZONE_ID resolves to '${zone_actual_name}'."
            echo "::error::Update the '${{ inputs.environment }}' GitHub Environment Variable CLOUDFLARE_ZONE_NAME."
            exit 1
          fi

          if [[ "$TF_CF_ACCOUNT_ID" != "$CF_ACCOUNT_ID" || "$TF_CF_ZONE_ID" != "$CF_ZONE_ID" || "$TF_CF_ZONE_NAME" != "$CF_ZONE_NAME" ]]; then
            echo "::error::Cloudflare Terraform environment values do not match the preflight values. Check the workflow's TF_VAR_cloudflare_* wiring."
            exit 1
          fi

          echo "Account/zone relationship: OK"
          echo
          echo "3. Test Cloudflare Access API for the configured account"
          access_file="$(mktemp)"
          access_http="$(curl -sS -o "$access_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps")"
          access_success="$(jq -r '.success // false' "$access_file")"
          access_errors="$(jq -c '.errors // []' "$access_file")"
          echo "Access API: HTTP ${access_http}, success=${access_success}"
          if [[ "$access_errors" != "[]" ]]; then
            echo "Access API errors: ${access_errors}"
          fi
          if [[ ! "$access_http" =~ ^2[0-9][0-9]$ || "$access_success" != "true" ]]; then
            echo "::error::Cloudflare Access API rejected the configured account '${CF_ACCOUNT_ID}'. The token is valid, but its permissions/account resource or the configured account ID is wrong."
            exit 1
          fi

          echo "Cloudflare credential/configuration preflight passed."

      - name: Test exact Cloudflare Access policy endpoints
        if: inputs.action != 'import'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p terraform-debug-artifact
          POLICY_LOG="terraform-debug-artifact/cloudflare-policy-probe.log"
          exec > >(tee "$POLICY_LOG") 2>&1

          # Diagnostic only. It calls the exact application-policy endpoint that
          # corresponds to the application_id + policy id stored in Terraform.
          for policy_address in \
            "cloudflare_zero_trust_access_policy.ssh_humans" \
            "cloudflare_zero_trust_access_policy.ssh_ci"; do

            # A fresh environment has no Cloudflare Access policy instances in
            # Terraform state yet. This probe is diagnostic only, so it must
            # never fail the deployment before Terraform has created those
            # resources.
            if ! terraform state list | grep -Fxq "$policy_address"; then
              echo "${policy_address}: not present in Terraform state yet; skipping preflight probe."
              continue
            fi

            policy_state="$(terraform state show -no-color "$policy_address")"
            policy_id="$(printf '%s\n' "$policy_state" | sed -n 's/^id[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' | head -1)"
            app_id="$(printf '%s\n' "$policy_state" | sed -n 's/^application_id[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' | head -1)"

            if [[ -z "$policy_id" || -z "$app_id" ]]; then
              echo "::warning::Could not read policy/application IDs from Terraform state for '${policy_address}'."
              continue
            fi

            response_file="$(mktemp)"
            http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${app_id}/policies/${policy_id}")"
            success="$(jq -r '.success // false' "$response_file")"
            errors="$(jq -c '.errors // []' "$response_file")"
            result="$(jq -c 'if .result == null then null else {id: .result.id, name: .result.name, app_id: .result.app_id} end' "$response_file")"

            echo "${policy_address}: HTTP ${http_code}, success=${success}, policy=${policy_id}, application=${app_id}"
            echo "result=${result}"
            if [[ "$errors" != "[]" ]]; then echo "errors=${errors}"; fi

            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ || "$success" != "true" ]]; then
              echo "::warning::Exact Access application-policy probe failed for '${policy_address}'. Terraform may fail refreshing this resource."
            fi
            rm -f "$response_file"
          done

      - name: terraform import
        if: inputs.action == 'import'
        # WHY THIS EXISTS: "Error: A resource with the ID ... already exists
        # -- to be managed via Terraform this resource needs to be imported
        # into the State" means Azure has this resource but Terraform's
        # state doesn't -- almost always because an earlier apply was
        # interrupted (a cancelled workflow run, a runner that got killed
        # mid-apply, or a run from before this state's remote backend was
        # fully wired up) after Azure finished creating something but
        # before/without that create landing in state. Re-running plan/apply
        # as-is just repeats the same "already exists" error forever --
        # Terraform refuses to overwrite a resource it doesn't believe it
        # owns, on purpose, since blindly "creating" over something real
        # risks destroying/replacing live data (see the managed_disk.data
        # case in particular -- that's the persistent data disk).
        # `terraform import` instead just tells state "this address IS that
        # ID, go read its current real config" -- no create, no delete, no
        # data risk. After an import run succeeds, switch back to
        # action=plan to confirm the plan is now clean (ideally an empty
        # diff, or only the diff you actually intended) before apply-ing.
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.import_resources }}" ]; then
            echo "::error::action=import requires at least one line in import_resources (address=azure_resource_id). See this input's description for the exact format, copied straight out of the 'already exists' error message."
            exit 1
          fi
          echo "${{ inputs.import_resources }}" | while IFS='=' read -r ADDRESS ID; do
            ADDRESS=$(echo "$ADDRESS" | xargs)
            ID=$(echo "$ID" | xargs)
            if [ -z "$ADDRESS" ] || [ -z "$ID" ]; then
              continue
            fi
            echo "::group::terraform import $ADDRESS"
            terraform import -input=false "$ADDRESS" "$ID"
            echo "::endgroup::"
          done

      - name: terraform plan
        id: terraform_plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        # Keep the normal Terraform error output. Provider TRACE is intentionally
        # NOT enabled by default: it produces very large, noisy artifacts and can
        # contain request/response details. The targeted Cloudflare probes above
        # give the useful account/zone/policy diagnostics without the noise.
        run: |
          set +e
          mkdir -p terraform-debug-artifact

          if [ -n "${{ inputs.replace_target }}" ]; then
            echo "Planning a targeted replace of: ${{ inputs.replace_target }}"
            terraform plan -input=false -no-color \
              -replace="${{ inputs.replace_target }}" \
              -out=tfplan 2>&1 | tee terraform-plan-output.log
          else
            terraform plan -input=false -no-color \
              -out=tfplan 2>&1 | tee terraform-plan-output.log
          fi

          PLAN_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PLAN_EXIT" -ne 0 ]; then
            echo "::error::Terraform plan failed. A concise diagnostic artifact will be uploaded; full provider TRACE logging is intentionally disabled."
            exit "$PLAN_EXIT"
          fi

          echo "Terraform plan succeeded."

      - name: terraform apply
        if: inputs.action == 'apply'
        # Retries on the transient Azure Resource Manager eventual-
        # consistency races described in main.tf's time_sleep.
        # network_propagation comment -- e.g. "Provider produced
        # inconsistent result after apply ... Root object was present, but
        # now absent" on the NSG, or "InvalidResourceReference ... was not
        # found" on the NIC. That resource already gives ARM a head start
        # once per apply; this loop is the backstop for the rarer case
        # where 30s wasn't quite enough, or a similar race hits a different
        # resource entirely. A plain `terraform apply` of an already-
        # existing tfplan is safe to simply re-run as-is on failure --
        # Terraform re-reads current state/plan validity on each attempt,
        # and every resource in this stack is idempotent create-or-update,
        # so a partially-applied plan from attempt 1 just picks up where it
        # left off on attempt 2 rather than double-creating anything.
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::terraform apply (attempt $attempt/$MAX_ATTEMPTS)"
            if terraform apply -input=false -auto-approve tfplan; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              SLEEP=$((attempt * 30))
              echo "::warning::terraform apply failed on attempt $attempt/$MAX_ATTEMPTS -- if this was one of the known transient Azure eventual-consistency races (NSG 'Provider produced inconsistent result', NIC 'InvalidResourceReference ... was not found'), retrying often succeeds once ARM catches up. Re-planning + retrying in ${SLEEP}s."
              sleep "$SLEEP"
              # Re-plan rather than blindly reusing the stale tfplan file --
              # Terraform refuses to apply a plan if state moved under it
              # (e.g. attempt 1 partially applied before failing), and a
              # fresh plan against current state is what correctly picks up
              # from wherever attempt 1 actually left off.
              if [ -n "${{ inputs.replace_target }}" ]; then
                terraform plan -input=false -replace="${{ inputs.replace_target }}" -out=tfplan
              else
                terraform plan -input=false -out=tfplan
              fi
            fi
          done
          echo "::error::terraform apply failed after $MAX_ATTEMPTS attempts -- this no longer looks like a transient Azure propagation race. Check the log above for the real error."
          exit 1

      - name: Prepare deployment failure diagnostics
        if: failure()
        shell: bash
        env:
          REDACT_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REDACT_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REDACT_CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          REDACT_AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          REDACT_AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          REDACT_AZ_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          mkdir -p terraform-debug-artifact

          # Build one small, actionable artifact after ANY workflow failure
          # (preflight, policy probe, plan, apply, or destroy). Provider TRACE is
          # deliberately absent: the targeted logs above are more useful and much
          # smaller for the common configuration/credential/state failures.
          {
            echo "Terraform deployment failure summary"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Environment: ${{ inputs.environment }}"
            echo "Action: ${{ inputs.action }}"
            echo
            if [ -f terraform-plan-output.log ]; then
              echo "--- Terraform errors / relevant lines ---"
              grep -E '(^│ Error:|^Error:|^╷|^╵|Planning failed|Terraform exited|error finding|Authentication error|Unauthorized|Invalid account|403|404|1010|9109|No configuration|Backend initialization|Error:)' terraform-plan-output.log || true
              echo
              echo "--- Last 120 lines of Terraform output ---"
              tail -n 120 terraform-plan-output.log
            else
              echo "No terraform-plan-output.log was produced (failure occurred before terraform plan)."
            fi
          } > terraform-debug-artifact/terraform-error-summary.txt

          # State summary is intentionally narrow: only the IDs/fields needed to
          # diagnose stale Cloudflare Access state are retained.
          {
            echo "Terraform Cloudflare state summary"
            echo "Environment: ${{ inputs.environment }}"
            for address in \
              cloudflare_zero_trust_access_policy.ssh_humans \
              cloudflare_zero_trust_access_policy.ssh_ci; do
              echo
              echo "### $address"
              terraform state show -no-color "$address" 2>/dev/null \
                | grep -E '^    (account_id|application_id|id|name|decision|precedence)[[:space:]]*=' || \
                echo "Resource not present in Terraform state."
            done
          } > terraform-debug-artifact/terraform-cloudflare-state-summary.txt

          # Redact known credentials from every artifact file. IDs remain visible
          # when useful for diagnosing wrong account/zone configuration.
          for file in terraform-debug-artifact/*; do
            [ -f "$file" ] || continue
            for secret in \
              "$REDACT_CF_TOKEN" \
              "$REDACT_CF_ACCOUNT" \
              "$REDACT_CF_ZONE" \
              "$REDACT_AZ_CLIENT" \
              "$REDACT_AZ_TENANT" \
              "$REDACT_AZ_SUBSCRIPTION"; do
              if [ -n "${secret:-}" ]; then
                SECRET="$secret" python3 -c 'import os,sys; p=sys.argv[1]; s=os.environ.get("SECRET",""); data=open(p,encoding="utf-8",errors="replace").read(); open(p,"w",encoding="utf-8").write(data.replace(s,"[REDACTED]"))' "$file"
              fi
            done
          done

          {
            echo "Concise Terraform deployment diagnostic"
            echo
            echo "Start with terraform-error-summary.txt."
            echo ""
            echo "Cloudflare preflight checks: token validity, zone ID, zone owner account ID, zone name, Access API access."
            echo "Cloudflare policy probe checks: exact Access application/policy IDs from Terraform state."
            echo ""
            echo "Provider TRACE is intentionally NOT included. It was producing large, noisy artifacts."
            echo "If a future provider-specific bug cannot be diagnosed with these checks, enable TRACE temporarily as an explicit debugging change."
          } > terraform-debug-artifact/README.txt

      - name: Upload deployment failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-deployment-failure-${{ github.run_id }}
          path: infra-vm/terraform-debug-artifact/
          if-no-files-found: warn
          retention-days: 3

      - name: Verify destroy confirmation
        if: inputs.action == 'destroy'
        working-directory: .
        run: |
          expected="DESTROY ${{ inputs.environment }}"
          if [[ "${{ inputs.confirm_destroy }}" != "$expected" ]]; then
            echo "::error::Destroy blocked. Set confirm_destroy to exactly: $expected"
            exit 1
          fi

      - name: terraform destroy
        if: inputs.action == 'destroy'
        # `-auto-approve` is required because this is a non-interactive
        # GitHub runner. The explicit DESTROY <environment> confirmation
        # above plus GitHub Environment protection rules provide the safety
        # gate before this step can run.
        run: terraform destroy -input=false -auto-approve

      - name: Pull preserved application images on the VM after infra apply
        if: inputs.action == 'apply' && steps.vm_state.outputs.exists == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          BACKEND_IMAGE: ${{ steps.current_images.outputs.backend_repo }}
          FRONTEND_IMAGE: ${{ steps.current_images.outputs.frontend_repo }}
          IMAGE_TAG: ${{ steps.current_images.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "docker pull '${BACKEND_IMAGE}:${IMAGE_TAG}' && docker pull '${FRONTEND_IMAGE}:${IMAGE_TAG}'"
          echo "Preserved application images pulled: ${BACKEND_IMAGE}:${IMAGE_TAG} / ${FRONTEND_IMAGE}:${IMAGE_TAG}"

      - name: Print outputs
        if: inputs.action == 'apply'
        run: |
          # GitHub Actions masks any output value that happens to match a
          # registered secret. The VM connection values are NOT secrets, but
          # derived values can still be redacted if a component of them is
          # registered elsewhere as a secret. Keep the normal Terraform output
          # table, and also publish the non-sensitive connection details as an
          # artifact so the exact values are always recoverable.
          echo "## Terraform outputs" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: `\(.value.value)`"' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### VM connection details" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub may redact derived values in the Summary if they match a registered secret. The exact non-sensitive SSH connection values are also attached as the \`vm-connection-details\` artifact." >> "$GITHUB_STEP_SUMMARY"
          mkdir -p vm-connection-details
          {
            echo "Snipe-It Lite VM connection details"
            echo "================================="
            echo
            printf 'ssh_hostname: %s\n' "$(terraform output -raw ssh_hostname)"
            printf 'ssh_command: %s\n' "$(terraform output -raw ssh_command)"
            printf 'ssh_command_break_glass: %s\n' "$(terraform output -raw ssh_command_break_glass)"
            printf 'public_ip_address: %s\n' "$(terraform output -raw public_ip_address)"
            printf 'azure_fqdn: %s\n' "$(terraform output -raw azure_fqdn)"
            printf 'app_domain: %s\n' "$(terraform output -raw app_domain)"
            printf 'app_url: %s\n' "$(terraform output -raw app_url)"
          } > vm-connection-details/connection-details.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: set VM_HOST to the exact \`ssh_hostname\` value (NOT public_ip_address/azure_fqdn for normal access), plus CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET from the Terraform outputs, then run deploy-azure-vm.yml -- see DEPLOYMENT_VM.md steps 7-9." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VM connection details
        if: inputs.action == 'apply' && success()
        uses: actions/upload-artifact@v4
        with:
          name: vm-connection-details
          path: infra-vm/vm-connection-details/connection-details.txt
          if-no-files-found: error
          retention-days: 30
