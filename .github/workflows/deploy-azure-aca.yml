# .github/workflows/deploy-azure-aca.yml
# -----------------------------------------------------------------------------
# ONE workflow for the Azure Container Apps target -- pick `staging` or
# `production` from the Actions tab, same shape as deploy-azure-vm.yml's
# `vm-staging`/`prod` choice on the VM target. This replaces what used to be
# two separate files (`deploy-azure-staging.yml` and
# `deploy-azure-production.yml`) that copy-pasted almost the entire
# ci -> build-push -> migrate -> deploy pipeline between them, differing only
# in which resource group / image names / GitHub Environment / safety
# posture applied. That copy-paste is exactly how staging and production
# drifted apart in ways that had nothing to do with an intentional
# environment difference (see the "Wait for backend/frontend readiness" and
# log-dump BUG FIX comments below -- both were fixed once, in one file, and
# silently absent from the other for a while). One file, parameterized by
# `$ENVIRONMENT`, makes that class of drift structurally impossible.
#
# ONE WAY IN: workflow_dispatch. Open this workflow in the Actions tab,
#   choose `staging` or `production`, and "Run workflow". Leave `image_tag`
#   BLANK to build fresh from whichever branch/ref you run it against (the
#   normal case) -- `ci` + `build-push` run first. Supply an EXISTING Docker
#   Hub tag (a commit SHA from a prior successful "Build + push both images"
#   run, a version like `v1.4.2`, or `latest`) to skip straight to
#   `migrate` -> `deploy` with that already-built image instead -- this is
#   also the rollback/redeploy path, AND how you push a production release:
#   `git tag vX.Y.Z && git push origin vX.Y.Z` (see release.yml) builds,
#   Trivy-scans, and publishes the images to Docker Hub under that version
#   tag, but does not deploy them anywhere on its own -- run this workflow by
#   hand afterward, choose `production`, and put that version in `image_tag`
#   when you're ready to actually ship it. `skip_migrate: true` additionally
#   skips `migrate`, for when you know the schema hasn't changed since that
#   image was built. There is no `workflow_call` entry point and no `push`
#   trigger -- nothing but a human running this workflow ever deploys here.
#
# WHAT DIFFERS BETWEEN staging AND production (everything else is identical,
# driven off the same `$ENVIRONMENT`/`$RESOURCE_GROUP`/`$BACKEND_IMAGE`/
# `$FRONTEND_IMAGE` variables, plus the `resolve-target` job's `build_env`
# output):
#   - Resource group: `staging` vs. `production` GitHub Environment secret
#     (`STAGING_RESOURCE_GROUP`/`PROD_RESOURCE_GROUP`), picked by the
#     `environment` dropdown.
#   - Image repo (`-staging` suffix vs. none): picked independently, by
#     each target GitHub Environment's own `ENVIRONMENT` Actions variable
#     -- see the `build_env` bullet below, `resolve-target`'s
#     `image_suffix` output comment.
#   - GitHub Environment used for OIDC secrets: `staging` vs. `production`
#     (separate Azure AD App Registrations/federated credentials -- see the
#     `migrate`/`deploy` jobs' own comments).
#   - `build_env` (the `resolve-target` job's output, fed into `build-push`
#     as BUILD_ENV): `development` (minified only) vs. `production`
#     (minified + obfuscated) -- see frontend/Dockerfile's own comment and
#     `resolve-target`'s own comment for how this is resolved from each
#     target GitHub Environment's own `ENVIRONMENT` Actions variable. That
#     SAME variable also now drives `$BACKEND_IMAGE`/`$FRONTEND_IMAGE`'s
#     `-staging` suffix (see `resolve-target`'s `image_suffix` output) --
#     whichever GitHub Environment you pick in the `environment` dropdown,
#     its own `ENVIRONMENT` variable decides which Docker Hub repo gets
#     pulled: `production` -> no suffix, `development`/unset -> `-staging`.
#   - Trivy blocking: staging reports CRITICAL findings but doesn't fail the
#     build on them; production does.
#   - Blue-green canary shape: both environments now roll out via
#     .github/scripts/aca-blue-green.sh (see the `deploy` job's own
#     comments) -- a new revision is always created at 0% traffic and
#     health-gated before it receives anything. Production walks that
#     revision across 10% -> 25% -> 50% -> 75% -> 100% traffic,
#     re-checking health at each step, since real users sit behind that
#     weight -- same five-step ramp the VM path uses (see
#     scripts/blue-green-deploy.sh's RAMP_STEPS), unified for
#     consistency between the two deploy targets. Staging's
#     `backend` AND `frontend` both run with min replicas 0 (scale-to-zero
#     -- effectively free compute the rest of the time), so there's no
#     standing traffic a gradual shift protects -- it jumps straight to
#     100% the moment the new revision reports healthy. Both environments
#     now get an automatic rollback (an instant traffic-weight flip back to
#     the still-running old revision, not a redeploy) if the post-deploy
#     smoke test fails -- see the `deploy` job's own comments for exactly
#     which gate catches what, and .github/scripts/aca-blue-green.sh for
#     the shared mechanics both environments run through.
# -----------------------------------------------------------------------------
name: Deploy to ACA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Azure Container Apps environment. "staging" or "production".
          "staging" is a separate GitHub Environment from the Container Apps path''s "vm-staging" so the two paths never share AZURE_CLIENT_ID or other environment-scoped secrets.'
        required: true
        type: choice
        options: [staging, production]
        default: production
      image_tag:
        description: 'Existing tag on Docker Hub to redeploy/roll back to, e.g. "v1.4.2" or a commit SHA from a prior successful build (skips `ci` + `build-push` entirely). Leave BLANK to build FRESH from whichever branch/ref you run this workflow against.'
        required: false
        type: string
      frontend_type:
        description: 'Which frontend to ship: "react" (the React "Ledger" SPA) or "legacy" (the legacy static site) -- see frontend/Dockerfile''s top-of-file comment; the two are mutually exclusive, both land at "/". "(environment default)" uses this target''s own FRONTEND_BUILD_TARGET Actions variable (Settings > Environments > staging|production > Environment variables) -- the normal case, and the only option that needs no code/settings change to keep working. Pick one of the other two to override that variable for THIS run only. Ignored entirely when `image_tag` above is set -- a reused image was already built with whatever flavor it was built with.'
        required: false
        type: choice
        options: ['(environment default)', react, legacy]
        default: '(environment default)'
      skip_migrate:
        description: 'Skip the migrate job (only safe if you are certain no migration has changed since image_tag was built -- e.g. re-running just the deploy/rollout logic after a workflow-file-only fix)'
        required: false
        type: boolean
        default: false

concurrency:
  # workflow_dispatch is the only trigger now, and its `environment` input
  # is required with a default, so this always carries a concrete "staging"
  # or "production".
  group: deploy-aca-${{ inputs.environment || 'production' }}
  cancel-in-progress: false # never cancel a deploy mid-flight -- let it finish or fail cleanly

permissions:
  id-token: write # OIDC federated Azure login -- no client secret stored in GitHub
  contents: read

env:
  # WHICH TARGET this run deploys to. workflow_dispatch is the only
  # trigger, its `environment` input is required with a default of
  # "production", so this always carries a concrete "staging" or
  # "production". This only decides which GitHub Environment's OIDC
  # secrets get used and which resource group this run touches -- NOT the
  # frontend build mode or which Docker Hub image repo gets pulled. Both
  # of those are BUILD_ENV/image_suffix, computed by the `resolve-target`
  # job below from each target's own `ENVIRONMENT` Actions variable (see
  # that job's own comment for why).
  ENVIRONMENT: ${{ inputs.environment || 'production' }}
  RESOURCE_GROUP: ${{ (inputs.environment || 'production') == 'production' && secrets.PROD_RESOURCE_GROUP || secrets.STAGING_RESOURCE_GROUP }}
  # A blank image_tag means "build fresh" -- fall back to the commit SHA of
  # whatever ref this run was dispatched against, so build-push below and
  # the rest of this pipeline always have a concrete tag to work with even
  # though the human left the input blank. Supply an existing, already-
  # published tag (e.g. a version like "v1.4.2" cut by release.yml) to
  # deploy exactly that image instead.
  IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
  # NOTE: BACKEND_IMAGE/FRONTEND_IMAGE deliberately do NOT live here
  # anymore -- they used to be a ternary on `inputs.environment` alone
  # (the dropdown), which meant this GitHub Environment's own `ENVIRONMENT`
  # variable had zero effect on which Docker Hub repo got pulled (see
  # `resolve-target`'s `image_suffix` output comment for the bug this
  # caused). A workflow-level `env:` block like this one is evaluated
  # before any job runs and can't see a job's `needs.*` outputs, so
  # BACKEND_IMAGE/FRONTEND_IMAGE now get set per-job instead (`build-push`,
  # `migrate`, `deploy` below), each built from
  # `needs.resolve-target.outputs.image_suffix`.

jobs:
  resolve-target:
    name: Resolve build settings for the target environment
    runs-on: ubuntu-latest
    # Bound to the SAME GitHub Environment `migrate`/`deploy` (below) use,
    # purely so `vars.ENVIRONMENT` in the step below resolves to THAT
    # environment's own `ENVIRONMENT` Actions variable (Settings >
    # Environments > staging|production > Environment variables) instead
    # of the repo-level one -- a variable scoped to a GitHub Environment is
    # only visible to a job that declares `environment:` (see the
    # workflow_dispatch `environment` input's own comment above). This is
    # a separate job, not folded into `build-push`, because `build-push`
    # calls a reusable workflow (`uses:`) and GitHub does not allow
    # `environment:` on a job that does that -- see build-push's own
    # `with:` comment for the related "with: can't see env" restriction.
    #
    # NOTE: since this job (like `migrate`/`deploy`) is bound to the
    # target environment, any required-reviewers protection rule on
    # "production" now gates approval up to three times in one run (here,
    # then again on `migrate` and `deploy`) -- accepted trade-off for
    # reading that environment's own variable correctly.
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      build_env: ${{ steps.resolve.outputs.build_env }}
      # BUG FIX -- this used to be computed purely from the workflow_dispatch
      # `environment` dropdown ('staging' -> '-staging' suffix, 'production'
      # -> no suffix), completely independent of this GitHub Environment's
      # own `ENVIRONMENT` Actions variable. That meant setting
      # `ENVIRONMENT=production` under the "production" GitHub Environment
      # did nothing to image selection -- a `production` dropdown run with
      # that Environment's `ENVIRONMENT` variable left on `development` (or
      # never set) would still deploy PRODUCTION resources/secrets while
      # pulling the `-staging` Docker Hub images, and vice versa. Now BOTH
      # the deploy target (dropdown: which resource group/secrets) AND the
      # image repo (this `ENVIRONMENT` variable: which Docker Hub tag) are
      # explicit, independent choices you set per GitHub Environment --
      # `image_suffix` here is the single source of truth every downstream
      # job (`build-push`, `migrate`, `deploy`) now reads instead of
      # re-deriving it from `inputs.environment` itself.
      image_suffix: ${{ steps.resolve.outputs.image_suffix }}
      # Which of the two mutually exclusive frontend flavors this
      # environment ships: "react" (frontend/Dockerfile's
      # frontend-react-only target, the React "Ledger" SPA) or "legacy"
      # (frontend-legacy-only, the legacy static site) -- see that
      # Dockerfile's top-of-file comment for why there's no longer a
      # combined default. Two ways to control this, in priority order:
      #   1. This run's own `frontend_type` workflow_dispatch input, if
      #      set to anything other than "(environment default)" -- a
      #      one-off override for THIS run only, nothing persisted.
      #   2. Otherwise, this GitHub Environment's own FRONTEND_BUILD_TARGET
      #      Actions variable, independent of staging vs. production -- a
      #      legacy-only client's production Environment sets this without
      #      touching anything else.
      # See frontend-app/README.md's "Detaching this app" section.
      frontend_type: ${{ steps.resolve.outputs.frontend_type }}
      # Whether frontend_type above came from this run's own input or
      # fell back to the Environment variable -- see deploy-azure-vm.yml's
      # matching output for why this is surfaced separately.
      frontend_type_source: ${{ steps.resolve.outputs.frontend_type_source }}
    steps:
      - name: Read this environment's ENVIRONMENT + FRONTEND_BUILD_TARGET variables
        id: resolve
        # vars.ENVIRONMENT here is the Actions variable set on THIS run's
        # target GitHub Environment (staging or production), value
        # "production" or "development" -- the app's own build-type
        # vocabulary (see frontend/Dockerfile's own comment), matching
        # what's configured under Settings > Environments > <name> >
        # Environment variables. Drives TWO independent things from the
        # one value: `build_env` (frontend minified-only vs.
        # minified+obfuscated) and `image_suffix` (plain Docker Hub repo
        # vs. the `-staging` one). Infra default for both is "production":
        # anything other than exactly "development" (including the
        # variable not being set at all) resolves to "production"/no
        # suffix, so an unset/misconfigured variable never silently ships
        # an unobfuscated build OR silently pulls a `-staging` image into
        # what you thought was a real deploy.
        #
        # vars.FRONTEND_BUILD_TARGET is a separate, independent Actions
        # variable on the same Environment, value "react" or "legacy" --
        # which of the two mutually exclusive frontend images this
        # environment ships. There's no "ship everything" fail-safe
        # anymore (the old combined `frontend-final` target is gone) --
        # anything other than exactly "react" (including unset) resolves
        # to "legacy", chosen as the safe default because it's the
        # smaller, longer-proven surface. This run's own
        # `inputs.frontend_type` (the workflow_dispatch dropdown) takes
        # priority over that variable when explicitly set to "react" or
        # "legacy" -- its default value, "(environment default)", falls
        # straight through to the variable instead, so leaving the
        # dropdown alone reproduces this environment's standing
        # configuration exactly.
        env:
          RAW_ENVIRONMENT_VAR: ${{ vars.ENVIRONMENT }}
          RAW_FRONTEND_BUILD_TARGET: ${{ vars.FRONTEND_BUILD_TARGET }}
          RAW_FRONTEND_TYPE_INPUT: ${{ inputs.frontend_type }}
        run: |
          if [ "$RAW_ENVIRONMENT_VAR" = "development" ]; then
            echo "build_env=development" >> "$GITHUB_OUTPUT"
            echo "image_suffix=-staging" >> "$GITHUB_OUTPUT"
          else
            echo "build_env=production" >> "$GITHUB_OUTPUT"
            echo "image_suffix=" >> "$GITHUB_OUTPUT"
          fi

          if [ "$RAW_FRONTEND_TYPE_INPUT" = "react" ] || [ "$RAW_FRONTEND_TYPE_INPUT" = "legacy" ]; then
            echo "frontend_type=$RAW_FRONTEND_TYPE_INPUT" >> "$GITHUB_OUTPUT"
            echo "frontend_type_source=this run's frontend_type input" >> "$GITHUB_OUTPUT"
          elif [ "$RAW_FRONTEND_BUILD_TARGET" = "react" ]; then
            echo "frontend_type=react" >> "$GITHUB_OUTPUT"
            echo "frontend_type_source=this environment's FRONTEND_BUILD_TARGET variable" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_type=legacy" >> "$GITHUB_OUTPUT"
            echo "frontend_type_source=this environment's FRONTEND_BUILD_TARGET variable" >> "$GITHUB_OUTPUT"
          fi

  verify-ci:
    name: Verify CI already passed for this commit
    runs-on: ubuntu-latest
    # Same gate `ci` itself uses below -- only relevant on the
    # workflow_dispatch fresh-build path; release.yml's workflow_call path
    # already ran its own equivalent gate before ever calling this workflow.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
    permissions:
      actions: read
    outputs:
      already_passed: ${{ steps.check.outputs.already_passed }}
    steps:
      # PERFORMANCE FIX: `ci` below used to call ci.yml unconditionally on
      # every fresh-build deploy. Since ci.yml's `workflow_call` trigger has
      # no base commit to diff against, that ALWAYS fell through to "treat
      # every path as changed" (see ci.yml's own comment) -- a full re-run
      # of frontend tests, backend tests, both image builds, both Trivy
      # scans, and nginx-config validation, every single deploy, even
      # though this exact commit already paid for all of that once when it
      # was pushed to its branch. This step checks whether a "CI" run
      # already completed successfully for THIS EXACT commit SHA via a real
      # push -- if one has, `ci` below skips itself and this run goes
      # straight to build+push+deploy. Deliberately checks `event=push`
      # specifically (not any completed CI run for this SHA), so a
      # previous deploy's own full re-run can't be mistaken for an actual
      # independent validation.
      - name: Look up a prior successful CI run for this exact commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Falls back to "0" (i.e. "run CI") on any API hiccup -- only
          # ever SKIPS validation when it's positively confirmed already
          # happened.
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" --jq '.total_count' 2>/dev/null || echo "0")
          if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
            echo "Found an existing successful CI run for $SHA (already validated when this commit was pushed) -- skipping a redundant re-check."
            echo "already_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior successful push-triggered CI run found for $SHA -- running CI now."
            echo "already_passed=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI gate (fresh-build path only)
    # Only runs on a workflow_dispatch run building fresh (image_tag left
    # blank) -- release.yml's workflow_call path already ran this exact gate
    # itself before ever calling this workflow -- AND only when verify-ci
    # above couldn't find an already-passing CI run for this exact commit.
    # Reused via `uses:`, not copy-pasted -- see ci.yml.
    needs: [verify-ci]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' && needs.verify-ci.outputs.already_passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build + push both images (fresh-build path only)
    needs: [ci, resolve-target]
    # `always()` because a skipped `ci` (see its own `if:` above) would
    # otherwise skip this job too by GitHub's default needs-propagation --
    # explicitly allow through both a real ci success AND ci being skipped
    # for the same reason this job itself should be skipped.
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && needs.resolve-target.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
    permissions:
      contents: read
    # Delegates to build-push-images.yml -- the single source of truth for
    # how the backend/frontend images actually get built, shared with
    # release.yml and deploy-azure-vm.yml. See that file's own top-of-file
    # comment for the full "why".
    uses: ./.github/workflows/build-push-images.yml
    with:
      # NOTE: image_tags/build_env/trivy_blocking inline the full
      # $IMAGE_TAG ternary rather than referencing env.IMAGE_TAG -- the
      # `with:` block of a job that calls a reusable workflow (`uses:`)
      # can only reference the github/needs/inputs/vars/strategy/matrix
      # contexts, NOT `env`. Referencing `env.*` here parses but is
      # invalid at trigger time: GitHub rejects the entire workflow file
      # with "Unrecognized named-value: 'env'" and every run shows a bare
      # "Startup failure" with no job graph, before anything runs -- this
      # bit both this file and deploy-azure-vm.yml's own `build-push` job
      # the same way. See build-push-images.yml's own inputs for what each
      # of these feeds. build_env/image_suffix come from `needs` (job
      # outputs), which -- unlike `env` -- IS allowed here; see
      # resolve-target's own comment for why both have to be resolved in
      # a separate job.
      image_tags: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }} latest
      build_env: ${{ needs.resolve-target.outputs.build_env }}
      # backend + exactly the ONE frontend flavor this run resolved to
      # (needs.resolve-target.outputs.frontend_type: "react" or "legacy")
      # -- see deploy-azure-vm.yml's matching build_matrix comment. Image
      # names are built from frontend_type directly, so
      # "snipeit-lite-frontend-react"/"snipeit-lite-frontend-legacy" (plus
      # this environment's own `-staging` suffix, if any) -- see the
      # `migrate`/`deploy` jobs' own FRONTEND_IMAGE for the matching
      # pull-time name.
      build_matrix: |
        [
          {"service":"backend","dockerfile":"backend/Dockerfile","context":"backend","image_name":"snipeit-lite-backend${{ needs.resolve-target.outputs.image_suffix }}"},
          {"service":"frontend-${{ needs.resolve-target.outputs.frontend_type }}","dockerfile":"frontend/Dockerfile","context":".","target":"frontend-${{ needs.resolve-target.outputs.frontend_type }}-only","image_name":"snipeit-lite-frontend-${{ needs.resolve-target.outputs.frontend_type }}${{ needs.resolve-target.outputs.image_suffix }}"}
        ]
      # Trivy blocking follows the deploy TARGET (staging vs production --
      # a safety posture about which resource this run touches), not
      # BUILD_ENV (a frontend minification setting) -- the two happen to
      # usually agree but are conceptually independent, see this file's
      # top-of-file "WHAT DIFFERS" comment.
      trivy_blocking: ${{ (inputs.environment || 'production') == 'production' }}
    secrets: inherit

  migrate:
    name: Run database migrations
    # BUG FIX: this used to be `needs: [build-push]` and only checked
    # `needs.build-push.result`. `build-push` skips ITSELF (via its own
    # `if:` above) whenever `ci` didn't succeed -- including when `ci`
    # genuinely FAILED (e.g. Gitleaks catching a real secret). GitHub
    # reports that as `skipped`, identical to the legitimate "workflow_call/
    # existing-tag path, ci never even ran" case -- `migrate` couldn't tell
    # the two apart, so a real ci failure still let this job point the
    # `migrate` Container Apps Job at an image tag that was never actually
    # built/pushed, failing with InvalidParameterValueInContainerTemplate /
    # MANIFEST_UNKNOWN. Explicitly re-checking `needs.ci.result` too (not
    # just `needs.build-push.result`) is what lets this job distinguish
    # "ci was legitimately skipped" from "ci actually failed and
    # build-push's skip was just a symptom of that" -- only the first case
    # is safe to proceed on.
    #
    # Three independent gates ANDed together:
    #   - skip_migrate: the manual escape hatch, workflow_dispatch only
    #   - ci: must have actually succeeded if it ran at all
    #   - build-push: must have actually succeeded if it ran at all (fresh-
    #     build path) -- `always()` + explicit result checks because a
    #     needs: job that gets `if:`-skipped (the normal case on the
    #     workflow_call/existing-tag paths) would otherwise skip this job
    #     too via GitHub's default needs-propagation, blocking every
    #     release.yml-triggered production deploy.
    needs: [ci, build-push, resolve-target]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') && needs.resolve-target.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.skip_migrate) }}
    runs-on: ubuntu-latest
    # AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are configured
    # as per-environment secrets (see DEPLOYMENT.md step 5's table --
    # deliberately per-environment since staging and production use
    # separate Azure AD App Registrations/federated credentials, never the
    # same one). GitHub only injects an Environment's secrets into a job
    # that actually declares `environment:` -- without this, those three
    # `secrets.AZURE_*` references silently resolve to empty strings (not
    # an error at parse time), and azure/login@v3 fails at runtime with
    # "Not all values are present. Ensure 'client-id' and 'tenant-id' are
    # supplied" even though the secrets exist and are correctly named.
    #
    # NOTE: this has to recompute the ternary rather than reference
    # `env.ENVIRONMENT` -- the job-level `environment:` key only supports
    # the github/needs/inputs/vars/strategy/matrix contexts, NOT `env`.
    # Referencing `env.ENVIRONMENT` here parses, but is invalid at trigger
    # time -- GitHub reports it as a bare "Startup failure" with no job
    # graph at all, since the whole workflow file fails validation before
    # any job runs. See deploy-azure-vm.yml's `environment:` line for the
    # same pattern (it uses `inputs.environment`, never `env.*`).
    environment: ${{ inputs.environment || 'production' }}
    # BACKEND_IMAGE now built from resolve-target's `image_suffix` output
    # (this GitHub Environment's own `ENVIRONMENT` variable), not from
    # `inputs.environment` -- see that job's output comment. Job-level
    # `env:` CAN reference `needs.*`, unlike the workflow-level `env:`
    # block above (which is why this couldn't just live there).
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend${{ needs.resolve-target.outputs.image_suffix }}
    steps:
      - name: Validate image_tag looks like a version tag (production only)
        if: ${{ env.ENVIRONMENT == 'production' }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::warning::image_tag '$IMAGE_TAG' doesn't look like a v*.*.* version tag -- continuing anyway (useful for hotfix/manual tags), but double check this is intentional."
          fi

      # Needed now (wasn't before) -- this job runs aca-blue-green.sh's
      # `reap` subcommand out of .github/scripts/ below, same reason
      # `deploy` already checks out the repo.
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # BUG FIX / INCIDENT RESPONSE: `deploy` (below) already reaps
      # orphaned revisions before its own rollout, but `migrate` runs
      # BEFORE `deploy` in this pipeline -- a fix that only reaps inside
      # `deploy` reaps too late to help `alembic upgrade head` itself,
      # which is exactly the failure this step exists to prevent. A
      # revision stuck ACTIVE at 0% traffic from a previous failed/
      # interrupted deploy holds its own DB connection pool open
      # regardless of which job is running; on a small Postgres SKU (e.g.
      # Standard_B1ms, max_connections ~50) a handful of these is enough
      # to leave nothing for alembic's own connection, which then fails
      # with a plain "Migration status: Failed" and no more specific
      # detail in this job's own log (the real Postgres-side error only
      # shows up in the migrate CONTAINER's logs -- see "Dump migration
      # job logs (on failure)" below). Reaping here, before the migration
      # even starts, is what actually protects it.
      - name: Reap any orphaned revisions before running migrations
        run: |
          bash .github/scripts/aca-blue-green.sh reap backend "$RESOURCE_GROUP" 20
          bash .github/scripts/aca-blue-green.sh reap frontend "$RESOURCE_GROUP" 20

      - name: Point the migrate job at the new backend image
        run: |
          az containerapp job update \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Run alembic upgrade head (against the OLD, still-live `backend`)
        run: |
          az containerapp job start --name migrate --resource-group "$RESOURCE_GROUP" --output json > job-run.json
          EXECUTION_NAME=$(jq -r '.name' job-run.json)
          echo "Started migration execution: $EXECUTION_NAME"

      # infra/main.bicep's `migrateJob` is configured with `replicaTimeout:
      # 600` (10 minutes) -- Azure itself won't kill a healthy execution
      # before that. Polling window here is 45 x 15s = 675s, a bit past
      # that 600s replicaTimeout so Azure's own timeout is always what
      # actually fires first, plus headroom for the job to be scheduled/
      # start pulling its image before its first status even shows up here.
      - name: Wait for migration to complete
        run: |
          for i in $(seq 1 45); do
            STATUS=$(az containerapp job execution list \
              --name migrate --resource-group "$RESOURCE_GROUP" \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ]; then echo "::error::Migration failed"; exit 1; fi
            sleep 15
          done
          echo "::error::Migration did not reach Succeeded/Failed within 675s (job's own replicaTimeout is 600s, so this means Azure itself hasn't resolved it yet -- check the job's execution logs, it may still be genuinely stuck)"
          exit 1

      # azure/login@v3 at the top of this job exchanges a GitHub Actions
      # OIDC token for an Azure AD access token via a client assertion
      # that's only valid for a few minutes (observed: ~5 minutes) from
      # when it was minted -- NOT for the lifetime of the job. "Wait for
      # migration to complete" above can poll for up to 675s (11m15s), so
      # by the time a failure reaches this step the original assertion has
      # commonly already expired, and every `az` call below would fail with
      # "AADSTS700024: Client assertion is not within its valid time
      # range". Re-authenticating here mints a fresh token right before
      # it's actually used.
      - name: Re-authenticate (previous login may have expired during the wait above)
        if: failure()
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Dump migration job logs (on failure)
        if: failure()
        run: |
          EXECUTION_NAME=$(az containerapp job execution list \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" -o tsv)
          echo "::group::migrate job execution: $EXECUTION_NAME"
          az containerapp job execution show \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --job-execution-name "$EXECUTION_NAME" -o json || true
          echo "::endgroup::"
          echo "::group::migrate container logs"
          az containerapp job logs show \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --container migrate --tail 200 || \
            echo "Could not fetch logs via 'az containerapp job logs show' -- check Log Analytics (workspace: \${namePrefix}-logs) or the Azure Portal's 'migrate' Container Apps Job > Execution history directly."
          echo "::endgroup::"

  deploy:
    name: Roll out new revisions
    # BUG FIX: same class of bug as `migrate` above, one hop further down
    # the chain -- this used to be `needs: [migrate]`, checking only
    # `needs.migrate.result`. `migrate` can itself report `skipped` for two
    # very different reasons: `skip_migrate: true` (fine, proceed) or `ci`/
    # `build-push` actually failed upstream (NOT fine -- there's no new
    # image to roll out to). Re-checking `needs.ci.result` and
    # `needs.build-push.result` explicitly, not just `needs.migrate.result`,
    # is what stops a real ci failure from reaching all the way down to
    # `az containerapp update` with a backend/frontend image tag that was
    # never actually pushed.
    #
    # `always()` + explicit success-or-skipped so this still runs when
    # `migrate` was deliberately skipped via skip_migrate above (by
    # default, a skipped dependency skips everything downstream of it too).
    needs: [ci, build-push, resolve-target, migrate]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') && needs.resolve-target.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    # See `migrate`'s `environment:` line above for why this recomputes the
    # ternary instead of referencing `env.ENVIRONMENT`.
    environment: ${{ inputs.environment || 'production' }}
    # See `migrate`'s matching `env:` comment -- same reasoning, both
    # images needed here for the backend/frontend rollout steps below.
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend${{ needs.resolve-target.outputs.image_suffix }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-frontend-${{ needs.resolve-target.outputs.frontend_type }}${{ needs.resolve-target.outputs.image_suffix }}
    steps:
      # Needed now (wasn't before) -- this job runs aca-blue-green.sh out of
      # .github/scripts/, unlike every other step here, which only ever
      # shelled out to `az`/`curl` and had no file dependency on the repo.
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # BUG FIX / INCIDENT RESPONSE: a rollout that fails its health gate is
      # supposed to self-clean via aca-blue-green.sh's own deactivate call,
      # but that call needs a still-valid Azure login -- and a single gate-1
      # wait alone can run up to 400s, well past how long an OIDC-exchanged
      # token stays usable here (see "Re-authenticate" steps below for the
      # same observation). When that cleanup call itself fails, the bad
      # revision is left ACTIVE at 0% traffic forever -- invisible in the
      # UI's "healthy vs not" sense, but still a live replica holding its
      # own DB connection pool open. Several of these accumulating across
      # separate failed runs is exactly what exhausted the target Postgres
      # server's connection budget in this incident (FATAL: "remaining
      # connection slots are reserved for roles with the SUPERUSER
      # attribute"). Running this at the START of every deploy -- before
      # touching anything else -- means any leak from a PREVIOUS run (this
      # one or a colleague's) gets cleaned up automatically before it can
      # compound further, rather than requiring someone to notice and clean
      # it up by hand. 20-minute grace window: comfortably longer than any
      # legitimate in-progress rollout this script itself would produce, so
      # this can never touch a revision that's still genuinely mid-deploy.
      - name: Reap any orphaned revisions left over from a previous failed/interrupted deploy
        run: |
          bash .github/scripts/aca-blue-green.sh reap backend "$RESOURCE_GROUP" 20
          bash .github/scripts/aca-blue-green.sh reap frontend "$RESOURCE_GROUP" 20

      - name: Snapshot currently-live images (for the summary + manual-rollback reference)
        id: previous
        # BUG FIX (unrelated to blue-green): this used to be
        # `if: env.ENVIRONMENT == 'production'` -- fine when a failed
        # staging deploy had nothing worth rolling back to anyway (see this
        # file's old top-of-file "WHAT DIFFERS" comment), but now that
        # `rollback` below is a traffic-weight flip rather than a redeploy,
        # it's cheap and useful on staging too -- capture it unconditionally.
        run: |
          PREV_BACKEND=$(az containerapp show --name backend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.template.containers[0].image" -o tsv)
          PREV_FRONTEND=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.template.containers[0].image" -o tsv)
          echo "backend_image=$PREV_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$PREV_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Currently-live before this deploy: backend=$PREV_BACKEND frontend=$PREV_FRONTEND"

      # Live rollout dashboard -- the ACA-path equivalent of the VM path's
      # /_deploy/ page (see docker-compose.vm.yml/blue-green-deploy.sh).
      # `frontend`'s nginx proxies status.json/checks.log LIVE, per-request,
      # from the `deploy-status` Blob container (infra/main.bicep) at
      # https://<domain>/_deploy/ -- see nginx/default.conf.template's own
      # /_deploy/ comment (this used to be an Azure Files mount; ACA
      # rejects the mount option that approach needed, and doesn't support
      # mounting Blob Storage as a volume at all -- see
      # infra/main.bicep's `deployStatusContainer` comment for the full
      # history). Every `az storage account list` here assumes exactly one
      # storage account per resource group -- true given main.bicep only
      # ever declares the one (`storage`) -- rather than trying to
      # reproduce Bicep's own name-generation formula in bash. Best-effort
      # throughout: see .github/scripts/aca-deploy-status.sh's own
      # top-of-file comment -- nothing here can fail this job; a
      # storage/dashboard hiccup only ever produces a warning.
      - name: Write ACA deploy status - init
        env:
          DEPLOY_STATUS_USER: ${{ secrets.DEPLOY_STATUS_USER }}
          DEPLOY_STATUS_PASSWORD_APR1_HASH: ${{ secrets.DEPLOY_STATUS_PASSWORD_APR1_HASH }}
        run: |
          STORAGE_ACCOUNT=$(az storage account list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "::warning::No storage account found in $RESOURCE_GROUP -- skipping deploy-status dashboard for this run (the rollout itself is unaffected). Re-run infra-deploy.yml if this environment predates the deploy-status container."
          else
            echo "storage_account=$STORAGE_ACCOUNT" >> "$GITHUB_ENV"
            bash .github/scripts/aca-deploy-status.sh init "$STORAGE_ACCOUNT" "$RUNNER_TEMP/aca-deploy-status"
          fi

      # CLIENT'S-EYE EVIDENCE, separate from and running the WHOLE TIME
      # alongside every gate below. `aca-blue-green.sh` (and the "Smoke
      # test" step further down) already prove the platform's own view --
      # each revision's readiness probe, then one end-to-end check once
      # both apps are at 100%. Neither of those proves a REAL request
      # against the live domain was never dropped or slowed down DURING
      # the traffic ramp itself -- only an independent poller, hitting the
      # same public URL a real user would, on its own clock, for the
      # entire rollout, can prove that. scripts/poll-live-endpoint.sh is
      # that poller (see its own header comment) -- start it here,
      # backgrounded, before either rollout begins, and stop it only after
      # "Spin down the old slots" below, so it's running for gates 1-3 of
      # BOTH apps' rollouts, not just part of them.
      - name: Start continuous endpoint poll (zero-downtime evidence)
        id: poll_start
        run: |
          FQDN=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)
          mkdir -p evidence
          POLL_OUT="evidence/poll-aca-${ENVIRONMENT}-${{ github.run_id }}.csv"
          echo "poll_out=$POLL_OUT" >> "$GITHUB_OUTPUT"
          nohup bash scripts/poll-live-endpoint.sh \
            --url "https://$FQDN/" --interval 1 --out "$POLL_OUT" \
            > evidence/poll.log 2>&1 &
          echo $! > evidence/poll.pid
          echo "Polling https://$FQDN/ every 1s in the background (PID $(cat evidence/poll.pid)) -- will run through both rollouts and the smoke test below."

      # BLUE-GREEN ROLLOUT (replaces the old Single-revision-mode "update
      # in place + wait for Healthy" pair of steps). See
      # .github/scripts/aca-blue-green.sh's top-of-file comment for the full
      # mechanics -- in short, per app: create an incoming ("blue")
      # revision at 0% traffic → wait for ITS OWN readiness probe (the
      # replica running its own /readyz+/healthz as it actually receives
      # this push, not just trusting the CI gate that already ran against
      # the built image) → (frontend only, since it's the one app with a
      # public FQDN per revision) a direct smoke test against that
      # revision's own slot → walk traffic across it in steps, re-checking
      # health at each one. The active ("green") revision is left ACTIVE
      # at 0% traffic, not deactivated yet -- see "Spin down the old
      # slots" below for why that waits until AFTER the end-to-end smoke
      # test. Once finalized, the revision that was "blue" for this
      # rollout is simply "green" (the active role) for the next one --
      # see blue-green.md for the fixed-role naming this repo uses
      # everywhere (both here and on the VM path).
      #
      # Canary steps differ by environment for the same reason the old
      # "production only" readiness wait did: staging runs min replicas 0
      # (scale-to-zero), so there's no standing traffic a gradual shift
      # protects -- one jump straight to 100% once the incoming revision
      # is proven healthy is exactly as safe there and keeps staging
      # deploys fast. Production walks 10% → 25% → 50% → 75% → 100%,
      # re-verifying health after each step, since real users are on the
      # other side of that weight -- same five-step ramp
      # scripts/blue-green-deploy.sh
      # uses on the VM path.
      - name: Blue-green rollout - backend
        id: backend_rollout
        run: |
          [ -n "${storage_account:-}" ] && bash .github/scripts/aca-deploy-status.sh write "rolling_out_backend" \
            "\"apps\": {\"backend\": {\"traffic_to_incoming_pct\": 0}}" 2>/dev/null || true
          if [ "$ENVIRONMENT" = "production" ]; then
            CANARY_STEPS="10,25,50,75,100"; STEP_WAIT=20
          else
            CANARY_STEPS="100"; STEP_WAIT=5
          fi
          bash .github/scripts/aca-blue-green.sh rollout \
            backend "$RESOURCE_GROUP" "$BACKEND_IMAGE:$IMAGE_TAG" \
            "$CANARY_STEPS" "$STEP_WAIT" false

      # BUG FIX: `backend_rollout` alone (gate 1 wait up to 400s, plus a
      # five-step gate 3 traffic ramp on production, each step re-checked)
      # can comfortably run past the ~5-minute window this workflow's own
      # "Re-authenticate" steps already document as this OIDC login's
      # observed usable lifetime. Without a fresh login here, `frontend`'s
      # OWN rollout -- including its self-cleanup `deactivate` call on a
      # failed gate -- silently runs against an expired token, which is
      # the exact mechanism that left several `backend` revisions
      # permanently stuck ACTIVE (and leaking DB connections) in this
      # incident. Cheap to always re-run, harmless if the previous login
      # was still valid.
      - name: Re-authenticate before the frontend rollout (backend's may have run long)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only runs if `backend_rollout` succeeded (GitHub Actions' default:
      # a step with no `if:` is skipped once an earlier step in the same
      # job fails) -- no reason to roll `frontend` forward to point at a
      # `backend` slot that just failed its own rollout and was already
      # rolled back internally by the script.
      - name: Blue-green rollout - frontend
        id: frontend_rollout
        run: |
          [ -n "${storage_account:-}" ] && bash .github/scripts/aca-deploy-status.sh write "rolling_out_frontend" \
            "\"apps\": {\"backend\": {\"active_revision\": \"${{ steps.backend_rollout.outputs.active_revision }}\", \"incoming_revision\": \"${{ steps.backend_rollout.outputs.incoming_revision }}\", \"traffic_to_incoming_pct\": 100}, \"frontend\": {\"traffic_to_incoming_pct\": 0}}" 2>/dev/null || true
          if [ "$ENVIRONMENT" = "production" ]; then
            CANARY_STEPS="10,25,50,75,100"; STEP_WAIT=20
          else
            CANARY_STEPS="100"; STEP_WAIT=5
          fi
          bash .github/scripts/aca-blue-green.sh rollout \
            frontend "$RESOURCE_GROUP" "$FRONTEND_IMAGE:$IMAGE_TAG" \
            "$CANARY_STEPS" "$STEP_WAIT" true

      # Final end-to-end gate, now running with BOTH apps already at 100%
      # traffic on their new revisions (each individually health-gated on
      # the way there by the steps above) -- this is what actually proves
      # the whole chain works together, not just that each app passed its
      # own probe in isolation. A failure here is the one case
      # aca-blue-green.sh's own internal rollback (mid-rollout) can't catch
      # by itself, since each app looked healthy on its own -- see "Roll
      # back on smoke test failure" below for how this case recovers.
      - name: Smoke test
        id: smoke
        run: |
          [ -n "${storage_account:-}" ] && bash .github/scripts/aca-deploy-status.sh write "smoke_testing" \
            "\"apps\": {\"backend\": {\"active_revision\": \"${{ steps.backend_rollout.outputs.active_revision }}\", \"incoming_revision\": \"${{ steps.backend_rollout.outputs.incoming_revision }}\", \"traffic_to_incoming_pct\": 100}, \"frontend\": {\"active_revision\": \"${{ steps.frontend_rollout.outputs.active_revision }}\", \"incoming_revision\": \"${{ steps.frontend_rollout.outputs.incoming_revision }}\", \"traffic_to_incoming_pct\": 100}}" 2>/dev/null || true
          FQDN=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Testing https://$FQDN ($ENVIRONMENT, both apps at 100% on their new revisions)"
          # `curl` has no timeout by default, so a request that connects but
          # then just never gets a response (as opposed to an outright
          # connection failure) hangs indefinitely instead of failing.
          # `--connect-timeout 30`: generous for establishing the TCP/TLS
          # connection to Container Apps ingress itself (this part is never
          # slow, even on a cold start -- ingress always answers, only the
          # app behind it might not be up yet).
          # `--max-time 90` + `--retry 5 --retry-delay 5`: bounds the ENTIRE
          # request (connect + wait for first byte + transfer), covering a
          # scale-from-zero cold start on staging, with up to 6 bounded
          # attempts -- worst case here is ~6 * (90 + 5) = 570s (~9.5 min)
          # instead of unbounded.
          curl -f -s -S --connect-timeout 30 --max-time 90 \
               --retry 5 --retry-delay 5 --retry-connrefused --retry-max-time 570 \
               -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               "https://$FQDN/"

          # Hits backend THROUGH frontend's reverse proxy -- proves nginx's
          # /api/ location block is actually reaching `backend` internally,
          # not just that frontend serves static files. Expects 200 (a
          # stale valid session cookie) or 401 (the normal "not logged in"
          # response, and specifically NOT an HTML error page) -- either
          # proves the request actually reached FastAPI and got a real JSON
          # response.
          curl -f -s -S --connect-timeout 30 --max-time 60 \
               "https://$FQDN/api/auth/me" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               | grep -qE "200|401" || {
                 echo "::error::GET /api/auth/me did not return 200 or 401 -- backend is unreachable through frontend's /api/ proxy. Falling through to the log-dump step below."
                 exit 1
               }

      # azure/login@v3 at the top of this job exchanges a GitHub Actions
      # OIDC token for an Azure AD access token via a client assertion
      # that's only valid for a few minutes from when it was minted -- NOT
      # for the lifetime of the job. The rollouts + smoke test above can
      # together run for several minutes, so by the time a failure reaches
      # this step the original assertion is commonly already expired.
      # Re-authenticating here mints a fresh token right before it's used
      # by this step and the rollback/log-dump steps that follow it.
      - name: Re-authenticate (previous login may have expired during the steps above)
        if: always() && job.status != 'success'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only the SMOKE TEST failure case needs an explicit rollback here --
      # if `backend_rollout`/`frontend_rollout` itself failed,
      # aca-blue-green.sh already flipped traffic back to the old revision
      # and deactivated the bad one internally before returning failure
      # (see that script's `rollout` subcommand). This step only fires for
      # the one failure mode that script can't self-detect: both apps
      # individually reported healthy and reached 100% traffic, but the
      # END-TO-END check above then failed anyway.
      #
      # Each app is rolled back independently and only if IT actually
      # finished its own rollout (`steps.*_rollout.outcome == 'success'`)
      # -- e.g. if `backend_rollout` succeeded but `frontend_rollout` itself
      # failed (and self-rolled-back), there is nothing here left to roll
      # back for frontend, and `smoke` never even ran (GitHub Actions skips
      # a no-`if:` step once an earlier one fails), so `backend`'s own
      # rollback condition below doesn't fire either -- `backend` is
      # deliberately LEFT on its new revision rather than also rolled back.
      # That's safe by the same "migrate first, only ever ADD" contract
      # this pipeline already depends on elsewhere (see README.md's CI/CD
      # section) -- a new `backend` must already tolerate the OLD
      # `frontend` calling it, since that's exactly the combination live
      # for the whole middle of every normal rollout, blue-green or not.
      - name: Roll back backend on smoke test failure
        if: ${{ failure() && steps.backend_rollout.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        run: |
          echo "::warning::Smoke test failed -- flipping backend traffic back to ${{ steps.backend_rollout.outputs.active_revision }}"
          bash .github/scripts/aca-blue-green.sh rollback backend "$RESOURCE_GROUP" \
            "${{ steps.backend_rollout.outputs.active_revision }}" "${{ steps.backend_rollout.outputs.incoming_revision }}"

      - name: Roll back frontend on smoke test failure
        if: ${{ failure() && steps.frontend_rollout.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        run: |
          echo "::warning::Smoke test failed -- flipping frontend traffic back to ${{ steps.frontend_rollout.outputs.active_revision }}"
          bash .github/scripts/aca-blue-green.sh rollback frontend "$RESOURCE_GROUP" \
            "${{ steps.frontend_rollout.outputs.active_revision }}" "${{ steps.frontend_rollout.outputs.incoming_revision }}"

      # Covers every failure path this job can take -- aca-blue-green.sh's
      # own internal rollback (backend_rollout/frontend_rollout itself
      # failing) as well as the smoke-test rollback steps just above --
      # with one final write so the dashboard doesn't get stuck showing
      # "smoke testing"/"rolling out" forever after a failed run.
      #
      # BUG FIX: this used to be gated on `failure() && (...outcome ==
      # 'failure')`, which is FALSE for a run that was CANCELLED (a
      # manual cancel from the Actions tab, or GitHub's own job-timeout
      # cancellation) rather than one where a step actually reported
      # failure -- `failure()` only reflects the latter. That left
      # /_deploy/ frozen forever on whatever phase happened to be written
      # last (commonly "rolling_out_backend" from seconds into the run,
      # with an empty checks log, since a cancelled run never gets as far
      # as its first health-check pass/fail either) -- indistinguishable
      # from a genuinely still-in-progress deploy, because nothing ever
      # told the dashboard the run was over. `job.status` (GitHub's own
      # running tally of this job's outcome, readable mid-job -- see
      # https://docs.github.com/actions/learn-github-actions/contexts#job-context)
      # is "success", "failure", or "cancelled" -- catching "not success"
      # covers both in one place, regardless of which specific step was
      # the one that failed or got interrupted.
      - name: Write ACA deploy status - failed or cancelled
        if: always() && job.status != 'success'
        run: |
          PHASE="failed"
          [ "${{ job.status }}" = "cancelled" ] && PHASE="cancelled"
          [ -n "${storage_account:-}" ] && bash .github/scripts/aca-deploy-status.sh write "$PHASE" \
            "\"note\": \"deploy job ended with status: ${{ job.status }}\"" 2>/dev/null || true

      - name: Dump backend/frontend logs (on rollout or smoke test failure)
        if: failure() && (steps.backend_rollout.outcome == 'failure' || steps.frontend_rollout.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          # Tries a live tail first (useful when a replica came up but is
          # degraded), then ALWAYS follows up with a real Log Analytics KQL
          # query for the last 15 minutes of console output from both apps
          # -- the same query a human would have to run by hand otherwise.
          # The live tail alone isn't enough on staging: both `backend` and
          # `frontend` run min replicas 0, so the most common failure this
          # step exists to diagnose -- a new revision that never passes its
          # readiness probe and gets scaled back to 0 -- is exactly the
          # case where there's no live replica for `logs show` to tail.
          ENV_NAME=$(az containerapp env list --resource-group "$RESOURCE_GROUP" \
                       --query "[0].name" -o tsv)
          WORKSPACE_ID=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RESOURCE_GROUP" \
                            --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv)

          for APP in backend frontend; do
            echo "::group::$APP container logs (live tail, last 200 lines)"
            az containerapp logs show --name "$APP" --resource-group "$RESOURCE_GROUP" --tail 200 || \
              echo "Could not fetch logs via 'az containerapp logs show' -- no live replica (expected if the revision never passed its readiness probe). Falling through to the Log Analytics query below."
            echo "::endgroup::"
          done

          if [ -n "$WORKSPACE_ID" ]; then
            for APP in backend frontend; do
              echo "::group::$APP console logs from Log Analytics (last 15 minutes)"
              az monitor log-analytics query --workspace "$WORKSPACE_ID" \
                --analytics-query "ContainerAppConsoleLogs_CL | where ContainerAppName_s == '$APP' | where TimeGenerated > ago(15m) | project TimeGenerated, Log_s | order by TimeGenerated desc | take 100" \
                --output table || echo "Log Analytics query failed for $APP -- check the '$ENV_NAME' Container Apps Environment's Log Analytics workspace directly in the Azure Portal."
              echo "::endgroup::"
            done
          else
            echo "::warning::Could not resolve the Log Analytics workspace customerId for environment '$ENV_NAME' -- check the Azure Portal's Container Apps Environment > Log stream directly."
          fi

          echo "::group::backend revision status"
          az containerapp revision list --name backend --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, healthState:properties.healthState, runningState:properties.runningState, replicas:properties.replicas}" \
            -o table || true
          echo "::endgroup::"
          echo "::group::frontend revision status"
          az containerapp revision list --name frontend --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, healthState:properties.healthState, runningState:properties.runningState, replicas:properties.replicas}" \
            -o table || true
          echo "::endgroup::"

      # "Spin down the other slot" -- the last step of the blue-green
      # lifecycle, and deliberately its own step rather than something each
      # rollout does for itself the moment IT reaches 100%: waiting until
      # here means the old revision for BOTH apps stays fully intact and
      # instantly reachable (just a traffic-weight flip away, no cold start,
      # no redeploy) for as long as there's still any chance this run fails
      # -- right up until the end-to-end smoke test above has actually
      # passed. Only reachable if every step before it succeeded (no `if:`
      # override needed -- see GitHub Actions' default step behavior noted
      # earlier in this job).
      - name: Spin down the old slots
        run: |
          bash .github/scripts/aca-blue-green.sh finalize backend "$RESOURCE_GROUP" \
            "${{ steps.backend_rollout.outputs.active_revision }}"
          bash .github/scripts/aca-blue-green.sh finalize frontend "$RESOURCE_GROUP" \
            "${{ steps.frontend_rollout.outputs.active_revision }}"
          [ -n "${storage_account:-}" ] && bash .github/scripts/aca-deploy-status.sh write "done" \
            "\"apps\": {\"backend\": {\"active_revision\": \"${{ steps.backend_rollout.outputs.incoming_revision }}\", \"incoming_revision\": null, \"traffic_to_incoming_pct\": 0}, \"frontend\": {\"active_revision\": \"${{ steps.frontend_rollout.outputs.incoming_revision }}\", \"incoming_revision\": null, \"traffic_to_incoming_pct\": 0}}" \
            2>/dev/null || true

      # `always()` so this runs and the evidence gets uploaded even if an
      # earlier step failed -- a poll log covering a FAILED rollout (e.g.
      # what the live domain actually did while a rollback was in
      # progress) is exactly as valuable as one covering a clean success,
      # arguably more so. SIGTERM (not kill -9) so
      # scripts/poll-live-endpoint.sh's own EXIT/TERM trap gets to run --
      # that's what writes the pass/fail/error summary to evidence/poll.log
      # instead of just leaving a bare CSV with no totals.
      - name: Stop continuous endpoint poll and collect evidence
        id: poll_stop
        if: always() && steps.poll_start.outcome == 'success'
        run: |
          if [ -f evidence/poll.pid ]; then
            PID="$(cat evidence/poll.pid)"
            kill -TERM "$PID" 2>/dev/null || true
            # Give the trap a moment to flush the summary before we read it.
            for _ in $(seq 1 5); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
          fi
          echo "::group::Live-endpoint poll summary (client's-eye view of the whole rollout)"
          cat evidence/poll.log || echo "No poll.log found."
          echo "::endgroup::"
          POLL_OUT="${{ steps.poll_start.outputs.poll_out }}"
          if [ -f "$POLL_OUT" ] && grep -q ',FAIL$\|,ERROR$' "$POLL_OUT"; then
            echo "::error::Live-endpoint poll recorded at least one FAIL/ERROR during this rollout -- see evidence/poll.log above and the uploaded CSV artifact. This means a real client-facing request did NOT get an uninterrupted response during cutover, even though every internal health gate passed."
            exit 1
          fi
          echo "Zero dropped/failed requests against the live endpoint for the full rollout -- see the uploaded CSV artifact for the full record."

      - name: Upload live-endpoint poll evidence
        if: always() && steps.poll_start.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: zero-downtime-poll-evidence-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      - name: Summarize this deploy
        if: success()
        run: |
          {
            echo "## Deployed to ACA ($ENVIRONMENT) :rocket:"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Environment** | \`$ENVIRONMENT\` |"
            echo "| **Image tag** | \`$IMAGE_TAG\` |"
            echo "| **Backend image** | \`$BACKEND_IMAGE:$IMAGE_TAG\` |"
            echo "| **Frontend image** | \`$FRONTEND_IMAGE:$IMAGE_TAG\` |"
            echo "| **Frontend build mode** | \`${{ needs.resolve-target.outputs.build_env }}\`${{ (github.event_name == 'workflow_dispatch' && inputs.image_tag != '') && ' _(reused an existing image -- not rebuilt this run, so this reflects whatever mode that image was originally built with, not necessarily this environment’s current `ENVIRONMENT` variable)_' || '' }} |"
            echo "| **Frontend type** | \`${{ needs.resolve-target.outputs.frontend_type }}\`${{ needs.resolve-target.outputs.frontend_type == 'legacy' && ' _(legacy static site -- no React "Ledger" SPA in this image)_' || ' _(React "Ledger" SPA)_' }}${{ (github.event_name == 'workflow_dispatch' && inputs.image_tag != '') && ' _(reused an existing image -- reflects whatever flavor that image was originally built with)_' || format(' _(via {0})_', needs.resolve-target.outputs.frontend_type_source) }} |"
            echo "| **Deployed by** | @${{ github.actor }} |"
            echo "| **Previously live** | \`${{ steps.previous.outputs.backend_image }}\` / \`${{ steps.previous.outputs.frontend_image }}\` |"
            echo ""
            echo "### Blue-green rollout"
            echo ""
            echo "| App | Previous (green, spun down) | Now live (was blue, now green) |"
            echo "|---|---|---|"
            echo "| backend | \`${{ steps.backend_rollout.outputs.active_revision || 'n/a -- first deploy' }}\` | \`${{ steps.backend_rollout.outputs.incoming_revision }}\` |"
            echo "| frontend | \`${{ steps.frontend_rollout.outputs.active_revision || 'n/a -- first deploy' }}\` | \`${{ steps.frontend_rollout.outputs.incoming_revision }}\` |"
            echo ""
            echo "Monitor any revision live: \`bash .github/scripts/aca-blue-green.sh status <app> $RESOURCE_GROUP --watch\`"
          } >> "$GITHUB_STEP_SUMMARY"
