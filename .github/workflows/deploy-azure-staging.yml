# .github/workflows/deploy-azure-staging.yml
# -----------------------------------------------------------------------------
# Mirrors deploy-azure-production.yml but triggers on `develop` and targets
# the staging resource group/environment. Same cost-optimized shape (3
# Container Apps: frontend/backend/redis, two Docker Hub images, plus a
# standalone Azure Database for PostgreSQL Flexible Server) -- see
# infra/main.bicep's top-of-file comment. Staging's `backend` AND `frontend`
# are both provisioned with min replicas 0 (see infra-deploy.yml) -- pure
# scale-to-zero, a cold start on the first request after idle, effectively
# free compute the rest of the time.
# -----------------------------------------------------------------------------
name: Deploy to Azure (Staging)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ secrets.STAGING_RESOURCE_GROUP }}
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend-staging
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-frontend-staging

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build + push both images
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            context: backend
            image_env: BACKEND_IMAGE
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: .
            image_env: FRONTEND_IMAGE
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image name
        id: img
        run: echo "name=${{ matrix.image_env == 'BACKEND_IMAGE' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}" >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.service }} image
        run: |
          docker build -f ${{ matrix.dockerfile }} \
                       -t ${{ steps.img.outputs.name }}:$IMAGE_TAG \
                       -t ${{ steps.img.outputs.name }}:latest \
                       ${{ matrix.context }}
          docker push ${{ steps.img.outputs.name }}:$IMAGE_TAG
          docker push ${{ steps.img.outputs.name }}:latest

      - name: Trivy scan (report-only -- staging doesn't block on findings)
        # Pinned to the commit SHA behind the verified-safe v0.35.0 release,
        # not a mutable tag -- see ci.yml's backend Trivy step for why.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ env.IMAGE_TAG }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  migrate:
    name: Run database migrations
    needs: [build-push]
    runs-on: ubuntu-latest
    # AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are configured
    # as per-environment secrets (see DEPLOYMENT.md step 5's table --
    # deliberately per-environment since staging and production use
    # separate Azure AD App Registrations/federated credentials, never the
    # same one). GitHub only injects an Environment's secrets into a job
    # that actually declares `environment:` -- without this, those three
    # `secrets.AZURE_*` references silently resolve to empty strings (not
    # an error at parse time), and azure/login@v2 fails at runtime with
    # "Not all values are present. Ensure 'client-id' and 'tenant-id' are
    # supplied" even though the secrets exist and are correctly named.
    # infra-deploy.yml already gets this right (`environment:
    # ${{ github.event.inputs.target }}`) -- this brings the two per-push
    # deploy jobs below (migrate, deploy) in line with it.
    environment: staging
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the migrate job at the new backend image
        run: |
          az containerapp job update \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Run alembic upgrade head
        run: |
          az containerapp job start --name migrate --resource-group "$RESOURCE_GROUP" --output json > job-run.json
          EXECUTION_NAME=$(jq -r '.name' job-run.json)
          echo "Started migration execution: $EXECUTION_NAME"

      # See deploy-azure-production.yml's matching step for why this is
      # 45 x 15s (675s) rather than the old 30 x 10s (300s) -- the job's own
      # `replicaTimeout` in infra/main.bicep is 600s, which is longer than
      # the old window, so a healthy-but-slow migration could get reported
      # as "timed out" here even though Azure hadn't actually killed it.
      - name: Wait for migration to complete
        run: |
          for i in $(seq 1 45); do
            STATUS=$(az containerapp job execution list \
              --name migrate --resource-group "$RESOURCE_GROUP" \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ]; then echo "::error::Migration failed"; exit 1; fi
            sleep 15
          done
          echo "::error::Migration did not reach Succeeded/Failed within 675s (job's own replicaTimeout is 600s, so this means Azure itself hasn't resolved it yet -- check the job's execution logs, it may still be genuinely stuck)"
          exit 1

      - name: Dump migration job logs (on failure)
        if: failure()
        run: |
          EXECUTION_NAME=$(az containerapp job execution list \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" -o tsv)
          echo "::group::migrate job execution: $EXECUTION_NAME"
          az containerapp job execution show \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --job-execution-name "$EXECUTION_NAME" -o json || true
          echo "::endgroup::"
          echo "::group::migrate container logs"
          az containerapp job logs show \
            --name migrate --resource-group "$RESOURCE_GROUP" \
            --container migrate --tail 200 || \
            echo "Could not fetch logs via 'az containerapp job logs show' -- check Log Analytics (workspace: \${namePrefix}-logs) or the Azure Portal's 'migrate' Container Apps Job > Execution history directly."
          echo "::endgroup::"

  deploy:
    name: Roll out new revisions
    needs: [build-push, migrate]
    runs-on: ubuntu-latest
    # See the `migrate` job's comment above -- same per-environment
    # AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID secrets, same
    # requirement to declare `environment:` to actually receive them.
    environment: staging
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update backend
        run: |
          az containerapp update --name backend --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Update frontend
        run: |
          az containerapp update --name frontend --resource-group "$RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Smoke test
        id: smoke
        run: |
          FQDN=$(az containerapp show --name frontend --resource-group "$RESOURCE_GROUP" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Testing https://$FQDN (cold start possible -- both apps scale from zero)"
          # BUG FIX: the previous version of this step
          # (`curl -f --retry 5 --retry-delay 5 --retry-connrefused ...`)
          # had no `-s` and no `--max-time`/`--connect-timeout`. Two
          # separate problems, both visible in the same symptom ("Smoke
          # test keeps looping" for 7+ minutes with a wall of
          # "0 0 0 0 ... --:--:-- 0:03:12 --:--:-- 0" log lines):
          #   1. No `-s` (silent) -- that wall of zeroes/timestamps IS
          #      curl's normal transfer-progress meter, re-printed once a
          #      second. It was never an error or a retry loop, just very
          #      noisy default output.
          #   2. No `--max-time`/`--connect-timeout` -- `--retry` and
          #      `--retry-connrefused` only cover connection-REFUSED or a
          #      completed-but-failed transfer. If the TCP connection
          #      succeeds but the server never sends a response (exactly
          #      what a slow scale-from-zero cold start, or a replica
          #      that's up but not yet actually healthy, looks like from
          #      the outside), none of `--retry*` ever kicks in and curl
          #      -- which has no timeout by default -- waits forever. That
          #      indefinite hang, not a bounded retry loop, is what was
          #      actually happening here.
          # `--connect-timeout 30`: generous for establishing the TCP/TLS
          # connection to the Container Apps ingress itself (this part is
          # never slow, even on a cold start -- ingress always answers,
          # only the app behind it might not be up yet).
          # `--max-time 90`: bounds the ENTIRE request (connect + wait for
          # first byte + transfer) -- covers `frontend` scaling up from
          # zero and nginx starting. `--retry 5 --retry-delay 5` on top of
          # that gives up to 6 bounded attempts, so the worst case here is
          # ~6 * (90 + 5) = 570s (~9.5 min) instead of unbounded, and any
          # single stuck attempt now fails and moves to the next retry
          # instead of hanging.
          curl -f -s -S --connect-timeout 30 --max-time 90 \
               --retry 5 --retry-delay 5 --retry-connrefused --retry-max-time 570 \
               -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               "https://$FQDN/"

      - name: Dump backend/frontend logs (on smoke test failure)
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          # BUG FIX: this step used to try ONLY `az containerapp logs show`
          # (a live tail against a running replica) and, on failure, just
          # echo "check Log Analytics ... directly" -- a dead end, not an
          # actual fallback. That's a real gap specifically on staging:
          # both `backend` and `frontend` run with min replicas 0 (see this
          # file's top-of-file comment), so the most common failure this
          # step exists to diagnose -- a new revision that never passes its
          # readiness probe and gets scaled back to 0 -- is EXACTLY the
          # case where there is no live replica for `logs show` to tail.
          # `logs show` was therefore failing here on every single staging
          # smoke-test failure, leaving nothing but a pointer to go run a
          # manual `az monitor log-analytics query` by hand (see
          # DEPLOYMENT.md/README.md's troubleshooting notes) -- exactly the
          # extra manual step this whole job exists to avoid.
          #
          # Now: still attempt the live tail first (useful on the rarer
          # "replica came up but degraded" case), then ALWAYS follow up
          # with a real Log Analytics KQL query for the last 15 minutes of
          # console output from both apps -- the same query a human would
          # have to run by hand otherwise, now baked into the workflow log
          # itself. `take 100` and last-15-minutes both err generous, since
          # this only runs on failure and needs to be self-sufficient
          # (nobody's watching the pipeline live to widen the window).
          ENV_NAME=$(az containerapp env list --resource-group "$RESOURCE_GROUP" \
                       --query "[0].name" -o tsv)
          WORKSPACE_ID=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RESOURCE_GROUP" \
                            --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv)

          for APP in backend frontend; do
            echo "::group::$APP container logs (live tail, last 200 lines)"
            az containerapp logs show --name "$APP" --resource-group "$RESOURCE_GROUP" --tail 200 || \
              echo "Could not fetch logs via 'az containerapp logs show' -- no live replica (expected if the revision never passed its readiness probe). Falling through to the Log Analytics query below."
            echo "::endgroup::"
          done

          if [ -n "$WORKSPACE_ID" ]; then
            for APP in backend frontend; do
              echo "::group::$APP console logs from Log Analytics (last 15 minutes)"
              az monitor log-analytics query --workspace "$WORKSPACE_ID" \
                --analytics-query "ContainerAppConsoleLogs_CL | where ContainerAppName_s == '$APP' | where TimeGenerated > ago(15m) | project TimeGenerated, Log_s | order by TimeGenerated desc | take 100" \
                --output table || echo "Log Analytics query failed for $APP -- check the '$ENV_NAME' Container Apps Environment's Log Analytics workspace directly in the Azure Portal."
              echo "::endgroup::"
            done
          else
            echo "::warning::Could not resolve the Log Analytics workspace customerId for environment '$ENV_NAME' -- check the Azure Portal's Container Apps Environment > Log stream directly."
          fi

          echo "::group::backend revision status"
          az containerapp revision list --name backend --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, healthState:properties.healthState, runningState:properties.runningState, replicas:properties.replicas}" \
            -o table || true
          echo "::endgroup::"
          echo "::group::frontend revision status"
          az containerapp revision list --name frontend --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, healthState:properties.healthState, runningState:properties.runningState, replicas:properties.replicas}" \
            -o table || true
          echo "::endgroup::"
