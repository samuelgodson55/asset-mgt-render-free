# .github/workflows/deploy-azure-vm.yml
# -----------------------------------------------------------------------------
# Application deploy pipeline for the VM target: run CI -> build+push both
# images to Docker Hub -> SSH into the VM through the Cloudflare Tunnel's
# ssh.<domain> hostname, authenticated as a Cloudflare Access service token
# (no inbound port ever opened on the VM's NSG -- see infra-vm/main.tf's
# "Cloudflare Tunnel" section and docker-compose.vm.yml's `cloudflared`
# service) -> sync docker-compose.vm.yml/Caddyfile -> `docker compose up -d`
# with the new tag -> run migrations -> smoke test.
# Mirrors deploy-azure-aca.yml's shape (same reusable ci.yml call,
# same workflow_dispatch image_tag/skip_migrate escape hatch) but the
# "deploy" step is SSH + docker compose instead of `az containerapp
# update`, since there's no Container Apps control plane on this path --
# just a VM.
#
# TRIGGERS: only two, same split as deploy-azure-aca.yml.
#   A. TAG RELEASE (workflow_call, prod only): `git tag vX.Y.Z && git push
#      origin vX.Y.Z` runs release.yml, which builds + Trivy-scans + pushes
#      both images tagged with that VERSION and then calls THIS workflow
#      (`uses: ./.github/workflows/deploy-azure-vm.yml`, from release.yml's
#      `deploy` job) with that already-built `image_tag`. release.yml also
#      calls deploy-azure-aca.yml (its `deploy-aca` job) on the exact same
#      tag push, in parallel -- a version tag now deploys to both targets
#      every release, not just this one. `ci`/`build-push` below both skip
#      themselves out on this path, since release.yml already ran an
#      equivalent gate -- same pattern as deploy-azure-aca.yml's own
#      workflow_call entry point.
#   B. MANUAL (workflow_dispatch): open this workflow in the Actions tab,
#      choose `vm-staging` or `prod`, and "Run workflow". Leave `image_tag`
#      BLANK to build fresh from whichever branch/ref you run it against --
#      `ci` + `build-push` run first. Supply an EXISTING Docker Hub tag to
#      skip straight to `deploy` with that already-built image instead --
#      also the rollback/redeploy path. A plain push to `main`/`develop` no
#      longer triggers any deploy on its own; it only runs ci.yml.
#
# Required repo/environment secrets (see DEPLOYMENT_VM.md step 5-9 and
# its "Set up Cloudflare Tunnel" section for how each one is produced):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  - already used by deploy-azure-*.yml
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
#                                         - the Access service token this
#                                           runner authenticates as (the
#                                           cloudflare_ci_service_token_id/
#                                           _secret Terraform outputs from
#                                           infra-deploy-vm.yml's apply) --
#                                           lets `cloudflared access ssh`
#                                           through Access non-interactively,
#                                           no browser/human login involved
#   VM_HOST                              - the VM's ssh.<domain> Tunnel
#                                           hostname (the ssh_hostname
#                                           Terraform output) -- NOT the
#                                           public IP; there's nothing
#                                           listening on port 22 at the
#                                           public IP
#   VM_SSH_USER                          - matches infra-vm's admin_username
#                                           (default "azureuser")
#   VM_SSH_PRIVATE_KEY                   - private half of the key pair
#                                           whose public half was passed as
#                                           ssh_public_key to Terraform
# -----------------------------------------------------------------------------
name: Deploy to VM

on:
  # NO independent `push: tags` trigger here anymore. It used to mirror
  # release.yml's `on.push.tags` trigger directly, self-contained -- which
  # meant a single `git tag vX.Y.Z && git push origin vX.Y.Z` fired TWO
  # completely separate, uncoordinated pipelines (this file's own trigger,
  # AND release.yml, which also builds + pushes the same images and cuts a
  # GitHub Release/CHANGELOG entry). Both would build the images
  # independently, and there was nothing tying "a tagged release" to one
  # authoritative workflow to look at. Now release.yml is the ONLY thing a
  # version tag triggers -- it runs the CI gate, builds + Trivy-scans +
  # pushes the images ONCE, cuts the changelog/GitHub Release, and then
  # calls this workflow (`uses:`, below) with that already-built
  # `image_tag` to actually roll it out here. Same shape as
  # deploy-azure-aca.yml's `workflow_call` entry point.
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy, e.g. v1.4.2 (must already exist on Docker Hub -- see release.yml). This entry point always targets prod.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment. "vm-staging", not "staging" -- kept deliberately distinct from the Container Apps path''s "staging" GitHub Environment so the two paths never share AZURE_CLIENT_ID or other environment-scoped secrets.'
        required: true
        type: choice
        options: [vm-staging, prod]
        default: prod
      image_tag:
        description: 'Existing tag on Docker Hub to redeploy -- a version (e.g. "v1.4.2", for a rollback: see DEPLOYMENT_VM.md "Tagging & Versioning" -> Rollback), a commit SHA from a prior run, or "latest". Leave blank to build fresh from this branch.'
        required: false
        type: string
      skip_migrate:
        description: 'Skip running alembic upgrade head (only safe if no migration changed since image_tag was built)'
        required: false
        type: boolean
        default: false

concurrency:
  # A tagged release (workflow_call, from release.yml) always targets prod;
  # a workflow_dispatch run always carries a concrete "vm-staging" or
  # "prod" in inputs.environment now that the dropdown has no
  # "from-variable" sentinel to resolve.
  group: deploy-vm-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  # A tagged release (workflow_call, from release.yml) always targets prod,
  # exactly like release.yml's equivalent call does for the Container Apps
  # path -- there's no such thing as a "staging" named release.
  # BUG FIX: `github.event_name` inside a CALLED reusable workflow is NOT
  # 'workflow_call' -- per GitHub's own docs, "When a reusable workflow is
  # triggered by a caller workflow, the github context is always
  # associated with the caller workflow", so this reflects release.yml's
  # own triggering event ('push', from the tag push) the entire time this
  # file runs on that path. `(github.event_name == 'workflow_call') &&
  # 'prod' || inputs.environment` therefore ALWAYS fell through to
  # `inputs.environment` below, even on a tag release -- and this
  # workflow's `workflow_call:` trigger (above) never declares an
  # `environment` input at all, so `inputs.environment` silently resolved
  # to an empty string on that path instead of erroring. That empty
  # string then became this job's/`deploy`'s `environment:` value, which
  # doesn't match the "prod" GitHub Environment, so none of that
  # Environment's secrets (VM_HOST, VM_SSH_USER, VM_SSH_PRIVATE_KEY,
  # CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET) were ever visible to the
  # run -- exactly the "Missing/empty secret(s) for GitHub Environment
  # ''" failure in `deploy`'s "Validate required deploy secrets" step,
  # even though those secrets are correctly set under Settings >
  # Environments > prod.
  #
  # Fixed by reading `inputs.environment` directly instead of gating on
  # `github.event_name`: `workflow_dispatch`'s `environment` input is
  # `required: true` with a `default: prod`, so it is ALWAYS a truthy
  # "vm-staging" or "prod" on that path -- while `workflow_call` never
  # defines that input in the first place, so `inputs.environment` is
  # reliably empty/falsy on a tag release, correctly falling back to
  # 'prod'. This is the same pattern this file's own IMAGE_TAG/VERSION
  # just above already rely on (`inputs.image_tag != '' && ... ||
  # ...`) -- referencing an input a given trigger never declared just
  # evaluates empty, it doesn't error.
  IS_VERSION_TAG: ${{ inputs.environment == '' }}
  # WHICH TARGET this run deploys to. A tagged release is always "prod";
  # a workflow_dispatch run always carries a concrete "vm-staging" or
  # "prod" in inputs.environment (the dropdown has no "from-variable"
  # sentinel to resolve anymore, and its own default is "prod" -- see that
  # input's description). This only decides which GitHub Environment's
  # secrets get used and which resource this run touches -- NOT the
  # frontend build mode or which Docker Hub image repo gets pulled. Both
  # of those are BUILD_ENV/image_suffix, computed by the `resolve-target`
  # job below from each target's own `ENVIRONMENT` Actions variable.
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  # IMAGE_TAG is the literal Docker tag pulled/deployed. VERSION is the
  # human-facing release name recorded on the VM and in this run's
  # summary (see the "Write release marker" step below). Both now derive
  # from the single shared `image_tag` input rather than re-deriving a tag
  # release from `github.ref` -- release.yml's workflow_call always
  # supplies a real `image_tag` (the tag name itself, e.g. "v1.4.2"), so
  # this ternary picks that up the same way it already picks up an
  # existing tag supplied to workflow_dispatch. Only a workflow_dispatch
  # fresh build (image_tag left blank) falls through to `github.sha` for
  # IMAGE_TAG and "unversioned" for VERSION -- that's the only case where
  # `cat /opt/snipeit/CURRENT_RELEASE` on the VM should NOT show a real
  # release name.
  IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
  VERSION: ${{ inputs.image_tag != '' && inputs.image_tag || 'unversioned' }}
  # NOTE: BACKEND_IMAGE/FRONTEND_IMAGE deliberately do NOT live here
  # anymore -- they used to be a ternary on `inputs.environment` alone
  # (the dropdown), which meant this GitHub Environment's own `ENVIRONMENT`
  # variable had zero effect on which Docker Hub repo got pulled (same bug
  # as deploy-azure-aca.yml had -- see that file's `resolve-target` output
  # comment for the full story). A workflow-level `env:` block like this
  # one is evaluated before any job runs and can't see a job's `needs.*`
  # outputs, so BACKEND_IMAGE/FRONTEND_IMAGE now get set per-job instead
  # (`build-push`, `deploy` below), each built from
  # `needs.resolve-target.outputs.image_suffix`.
  REUSE_EXISTING_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

jobs:
  resolve-target:
    name: Resolve build settings for the target environment
    runs-on: ubuntu-latest
    # Bound to the SAME GitHub Environment `deploy` (below) uses, purely so
    # `vars.ENVIRONMENT` in the step below resolves to THAT environment's
    # own `ENVIRONMENT` Actions variable (Settings > Environments >
    # vm-staging|prod > Environment variables) instead of the repo-level
    # one -- a variable scoped to a GitHub Environment is only visible to a
    # job that declares `environment:` (see the workflow_dispatch
    # `environment` input's own comment above). This is a separate job,
    # not folded into `build-push`, because `build-push` calls a reusable
    # workflow (`uses:`) and GitHub does not allow `environment:` on a job
    # that does that -- see build-push's own `with:` comment for the
    # related "with: can't see env" restriction.
    #
    # NOTE: since this job (like `deploy`) is bound to the target
    # environment, any required-reviewers protection rule on "prod" now
    # gates approval twice in one run (here, then again on `deploy`) --
    # accepted trade-off for reading that environment's own variable
    # correctly.
    #
    # BUG FIX: see the top-of-file ENVIRONMENT comment -- github.event_name
    # is never 'workflow_call' inside a called reusable workflow, so this
    # used to always fall through to inputs.environment, which is silently
    # empty on the workflow_call (tag-release) path. Reading
    # inputs.environment directly (falling back to 'prod') is correct on
    # both paths.
    environment: ${{ inputs.environment || 'prod' }}
    outputs:
      build_env: ${{ steps.resolve.outputs.build_env }}
      # BUG FIX -- see this file's top-of-file BACKEND_IMAGE/FRONTEND_IMAGE
      # comment. This GitHub Environment's own `ENVIRONMENT` Actions
      # variable now decides the Docker Hub `-staging` suffix, independent
      # of which target the `environment` dropdown selected -- both
      # `build-push` and `deploy` below read this output instead of
      # re-deriving it from `inputs.environment` themselves.
      image_suffix: ${{ steps.resolve.outputs.image_suffix }}
    steps:
      - name: Read this environment's ENVIRONMENT variable
        id: resolve
        # vars.ENVIRONMENT here is the Actions variable set on THIS run's
        # target GitHub Environment (vm-staging or prod), value
        # "production" or "development" -- the app's own build-type
        # vocabulary (see frontend/Dockerfile and
        # backend/config.py's apply_environment_defaults), matching what's
        # configured under Settings > Environments > <name> > Environment
        # variables. Drives TWO independent things from the one value:
        # `build_env` (frontend minified-only vs. minified+obfuscated) and
        # `image_suffix` (plain Docker Hub repo vs. the `-staging` one).
        # Infra default for both is "production": anything other than
        # exactly "development" (including the variable not being set at
        # all) resolves to "production"/no suffix, so an
        # unset/misconfigured variable never silently ships an
        # unobfuscated build OR silently pulls a `-staging` image into
        # what you thought was a real deploy.
        env:
          RAW_ENVIRONMENT_VAR: ${{ vars.ENVIRONMENT }}
        run: |
          if [ "$RAW_ENVIRONMENT_VAR" = "development" ]; then
            echo "build_env=development" >> "$GITHUB_OUTPUT"
            echo "image_suffix=-staging" >> "$GITHUB_OUTPUT"
          else
            echo "build_env=production" >> "$GITHUB_OUTPUT"
            echo "image_suffix=" >> "$GITHUB_OUTPUT"
          fi

  verify-ci:
    name: Verify CI already passed for this commit
    runs-on: ubuntu-latest
    # Same gate `ci` itself uses below: only relevant on the
    # workflow_dispatch fresh-build path (image_tag left blank) --
    # release.yml's workflow_call path already ran this exact gate itself
    # before ever calling this workflow (same reasoning as
    # deploy-azure-aca.yml's identical `verify-ci` job), and a
    # workflow_dispatch that reuses an existing image_tag never needed CI
    # in the first place either.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
    permissions:
      actions: read
    outputs:
      already_passed: ${{ steps.check.outputs.already_passed }}
    steps:
      # PERFORMANCE FIX: `ci` below used to call ci.yml unconditionally on
      # every fresh-build deploy. Since ci.yml's `workflow_call` trigger has
      # no base commit to diff against, that ALWAYS fell through to "treat
      # every path as changed" (see ci.yml's own comment) -- meaning a full
      # re-run of frontend tests, backend tests, both image builds, both
      # Trivy scans, and nginx-config validation, every single deploy, even
      # though this exact commit already paid for all of that once when it
      # was pushed to its branch (see ci.yml's own `push`/`pull_request`
      # triggers). That's what stretched "Deploy to VM" out and stalled
      # otherwise-fast rollouts. This step checks whether a "CI" run
      # already completed successfully for THIS EXACT commit SHA (not just
      # this branch) via a real push -- if one has, `ci` below skips
      # itself entirely and this run goes straight to build+push+deploy.
      # Deliberately checks `event=push` specifically, not any completed
      # CI run for this SHA -- a previous deploy's own full re-run would
      # also show up in this list otherwise, which would just be trusting
      # this same shortcut recursively rather than an actual independent
      # validation.
      - name: Look up a prior successful CI run for this exact commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Falls back to "0" (i.e. "run CI") on any API hiccup -- this
          # check only ever SKIPS validation when it's positively confirmed
          # already happened; anything uncertain (rate limit, transient
          # network error, unexpected response) fails open to the old,
          # always-safe behavior of just running CI again.
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" --jq '.total_count' 2>/dev/null || echo "0")
          if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
            echo "Found an existing successful CI run for $SHA (already validated when this commit was pushed) -- skipping a redundant re-check."
            echo "already_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior successful push-triggered CI run found for $SHA -- running CI now."
            echo "already_passed=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: [verify-ci]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' && needs.verify-ci.outputs.already_passed != 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      # infra/main.bicep is the ACA path only (see infra-deploy.yml) --
      # this VM path provisions/updates via infra-vm/ + Terraform
      # (infra-deploy-vm.yml) instead, and never touches main.bicep at
      # all. Without this, ci.yml's "no usable base commit for a diff"
      # fallback (which every workflow_call hits, this one included) had
      # no way to tell this caller apart from deploy-azure-aca.yml/
      # release.yml and ran bicep-lint here unconditionally -- see
      # ci.yml's check_infra input for the full story.
      check_infra: false

  build-push:
    name: Build + push both images
    needs: [ci, resolve-target]
    # `needs.ci.result == 'skipped'` covers BOTH the pre-existing "reusing
    # an existing image_tag" skip AND the new "verify-ci already confirmed
    # this commit passed" skip above -- both are legitimate reasons to
    # proceed without re-running `ci` itself.
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && needs.resolve-target.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
    permissions:
      contents: read
    # Delegates to build-push-images.yml -- the single source of truth for
    # how the backend/frontend images actually get built, shared with
    # release.yml and
    # deploy-azure-aca.yml's fresh-build path. See that file's own
    # top-of-file comment for the full "why".
    #
    # image_tags: the human-facing tag ($IMAGE_TAG -- a real vX.Y.Z for a
    # version-tag push, else a SHA), the raw commit SHA again (always
    # present, so a build is traceable back to exact source even for a plain
    # branch push where $IMAGE_TAG and the SHA are already the same value --
    # a harmless duplicate tag/push in that case), and `latest`.
    uses: ./.github/workflows/build-push-images.yml
    with:
      backend_image_name: snipeit-lite-backend${{ needs.resolve-target.outputs.image_suffix }}
      frontend_image_name: snipeit-lite-frontend${{ needs.resolve-target.outputs.image_suffix }}
      # NOTE: these inline the full IMAGE_TAG/VERSION expressions rather
      # than referencing env.IMAGE_TAG/env.VERSION -- the `with:` block of
      # a job that calls a reusable workflow (`uses:`) can only reference
      # the github/needs/inputs/vars/strategy/matrix contexts, NOT `env`.
      # Referencing `env.*` here parses but is invalid at trigger time:
      # GitHub rejects the entire workflow file with "Unrecognized
      # named-value: 'env'" and every run shows a bare "Startup failure"
      # with no job graph, before anything runs. See
      # build-push-images.yml's own inputs for what each of these feeds.
      # build_env/image_suffix come from `needs` (job outputs), which --
      # unlike `env` -- IS allowed here; see resolve-target's own comment
      # for why both have to be resolved in a separate job in the first
      # place.
      # This job's `if:` above only ever lets it run on the workflow_dispatch
      # fresh-build path (image_tag left blank) -- a tagged release
      # (workflow_call) always skips it, since release.yml already built
      # and pushed the images itself before calling this workflow. So
      # `inputs.image_tag` is always empty here in practice; this falls
      # back straight to `github.sha`/'unversioned' rather than carrying
      # the old tag-release branch of the ternary, which could never be
      # true on this path anymore.
      image_tags: ${{ github.sha }} latest
      version_label: unversioned
      build_env: ${{ needs.resolve-target.outputs.build_env }}
      trivy_blocking: true
    secrets: inherit

  deploy:
    name: Deploy over SSH + migrate
    # BUG FIX: this used to only gate on `needs.build-push.result`, needing
    # only [build-push]. But `build-push`'s own `if:` (above) skips ITSELF
    # whenever `ci` didn't succeed -- including when `ci` genuinely FAILED
    # (e.g. the Gitleaks secret scan catching something real). A skipped job
    # and a failed-then-skipped-downstream job both report `skipped` here,
    # so `deploy` couldn't tell those two cases apart and happily proceeded
    # to `docker compose pull` a tag that was never actually built/pushed --
    # exactly the "Error: ... not found" / "manifest unknown" failure this
    # comment is fixing. Explicitly re-checking `needs.ci.result` (not just
    # `needs.build-push.result`) is what lets `deploy` distinguish "ci was
    # legitimately skipped" (workflow_dispatch reusing an existing
    # image_tag -- see `ci`'s own `if:`) from "ci actually failed, and
    # build-push's skip was just a symptom of that". Only the first case is
    # safe to deploy through.
    needs: [ci, build-push, resolve-target]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') && needs.resolve-target.result == 'success' }}
    runs-on: ubuntu-latest
    # Same restriction as build-push's `with:` block above (see its
    # comment): a job's `environment:` field can only reference the
    # github/needs/inputs/vars/strategy/matrix contexts, NOT `env` --
    # referencing env.ENVIRONMENT here parses but is invalid at trigger
    # time and produces "Unrecognized named-value: 'env'". Inlined the
    # same expression the top-of-file `env.ENVIRONMENT` is computed from.
    #
    # BUG FIX: see the top-of-file ENVIRONMENT comment. This is the exact
    # field responsible for the "Missing/empty secret(s) for GitHub
    # Environment ''" failure -- github.event_name is never
    # 'workflow_call' inside a called reusable workflow (it's always the
    # CALLER's original triggering event, e.g. 'push' for a tag release),
    # so this always fell through to inputs.environment, which is empty
    # on the workflow_call path (that trigger never declares an
    # `environment` input), binding this job to Environment '' instead of
    # 'prod' and hiding every secret scoped to the real 'prod' Environment.
    environment: ${{ inputs.environment || 'prod' }}
    env:
      # What the backend/worker/beat containers actually read as their own
      # ENVIRONMENT env var (see backend/config.py's apply_environment_defaults).
      # Written into the VM's .env by the "Update ENVIRONMENT on the VM"
      # step below; docker-compose.vm.yml reads it from there instead of a
      # hardcoded value. Sourced from resolve-target's job output, not
      # recomputed here, since it depends on THIS environment's own
      # `ENVIRONMENT` Actions variable -- see resolve-target's comment.
      RUNTIME_ENVIRONMENT: ${{ needs.resolve-target.outputs.build_env }}
      # BACKEND_IMAGE/FRONTEND_IMAGE now built from resolve-target's
      # `image_suffix` output (this GitHub Environment's own `ENVIRONMENT`
      # variable), not from `inputs.environment` -- see this file's
      # top-of-file BACKEND_IMAGE/FRONTEND_IMAGE comment and
      # resolve-target's `image_suffix` output comment.
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-backend${{ needs.resolve-target.outputs.image_suffix }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/snipeit-lite-frontend${{ needs.resolve-target.outputs.image_suffix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cloudflared
        # The same client Cloudflare ships for `cloudflared access ssh` --
        # this runner needs it locally to proxy the SSH connection below
        # through the Tunnel; it does NOT join anything persistent (unlike
        # the old ephemeral Tailscale node), it's a one-shot outbound
        # connection per SSH session, torn down when the job ends.
        #
        # PINNED, not `releases/latest` -- 2026.6.0 shipped a regression
        # (cloudflare/cloudflared#1673) where `access ssh`/`access tcp`
        # ignore --service-token-id/--service-token-secret entirely and
        # fall through to an interactive browser-auth flow on every
        # connection attempt instead, which a non-interactive CI runner
        # can never complete -- the ProxyCommand dies immediately and ssh/
        # scp see it as a bare "remote error: tls: handshake failure" /
        # "Connection closed by UNKNOWN port 65535", exactly like this
        # step used to fail before it was pinned. 2026.5.1 is the last
        # version confirmed to honor service-token auth correctly, so
        # that's what's installed here -- bump this deliberately (and
        # retest an actual CI deploy) once a fixed release ships, rather
        # than silently riding `latest` again.
        env:
          CLOUDFLARED_VERSION: '2026.5.1'
        run: |
          curl -fsSL --output /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Validate required deploy secrets are set for this Environment
        # BUG FIX: without this, an unset/empty VM_HOST or VM_SSH_USER
        # under this job's `environment:` (see this job's own comment on
        # why that's a distinct GitHub Environment from the ACA path's)
        # doesn't fail here -- GitHub Actions silently resolves a missing
        # Environment secret to an empty string rather than erroring at
        # trigger time. That empty value then flows all the way down into
        # "$VM_SSH_USER@$VM_HOST" in "Self-heal /opt/snipeit ownership"
        # (the first step that actually TRIES to use it), collapsing to a
        # bare "@" -- which ssh's own argument parser rejects by dumping
        # its full usage banner and exiting 255. That failure is real, but
        # three steps and zero information away from "VM_HOST is unset for
        # the 'prod' GitHub Environment" -- exactly the failure this repo
        # already flagged as a known class (see `migrate`'s own
        # `azure/login@v3` comment for the ACA-side equivalent). Checked
        # here, immediately, against the actual Environment this run
        # resolved to, so a missing secret is obvious the moment CI runs
        # instead of masquerading as an ssh syntax error.
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          MISSING=()
          [ -z "$VM_HOST" ] && MISSING+=("VM_HOST")
          [ -z "$VM_SSH_USER" ] && MISSING+=("VM_SSH_USER")
          [ -z "$VM_SSH_PRIVATE_KEY" ] && MISSING+=("VM_SSH_PRIVATE_KEY")
          [ -z "$CF_ACCESS_CLIENT_ID" ] && MISSING+=("CF_ACCESS_CLIENT_ID")
          [ -z "$CF_ACCESS_CLIENT_SECRET" ] && MISSING+=("CF_ACCESS_CLIENT_SECRET")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing/empty secret(s) for GitHub Environment '$ENVIRONMENT': ${MISSING[*]}. Set these under Settings > Environments > $ENVIRONMENT > Environment secrets (Environment-scoped, not repo-level -- see this job's environment: line for why). This job will otherwise fail several steps later with an opaque 'ssh: usage: ...' / exit 255 instead of this message."
            exit 1
          fi
          echo "All required deploy secrets are present for Environment '$ENVIRONMENT'."

      - name: Set up SSH (proxied through Cloudflare Access)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Every `ssh`/`scp` call below targets $VM_HOST as if it were a
          # normal, directly reachable host -- this ProxyCommand is what
          # actually routes the connection through the Cloudflare Tunnel,
          # authenticated as the CI service token (non-interactive, no
          # browser/SSO prompt). `StrictHostKeyChecking accept-new`
          # (rather than a blind `=no`) still pins whatever host key the
          # VM presents on first connect and fails loudly on a mismatch
          # later -- the usual MITM protection ssh-keyscan gave us before,
          # just set inline since ssh-keyscan itself can't see through a
          # ProxyCommand.
          cat >> ~/.ssh/config <<SSHCONFIG
          Host $VM_HOST
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Self-heal /opt/snipeit ownership before syncing
        # Cheap, idempotent guard against the root-ownership drift we hit
        # live: any manual root-shell edit under /opt/snipeit (e.g.
        # patching a file directly on the VM instead of through a
        # workflow) leaves some subset of it root-owned, which then makes
        # THIS scp -- writing as $VM_SSH_USER -- fail with a silent
        # Permission denied on whatever it touches. Running this
        # unconditionally, every deploy, means that drift can never
        # again block a sync no matter how it got introduced -- on a
        # normal deploy where nothing drifted, it just re-chowns files
        # that are already correctly owned, which is a no-op.
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "sudo chown -R $VM_SSH_USER:$VM_SSH_USER /opt/snipeit"

      - name: Sync docker-compose.vm.yml + Caddyfile + scripts to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        # Deliberately does NOT sync caddy/weights.conf -- that file is
        # LIVE STATE on the VM (see its own header comment), rewritten by
        # scripts/blue-green-deploy.sh itself during the rollout below.
        # Overwriting it here with this repo's static "100 0" seed
        # BEFORE the rollout runs would risk briefly routing 100% of
        # traffic to the WRONG slot if this VM's actual active slot is
        # currently green, not blue -- a self-inflicted mini-outage right
        # at deploy start, corrected only once blue-green-deploy.sh's own
        # first `set_weights` call runs a few steps later. Only files
        # that are safe to blindly overwrite -- because nothing reads
        # them as authoritative LIVE state -- belong in this step.
        run: |
          # BUG FIX: this used to `mkdir -p /opt/snipeit/scripts/deploy-status`
          # -- a path nothing ever scp's into. The REAL destination below,
          # /mnt/docker-data/volumes/deploy_status, is on the separate data
          # disk (see infra-vm/cloud-init.yaml's setup-disk.sh), created
          # root-owned during first-boot provisioning; it normally already
          # exists, but anything that leaves it missing or root-owned again
          # (a rebuilt/re-imaged VM, a manual root-shell edit, etc.) made
          # every future scp here fail with "No such file or directory" /
          # silent Permission denied, exactly like the self-heal step above
          # exists to guard against for /opt/snipeit. `mkdir -p
          # /opt/snipeit/scripts` is kept explicit here too -- it used to
          # only exist as a side effect of the old (wrong) mkdir path,
          # which happened to create it as a parent directory.
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "mkdir -p /opt/snipeit/scripts && sudo mkdir -p /mnt/docker-data/volumes/deploy_status && sudo chown -R $VM_SSH_USER:$VM_SSH_USER /mnt/docker-data/volumes/deploy_status"
          scp -i ~/.ssh/deploy_key \
              docker-compose.vm.yml Caddyfile \
              "$VM_SSH_USER@$VM_HOST:/opt/snipeit/"
          scp -i ~/.ssh/deploy_key \
              scripts/health-check.sh scripts/blue-green-deploy.sh \
              "$VM_SSH_USER@$VM_HOST:/opt/snipeit/scripts/"
          scp -i ~/.ssh/deploy_key \
              scripts/deploy-status/index.html \
              "$VM_SSH_USER@$VM_HOST:/mnt/docker-data/volumes/deploy_status/index.html"
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "chmod +x /opt/snipeit/scripts/health-check.sh /opt/snipeit/scripts/blue-green-deploy.sh"

      - name: Update IMAGE_TAG + ENVIRONMENT on the VM and pull new images
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        # Using an UNQUOTED heredoc delimiter (<<EOF, not <<'EOF') is what
        # lets the RUNNER's own shell expand $IMAGE_TAG/$RUNTIME_ENVIRONMENT
        # below into literal values before the command is ever sent over
        # SSH -- the remote VM's shell never needs to know about
        # GITHUB_ENV/IMAGE_TAG/RUNTIME_ENVIRONMENT at all, it just receives
        # the already-substituted sed commands.
        #
        # ENVIRONMENT is written here for the SAME reason IMAGE_TAG already
        # was: docker-compose.vm.yml no longer hardcodes
        # `ENVIRONMENT: production` for backend/worker/beat -- it reads
        # `${ENVIRONMENT:-development}` from this .env file (see that
        # file's own comment). Without this step, a vm-staging deploy would
        # sync a docker-compose.vm.yml that expects ENVIRONMENT in .env, but
        # nothing would ever have written a non-production value there --
        # this is the actual fix for "the VM deployed with values set to
        # true/production even for a staging run".
        #
        # `docker compose pull` here pulls only the CURRENTLY ACTIVE
        # profile's images (COMPOSE_PROFILES in .env) -- that's fine and
        # sufficient: backend-blue/backend-green (and frontend-blue/
        # frontend-green) share the exact same `image:` reference, so
        # pulling it once makes it available to whichever slot
        # scripts/blue-green-deploy.sh starts next regardless of profile.
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" bash -s <<EOF
            set -euo pipefail
            cd /opt/snipeit
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi
            if grep -q '^ENVIRONMENT=' .env; then
              sed -i "s/^ENVIRONMENT=.*/ENVIRONMENT=$RUNTIME_ENVIRONMENT/" .env
            else
              echo "ENVIRONMENT=$RUNTIME_ENVIRONMENT" >> .env
            fi
            docker compose -f docker-compose.vm.yml pull
          EOF

      - name: Look up the live domain
        id: domain
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        # Fetched here (moved earlier from the "Smoke test" step below,
        # which still uses this same output) purely so the poller started
        # next has a URL to hit before the rollout itself begins -- the
        # domain doesn't change mid-rollout, only which slot answers for it.
        run: |
          DOMAIN=$(ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" "grep '^DOMAIN=' /opt/snipeit/.env | cut -d= -f2")
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      # CLIENT'S-EYE EVIDENCE, running on the RUNNER (not over SSH, not on
      # the VM) for the same reason a browser tab left open during the
      # swap would be off the VM too -- this has to observe the SAME path
      # a real user's request takes (through Cloudflare/Caddy), not a
      # shortcut that happens to skip whatever the actual outage risk is.
      # scripts/deploy-status/ (the VM's own dashboard) and the health
      # checks inside blue-green-deploy.sh below already prove the
      # DEPLOYMENT's view of its own rollout; this proves the opposite
      # side -- a real request stream against the live domain never saw a
      # dropped or errored response DURING the ramp. Started here, before
      # the rollout begins, and stopped only after the "Smoke test" step
      # below, so it's running for the migration, replica start, health
      # check, and the entire traffic ramp -- not just part of it.
      - name: Start continuous endpoint poll (zero-downtime evidence)
        id: poll_start
        run: |
          mkdir -p evidence
          POLL_OUT="evidence/poll-vm-${{ github.run_id }}.csv"
          echo "poll_out=$POLL_OUT" >> "$GITHUB_OUTPUT"
          nohup bash scripts/poll-live-endpoint.sh \
            --url "https://${{ steps.domain.outputs.domain }}/" --interval 1 --out "$POLL_OUT" \
            > evidence/poll.log 2>&1 &
          echo $! > evidence/poll.pid
          echo "Polling https://${{ steps.domain.outputs.domain }}/ every 1s in the background (PID $(cat evidence/poll.pid)) -- will run through the full blue-green rollout and the smoke test below."

      - name: Blue-green rollout (migrate -> replica -> health-check -> ramp traffic -> retire old slot)
        id: rollout
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SKIP_MIGRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrate }}
        # scripts/blue-green-deploy.sh does everything the old "Roll out"
        # + "Run alembic upgrade head" steps used to do, PLUS the actual
        # zero-downtime mechanics (see that script's own header comment
        # and DEPLOYMENT_VM.md's "Zero-Downtime Blue-Green Deployments"
        # section): it exits non-zero -- failing this step -- if any
        # health check fails at any point, having already restored 100%
        # traffic to the still-good old slot and stopped the new one
        # before returning. SKIP_MIGRATE (from the `skip_migrate` input)
        # only ever skips the `alembic upgrade head` step itself -- the
        # replica/health-check/gradual-ramp mechanics always run in full
        # either way, so this escape hatch never trades away zero
        # downtime. Watch this step's own log for a live, phase-by-phase
        # account of the rollout, or https://<DOMAIN>/_deploy/ for the
        # same thing as a dashboard -- see that section for how to set
        # its credentials.
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "cd /opt/snipeit && SKIP_MIGRATE=$SKIP_MIGRATE ./scripts/blue-green-deploy.sh"


      - name: Reclaim disk space (drop superseded image layers)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "docker image prune -af --filter 'until=72h'"

      - name: Smoke test (public domain, post-cutover)
        id: smoke
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        # Same criteria scripts/health-check.sh already held the REPLICA
        # to before it received any traffic (see the rollout step above)
        # -- run here in --mode external, against the live public domain,
        # as a final end-to-end confirmation of the whole path including
        # Cloudflare/Caddy, not just the container pair directly. DOMAIN
        # now comes from the "Look up the live domain" step above (also
        # what the poller started before the rollout is using) rather than
        # being re-fetched here, so both checks are guaranteed to be
        # looking at the exact same domain.
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" \
            "cd /opt/snipeit && ./scripts/health-check.sh --mode external --url https://${{ steps.domain.outputs.domain }}"

      # `always()` so this runs -- and the evidence gets uploaded -- even
      # if an earlier step (migration, health check, ramp, or the smoke
      # test above) failed. A poll log covering a FAILED rollout is exactly
      # as valuable as one covering a clean success: it's proof of what the
      # live domain actually did while blue-green-deploy.sh's own failure
      # trap was restoring 100% traffic to the old slot. SIGTERM (not
      # kill -9) so scripts/poll-live-endpoint.sh's own EXIT/TERM trap gets
      # to run and write its pass/fail/error summary to evidence/poll.log.
      - name: Stop continuous endpoint poll and collect evidence
        id: poll_stop
        if: always() && steps.poll_start.outcome == 'success'
        run: |
          if [ -f evidence/poll.pid ]; then
            PID="$(cat evidence/poll.pid)"
            kill -TERM "$PID" 2>/dev/null || true
            for _ in $(seq 1 5); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
          fi
          echo "::group::Live-endpoint poll summary (client's-eye view of the whole rollout)"
          cat evidence/poll.log || echo "No poll.log found."
          echo "::endgroup::"
          POLL_OUT="${{ steps.poll_start.outputs.poll_out }}"
          if [ -f "$POLL_OUT" ] && grep -q ',FAIL$\|,ERROR$' "$POLL_OUT"; then
            echo "::error::Live-endpoint poll recorded at least one FAIL/ERROR during this rollout -- see evidence/poll.log above and the uploaded CSV artifact. This means a real client-facing request did NOT get an uninterrupted response during cutover, even though blue-green-deploy.sh's own internal health checks passed."
            exit 1
          fi
          echo "Zero dropped/failed requests against the live domain for the full rollout -- see the uploaded CSV artifact for the full record."

      - name: Upload live-endpoint poll evidence
        if: always() && steps.poll_start.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zero-downtime-poll-evidence-vm-${{ github.run_id }}
          path: evidence/
          retention-days: 90


      - name: Write release marker on the VM
        # Deliberately AFTER the smoke test, not before -- this file is
        # meant to answer "what version is CONFIRMED RUNNING and
        # healthy", not "what was the last attempted deploy". If the
        # smoke test above fails, this step never runs and
        # /opt/snipeit/CURRENT_RELEASE keeps pointing at the previous
        # good deploy -- see DEPLOYMENT_VM.md's "Tagging & Versioning"
        # section for how this file is used to answer "what version is
        # production running" and to plan a rollback.
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" bash -s <<EOF
            cat > /opt/snipeit/CURRENT_RELEASE <<RELEASE_EOF
          VERSION=$VERSION
          IMAGE_TAG=$IMAGE_TAG
          GIT_SHA=${{ github.sha }}
          BACKEND_IMAGE=$BACKEND_IMAGE
          FRONTEND_IMAGE=$FRONTEND_IMAGE
          DEPLOYED_AT=$DEPLOYED_AT
          DEPLOYED_BY=${{ github.actor }}
          DEPLOYED_VIA=${{ github.workflow }} (run ${{ github.run_id }})
          RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_EOF
          EOF

      - name: Summarize this deploy
        if: always()
        run: |
          {
            echo "## Deployed to Azure VM (${{ env.ENVIRONMENT }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`${{ env.VERSION }}\` |"
            echo "| **Image tag** | \`${{ env.IMAGE_TAG }}\` |"
            echo "| **Commit** | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Frontend build mode** | \`${{ needs.resolve-target.outputs.build_env }}\`${{ (github.event_name == 'workflow_dispatch' && inputs.image_tag != '') && ' _(reused an existing image -- not rebuilt this run, so this reflects whatever mode that image was originally built with, not necessarily this environment’s current `ENVIRONMENT` variable)_' || '' }} |"
            echo "| **Deployed by** | @${{ github.actor }} |"
            if [ "${{ env.VERSION }}" = "unversioned" ]; then
              echo ""
              echo "> This deploy has no version tag -- it won't show up as a named"
              echo "> release in \`git tag\`/Docker Hub/CHANGELOG.md. See"
              echo "> DEPLOYMENT_VM.md's \"Tagging & Versioning\" section if you want"
              echo "> this to become a real, rollback-able release: \`git tag"
              echo "> vX.Y.Z && git push origin vX.Y.Z\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump container status + recent logs + rollout status (on failure)
        if: failure()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_SSH_USER@$VM_HOST" bash -s <<'EOF'
            cd /opt/snipeit
            echo "::group::deploy-status/status.json + checks.log"
            cat /mnt/docker-data/volumes/deploy_status/status.json 2>/dev/null || echo "(no status.json yet)"
            cat /mnt/docker-data/volumes/deploy_status/checks.log 2>/dev/null || echo "(no checks.log yet)"
            echo "::endgroup::"
            echo "::group::current caddy/weights.conf"
            cat caddy/weights.conf 2>/dev/null || echo "(missing)"
            echo "::endgroup::"
            echo "::group::docker compose ps"
            docker compose -f docker-compose.vm.yml ps
            echo "::endgroup::"
            for svc in db redis backend-blue backend-green worker beat frontend-blue frontend-green caddy cloudflared; do
              echo "::group::logs: $svc (last 100 lines)"
              docker compose -f docker-compose.vm.yml logs --tail 100 "$svc" || true
              echo "::endgroup::"
            done
          EOF
