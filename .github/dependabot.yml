# .github/dependabot.yml
# -----------------------------------------------------------------------------
# Automated, scheduled dependency-update PRs across every package manifest in
# this repo. This is complementary to ci.yml's `pip-audit` step, not a
# replacement for it: pip-audit flags known CVEs in whatever versions are
# CURRENTLY pinned on every push/PR (a point-in-time vulnerability check).
# Dependabot instead proactively opens a PR each week bumping dependencies
# toward their latest versions -- including plain version-drift updates with
# no CVE attached -- so upgrades happen in small, reviewable, CI-gated steps
# instead of one large "everything is 2 years stale" PR later.
#
# Every PR Dependabot opens runs through the exact same `ci.yml` gate as a
# human-authored PR (ci.yml already declares `workflow_call` and triggers on
# every push/PR to any branch) -- no extra CI wiring needed for this to be
# safe to merge on review rather than blind-merged.
#
# See README.md's "Safely Updating An Existing Production Deployment (CI/CD)"
# section and SRE_STRATEGY.md's "4. Dependency-update gap — closed" section
# for how this fits into the ongoing update cadence.
# -----------------------------------------------------------------------------
version: 2
updates:
  # --- Backend (FastAPI) Python dependencies ---
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]

  # --- Frontend build pipeline (minify/obfuscate step) ---
  - package-ecosystem: "npm"
    directory: "/build-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]

  # --- Tailwind build pipeline ---
  - package-ecosystem: "npm"
    directory: "/build-tailwind"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]

  # --- Frontend test suite (pages-load / module-exports-integrity / etc.) ---
  - package-ecosystem: "npm"
    directory: "/frontend/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend", "tests"]

  # --- Backend container image base ---
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]

  # --- Frontend (nginx) container image base ---
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]

  # --- GitHub Actions themselves (actions/checkout, trivy-action, etc.) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
