
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban
  - unattended-upgrades
  - jq

write_files:
  - path: /opt/snipeit/certs/cloudflare-origin.pem
    permissions: "0644"
    content: |
      ${indent(6, cloudflare_origin_cert)}
  - path: /opt/snipeit/certs/cloudflare-origin-key.pem
    permissions: "0600"
    content: |
      ${indent(6, cloudflare_origin_cert_key)}

  - path: /opt/snipeit/.env
    permissions: "0600"
    content: |
      DOMAIN=${domain}
      CLOUDFLARE_TUNNEL_TOKEN=${cloudflare_tunnel_token}
      IMAGE_TAG=${initial_image_tag}
      DOCKERHUB_BACKEND_IMAGE=${dockerhub_backend_image}
      DOCKERHUB_FRONTEND_IMAGE=${dockerhub_frontend_image}
      EXPECTED_FRONTEND_BUILD_TARGET=${frontend_build_target}

      ACTIVE_SLOT=green
      COMPOSE_PROFILES=green

      DEPLOY_STATUS_USER=${deploy_status_user}
      DEPLOY_STATUS_PASSWORD_HASH=${deploy_status_password_hash}

      POSTGRES_USER=${postgres_user}
      POSTGRES_PASSWORD=${postgres_password}
      POSTGRES_DB=${postgres_db}

      DATABASE_URL=postgresql://${postgres_user_urlencoded}:${postgres_password_urlencoded}@db:5432/${postgres_db}

      JWT_SECRET_KEY=${jwt_secret_key}
      JWT_ALGORITHM=HS256
      JWT_EXPIRY_HOURS=12

      CORS_ORIGINS=https://${domain}
      SITE_NAME="${site_name}"
      ENABLE_API_DOCS=${enable_api_docs}

      SUPER_ADMIN_USERNAME=superadmin
      SUPER_ADMIN_NAME="Super Admin"
      ROOT_ADMIN_BOOTSTRAP_PASSWORD=${root_admin_bootstrap_password}

      NOTIFICATIONS_ENABLED=${notifications_enabled}
      SMTP_HOST=${smtp_host}
      SMTP_PORT=${smtp_port}
      SMTP_USERNAME=${smtp_username}
      SMTP_PASSWORD=${smtp_password}
      SMTP_USE_TLS=true
      SMTP_USE_SSL=false
      SMTP_FROM_EMAIL=${smtp_from_email}
      EMAIL_PROVIDER=${email_provider}
      BREVO_API_KEY=${brevo_api_key}
      RESEND_API_KEY=${resend_api_key}
      ADMIN_NOTIFICATION_EMAILS=${admin_notification_emails}
      OVERDUE_DIGEST_HOURS_UTC=${overdue_digest_hours_utc}
      DUE_SOON_DIGEST_HOURS_UTC=${due_soon_digest_hours_utc}

      EXTENSION_REQUEST_SLA_HOURS=${extension_request_sla_hours}
      QUOTATION_SLA_HOURS=${quotation_sla_hours}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES=${approval_sla_check_interval_minutes}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS=${approval_sla_escalation_repeat_hours}
      SEND_QUOTATION_RECIPIENT_EMAILS=${send_quotation_recipient_emails}

      DISPLAY_TIMEZONE=${display_timezone}
      CURRENCY_CODE=${currency_code}

      ENABLE_AUTO_BACKUP=${enable_auto_backup}
      BACKUP_GDRIVE_ENABLED=${backup_gdrive_enabled}
      BACKUP_GDRIVE_OAUTH_CLIENT_ID=${backup_gdrive_oauth_client_id}
      BACKUP_GDRIVE_OAUTH_CLIENT_SECRET=${backup_gdrive_oauth_client_secret}
      BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN=${backup_gdrive_oauth_refresh_token}
      BACKUP_GDRIVE_CREDENTIALS_JSON=${backup_gdrive_credentials_json}
      BACKUP_GDRIVE_FOLDER_ID=${backup_gdrive_folder_id}

      OTEL_ENABLED=${otel_enabled}
      OTEL_SERVICE_NAME=${otel_service_name}
      OTEL_EXPORTER_OTLP_ENDPOINT=${otel_exporter_otlp_endpoint}
      OTEL_EXPORTER_OTLP_HEADERS=${otel_exporter_otlp_headers}
      OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      OTEL_TRACES_SAMPLE_RATIO=${otel_traces_sample_ratio}
      OTEL_CONSOLE_EXPORTER=${otel_console_exporter}
      APPLICATIONINSIGHTS_CONNECTION_STRING=${applicationinsights_connection_string}

      DB_MEM_LIMIT=768m
      DB_MEM_RESERVATION=256m
      REDIS_MEM_LIMIT=256m
      REDIS_MEM_RESERVATION=128m
      BACKEND_MEM_LIMIT=768m
      BACKEND_MEM_RESERVATION=256m
      WORKER_MEM_LIMIT=640m
      WORKER_MEM_RESERVATION=256m
      BEAT_MEM_LIMIT=128m
      BEAT_MEM_RESERVATION=64m
      FRONTEND_MEM_LIMIT=128m
      FRONTEND_MEM_RESERVATION=64m
      CADDY_MEM_LIMIT=160m
      CADDY_MEM_RESERVATION=64m

  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "data-root": "/mnt/docker-data/docker",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 5
      findtime = 600
      bantime = 3600

  - path: /opt/snipeit/docker-compose.vm.yml
    permissions: "0644"
    content: |
      ${indent(6, docker_compose_vm_yml)}

  - path: /opt/snipeit/Caddyfile
    permissions: "0644"
    content: |
      ${indent(6, caddyfile)}

  - path: /opt/snipeit/caddy/weights.conf
    permissions: "0644"
    content: |
      ${indent(6, caddy_weights_conf)}

  - path: /opt/snipeit/seed/deploy-status-index.html
    permissions: "0644"
    content: |
      ${indent(6, deploy_status_index_html)}

  - path: /opt/snipeit/seed/deploy-status-status.json
    permissions: "0644"
    content: |
      ${indent(6, deploy_status_seed_json)}

  - path: /etc/systemd/system/create-swap.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Create 2G swapfile on data disk
      DefaultDependencies=no
      Before=swap.target
      RequiresMountsFor=/mnt/docker-data

      [Service]
      Type=oneshot
      ExecStart=/opt/snipeit/scripts/create-swap.sh
      RemainAfterExit=true

      [Install]
      WantedBy=swap.target

  - path: /opt/snipeit/scripts/create-swap.sh
    permissions: "0755"
    content: |
      set -euo pipefail
      SWAPFILE=/mnt/docker-data/swapfile
      if [ ! -f "$SWAPFILE" ]; then
        fallocate -l 2G "$SWAPFILE"
        chmod 600 "$SWAPFILE"
        mkswap "$SWAPFILE"
      fi
      if ! swapon --show | grep -q "$SWAPFILE"; then
        swapon "$SWAPFILE"
      fi
      grep -q "$SWAPFILE" /etc/fstab || echo "$SWAPFILE none swap sw 0 0" >> /etc/fstab
      sysctl -w vm.swappiness=10

  - path: /opt/snipeit/scripts/setup-disk.sh
    permissions: "0755"
    content: |
      set -euo pipefail
      DISK=/dev/disk/azure/scsi1/lun0
      for i in $(seq 1 30); do [ -e "$DISK" ] && break; sleep 2; done
      if ! blkid "$DISK" >/dev/null 2>&1; then
        mkfs.ext4 -F "$DISK"
      fi
      mkdir -p /mnt/docker-data
      UUID=$(blkid -s UUID -o value "$DISK")
      grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /mnt/docker-data ext4 defaults,nofail 0 2" >> /etc/fstab
      mount -a
      mkdir -p /mnt/docker-data/docker \
               /mnt/docker-data/volumes/pgdata \
               /mnt/docker-data/volumes/redisdata \
               /mnt/docker-data/volumes/backup_data \
               /mnt/docker-data/volumes/export_data \
               /mnt/docker-data/volumes/caddy_data \
               /mnt/docker-data/volumes/caddy_config \
               /mnt/docker-data/volumes/deploy_status

  - path: /opt/snipeit/scripts/install-docker.sh
    permissions: "0755"
    content: |
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      apt-get update -y
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker ${admin_username}

  - path: /etc/systemd/system/snipeit.service
    permissions: "0644"
    content: |
      [Unit]
      Description=snipeit-lite docker compose stack
      Requires=docker.service
      After=docker.service network-online.target mnt-docker\x2ddata.mount
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      WorkingDirectory=/opt/snipeit
      ExecStart=/usr/bin/docker compose -f docker-compose.vm.yml up -d
      ExecStop=/usr/bin/docker compose -f docker-compose.vm.yml down
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target

runcmd:
  - /opt/snipeit/scripts/setup-disk.sh

  - systemctl daemon-reload
  - systemctl enable --now create-swap.service

  - /opt/snipeit/scripts/install-docker.sh

  - ufw allow 22/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban

  - mkdir -p /opt/snipeit
  - chown -R ${admin_username}:${admin_username} /opt/snipeit
  - cp /opt/snipeit/seed/deploy-status-index.html /mnt/docker-data/volumes/deploy_status/index.html
  - cp /opt/snipeit/seed/deploy-status-status.json /mnt/docker-data/volumes/deploy_status/status.json
%{ if dockerhub_username != "" }
  - |
    echo "${dockerhub_token}" | docker login -u "${dockerhub_username}" --password-stdin
%{ endif }

  - systemctl daemon-reload
  - systemctl enable snipeit.service
  - systemctl start snipeit.service

  - |
    cd /opt/snipeit
    for i in $(seq 1 20); do
      docker compose -f docker-compose.vm.yml run --rm backend-green alembic upgrade head && break
      echo "Migration attempt $i failed, retrying in 10s..."
      sleep 10
    done

final_message: "snipeit-lite VM provisioning complete after $UPTIME seconds. Docker data-root: /mnt/docker-data/docker. App should now be reachable -- see the app_url Terraform output (allow a minute for the `cloudflared` container to establish the Tunnel and for Cloudflare's DNS to propagate). SSH access: this VM has NO open inbound SSH port on its NSG by default -- reach it via the Cloudflare Tunnel instead (see the ssh_hostname/ssh_command Terraform outputs, and DEPLOYMENT_VM.md's 'Set up Cloudflare Tunnel' section for the one-time ~/.ssh/config entry). Root admin credentials: see ROOT_ADMIN_BOOTSTRAP_PASSWORD in /opt/snipeit/.env, or check `docker compose -f /opt/snipeit/docker-compose.vm.yml logs backend-green` for the auto-generated one if that was left blank. Future deploys go through .github/workflows/deploy-azure-vm.yml -- see DEPLOYMENT_VM.md step 9."
