# =============================================================================
# docker-compose.vm.yml
# -----------------------------------------------------------------------------
# The VM deployment target's compose file. Mirrors docker-compose.yml's six
# roles -- db, redis, backend, worker, beat, frontend -- but `backend` and
# `frontend` (the two roles that actually serve production HTTP traffic) are
# each split into a BLUE and a GREEN pair (backend-blue/backend-green,
# frontend-blue/frontend-green) so a deploy can run entirely on the idle
# slot -- with zero production traffic and its own health checks -- before
# `caddy` gradually shifts real traffic onto it. FIXED ROLES: blue is
# ALWAYS the incoming candidate a deploy targets, green is ALWAYS the
# active/production slot once a rollout finishes -- these never swap. See
# "ZERO-DOWNTIME BLUE-GREEN DEPLOYMENTS" below and DEPLOYMENT_VM.md's
# matching section for the full mechanics; scripts/blue-green-deploy.sh is
# what actually drives a rollout. db/redis/worker/beat stay singleton (a
# second Postgres/Redis would just be a second copy of the same data;
# `beat` in particular must never run twice at once -- see its own comment
# below) -- only the two HTTP-serving roles need two copies to avoid
# downtime.
#
# Differences from docker-compose.yml, beyond the blue/green split above:
#
#   1. `image:` (pulled from Docker Hub, tagged by CI) instead of `build:` --
#      the VM never builds images itself, it only ever runs ones
#      deploy-azure-vm.yml already built and pushed.
#   2. Every service gets a `mem_limit`/`mem_reservation` ceiling (see the
#      table below) so one runaway container (e.g. a big CSV export, or a
#      slow query) can't starve the others of RAM and take the whole VM
#      down -- Compose enforces these as real cgroup limits even outside
#      Swarm mode, unlike `deploy.resources.limits` which Swarm ignores.
#   3. A `caddy` service replaces the host port publish on `frontend` --
#      Caddy reverse-proxies to a WEIGHTED pair (frontend-blue:80,
#      frontend-green:80) internally and presents a free Cloudflare Origin
#      CA certificate for whatever domain DOMAIN resolves to (see
#      DEPLOYMENT_VM.md's "Set up Cloudflare Tunnel" section).
#   4. A `cloudflared` service is the ONLY thing that ever connects
#      outbound -- it's the Cloudflare Tunnel that replaces both Tailscale
#      (for SSH) and any open inbound port at all (for the app). See that
#      service's own comment below.
#
# Plus one OPT-IN ninth service, behind a Compose profile so it never
# starts unless you ask for it:
#   jaeger   - local distributed-tracing UI (Operations & Observability
#              requirement #4 -- see backend/telemetry.py's module
#              docstring), identical role/config to docker-compose.yml's
#              own `jaeger` service. Plain `docker compose -f
#              docker-compose.vm.yml up -d` never starts this; SSH in and
#              run `docker compose -f docker-compose.vm.yml --profile
#              tracing up -d` instead, with OTEL_ENABLED=true in
#              /opt/snipeit/.env (see .env.example) -- every
#              backend/worker/beat env block below already points
#              OTEL_EXPORTER_OTLP_ENDPOINT at it. Browse traces at
#              http://<vm>:16686 over the Cloudflare Tunnel's SSH route
#              (nothing here publishes 16686/4318 to the public internet --
#              see that service's own comment). See README.md's
#              "Distributed Tracing" section.
#
# -----------------------------------------------------------------------------
# ZERO-DOWNTIME BLUE-GREEN DEPLOYMENTS -- the short version
# -----------------------------------------------------------------------------
# `ACTIVE_SLOT`/`COMPOSE_PROFILES` in /opt/snipeit/.env are both permanently
# "green" -- FIXED, not alternating -- so a plain `docker compose up -d`
# (systemd's snipeit.service, or a reboot) always brings up
# backend-green/frontend-green; blue's pair is defined but dormant
# (Compose profile filtering -- see each service's own `profiles:`
# comment) except during an actual rollout. Set once by
# infra-vm/cloud-init.yaml on first boot and never touched again by any
# later deploy (earlier versions of this design flipped both values at
# the end of every rollout -- that's gone now that the roles don't swap).
#
# A real deploy (scripts/blue-green-deploy.sh, invoked by
# .github/workflows/deploy-azure-vm.yml) does NOT touch COMPOSE_PROFILES
# at all -- it:
#   1. Runs `alembic upgrade head` against the incoming image, through
#      blue (shared `db`, so migrations must stay backward-compatible
#      with the still-running green slot for the duration of the
#      rollout).
#   2. Starts ONLY blue's backend-*/frontend-* pair, by naming them
#      explicitly (Compose starts an explicitly-named service regardless
#      of active profile) -- `caddy` is still sending 100% of traffic to
#      green at this point, so blue receives NO production traffic yet.
#   3. Runs scripts/health-check.sh --mode internal directly against blue
#      (GET /healthz, GET /readyz, a static-asset fetch, and an
#      /api/auth/me round-trip through its own nginx to its own backend) --
#      the SAME criteria the post-cutover smoke test (--mode external) in
#      deploy-azure-vm.yml already holds the live domain to, so the replica
#      is held to that bar too, not a lesser one, before it ever sees a
#      real request.
#   4. Only if every check passes: gradually reweights `caddy`'s
#      reverse_proxy from green onto blue (10/25/50/75/100%, re-checking
#      blue at each step -- see Caddyfile's
#      /etc/caddy/snippets/weights.conf import and
#      scripts/blue-green-deploy.sh).
#   5. PROMOTES: once blue is proven at 100% traffic, brings green up on
#      the exact same image blue is already running (both share the one
#      `${IMAGE_TAG}` reference below -- this is a same-code restart, not
#      a second canary), health-checks it, flips traffic straight back to
#      100% green, then stops blue -- restoring the "green = active,
#      blue = idle" invariant for the next deploy.
#   6. On ANY failed check before step 5, traffic is left at (or restored
#      to) 100% on green and blue's containers are stopped -- green is
#      never touched until blue has already proven itself, so a bad
#      deploy never causes an outage. A failure DURING step 5 itself
#      (green's promotion) is handled differently -- see
#      blue-green-deploy.sh's own top-of-file comment for why leaving
#      blue serving is safer than reverting to a stale green in that one
#      case.
#
# scripts/deploy-status/status.json (written live during a rollout,
# watchable at https://<DOMAIN>/_deploy/ -- see Caddyfile and
# DEPLOYMENT_VM.md's "Monitoring a rollout" section) is how you watch all
# of this happen.
#
# Memory budget (Standard_B2s = 4 GiB RAM total, the default vm_size in
# infra-vm/variables.tf) -- STEADY STATE (only one slot's backend/frontend
# running) limits sum to ~2.9 GiB, leaving ~1.1 GiB headroom for the OS,
# Docker's own daemon, and page cache. DURING a rollout, both slots'
# backend+frontend briefly run together (+~896m) -- see "Cost / sizing" in
# DEPLOYMENT_VM.md for the Standard_B2ms recommendation if that peak
# headroom feels too tight for your traffic:
#
#   service           limit   reservation   why
#   ---------------   -----   -----------   ----------------------------------
#   db                768m    256m          Postgres; grows with data volume
#   redis             256m    128m          small queue + short-lived export blobs
#   backend-<slot>    768m    256m          FastAPI/uvicorn, UVICORN_WORKERS procs
#   worker            640m    256m          Celery worker; CSV/PDF export jobs
#   beat              128m    64m           scheduler only, no request handling
#   frontend-<slot>   128m    64m           nginx serving static assets + proxy
#   caddy             160m    64m           TLS re-presentation (Origin CA cert)
#   cloudflared        128m   32m           outbound-only Tunnel connector
#   ---------------   -----   -----------
#   total (1 slot)    2976m   1120m
#   total (mid-rollout, 2 slots' backend+frontend) ~3872m   ~1440m
#
#   jaeger     256m    96m           OPT-IN (profile: tracing) -- not part
#                                    of the always-on total above; only
#                                    counts against the ~1.1 GiB headroom
#                                    while you've deliberately started it.
#
# Running Standard_B2ms (8 GiB) instead? Double every number below, or set
# the *_MEM_LIMIT / *_MEM_RESERVATION overrides in .env -- every value here
# reads from .env first, same pattern as docker-compose.yml, so nothing
# needs editing in this file itself for that.
#
# Deployed to /opt/snipeit/docker-compose.vm.yml on the VM by cloud-init on
# first boot, and re-synced there by deploy-azure-vm.yml on every deploy
# after that (see infra-vm/cloud-init.yaml and that workflow).
# =============================================================================

services:
  # ---------------------------------------------------------------------
  # db (identical role to docker-compose.yml's db)
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: snipeit_lite_db
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-768m}
    mem_reservation: ${DB_MEM_RESERVATION:-256m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      # Bind-mounted (not a named volume) to the data disk cloud-init
      # mounts at /mnt/docker-data -- see that file's comments on why a
      # SEPARATE managed disk backs application data instead of the OS
      # disk, and infra-vm/main.tf's azurerm_managed_disk resource.
      - /mnt/docker-data/volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-asset_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # redis (identical role to docker-compose.yml's redis)
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: snipeit_lite_redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-128m}
    # Cap Redis's OWN internal memory below the container's cgroup limit
    # (256m) so Redis evicts old export results gracefully under
    # maxmemory-policy instead of the OOM killer ending the process
    # outright when the two limits are identical.
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /mnt/docker-data/volumes/redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # backend-blue / backend-green -- the FastAPI/uvicorn app, split into two
  # slots for zero-downtime blue-green deploys (see this file's own
  # "ZERO-DOWNTIME BLUE-GREEN DEPLOYMENTS" header comment). Identical to
  # each other and to docker-compose.yml's `backend` in every way except
  # `container_name` and which Compose `profiles:` entry gates them.
  # ---------------------------------------------------------------------
  backend-blue:
    image: ${DOCKERHUB_BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: snipeit_lite_backend_blue
    # NEVER auto-started by a bare `docker compose up -d` -- COMPOSE_PROFILES
    # (.env) is permanently "green" (the fixed active role; see this
    # file's own "ZERO-DOWNTIME BLUE-GREEN DEPLOYMENTS" comment), so
    # blue's profile is never active on its own. scripts/blue-green-deploy.sh
    # starts/stops this service EXPLICITLY BY NAME during a rollout
    # instead (Compose always honors an explicitly-named service even if
    # its profile isn't active) -- see that script and
    # DEPLOYMENT_VM.md's "Zero-Downtime Blue-Green Deployments" section.
    profiles: ["blue"]
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    mem_reservation: ${BACKEND_MEM_RESERVATION:-256m}
    volumes:
      - /mnt/docker-data/volumes/backup_data:/app/backups
      - /mnt/docker-data/volumes/export_data:/app/export_results
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_API_KEY: ${ERRORBEACON_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Pre-encoded, ready-to-use DATABASE_URL from .env -- written by
      # infra-vm/cloud-init.yaml / sync-secrets-vm.yml using Terraform's
      # urlencode() on POSTGRES_USER/POSTGRES_PASSWORD, so special
      # characters from `openssl rand -base64 24` (`+`/`/`/`=`) don't
      # corrupt postgresql:// URL parsing. Consumed verbatim, not rebuilt.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Tells backend/database.py's adaptive connection-pool sizing
      # (_compute_pool_sizing()) exactly how many DB-connecting processes
      # can exist AT ONCE on this VM, instead of letting it derive a
      # (wrong, for this topology) guess from BACKEND_MAX_REPLICAS: this
      # deployment's replica-shaped derivation doesn't fit `worker`/
      # `beat` running as their own separate, always-on processes rather
      # than embedded, or the blue/green pair briefly running together
      # mid-rollout. Worst case (during a rollout, before the outgoing
      # slot is torn down): backend-blue (UVICORN_WORKERS=2) + backend-
      # green (UVICORN_WORKERS=2) + worker (--concurrency=2, i.e. 2
      # forked processes) + beat (1, no concurrency) = 7. Bump this (on
      # ALL FOUR of backend-blue/backend-green/worker/beat in this file,
      # kept in sync by hand since Compose has no shared-anchor env block
      # here) if UVICORN_WORKERS or worker's --concurrency ever change.
      DB_EXPECTED_PROCESSES: "7"
      REDIS_URL: redis://redis:6379/0
      EXPORT_RESULT_DIR: /app/export_results
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      SITE_NAME: ${SITE_NAME:-Snipe-IT Lite}
      # IANA timezone used to render CSV/PDF export timestamps and the
      # scheduled-backup filename (see backend/config.py's DISPLAY_TIMEZONE
      # docstring) + ISO 4217 currency code shown/exported everywhere a
      # price appears (see CURRENCY_CODE docstring). BUG FIX: both were
      # already real, wired-through settings on this VM path
      # (infra-vm's display_timezone/currency_code Terraform variables ->
      # cloud-init.yaml -> this VM's .env) and the ACA path (infra/
      # main.bicep's sharedEnv) the whole time, but this file never
      # actually read them here -- an operator setting either one via
      # terraform.tfvars had it silently ignored, always falling back to
      # config.py's "Africa/Lagos"/"NGN" defaults. Caught by
      # scripts/check-bicep-compose-drift.py.
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Africa/Lagos}
      CURRENCY_CODE: ${CURRENCY_CODE:-NGN}
      # Explicit, not left to config.py's is_production default: this VM is
      # a real, persistent-data deployment (prod OR vm-staging -- both use
      # real Postgres, not a throwaway DB) where Alembic (run as its own
      # explicit "alembic upgrade head" step by the deploy workflow -- see
      # .github/workflows/deploy-azure-vm.yml) must be the ONLY thing that
      # ever creates/alters schema. config.py's apply_environment_defaults()
      # already keys AUTO_INIT_DB/AUTO_SEED_DEMO_DATA off is_production
      # directly (ENVIRONMENT is the single source of truth -- there used to
      # be a separate LEAN_MODE override here, which is how this VM used to
      # force these two flags off independently of ENVIRONMENT; it's been
      # removed), so leaving them unset here would already resolve to
      # "false" given ENVIRONMENT=production/vm-staging above. They're
      # pinned explicitly anyway -- exactly as the `worker` service below
      # already does -- so this stays safe even if that default ever
      # changes, and it documents the reason schema-mutation is intentionally
      # kept out of this container's own startup: it would otherwise race
      # the deploy workflow's separate "alembic upgrade head" step, e.g.
      # both trying to create the same brand-new table (a real
      # psycopg2.errors.DuplicateTable failure this repo hit once).
      # ENVIRONMENT itself (above) still matters for everything ELSE
      # config.py gates on it (JWT secret strength checks, secure cookie
      # flags, CORS strictness, etc.) -- it's read from this VM's
      # /opt/snipeit/.env, defaulting to "production" (the infrastructure
      # default) if that file doesn't set ENVIRONMENT at all -- e.g. a
      # brand-new VM before deploy-azure-vm.yml has ever run its "Update
      # IMAGE_TAG + ENVIRONMENT on the VM" step. That step writes the real
      # value on every deploy, sourced from the resolve-target job's
      # build_env output -- which reads the ENVIRONMENT Actions variable
      # configured on THIS run's target GitHub Environment (vm-staging or
      # prod), not derived from the target's name -- see that workflow's
      # resolve-target job comment for the full resolution.
      AUTO_INIT_DB: "false"
      AUTO_SEED_DEMO_DATA: "false"
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Operations & Observability requirement #4: distributed tracing
      # (OpenTelemetry) -- see backend/telemetry.py's module docstring and
      # docker-compose.yml's identical block for the full comment. Off by
      # default; flip OTEL_ENABLED to "true" in /opt/snipeit/.env and
      # traces flow to the `jaeger` service below with no other change
      # needed -- remember `jaeger` itself only starts with `docker
      # compose -f docker-compose.vm.yml --profile tracing up -d` (see
      # this file's top comment).
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      # Alternative/additional export target -- see .env.azure.example and
      # README.md's "Distributed Tracing" section. Empty by default since
      # this VM path provisions no Application Insights resource of its
      # own (that's the Container Apps path's infra/main.bicep) -- set it
      # yourself if you have an Application Insights resource elsewhere
      # you want this VM's traces to reach.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      ROOT_ADMIN_BOOTSTRAP_PASSWORD: ${ROOT_ADMIN_BOOTSTRAP_PASSWORD:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
      ENABLE_AUTO_BACKUP: ${ENABLE_AUTO_BACKUP:-true}
      BACKUP_HOURS_UTC: ${BACKUP_HOURS_UTC:-3}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_GDRIVE_ENABLED: ${BACKUP_GDRIVE_ENABLED:-false}
      BACKUP_GDRIVE_OAUTH_CLIENT_ID: ${BACKUP_GDRIVE_OAUTH_CLIENT_ID:-}
      BACKUP_GDRIVE_OAUTH_CLIENT_SECRET: ${BACKUP_GDRIVE_OAUTH_CLIENT_SECRET:-}
      BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN: ${BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN:-}
      # Mode 2 -- Google Workspace service account + Shared Drive. BUG FIX:
      # this line was missing entirely on the VM path (present in
      # docker-compose.yml/render.yaml/backend/config.py the whole time) --
      # see backend/services/backup_service.py's BACKUP_GDRIVE_CREDENTIALS_JSON
      # branch and infra-vm/variables.tf's matching variable.
      BACKUP_GDRIVE_CREDENTIALS_JSON: ${BACKUP_GDRIVE_CREDENTIALS_JSON:-}
      BACKUP_GDRIVE_FOLDER_ID: ${BACKUP_GDRIVE_FOLDER_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No host `ports:` -- reached only via `frontend`'s nginx reverse proxy
    # (see nginx/default.conf.template), same as docker-compose.yml.

  backend-green:
    image: ${DOCKERHUB_BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: snipeit_lite_backend_green
    # ALWAYS auto-started by a bare `docker compose up -d` -- COMPOSE_PROFILES
    # (.env) is permanently "green": green is the fixed active role (see
    # this file's own "ZERO-DOWNTIME BLUE-GREEN DEPLOYMENTS" comment), so
    # a reboot or systemd restart always brings this back up with no
    # rollout needing to run first. scripts/blue-green-deploy.sh also
    # restarts this service EXPLICITLY BY NAME during a rollout's
    # promotion step, onto whatever image blue just proved itself on --
    # see that script and DEPLOYMENT_VM.md's "Zero-Downtime Blue-Green
    # Deployments" section.
    profiles: ["green"]
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    mem_reservation: ${BACKEND_MEM_RESERVATION:-256m}
    volumes:
      - /mnt/docker-data/volumes/backup_data:/app/backups
      - /mnt/docker-data/volumes/export_data:/app/export_results
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_API_KEY: ${ERRORBEACON_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Pre-encoded, ready-to-use DATABASE_URL from .env -- written by
      # infra-vm/cloud-init.yaml / sync-secrets-vm.yml using Terraform's
      # urlencode() on POSTGRES_USER/POSTGRES_PASSWORD, so special
      # characters from `openssl rand -base64 24` (`+`/`/`/`=`) don't
      # corrupt postgresql:// URL parsing. Consumed verbatim, not rebuilt.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Tells backend/database.py's adaptive connection-pool sizing
      # (_compute_pool_sizing()) exactly how many DB-connecting processes
      # can exist AT ONCE on this VM, instead of letting it derive a
      # (wrong, for this topology) guess from BACKEND_MAX_REPLICAS: this
      # deployment's replica-shaped derivation doesn't fit `worker`/
      # `beat` running as their own separate, always-on processes rather
      # than embedded, or the blue/green pair briefly running together
      # mid-rollout. Worst case (during a rollout, before the outgoing
      # slot is torn down): backend-blue (UVICORN_WORKERS=2) + backend-
      # green (UVICORN_WORKERS=2) + worker (--concurrency=2, i.e. 2
      # forked processes) + beat (1, no concurrency) = 7. Bump this (on
      # ALL FOUR of backend-blue/backend-green/worker/beat in this file,
      # kept in sync by hand since Compose has no shared-anchor env block
      # here) if UVICORN_WORKERS or worker's --concurrency ever change.
      DB_EXPECTED_PROCESSES: "7"
      REDIS_URL: redis://redis:6379/0
      EXPORT_RESULT_DIR: /app/export_results
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      SITE_NAME: ${SITE_NAME:-Snipe-IT Lite}
      # IANA timezone used to render CSV/PDF export timestamps and the
      # scheduled-backup filename (see backend/config.py's DISPLAY_TIMEZONE
      # docstring) + ISO 4217 currency code shown/exported everywhere a
      # price appears (see CURRENCY_CODE docstring). BUG FIX: both were
      # already real, wired-through settings on this VM path
      # (infra-vm's display_timezone/currency_code Terraform variables ->
      # cloud-init.yaml -> this VM's .env) and the ACA path (infra/
      # main.bicep's sharedEnv) the whole time, but this file never
      # actually read them here -- an operator setting either one via
      # terraform.tfvars had it silently ignored, always falling back to
      # config.py's "Africa/Lagos"/"NGN" defaults. Caught by
      # scripts/check-bicep-compose-drift.py.
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Africa/Lagos}
      CURRENCY_CODE: ${CURRENCY_CODE:-NGN}
      # Explicit, not left to config.py's is_production default: this VM is
      # a real, persistent-data deployment (prod OR vm-staging -- both use
      # real Postgres, not a throwaway DB) where Alembic (run as its own
      # explicit "alembic upgrade head" step by the deploy workflow -- see
      # .github/workflows/deploy-azure-vm.yml) must be the ONLY thing that
      # ever creates/alters schema. config.py's apply_environment_defaults()
      # already keys AUTO_INIT_DB/AUTO_SEED_DEMO_DATA off is_production
      # directly (ENVIRONMENT is the single source of truth -- there used to
      # be a separate LEAN_MODE override here, which is how this VM used to
      # force these two flags off independently of ENVIRONMENT; it's been
      # removed), so leaving them unset here would already resolve to
      # "false" given ENVIRONMENT=production/vm-staging above. They're
      # pinned explicitly anyway -- exactly as the `worker` service below
      # already does -- so this stays safe even if that default ever
      # changes, and it documents the reason schema-mutation is intentionally
      # kept out of this container's own startup: it would otherwise race
      # the deploy workflow's separate "alembic upgrade head" step, e.g.
      # both trying to create the same brand-new table (a real
      # psycopg2.errors.DuplicateTable failure this repo hit once).
      # ENVIRONMENT itself (above) still matters for everything ELSE
      # config.py gates on it (JWT secret strength checks, secure cookie
      # flags, CORS strictness, etc.) -- it's read from this VM's
      # /opt/snipeit/.env, defaulting to "production" (the infrastructure
      # default) if that file doesn't set ENVIRONMENT at all -- e.g. a
      # brand-new VM before deploy-azure-vm.yml has ever run its "Update
      # IMAGE_TAG + ENVIRONMENT on the VM" step. That step writes the real
      # value on every deploy, sourced from the resolve-target job's
      # build_env output -- which reads the ENVIRONMENT Actions variable
      # configured on THIS run's target GitHub Environment (vm-staging or
      # prod), not derived from the target's name -- see that workflow's
      # resolve-target job comment for the full resolution.
      AUTO_INIT_DB: "false"
      AUTO_SEED_DEMO_DATA: "false"
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Operations & Observability requirement #4: distributed tracing
      # (OpenTelemetry) -- see backend/telemetry.py's module docstring and
      # docker-compose.yml's identical block for the full comment. Off by
      # default; flip OTEL_ENABLED to "true" in /opt/snipeit/.env and
      # traces flow to the `jaeger` service below with no other change
      # needed -- remember `jaeger` itself only starts with `docker
      # compose -f docker-compose.vm.yml --profile tracing up -d` (see
      # this file's top comment).
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      # Alternative/additional export target -- see .env.azure.example and
      # README.md's "Distributed Tracing" section. Empty by default since
      # this VM path provisions no Application Insights resource of its
      # own (that's the Container Apps path's infra/main.bicep) -- set it
      # yourself if you have an Application Insights resource elsewhere
      # you want this VM's traces to reach.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      ROOT_ADMIN_BOOTSTRAP_PASSWORD: ${ROOT_ADMIN_BOOTSTRAP_PASSWORD:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
      ENABLE_AUTO_BACKUP: ${ENABLE_AUTO_BACKUP:-true}
      BACKUP_HOURS_UTC: ${BACKUP_HOURS_UTC:-3}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_GDRIVE_ENABLED: ${BACKUP_GDRIVE_ENABLED:-false}
      BACKUP_GDRIVE_OAUTH_CLIENT_ID: ${BACKUP_GDRIVE_OAUTH_CLIENT_ID:-}
      BACKUP_GDRIVE_OAUTH_CLIENT_SECRET: ${BACKUP_GDRIVE_OAUTH_CLIENT_SECRET:-}
      BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN: ${BACKUP_GDRIVE_OAUTH_REFRESH_TOKEN:-}
      # Mode 2 -- Google Workspace service account + Shared Drive. BUG FIX:
      # this line was missing entirely on the VM path (present in
      # docker-compose.yml/render.yaml/backend/config.py the whole time) --
      # see backend/services/backup_service.py's BACKUP_GDRIVE_CREDENTIALS_JSON
      # branch and infra-vm/variables.tf's matching variable.
      BACKUP_GDRIVE_CREDENTIALS_JSON: ${BACKUP_GDRIVE_CREDENTIALS_JSON:-}
      BACKUP_GDRIVE_FOLDER_ID: ${BACKUP_GDRIVE_FOLDER_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No host `ports:` -- reached only via `frontend`'s nginx reverse proxy
    # (see nginx/default.conf.template), same as docker-compose.yml.

  # ---------------------------------------------------------------------
  # worker (identical role to docker-compose.yml's worker)
  # ---------------------------------------------------------------------
  worker:
    image: ${DOCKERHUB_BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: snipeit_lite_worker
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-640m}
    mem_reservation: ${WORKER_MEM_RESERVATION:-256m}
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - /mnt/docker-data/volumes/export_data:/app/export_results
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_API_KEY: ${ERRORBEACON_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      # Pre-encoded DATABASE_URL from .env -- see the backend service's
      # DATABASE_URL comment above for why this is no longer rebuilt from
      # raw POSTGRES_USER/POSTGRES_PASSWORD here.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # See backend-blue's matching DB_EXPECTED_PROCESSES comment above
      # for the full "why 7" breakdown -- this worker's own
      # --concurrency=2 (2 forked processes) is one of the four inputs.
      DB_EXPECTED_PROCESSES: "7"
      REDIS_URL: redis://redis:6379/0
      EXPORT_RESULT_DIR: /app/export_results
      # `worker` is what actually generates CSV/PDF exports
      # (backend/services/export_service.py), which reads both of these
      # directly -- DISPLAY_TIMEZONE at import time (module-level
      # `DISPLAY_TZ = ZoneInfo(settings.DISPLAY_TIMEZONE)`) and
      # CURRENCY_CODE per-export for currency formatting. See the
      # `backend-blue`/`backend-green` services' own DISPLAY_TIMEZONE/
      # CURRENCY_CODE comment above for the "why these exist at all" story.
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Africa/Lagos}
      CURRENCY_CODE: ${CURRENCY_CODE:-NGN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      # Operations & Observability requirement #4: distributed tracing --
      # see the `backend` service's own OTEL_* block above for the full
      # comment. celery_app.py appends "-worker" to OTEL_SERVICE_NAME
      # automatically, so this container's spans are still easy to tell
      # apart from `backend`'s in the Jaeger UI despite sharing the same
      # env var value.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      AUTO_INIT_DB: "false"
      AUTO_SEED_DEMO_DATA: "false"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --destination celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # beat (identical role to docker-compose.yml's beat -- kept as its own
  # single, never-scaled container for the exact reason documented there:
  # more than one Beat process fires duplicate notification emails)
  # ---------------------------------------------------------------------
  beat:
    image: ${DOCKERHUB_BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: snipeit_lite_beat
    restart: unless-stopped
    mem_limit: ${BEAT_MEM_LIMIT:-128m}
    mem_reservation: ${BEAT_MEM_RESERVATION:-64m}
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ERRORBEACON_URL: ${ERRORBEACON_URL:-http://errorbeacon:8000}
      ERRORBEACON_API_KEY: ${ERRORBEACON_API_KEY:-}
      ERRORBEACON_APP: ${ERRORBEACON_APP:-asset-inventory-quotes}
      APP_RELEASE: ${APP_RELEASE:-${IMAGE_TAG:-local}}
      ERRORBEACON_TIMEOUT: ${ERRORBEACON_TIMEOUT:-0.75}
      # Pre-encoded DATABASE_URL from .env -- see the backend service's
      # DATABASE_URL comment above for why this is no longer rebuilt from
      # raw POSTGRES_USER/POSTGRES_PASSWORD here.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # See backend-blue's matching DB_EXPECTED_PROCESSES comment above
      # for the full "why 7" breakdown -- beat itself is only 1 of the 7
      # (no concurrency), but still needs the SAME total so its own pool
      # is sized to fit alongside the other six.
      DB_EXPECTED_PROCESSES: "7"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      # Operations & Observability requirement #4: distributed tracing --
      # see the `backend` service's own OTEL_* block for the full
      # comment. celery_app.py appends "-beat" to OTEL_SERVICE_NAME
      # automatically for this process specifically (via `beat_init`, not
      # `worker_process_init` -- see that file's own comment for why Beat
      # needs its own separate signal).
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-snipeit-lite-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      AUTO_INIT_DB: "false"
      AUTO_SEED_DEMO_DATA: "false"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # EMAIL_PROVIDER selects the transport ("smtp" default, or
      # "brevo"/"resend" for an HTTP-API provider -- see config.py's
      # EMAIL_PROVIDER docstring). BREVO_API_KEY/RESEND_API_KEY are only
      # read when EMAIL_PROVIDER selects that provider; harmless to pass
      # through unconditionally otherwise.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      OVERDUE_DIGEST_HOURS_UTC: ${OVERDUE_DIGEST_HOURS_UTC:-8}
      DUE_SOON_REMINDER_DAYS: ${DUE_SOON_REMINDER_DAYS:-2}
      DUE_SOON_DIGEST_HOURS_UTC: ${DUE_SOON_DIGEST_HOURS_UTC:-8}
      # Pending-approval SLA nudges (ExtensionRequest & Quotation) -- see
      # backend/config.py's own comment block and backend/tasks/sla_tasks.py's
      # module docstring for the full rationale.
      EXTENSION_REQUEST_SLA_HOURS: ${EXTENSION_REQUEST_SLA_HOURS:-24}
      QUOTATION_SLA_HOURS: ${QUOTATION_SLA_HOURS:-24}
      APPROVAL_SLA_CHECK_INTERVAL_MINUTES: ${APPROVAL_SLA_CHECK_INTERVAL_MINUTES:-60}
      APPROVAL_SLA_ESCALATION_REPEAT_HOURS: ${APPROVAL_SLA_ESCALATION_REPEAT_HOURS:-24}
      # Whether a Quotation's own recipient gets emailed on every change
      # (on top of the in-app bell notification, which is always
      # created regardless) -- see backend/config.py's own comment.
      SEND_QUOTATION_RECIPIENT_EMAILS: ${SEND_QUOTATION_RECIPIENT_EMAILS:-true}
      SEND_INDIVIDUAL_HOLDER_REMINDERS: ${SEND_INDIVIDUAL_HOLDER_REMINDERS:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # frontend-blue / frontend-green -- nginx serving the built SPA + proxying
  # /api/* to THIS SLOT's own backend-<slot>:8000 internally (per
  # nginx/default.conf.template baked into the image), split into two slots
  # for zero-downtime blue-green deploys (see this file's own "ZERO-DOWNTIME
  # BLUE-GREEN DEPLOYMENTS" header comment). `caddy` below is what actually
  # decides how much traffic each one gets.
  # ---------------------------------------------------------------------

  # ErrorBeacon is deliberately outside the backend blue/green slots.
  # A backend rollout can replace blue/green without replacing the monitor.
  errorbeacon:
    image: ${ERRORBEACON_IMAGE:-samuelgodson55/errorbeacon-lite}:${ERRORBEACON_IMAGE_TAG:-latest}
    container_name: snipeit_lite_errorbeacon
    restart: unless-stopped
    mem_limit: ${ERRORBEACON_MEM_LIMIT:-256m}
    mem_reservation: ${ERRORBEACON_MEM_RESERVATION:-64m}
    environment:
      ERRORBEACON_API_KEY: ${ERRORBEACON_API_KEY:?Set ERRORBEACON_API_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DATA_DIR: /data
      DEDUP_SECONDS: ${DEDUP_SECONDS:-60}
      SPIKE_THRESHOLD: ${SPIKE_THRESHOLD:-10}
      SPIKE_WINDOW_SECONDS: ${SPIKE_WINDOW_SECONDS:-300}
      ALERT_QUEUE_SIZE: ${ALERT_QUEUE_SIZE:-1000}
      ALERT_WORKERS: ${ALERT_WORKERS:-3}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-true}
    volumes:
      - /mnt/docker-data/volumes/errorbeacon_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend-blue:
    image: ${DOCKERHUB_FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: snipeit_lite_frontend_blue
    # Same profile-gating story as backend-blue above -- see that
    # service's own comment.
    profiles: ["blue"]
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    mem_reservation: ${FRONTEND_MEM_RESERVATION:-64m}
    environment:
      PORT: "80"
      # Points THIS slot's nginx at THIS slot's backend, never the other
      # one -- that pairing is the whole point of blue-green: a request
      # that lands on frontend-blue is guaranteed to be served entirely
      # by blue's own code, never a mix of old and new.
      BACKEND_HOST: backend-blue
      BACKEND_PORT: "8000"
      RESOLVER_IP: 127.0.0.11
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    # NO host `ports:` publish here (unlike docker-compose.yml's
    # "8080:80") -- `caddy` below is the only container bound to the
    # host's 80/443, and reaches frontend-blue/frontend-green over the
    # internal Compose network by name instead, weighting traffic between
    # them (see Caddyfile and DEPLOYMENT_VM.md's "Zero-Downtime Blue-Green
    # Deployments" section). Keeping the SPA/API entry point itself
    # completely unpublished mirrors the same "shrink the public attack
    # surface to one hardened entry point" reasoning docker-compose.yml
    # already applies to `backend`.
    depends_on:
      backend-blue:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend-green:
    image: ${DOCKERHUB_FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: snipeit_lite_frontend_green
    # Same profile-gating story as backend-green above -- see that
    # service's own comment.
    profiles: ["green"]
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    mem_reservation: ${FRONTEND_MEM_RESERVATION:-64m}
    environment:
      PORT: "80"
      # Points THIS slot's nginx at THIS slot's backend, never the other
      # one -- that pairing is the whole point of blue-green: a request
      # that lands on frontend-green is guaranteed to be served entirely
      # by green's own code, never a mix of old and new.
      BACKEND_HOST: backend-green
      BACKEND_PORT: "8000"
      RESOLVER_IP: 127.0.0.11
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    # NO host `ports:` publish here (unlike docker-compose.yml's
    # "8080:80") -- `caddy` below is the only container bound to the
    # host's 80/443, and reaches frontend-blue/frontend-green over the
    # internal Compose network by name instead, weighting traffic between
    # them (see Caddyfile and DEPLOYMENT_VM.md's "Zero-Downtime Blue-Green
    # Deployments" section). Keeping the SPA/API entry point itself
    # completely unpublished mirrors the same "shrink the public attack
    # surface to one hardened entry point" reasoning docker-compose.yml
    # already applies to `backend`.
    depends_on:
      backend-green:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # caddy -- reverse proxy + security headers, presenting a Cloudflare
  # Origin CA certificate for the inner hop from `cloudflared` below (real
  # visitors' TLS terminates at Cloudflare's edge for free -- there's no
  # ACME/Let's Encrypt step on this VM at all anymore). See Caddyfile for
  # the actual proxy/TLS config, and DEPLOYMENT_VM.md's "Set up Cloudflare
  # Tunnel" section for how DOMAIN and the Origin CA cert get set.
  #
  # ALSO the blue-green traffic switch: Caddyfile's reverse_proxy load-
  # balances between frontend-blue:80/frontend-green:80 using weights
  # imported from /etc/caddy/snippets/weights.conf (the `weights.conf`
  # bind mount below) -- scripts/blue-green-deploy.sh rewrites that file
  # and runs `caddy reload` (a graceful, zero-dropped-connection reload,
  # not a restart) to shift traffic between slots. It also serves the
  # live rollout status dashboard at /_deploy/ from `deploy_status` below
  # -- see DEPLOYMENT_VM.md's "Monitoring a rollout" section.
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: snipeit_lite_caddy
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-160m}
    mem_reservation: ${CADDY_MEM_RESERVATION:-64m}
    # DELIBERATELY no `ports:` here -- the only thing that ever reaches
    # Caddy is the `cloudflared` container below, over the internal
    # Docker network by service name ("caddy:443"). No host port is
    # published, so there is nothing for the VM's NSG or UFW to have to
    # open for this service at all -- see the Caddyfile's top comment and
    # infra-vm/main.tf's "Cloudflare Tunnel" section.
    environment:
      DOMAIN: ${DOMAIN}
      # HTTP Basic Auth guarding the /_deploy/ rollout-status dashboard --
      # see DEPLOYMENT_VM.md's "Monitoring a rollout" section for how to
      # generate your own DEPLOY_STATUS_PASSWORD_HASH (`docker run --rm
      # caddy:2-alpine caddy hash-password`). The fallback default below
      # is a REAL, validly-formatted bcrypt hash of a random,
      # never-recorded password (so Caddy loads it without a config
      # error) -- every `$` is doubled (`$$`) because this is a Compose
      # YAML file, where a single `$` would otherwise be parsed as the
      # start of a `${VAR}` reference. It fails CLOSED (nobody can log
      # in, not "anybody can") only as a last-resort fallback -- in
      # practice /opt/snipeit/.env always sets a real value (see
      # infra-vm/cloud-init.yaml), so this default is rarely what's
      # actually used.
      DEPLOY_STATUS_USER: ${DEPLOY_STATUS_USER:-admin}
      DEPLOY_STATUS_PASSWORD_HASH: ${DEPLOY_STATUS_PASSWORD_HASH:-$$2b$$14$$xkxwohsBNLl9Qd7uw00zf.h.nQ4Ntazc39oQvd81GIjtK0xpLI3p6}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Rewritten in place by scripts/blue-green-deploy.sh during a
      # rollout; imported into Caddyfile's reverse_proxy block (see that
      # file). Seeded once by cloud-init at "100 0" (100% blue) -- safe to
      # hand-edit for a manual/emergency traffic shift too, just follow it
      # with `docker compose -f docker-compose.vm.yml exec caddy caddy
      # reload --config /etc/caddy/Caddyfile --adapter caddyfile`.
      - ./caddy/weights.conf:/etc/caddy/snippets/weights.conf:ro
      - /mnt/docker-data/volumes/caddy_data:/data
      - /mnt/docker-data/volumes/caddy_config:/config
      # Cloudflare Origin CA cert/key -- written by cloud-init from the
      # cloudflare_origin_cert/_key Terraform variables (see Caddyfile).
      - /opt/snipeit/certs:/etc/caddy/certs:ro
      # Live rollout status (status.json) + the small dashboard that polls
      # it -- written by scripts/blue-green-deploy.sh / synced by
      # deploy-azure-vm.yml, served read-only at /_deploy/ (see
      # Caddyfile). On the data disk so a rollout's final status survives
      # a VM reboot/rebuild.
      - /mnt/docker-data/volumes/deploy_status:/srv/deploy-status:ro
    # DELIBERATELY no `depends_on` on frontend-blue/frontend-green here --
    # Compose auto-activates a dependency's profile even when it isn't
    # otherwise enabled, which would defeat the whole point of
    # profile-gating the inactive slot (both slots' frontend would end up
    # running all the time). Caddy tolerates a currently-stopped upstream
    # fine on its own (passive health checking just routes around it --
    # see Caddyfile) -- there being only one slot up in steady state is
    # the normal, expected case, not an error condition.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # cloudflared -- the ONLY thing on this VM that ever makes a connection
  # to the outside world on the app/SSH's behalf, and it's always OUTBOUND
  # (to Cloudflare's edge). This is the substitute for both Tailscale (SSH)
  # and the old open-80/443 Caddy/Let's Encrypt path -- see
  # infra-vm/main.tf's "Cloudflare Tunnel" section for how the tunnel and
  # its two routed hostnames (the app, and ssh.<domain>) get created, and
  # DEPLOYMENT_VM.md's "Set up Cloudflare Tunnel" section for the one-time
  # setup. Ingress rules themselves live in Cloudflare's config (pushed by
  # Terraform), not in a local config.yml here -- that's what
  # `tunnel run` (rather than `tunnel --config ... run`) picks up.
  # ---------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    container_name: snipeit_lite_cloudflared
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-128m}
    mem_reservation: ${CLOUDFLARED_MEM_RESERVATION:-32m}
    # The image bakes in ENTRYPOINT ["cloudflared", "--no-autoupdate"], and
    # ships no shell -- `tunnel run` is the plain subcommand that stacks
    # cleanly onto it. `cloudflared` reads TUNNEL_TOKEN from `environment:`
    # below natively, no shell/conditional needed.
    #
    # For local testing without a domain/token yet, run a Quick Tunnel from
    # outside this compose file instead, e.g.:
    #   docker run --rm cloudflare/cloudflared:2025.6.1 tunnel --no-autoupdate --url http://localhost:8080
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    extra_hosts:
      # Lets this container reach the VM HOST's own sshd (a normal
      # systemd service, not a container) for the SSH ingress
      # rule -- "host-gateway" is Docker's own resolved address for the
      # host, supported natively on Linux since Docker 20.10. Unused in
      # Quick Tunnel mode (no SSH route exists there), harmless to keep.
      - "host.docker.internal:host-gateway"
    depends_on:
      caddy:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # jaeger (local distributed-tracing UI -- Operations & Observability
  # requirement #4; see backend/telemetry.py's module docstring and
  # docker-compose.yml's identical service for the full comment on why
  # in-memory-only storage is the right trade-off here)
  # ---------------------------------------------------------------------
  # OPT-IN: `profiles: [tracing]` means this never starts on a normal
  # `docker compose -f docker-compose.vm.yml up -d` -- SSH to the VM
  # (DEPLOYMENT_VM.md's "No open SSH port" section) and explicitly run:
  #     docker compose -f docker-compose.vm.yml --profile tracing up -d
  # with OTEL_ENABLED=true in /opt/snipeit/.env (see .env.example).
  #
  # DELIBERATELY no host `ports:` publish here, unlike docker-compose.yml's
  # version (which is fine publishing to localhost on a developer's own
  # laptop) -- this is a shared VM, and Jaeger's UI/OTLP receiver ship with
  # no authentication of their own. Reach the UI over the same Cloudflare
  # Tunnel used for SSH instead (see DEPLOYMENT_VM.md), e.g.
  # `ssh -L 16686:localhost:16686 <ssh_hostname>` for the UI; backend/worker/
  # beat above already reach the OTLP receiver over the internal
  # "jaeger:4318" service name and need no port publish at all.
  #
  # Jaeger v2 (OTLP enabled on 4317/4318 by default) -- see
  # docker-compose.yml's `jaeger` service for the full writeup.
  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: snipeit_lite_jaeger
    profiles: ["tracing"]
    restart: unless-stopped
    mem_limit: ${JAEGER_MEM_LIMIT:-256m}
    mem_reservation: ${JAEGER_MEM_RESERVATION:-96m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# No top-level `volumes:` block -- every volume above is an explicit BIND
# MOUNT into /mnt/docker-data (the separate managed data disk cloud-init
# formats and mounts), not a Compose-managed named volume. This is what
# makes the data trivially findable/backup-able/snapshot-able as one plain
# directory tree from the host side, and what infra-vm/main.tf's optional
# daily disk-snapshot policy actually protects.
